name: Diagnosticar camada mobile

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-mobile-responsive
      - name: Executar build e capturar saída
        shell: bash
        run: |
          set +e
          node scripts/build-etapa2.cjs > mobile-build.log 2>&1
          echo $? > mobile-build.status
          exit 0
      - name: Publicar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-mobile
          path: |
            mobile-build.log
            mobile-build.status
          retention-days: 2
      - name: Confirmar resultado
        shell: bash
        run: |
          cat mobile-build.log
          test "$(cat mobile-build.status)" = "0"
