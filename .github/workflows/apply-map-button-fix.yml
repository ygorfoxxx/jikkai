name: Ajustar permissões e posição dos botões do mapa

on:
  push:
    branches:
      - ajuste-botoes-mapa-musica
    paths:
      - '.github/workflows/apply-map-button-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ajuste-botoes-mapa-musica

      - name: Aplicar correções
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          role_anchor = '  const role = usuarioAtual && data ? data.roles.find(r => r.id === usuarioAtual.role) : null;\n'
          role_insert = role_anchor + '''

  // Compartilha apenas a identidade/cargo da sessão atual com o mapa estratégico.
  // O mapa continua exigindo a senha antes de liberar qualquer alteração.
  useEffect(() => {
    try {
      if (usuarioAtual && role) {
        localStorage.setItem("fox-map-viewer", JSON.stringify({
          username: usuarioAtual.username,
          roleId: role.id,
          updatedAt: new Date().toISOString(),
        }));
      } else {
        localStorage.removeItem("fox-map-viewer");
      }
    } catch {}
  }, [usuarioAtual?.username, role?.id]);
'''
          if 'fox-map-viewer' not in index:
              if role_anchor not in index:
                  raise SystemExit('Âncora do cargo do usuário não encontrada em index.html')
              index = index.replace(role_anchor, role_insert, 1)

          old_position = "right:18px;bottom:18px;z-index:9999"
          new_position = "right:18px;bottom:76px;z-index:9999"
          if old_position in index:
              index = index.replace(old_position, new_position, 1)
          elif new_position not in index:
              raise SystemExit('Posição do botão do mapa não encontrada em index.html')

          index_path.write_text(index, encoding='utf-8')

          map_path = Path('mapa.html')
          mapa = map_path.read_text(encoding='utf-8')

          mapa = mapa.replace(
              '<button class="auth-mini" id="authBtn">Ativar edição</button>',
              '<button class="auth-mini" id="authBtn" hidden>Ativar edição</button>',
              1,
          )
          mapa = mapa.replace(
              '<div class="readonly-note" id="readonlyNote">Entre no portal como Líder ou Conselheiro para criar e editar locais e rotas.</div>',
              '<div class="readonly-note" id="readonlyNote">Mapa disponível em modo somente leitura.</div>',
              1,
          )
          mapa = mapa.replace(
              'const SESSION_KEY="fox-map-session";',
              'const SESSION_KEY="fox-map-session";\nconst VIEWER_KEY="fox-map-viewer";',
              1,
          )

          old_access = '''function parseSession(){
  try{return JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null")}catch{return null}
}
function resolveAccess(state){
  const session=parseSession();
  const user=session&&state?.users?.find(u=>u.username===session.username);
  const role=user&&state?.roles?.find(r=>r.id===user.role);
  const canEdit=roleCanEdit(role);
  return{user,role,canEdit};
}'''
          new_access = '''function parseSession(){
  try{return JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null")}catch{return null}
}
function parseViewer(){
  try{return JSON.parse(localStorage.getItem(VIEWER_KEY)||"null")}catch{return null}
}
function resolveAccess(state){
  const viewer=parseViewer();
  const session=parseSession();
  const user=viewer&&state?.users?.find(u=>u.username===viewer.username);
  const role=user&&state?.roles?.find(r=>r.id===user.role);
  const eligible=roleCanEdit(role);
  const canEdit=!!(eligible&&session?.username===user?.username);
  return{user,role,eligible,canEdit};
}'''
          if old_access not in mapa:
              raise SystemExit('Bloco de resolução de acesso não encontrado em mapa.html')
          mapa = mapa.replace(old_access, new_access, 1)

          mapa = mapa.replace(
              '''function openAuth(){
  if(access.canEdit){''',
              '''function openAuth(){
  if(!access.eligible)return;
  if(access.canEdit){''',
              1,
          )

          old_ui = '''  el("adminTools").hidden=!access.canEdit;
  el("readonlyNote").hidden=access.canEdit;
  el("detailActions").hidden=!access.canEdit;
  el("authBtn").textContent=access.canEdit?"Encerrar edição":"Ativar edição";'''
          new_ui = '''  el("adminTools").hidden=!access.canEdit;
  el("readonlyNote").hidden=!!access.eligible;
  el("detailActions").hidden=!access.canEdit;
  el("authBtn").hidden=!access.eligible;
  el("authBtn").textContent=access.canEdit?"Encerrar edição":"Ativar edição";'''
          if old_ui not in mapa:
              raise SystemExit('Bloco de visibilidade dos controles não encontrado em mapa.html')
          mapa = mapa.replace(old_ui, new_ui, 1)

          init_anchor = '''  if(cloudClient){
    cloudClient.channel("fox_map_changes")'''
          init_replacement = '''  window.addEventListener("storage",e=>{
    if(e.key===VIEWER_KEY){
      sessionStorage.removeItem(SESSION_KEY);
      applyState(portalState);
    }
  });
  if(cloudClient){
    cloudClient.channel("fox_map_changes")'''
          if init_anchor not in mapa:
              raise SystemExit('Âncora da inicialização do mapa não encontrada')
          mapa = mapa.replace(init_anchor, init_replacement, 1)

          map_path.write_text(mapa, encoding='utf-8')
          PY

      - name: Validar código e regras
        shell: bash
        run: |
          grep -q 'bottom:76px' index.html
          grep -q 'localStorage.setItem("fox-map-viewer"' index.html
          grep -q 'id="authBtn" hidden' mapa.html
          grep -q 'el("authBtn").hidden=!access.eligible' mapa.html
          grep -q 'el("adminTools").hidden=!access.canEdit' mapa.html
          grep -q 'const VIEWER_KEY="fox-map-viewer"' mapa.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          mapa = Path('mapa.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', mapa, re.S)
          Path('/tmp/mapa.js').write_text(scripts[-1], encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')
          start = index.index('<script type="text/babel" data-presets="env,react">')
          start = index.index('>', start) + 1
          end = index.rindex('</script>')
          Path('/tmp/portal.jsx').write_text(index[start:end], encoding='utf-8')
          PY
          node --check /tmp/mapa.js
          npx --yes esbuild@0.21.5 /tmp/portal.jsx --loader:.jsx=jsx --outfile=/tmp/portal.js >/dev/null

      - name: Salvar correções validadas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mapa.html
          git rm .github/workflows/apply-map-button-fix.yml
          git commit -m "Corrigir visibilidade dos controles do mapa"
          git push origin ajuste-botoes-mapa-musica
