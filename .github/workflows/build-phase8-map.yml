name: Construir mapa estratégico

on:
  push:
    branches:
      - fase8-mapa-final
    paths:
      - '.github/workflows/build-phase8-map.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fase8-mapa-final
      - name: Gerar página e integrar ao portal
        shell: bash
        run: |
          base64 --decode .mapbuild/mapa.html.gz.b64 | gzip --decompress > mapa.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'data-jikkai-map-link'
          if marker not in text:
              inject = '''
<script data-jikkai-map-link>
(function(){
  function addMapLink(){
    if(document.querySelector('[data-map-strategic-link]')) return;
    const a=document.createElement('a');
    a.href='mapa.html';
    a.setAttribute('data-map-strategic-link','');
    a.textContent='◈ MAPA ESTRATÉGICO';
    a.style.cssText='position:fixed;right:18px;bottom:18px;z-index:9999;background:rgba(24,24,27,.96);color:#fed7aa;border:1px solid #ea580c;border-radius:10px;padding:11px 14px;font:800 11px/1 system-ui;letter-spacing:.09em;text-decoration:none;box-shadow:0 14px 40px rgba(0,0,0,.55)';
    a.onmouseenter=()=>a.style.background='#7c2d12';
    a.onmouseleave=()=>a.style.background='rgba(24,24,27,.96)';
    document.body.appendChild(a);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',addMapLink); else addMapLink();
})();
</script>
'''
              text = text.replace('</body>', inject + '</body>')
              p.write_text(text, encoding='utf-8')
          PY
          grep -q 'Mapa Estratégico' mapa.html
          grep -q 'data-jikkai-map-link' index.html
      - name: Salvar implementação
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mapa.html
          git rm -r .mapbuild
          git rm .github/workflows/build-phase8-map.yml
          git commit -m "Fase 8: adicionar mapa estratégico interativo"
          git push origin fase8-mapa-final
