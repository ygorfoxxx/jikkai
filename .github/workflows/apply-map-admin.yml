name: Aplicar edição administrativa do mapa

on:
  push:
    branches:
      - fase8-mapa-admin
    paths:
      - '.github/workflows/apply-map-admin.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fase8-mapa-admin

      - name: Gerar e validar mapa
        shell: bash
        run: |
          base64 --decode .map-admin/mapa.html.gz.b64 | gzip --decompress > mapa.html
          grep -q 'Ativar modo de edição' mapa.html
          grep -q 'Nova rota' mapa.html
          grep -q 'Novo local' mapa.html
          grep -q 'mapaPontos' mapa.html
          grep -q 'mapaRotas' mapa.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('mapa.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
          if not scripts:
              raise SystemExit('script principal não encontrado')
          Path('/tmp/mapa.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/mapa.js

      - name: Salvar implementação validada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapa.html
          git rm -r .map-admin
          git rm .github/workflows/apply-map-admin.yml
          git commit -m "Fase 8: permitir criação e edição de locais e rotas"
          git push origin fase8-mapa-admin
