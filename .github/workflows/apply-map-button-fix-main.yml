name: Aplicar correção dos botões do mapa

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'ajuste-botoes-mapa-musica'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ajuste-botoes-mapa-musica

      - name: Aplicar correções
        run: python3 .scripts/fix_map_buttons.py

      - name: Validar
        shell: bash
        run: |
          grep -q 'bottom:76px' index.html
          grep -q 'localStorage.setItem("fox-map-viewer"' index.html
          grep -q 'id="authBtn" hidden' mapa.html
          grep -q 'el("authBtn").hidden=!access.eligible' mapa.html
          grep -q 'el("adminTools").hidden=!access.canEdit' mapa.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          mapa=Path('mapa.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',mapa,re.S)
          Path('/tmp/mapa.js').write_text(scripts[-1],encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          start=index.index('<script type="text/babel" data-presets="env,react">')
          start=index.index('>',start)+1
          end=index.index('</script>',start)
          Path('/tmp/portal.jsx').write_text(index[start:end],encoding='utf-8')
          PY
          node --check /tmp/mapa.js
          npx --yes esbuild@0.21.5 /tmp/portal.jsx --loader:.jsx=jsx --outfile=/tmp/portal.js >/dev/null

      - name: Salvar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mapa.html
          git rm -rf .scripts .github/workflows/apply-map-button-fix.yml .fix-map-buttons-trigger pr-ready.txt pr-ready2.txt pr-trigger3.txt || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrigir visibilidade e posição dos botões do mapa"
          git push origin ajuste-botoes-mapa-musica
