name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.html"
      - "overlay.html"
      - "electron/**"
      - "build/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/session-permission-guard.js

      - name: Build NSIS installer
        shell: powershell
        run: |
          npm run dist:installer 2>&1 | Tee-Object -FilePath build-installer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JIKKAI-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JIKKAI-Installer-Build-Log
          path: build-installer.log
          if-no-files-found: warn
          retention-days: 7
