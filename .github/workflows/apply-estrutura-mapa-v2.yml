name: Aplicar estrutura e mapa v2

on:
  push:
    branches:
      - feature-estrutura-mapa-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-estrutura-mapa-v2

      - name: Regenerar e validar portal
        run: node scripts/build-etapa2.cjs

      - name: Consolidar arquivos públicos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mapa.html
          if git diff --cached --quiet; then
            echo "Arquivos públicos já estão consolidados."
            exit 0
          fi
          git commit -m "Consolidar estrutura hierárquica e rolagem do mapa"
          git push origin HEAD:feature-estrutura-mapa-v2
