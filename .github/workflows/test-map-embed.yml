name: Testar incorporação do mapa SLP Forge

on:
  push:
    branches:
      - teste-incorporacao-mapa-slpforge
    paths:
      - '.github/workflows/test-map-embed.yml'
      - 'map-test-trigger.txt'

permissions:
  contents: write

jobs:
  test-embed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar navegador e comparador
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.45.0 pixelmatch@5.3.0 pngjs@7.0.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Testar cabeçalhos e renderização em iframe
        shell: bash
        run: |
          mkdir -p .map-test
          curl -sSIL --max-time 30 https://slpforge.xyz/map > .map-test/headers.txt || true
          cat > /tmp/test-map.js <<'NODE'
          const { chromium } = require('playwright');
          const { PNG } = require('pngjs');
          const pixelmatch = require('pixelmatch');
          const fs = require('fs');

          (async () => {
            const url = 'https://slpforge.xyz/map';
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1365, height: 768 },
              deviceScaleFactor: 1,
              ignoreHTTPSErrors: true,
            });

            const direct = await context.newPage();
            const embedded = await context.newPage();
            const consoleMessages = [];
            embedded.on('console', msg => consoleMessages.push(`[${msg.type()}] ${msg.text()}`));
            embedded.on('pageerror', err => consoleMessages.push(`[pageerror] ${err.message}`));

            let directError = null;
            let embedError = null;
            let directStatus = null;
            try {
              const response = await direct.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              directStatus = response ? response.status() : null;
            } catch (e) {
              directError = e.message;
            }

            try {
              await embedded.setContent(`<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}iframe{display:block;width:100vw;height:100vh;border:0;margin:0;padding:0}</style></head><body><iframe id="map" src="${url}" allowfullscreen></iframe></body></html>`, { waitUntil: 'domcontentloaded', timeout: 60000 });
            } catch (e) {
              embedError = e.message;
            }

            await Promise.all([
              direct.waitForTimeout(15000),
              embedded.waitForTimeout(15000),
            ]);

            const childFrames = embedded.frames().filter(f => f !== embedded.mainFrame());
            const frameUrls = childFrames.map(f => f.url());
            let frameTitle = null;
            if (childFrames[0]) {
              try { frameTitle = await childFrames[0].title(); } catch {}
            }

            await direct.screenshot({ path: '.map-test/direct.png', fullPage: false });
            await embedded.screenshot({ path: '.map-test/embedded.png', fullPage: false });

            const img1 = PNG.sync.read(fs.readFileSync('.map-test/direct.png'));
            const img2 = PNG.sync.read(fs.readFileSync('.map-test/embedded.png'));
            const diff = new PNG({ width: img1.width, height: img1.height });
            const differentPixels = pixelmatch(img1.data, img2.data, diff.data, img1.width, img1.height, { threshold: 0.1 });
            fs.writeFileSync('.map-test/diff.png', PNG.sync.write(diff));
            const totalPixels = img1.width * img1.height;
            const differenceRatio = differentPixels / totalPixels;

            const headers = fs.existsSync('.map-test/headers.txt') ? fs.readFileSync('.map-test/headers.txt', 'utf8') : '';
            const xFrameOptions = /(?:^|\n)x-frame-options:\s*([^\r\n]+)/i.exec(headers)?.[1]?.trim() || null;
            const csp = /(?:^|\n)content-security-policy:\s*([^\r\n]+)/i.exec(headers)?.[1]?.trim() || null;
            const frameAncestorsBlocked = csp ? /frame-ancestors\s+[^;]*(?:'none'|'self')/i.test(csp) : false;
            const headerBlocked = !!xFrameOptions || frameAncestorsBlocked;
            const frameLoaded = frameUrls.some(u => u.startsWith('https://slpforge.xyz/map'));
            const consoleBlocked = consoleMessages.some(m => /refused to display|x-frame-options|frame-ancestors|blocked a frame/i.test(m));
            const visuallyEquivalent = differenceRatio <= 0.01;
            const canEmbedExactly = directStatus >= 200 && directStatus < 400 && frameLoaded && !headerBlocked && !consoleBlocked && visuallyEquivalent;

            const result = {
              testedAt: new Date().toISOString(),
              url,
              directStatus,
              directError,
              embedError,
              xFrameOptions,
              contentSecurityPolicy: csp,
              frameAncestorsBlocked,
              frameUrls,
              frameTitle,
              consoleMessages,
              differentPixels,
              totalPixels,
              differenceRatio,
              visuallyEquivalent,
              frameLoaded,
              headerBlocked,
              consoleBlocked,
              canEmbedExactly,
            };
            fs.writeFileSync('.map-test/result.json', JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));
            await browser.close();
          })().catch(err => {
            fs.mkdirSync('.map-test', { recursive: true });
            fs.writeFileSync('.map-test/result.json', JSON.stringify({ canEmbedExactly: false, fatalError: err.message, stack: err.stack }, null, 2));
            console.error(err);
            process.exitCode = 1;
          });
          NODE
          node /tmp/test-map.js

      - name: Salvar resultado do teste
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .map-test
          git commit -m "Registrar teste de incorporação do mapa [skip ci]" || exit 0
          git push origin teste-incorporacao-mapa-slpforge

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-mapa-slpforge
          path: .map-test
