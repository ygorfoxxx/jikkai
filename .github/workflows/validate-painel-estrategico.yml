name: Validar Painel Estratégico JIKKAI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Gerar portal e registrar saída
        shell: bash
        run: node scripts/build-etapa2.cjs > build-painel.log 2>&1 || true

      - name: Publicar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-painel
          path: build-painel.log
          retention-days: 2

      - name: Confirmar build e fontes estratégicas
        shell: bash
        run: |
          cat build-painel.log
          grep -q 'Portal validado:' build-painel.log
          grep -q 'ETAPA 3 — PAINEL ESTRATÉGICO JIKKAI v1' index.html
          grep -q 'function coletarSinaisEstrategicos' index.html
          grep -q 'Gerar alerta no Painel JIKKAI' index.html
          grep -q 'Painel Estratégico JIKKAI' index.html
          grep -q 'Integração com o Painel JIKKAI' mapa.html
          grep -q 'Comprometido' mapa.html
