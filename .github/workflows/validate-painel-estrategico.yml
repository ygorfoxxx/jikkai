name: Validar Painel Estratégico JIKKAI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/painel-estrategico-jikkai

      - name: Consolidar arquivos públicos
        shell: bash
        run: |
          if grep -q 'ETAPA 3 — PAINEL ESTRATÉGICO JIKKAI v1' index.html; then
            echo 'Arquivos já consolidados.'
            exit 0
          fi
          node scripts/materialize-portal.cjs
          git checkout origin/main -- scripts/validate-portal.cjs || true
          rm -f .materialize-painel
          rm -f .github/workflows/materialize-painel.yml scripts/materialize-portal.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidar Painel Estratégico nos arquivos públicos"
          git push origin HEAD:feature/painel-estrategico-jikkai

      - name: Validar portal consolidado
        run: node scripts/validate-portal-v3.cjs
