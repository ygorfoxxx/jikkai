name: Validar Fase 8 - Mapa Estratégico

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  validate-map:
    if: github.head_ref == 'fase8-mapa-estrategico'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar branch da implementação
        uses: actions/checkout@v4

      - name: Aplicar cartografia no arquivo isolado
        id: apply
        shell: bash
        run: |
          mkdir -p phase8-diagnostics
          base64 --decode .phase8/apply.py.gz.b64 | gzip --decompress > /tmp/apply_phase8.py
          python3 -m py_compile /tmp/apply_phase8.py > phase8-diagnostics/compile.log 2>&1
          COMPILE_STATUS=$?
          if [ "$COMPILE_STATUS" -ne 0 ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "$COMPILE_STATUS" > phase8-diagnostics/status.txt
            exit 0
          fi
          python3 /tmp/apply_phase8.py > phase8-diagnostics/apply.log 2>&1
          APPLY_STATUS=$?
          echo "$APPLY_STATUS" > phase8-diagnostics/status.txt
          if [ "$APPLY_STATUS" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Validar estrutura e sintaxe
        id: syntax
        if: steps.apply.outputs.status == 'success'
        shell: bash
        run: |
          set +e
          {
            grep -q 'function MapaEstrategicoPage' index.html &&
            grep -q 'function MapaPontoModal' index.html &&
            grep -q 'function MapaRotaModal' index.html &&
            grep -q 'https://slpforge.xyz/images/map/map_base_low.webp' index.html &&
            grep -q 'id: "edit_map"' index.html
          } > phase8-diagnostics/structure.log 2>&1
          STRUCTURE_STATUS=$?
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.index('<script type="text/babel" data-presets="env,react">')
          start = text.index('>', start) + 1
          end = text.rindex('</script>')
          Path('/tmp/portal.jsx').write_text(text[start:end], encoding='utf-8')
          PY
          EXTRACT_STATUS=$?
          npx --yes esbuild@0.21.5 /tmp/portal.jsx --loader:.jsx=jsx --outfile=/tmp/portal.js > phase8-diagnostics/esbuild.log 2>&1
          ESBUILD_STATUS=$?
          printf 'structure=%s\nextract=%s\nesbuild=%s\n' "$STRUCTURE_STATUS" "$EXTRACT_STATUS" "$ESBUILD_STATUS" > phase8-diagnostics/validation-status.txt
          if [ "$STRUCTURE_STATUS" -eq 0 ] && [ "$EXTRACT_STATUS" -eq 0 ] && [ "$ESBUILD_STATUS" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Preparar pacote validado
        if: steps.apply.outputs.status == 'success' && steps.syntax.outputs.status == 'success'
        shell: bash
        run: |
          mkdir -p validated-phase8
          cp index.html validated-phase8/index.html
          printf '%s\n' 'Fase 8 validada com esbuild.' > validated-phase8/validation.txt

      - name: Enviar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase8-diagnostico
          path: phase8-diagnostics

      - name: Enviar resultado validado
        if: steps.apply.outputs.status == 'success' && steps.syntax.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fase8-index-validado
          path: validated-phase8

      - name: Finalizar validação
        if: always()
        shell: bash
        run: |
          test "${{ steps.apply.outputs.status }}" = "success"
          test "${{ steps.syntax.outputs.status }}" = "success"
