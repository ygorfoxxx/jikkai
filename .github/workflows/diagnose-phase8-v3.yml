name: Diagnosticar Fase 8 v3

on:
  push:
    branches:
      - fase8-mapa-estrategico
    paths:
      - '.github/workflows/diagnose-phase8-v3.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fase8-mapa-estrategico
      - name: Registrar resultado
        shell: bash
        run: |
          mkdir -p .phase8-diagnostics
          set +e
          base64 --decode .phase8/apply.py.gz.b64 | gzip --decompress > /tmp/apply_phase8.py 2> .phase8-diagnostics/decode.log
          echo $? > .phase8-diagnostics/decode-status.txt
          python3 -m py_compile /tmp/apply_phase8.py > .phase8-diagnostics/compile.log 2>&1
          echo $? > .phase8-diagnostics/compile-status.txt
          python3 /tmp/apply_phase8.py > .phase8-diagnostics/apply.log 2>&1
          echo $? > .phase8-diagnostics/apply-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .phase8-diagnostics
          git commit -m "Registrar diagnóstico da Fase 8" || true
          git push origin fase8-mapa-estrategico
          exit 0
