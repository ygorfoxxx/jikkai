name: Aplicar experiência mobile

on:
  push:
    branches:
      - feature-mobile-responsive

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-mobile-responsive

      - name: Aplicar camada responsiva
        run: node scripts/mobile-responsive-loader.cjs

      - name: Validar portal completo
        run: |
          node scripts/validate-portal-v3.cjs
          node scripts/validate-mobile-responsive.cjs

      - name: Consolidar arquivo público
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Portal mobile já está consolidado."
            exit 0
          fi
          git commit -m "Consolidar experiência mobile no portal"
          git push origin HEAD:feature-mobile-responsive
