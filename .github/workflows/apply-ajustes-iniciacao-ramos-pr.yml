name: Aplicar ajustes de iniciação no PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-ajustes-iniciacao-ramos

      - name: Aplicar ajustes e capturar saída
        shell: bash
        run: |
          set +e
          node scripts/ajustes-iniciacao-ramos.cjs > ajuste-iniciacao.log 2>&1
          echo $? > ajuste-iniciacao.status
          exit 0

      - name: Salvar diagnóstico temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ajuste-iniciacao.log ajuste-iniciacao.status
          git commit -m "Registrar diagnóstico dos ajustes de iniciação" || true
          git push origin HEAD:feature-ajustes-iniciacao-ramos

      - name: Confirmar aplicação
        shell: bash
        run: |
          cat ajuste-iniciacao.log
          test "$(cat ajuste-iniciacao.status)" = "0"

      - name: Preservar ajustes no build
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/build-etapa2.cjs';
          let source = fs.readFileSync(path, 'utf8');
          if (!source.includes('./ajustes-iniciacao-ramos.cjs')) {
            source = source.replace(
              '  "./validate-portal-v3.cjs"',
              '  "./ajustes-iniciacao-ramos.cjs",\n  "./validate-portal-v3.cjs"'
            );
          }
          if (!source.includes('./ajustes-iniciacao-ramos.cjs')) throw new Error('Ajuste não incluído no build.');
          fs.writeFileSync(path, source);
          NODE

      - name: Validar portal
        run: |
          node scripts/validate-portal-v3.cjs
          node scripts/validate-ajustes-iniciacao-ramos.cjs

      - name: Consolidar arquivos na branch
        shell: bash
        run: |
          rm -f ajuste-iniciacao.log ajuste-iniciacao.status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html scripts/build-etapa2.cjs ajuste-iniciacao.log ajuste-iniciacao.status
          git commit -m "Consolidar ajustes de iniciação e responsáveis por ramo" || true
          git push origin HEAD:feature-ajustes-iniciacao-ramos
