name: Aplicar Central de Comando

on:
  push:
    branches:
      - feature-central-comando-historia

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-central-comando-historia

      - name: Regenerar e validar portal
        run: node scripts/build-etapa2.cjs

      - name: Consolidar arquivo público
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "O portal já está consolidado."
            exit 0
          fi
          git commit -m "Consolidar Central de Comando e História unificada"
          git push origin HEAD:feature-central-comando-historia
