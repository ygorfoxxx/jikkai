name: Aplicar Central de Comando

on:
  push:
    branches:
      - feature-central-comando-historia
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-central-comando-historia

      - name: Regenerar portal e capturar diagnóstico
        shell: bash
        run: |
          set +e
          node scripts/build-etapa2.cjs > central-build.log 2>&1
          echo $? > central-build.status
          exit 0

      - name: Consolidar saída e diagnóstico
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html central-build.log central-build.status
          if ! git diff --cached --quiet; then
            git commit -m "Registrar build da Central de Comando"
            git push origin HEAD:feature-central-comando-historia
          fi

      - name: Confirmar resultado
        shell: bash
        run: |
          cat central-build.log
          test "$(cat central-build.status)" = "0"
