const STORAGE_KEY = "fox-portal-v3";

async function loadState() {
  // Tenta nuvem primeiro
  if (cloudClient) {
    try {
      const { data, error } = await cloudClient.from("fox_state").select("data").eq("id", 1).single();
      if (!error && data?.data && Object.keys(data.data).length > 0) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data.data)); } catch {}
        return data.data;
      }
    } catch (e) { console.error("cloud load error", e); }
  }
  // Fallback: localStorage
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { console.error("local load error", e); return null; }
}

async function saveStateAsync(s) {
  let cloudOk = null; // null = não configurado
  if (cloudClient) {
    try {
      const { error } = await cloudClient.from("fox_state").upsert({ id: 1, data: s, updated_at: new Date().toISOString() });
      cloudOk = !error;
      if (error) console.error("cloud save error", error);
    } catch (e) { cloudOk = false; console.error(e); }
  }
  let localOk = false;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); localOk = true; }
  catch (e) { console.error("local save error", e); }
  return { cloudOk, localOk };
}

function Btn({ children, onClick, variant = "default", size = "sm", disabled, className = "", type = "button" }) {
  const variants = {
    default: "bg-zinc-900 hover:bg-zinc-800 text-orange-300 border border-zinc-800",
    primary: "bg-gradient-to-r from-red-700 to-orange-700 hover:from-red-600 hover:to-orange-600 text-white",
    danger: "bg-red-950 hover:bg-red-900 text-red-300 border border-red-900",
    ghost: "bg-transparent hover:bg-zinc-900 text-zinc-400 border border-zinc-800",
    success: "bg-green-900 hover:bg-green-800 text-green-200 border border-green-800",
  };
  const sizes = { sm: "px-3 py-1.5 text-xs", md: "px-4 py-2 text-sm", lg: "px-6 py-3 text-base" };
  return (
    <button type={type} onClick={onClick} disabled={disabled} className={`${variants[variant]} ${sizes[size]} uppercase tracking-wider font-bold rounded transition-all disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2 ${className}`}>
      {children}
    </button>
  );
}

function HistoriaPage({ data, setData, isLider }) {
  const [editando, setEditando] = useState(false);
  const [draft, setDraft] = useState(data.historia);

  useEffect(() => { if (!editando) setDraft(data.historia); }, [data.historia, editando]);

  const salvar = () => { setData(d => ({ ...d, historia: draft.filter(e => e.evento.trim()) })); setEditando(false); };
  const cancelar = () => { setDraft(data.historia); setEditando(false); };
  const update = (i, field, val) => setDraft(draft.map((e, idx) => idx === i ? { ...e, [field]: val } : e));
  const remove = (i) => setDraft(draft.filter((_, idx) => idx !== i));
  const add = () => setDraft([...draft, { id: uid(), era: "Nova Era", evento: "Novo evento", desc: "" }]);
  const move = (i, dir) => {
    const ni = i + dir;
    if (ni < 0 || ni >= draft.length) return;
    const n = [...draft];
    [n[i], n[ni]] = [n[ni], n[i]];
    setDraft(n);
  };

  const action = isLider && (
    editando ? (
      <div className="flex gap-2">
        <Btn onClick={cancelar} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
        <Btn onClick={salvar} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn>
      </div>
    ) : (
      <Btn onClick={() => setEditando(true)} variant="default"><IEdit className="w-3 h-3" /> Editar</Btn>
    )
  );

  const eventos = editando ? draft : data.historia;

  return (
    <div>
      <SectionTitle icon={IBook} sub="Da queda de Uzushio ao nascimento da F.O.X." action={action}>História do Clã</SectionTitle>
      <div className="relative pl-8 space-y-6 border-l-2 border-orange-900/40">
        {eventos.map((e, i) => (
          <div key={e.id || i} className="relative">
            <div className="absolute -left-[42px] w-5 h-5 rounded-full bg-black border-2 border-orange-600 flex items-center justify-center">
              <div className="w-1.5 h-1.5 bg-orange-500 rounded-full" />
            </div>
            {editando ? (
              <div className="space-y-2 p-3 bg-zinc-950/60 border border-orange-900/30 rounded">
                <div className="flex gap-2">
                  <input value={e.era} onChange={(ev) => update(i, "era", ev.target.value)} placeholder="Era (ex: Era Antiga)" className="fox-input" />
                  <div className="flex gap-1">
                    <button onClick={() => move(i, -1)} className="px-2 bg-zinc-900 border border-zinc-800 rounded text-zinc-400" title="Subir">↑</button>
                    <button onClick={() => move(i, 1)} className="px-2 bg-zinc-900 border border-zinc-800 rounded text-zinc-400" title="Descer">↓</button>
                    <button onClick={() => remove(i)} className="px-2 bg-red-950/80 text-red-300 rounded"><ITrash className="w-3 h-3" /></button>
                  </div>
                </div>
                <input value={e.evento} onChange={(ev) => update(i, "evento", ev.target.value)} placeholder="Título do evento" className="fox-input" />
                <textarea value={e.desc} onChange={(ev) => update(i, "desc", ev.target.value)} rows="3" placeholder="Descrição do evento" className="fox-input" />
              </div>
            ) : (
              <>
                <div className="text-orange-600 text-xs uppercase tracking-widest mb-1">{e.era}</div>
                <h3 className="text-xl font-bold text-orange-50 mb-2 serif">{e.evento}</h3>
                <p className="text-zinc-400 leading-relaxed">{e.desc}</p>
              </>
            )}
          </div>
        ))}
        {editando && (
          <div className="relative">
            <div className="absolute -left-[42px] w-5 h-5 rounded-full bg-black border-2 border-zinc-700 flex items-center justify-center">
              <IPlus className="w-3 h-3 text-zinc-700" />

        )}

    </div>

}

function FigurasEditor({ figuras, onChange, isLider, cor }) {
  const [editando, setEditando] = useState(false);
  const [draft, setDraft] = useState(figuras);
  // cor pode vir como hex (#D85A30) ou legado ("red"/"orange"); normaliza para hex
  const hex = typeof cor === "string" && cor.startsWith("#") ? cor : (cor === "red" ? "#B91C1C" : "#D85A30");
  const corStyle = { borderColor: hex + "66", background: "#000000" };

  useEffect(() => { if (!editando) setDraft(figuras); }, [figuras, editando]);

  const add = () => setDraft([...draft, { nome: "", desc: "" }]);
  const remove = (i) => setDraft(draft.filter((_, idx) => idx !== i));
  const update = (i, field, val) => setDraft(draft.map((f, idx) => idx === i ? { ...f, [field]: val } : f));
  const salvar = () => { onChange(draft.filter(f => f.nome.trim())); setEditando(false); };
  const cancelar = () => { setDraft(figuras); setEditando(false); };

  return (
    <div>
      <div className="flex items-center justify-between mb-2 gap-2 flex-wrap">
        <div className="text-xs uppercase tracking-wider font-semibold" style={{ color: hex }}>Figuras de destaque</div>
        {isLider && !editando && <Btn onClick={() => setEditando(true)} variant="ghost"><IEdit className="w-3 h-3" /> Editar</Btn>}
        {isLider && editando && (
          <div className="flex gap-2">
            <Btn onClick={cancelar} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
            <Btn onClick={salvar} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn>
          </div>
        )}
      </div>

      {!editando && figuras.length === 0 && (
        <div className="text-zinc-600 text-sm italic p-4 bg-black/40 border border-zinc-900 rounded">
          Nenhuma figura registrada ainda.{isLider && " Clique em Editar para adicionar."}
        </div>
      )}

      {!editando && figuras.length > 0 && (
        <div className="grid sm:grid-cols-2 md:grid-cols-3 gap-2 text-sm">
          {figuras.map((f, i) => (
            <div key={i} className="p-3 bg-black/60 border rounded" style={corStyle}>
              <div className="font-bold" style={{ color: hex }}>{f.nome}</div>
              <div className="text-zinc-500 text-xs">{f.desc}</div>
            </div>
          ))}
        </div>
      )}

      {editando && (
        <div className="space-y-2">
          {draft.map((f, i) => (
            <div key={i} className="p-3 bg-black/60 border rounded flex gap-2 items-start" style={corStyle}>
              <div className="flex-1 space-y-2">
                <input value={f.nome} onChange={(e) => update(i, "nome", e.target.value)} placeholder="Nome" className="fox-input" />
                <input value={f.desc} onChange={(e) => update(i, "desc", e.target.value)} placeholder="Descrição curta" className="fox-input" />
              </div>
              <button onClick={() => remove(i)} className="text-red-500 hover:text-red-400 p-2"><ITrash className="w-4 h-4" /></button>
            </div>
          ))}
          <Btn onClick={add} variant="ghost" className="w-full justify-center"><IPlus className="w-3 h-3" /> Adicionar figura</Btn>
        </div>
      )}
    </div>
  );
}

      <div><label className="fox-label">Status</label>
        <select value={status} onChange={(e) => setStatus(e.target.value)} className="fox-input">

        </select>
      </div>
      <div>
        <label className="fox-label">Objetivos ({objetivos.length})</label>
        <div className="space-y-1 mb-2">
          {objetivos.map((o, i) => (
            <div key={i} className="flex items-center gap-2 p-2 bg-black/60 border border-zinc-800 rounded">
              <input type="checkbox" checked={o.done} onChange={() => toggleObj(i)} className="w-4 h-4 accent-orange-600" />
              <span className={`flex-1 text-sm ${o.done ? "line-through text-zinc-600" : "text-zinc-300"}`}>{o.text}</span>
              <button onClick={() => removeObj(i)} className="text-red-500"><ITrash className="w-3 h-3" /></button>
            </div>
          ))}
        </div>
        <div className="flex gap-2">
          <input value={novoObj} onChange={(e) => setNovoObj(e.target.value)} onKeyDown={(e) => e.key === "Enter" && (e.preventDefault(), addObj())} placeholder="Novo objetivo..." className="fox-input" />
          <Btn onClick={addObj} variant="default"><IPlus className="w-3 h-3" /></Btn>

      <div className="flex gap-2 pt-2 border-t border-zinc-800">
        <Btn onClick={onCancel} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
        <Btn onClick={() => onSave({ titulo, desc, status, objetivos })} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn>
      </div>
    </div>
  );
}

function JikkaiPage({ data, setData, isLider }) {
  const [editandoFase, setEditandoFase] = useState(null);

  const updateFase = (n, patch) => setData(d => ({ ...d, fases: d.fases.map(f => f.n === n ? { ...f, ...patch } : f) }));
  const toggleObjetivo = (n, oi) => {
    const fase = data.fases.find(f => f.n === n);
    updateFase(n, { objetivos: fase.objetivos.map((o, idx) => idx === oi ? { ...o, done: !o.done } : o) });
  };

  return (
    <div>
      <SectionTitle icon={ITarget} sub="O grande plano para fundar Kumogakure">JIKKAI</SectionTitle>
      <div className="space-y-4">
        {data.fases.map((f) => {
          const c = STATUS_CFG[f.status] || STATUS_CFG.pendente;
          const editando = editandoFase === f.n;
          return (
            <div key={f.n} className={`p-5 rounded-lg border ${c.border} ${c.bg} fadein`}>
              <div className="flex items-start gap-4">
                <div className={`flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center font-black text-xl ${c.circle}`}>
                  {f.status === "concluida" ? <ICheck className="w-5 h-5" /> : f.n}
                </div>
                <div className="flex-1 min-w-0">
                  {!editando ? (
                    <>
                      <div className="flex items-center gap-2 mb-1 flex-wrap">
                        <h3 className="text-orange-50 font-bold text-lg">{f.titulo}</h3>
                        <span className={`text-xs px-2 py-0.5 rounded font-bold uppercase tracking-wider ${c.badge}`}>{c.label}</span>
                        {isLider && <button onClick={() => setEditandoFase(f.n)} className="ml-auto text-zinc-500 hover:text-orange-400"><IEdit className="w-4 h-4" /></button>}
                      </div>
                      <p className="text-zinc-400 text-sm leading-relaxed mb-3">{f.desc}</p>
                      {f.objetivos.length > 0 && (
                        <div className="space-y-1.5 mt-3">
                          <div className="text-xs uppercase tracking-wider text-orange-600 mb-1">Objetivos</div>
                          {f.objetivos.map((o, oi) => (
                            <label key={oi} className={`flex items-center gap-2 text-sm ${isLider ? "cursor-pointer" : ""}`}>
                              <input type="checkbox" checked={o.done} disabled={!isLider} onChange={() => toggleObjetivo(f.n, oi)} className="w-4 h-4 accent-orange-600" />
                              <span className={o.done ? "line-through text-zinc-600" : "text-zinc-300"}>{o.text}</span>
                            </label>
                          ))}
                        </div>
                      )}
                      {f.objetivos.length === 0 && isLider && <div className="text-zinc-600 text-xs italic mt-2">Sem objetivos. Edite a fase para adicionar.</div>}
                    </>
                  ) : (
                    <FaseEditor fase={f} onSave={(patch) => { updateFase(f.n, patch); setEditandoFase(null); }} onCancel={() => setEditandoFase(null)} />
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ArmasPage({ data, setData, isLider }) {
  const [editando, setEditando] = useState(false);
  const [draft, setDraft] = useState(data.armas);

  useEffect(() => { if (!editando) setDraft(data.armas); }, [data.armas, editando]);

  const salvar = () => { setData(d => ({ ...d, armas: draft.filter(a => a.nome.trim()) })); setEditando(false); };
  const cancelar = () => { setDraft(data.armas); setEditando(false); };
  const updateArma = (i, patch) => setDraft(draft.map((a, idx) => idx === i ? { ...a, ...patch } : a));
  const removeArma = (i) => setDraft(draft.filter((_, idx) => idx !== i));
  const addArma = () => setDraft([...draft, { id: uid(), nome: "Nova Arma", vila: "", dificuldade: "Médio", status: "Não capturada", cor: "#D85A30" }]);

  const toggleCap = (i) => setData(d => ({
    ...d,
    armas: d.armas.map((a, idx) => idx === i ? { ...a, status: a.status === "Capturada" ? "Não capturada" : "Capturada" } : a)
  }));

  const action = isLider && (
    editando ? (
      <div className="flex gap-2">
        <Btn onClick={cancelar} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
        <Btn onClick={salvar} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn>
      </div>
    ) : (
      <Btn onClick={() => setEditando(true)} variant="default"><IEdit className="w-3 h-3" /> Editar Armas</Btn>
    )
  );

  const armas = editando ? draft : data.armas;

  return (
    <div>
      <SectionTitle icon={ISwords} sub="Relíquias lendárias" action={action}>Armas Lendárias</SectionTitle>
      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
        {armas.map((a, i) => {
          const cap = a.status === "Capturada";
          return (
            <div key={a.id || i} className={`rounded-lg border overflow-hidden ${cap ? "border-green-700 bg-green-950/10" : "border-zinc-800 bg-gradient-to-br from-zinc-950 to-black"}`}>
              <div className="p-5 border-b border-zinc-800" style={{ background: `linear-gradient(135deg, ${a.cor}22, transparent)` }}>
                {editando ? (
                  <div className="space-y-2">
                    <input value={a.nome} onChange={(e) => updateArma(i, { nome: e.target.value })} placeholder="Nome" className="fox-input" />
                    <input value={a.vila} onChange={(e) => updateArma(i, { vila: e.target.value })} placeholder="Vila de origem" className="fox-input" />
                    <div className="flex gap-2 items-center">
                      <label className="fox-label mb-0">Cor</label>
                      <input type="color" value={a.cor} onChange={(e) => updateArma(i, { cor: e.target.value })} className="h-8 w-14 rounded bg-transparent border border-zinc-700" />
                      <button onClick={() => { if (confirm(`Remover ${a.nome}?`)) removeArma(i); }} className="ml-auto text-red-300 bg-red-950/80 p-2 rounded"><ITrash className="w-4 h-4" /></button>
                    </div>
                  </div>
                ) : (
                  <>
                    <div className="text-xs uppercase tracking-widest mb-1" style={{ color: a.cor }}>{a.vila}</div>
                    <h3 className="text-2xl font-black text-orange-50 serif">{a.nome}</h3>
                  </>
                )}
              </div>
              <div className="p-5 space-y-3">
                {editando ? (
                  <>
                    <div>
                      <label className="fox-label">Dificuldade</label>
                      <select value={a.dificuldade} onChange={(e) => updateArma(i, { dificuldade: e.target.value })} className="fox-input">
                        <option>Fácil</option><option>Médio</option><option>Difícil</option><option>Impossível</option>
                      </select>
                    </div>
                    <div>
                      <label className="fox-label">Status</label>
                      <select value={a.status} onChange={(e) => updateArma(i, { status: e.target.value })} className="fox-input">
                        <option>Não capturada</option><option>Capturada</option><option>Em custódia de aliado</option><option>Perdida</option>
                      </select>
                    </div>
                  </>
                ) : (
                  <>
                    <div className="flex justify-between text-sm"><span className="text-zinc-500 uppercase tracking-wider text-xs">Dificuldade</span><span className="text-orange-300 font-bold">{a.dificuldade}</span></div>
                    <div className="flex justify-between text-sm"><span className="text-zinc-500 uppercase tracking-wider text-xs">Status</span><span className={`font-bold ${cap ? "text-green-400" : "text-red-400"}`}>{a.status}</span></div>
                    {isLider && <Btn onClick={() => toggleCap(i)} variant={cap ? "danger" : "primary"} className="w-full justify-center mt-2">{cap ? "Marcar como não capturada" : "Marcar como capturada"}</Btn>}
                  </>
                )}
              </div>
            </div>
          );
        })}
        {editando && (
          <button onClick={addArma} className="rounded-lg border-2 border-dashed border-zinc-800 hover:border-orange-700 text-zinc-600 hover:text-orange-500 py-16 flex flex-col items-center gap-2 transition-colors">
            <IPlus className="w-8 h-8" />
            <span className="uppercase tracking-wider text-xs font-bold">Nova Arma</span>
          </button>
        )}
      </div>
    </div>
  );
}

function JuramentoPage({ usuario, juramentado, juramentar, juramentados, removerJuramento, isLider }) {
  const [step, setStep] = useState(0);
  const [aceitos, setAceitos] = useState(new Array(MANDAMENTOS.length).fill(false));
  const [form, setForm] = useState({ nome: usuario?.displayName || "", linhagem: "", elemento: "Katon", idade: "", motivacao: "" });
  const [fraseTypo, setFraseTypo] = useState("");
  const [selando, setSelando] = useState(false);

  if (juramentado) return <JuramentadoView juramentado={juramentado} juramentados={juramentados} isLider={isLider} removerJuramento={removerJuramento} />;

  const todosAceitos = aceitos.every(Boolean);
  const formValido = form.nome.trim() && form.motivacao.trim();
  const fraseOk = fraseTypo.trim() === FRASE_JURAMENTO;

  const iniciarSelo = async () => {
    setSelando(true);
    await new Promise(r => setTimeout(r, 4000));
    juramentar({ ...form, nome: form.nome.trim(), data: new Date().toISOString(), username: usuario.username });
    setSelando(false);
  };

  if (selando) return (
    <div className="min-h-[60vh] flex flex-col items-center justify-center text-center fadein">
      <ISkull className="w-24 h-24 text-orange-600 mb-6 pulse-fire" />
      <div className="text-orange-600 uppercase tracking-[0.4em] text-xs mb-3">Selando o Pacto</div>
      <h2 className="text-3xl font-black text-orange-50 serif mb-6">Seu sangue pertence à F.O.X.</h2>
      <div className="w-full max-w-md h-2 bg-zinc-900 rounded overflow-hidden">
        <div className="h-full bg-gradient-to-r from-red-700 to-orange-600 blood-fill" />
      </div>
      <div className="text-zinc-600 text-xs mt-4 italic">Não há caminho de volta...</div>
    </div>
  );

  return (
    <div>
      <SectionTitle icon={IDrop} sub={`Etapa ${step + 1} de 4`}>Ritual de Juramento</SectionTitle>
      <div className="mb-6"><div className="flex gap-1">{[0,1,2,3].map(i => <div key={i} className={`flex-1 h-1 rounded ${i <= step ? "bg-orange-600" : "bg-zinc-900"}`} />)}</div></div>

      {step === 0 && (
        <div className="fadein">
          <div className="rounded-lg border-2 border-red-900/60 bg-gradient-to-br from-red-950/30 to-black p-8 text-center">
            <IAlert className="w-16 h-16 text-red-500 mx-auto mb-4 pulse-fire" />
            <h3 className="text-2xl font-black text-red-50 serif mb-3">ADVERTÊNCIA FINAL</h3>
            <p className="text-zinc-300 leading-relaxed max-w-xl mx-auto mb-4">
              O juramento que você está prestes a fazer é <strong className="text-red-400">irrevogável</strong>.
              Uma vez selado, seu destino ficará atrelado ao clã Lamona e à F.O.X. para sempre.
            </p>
            <p className="text-zinc-400 leading-relaxed max-w-xl mx-auto mb-6 text-sm italic">
              Quem trai o pacto, trai o clã. Quem trai o clã, é caçado até o fim dos tempos. Não há perdão.
            </p>
            <div className="text-red-500 uppercase tracking-widest text-xs mb-4">Se prosseguires, não haverá retorno</div>
            <Btn onClick={() => setStep(1)} variant="primary" size="lg">Tenho coragem — Prosseguir</Btn>
          </div>
        </div>
      )}

      {step === 1 && (
        <div className="fadein space-y-4">
          <div className="p-4 bg-zinc-950/60 border border-orange-900/40 rounded">
            <h3 className="text-orange-50 font-bold mb-1">Os 7 Mandamentos</h3>
            <p className="text-zinc-500 text-sm">Leia e aceite cada mandamento individualmente.</p>
          </div>
          <div className="space-y-2">
            {MANDAMENTOS.map((m, i) => (
              <label key={i} className={`flex items-start gap-3 p-4 rounded border cursor-pointer transition-all ${aceitos[i] ? "bg-orange-950/20 border-orange-700" : "bg-zinc-950/50 border-zinc-800 hover:border-zinc-700"}`}>
                <input type="checkbox" checked={aceitos[i]} onChange={(e) => { const n = [...aceitos]; n[i] = e.target.checked; setAceitos(n); }} className="mt-1 w-4 h-4 accent-orange-600" />
                <div>
                  <div className="text-orange-600 font-bold text-xs uppercase tracking-wider mb-1">Mandamento {i + 1}</div>
                  <div className="text-zinc-200">{m}</div>
                </div>

          </div>
          <div className="flex gap-2 pt-2">
            <Btn onClick={() => setStep(0)} variant="ghost">Voltar</Btn>

              {todosAceitos ? "Aceito os 7 Mandamentos" : `Aceite todos (${aceitos.filter(Boolean).length}/7)`}

      {step === 2 && (
        <div className="fadein space-y-4">

          <div className="space-y-4 p-6 bg-zinc-950/50 border border-zinc-800 rounded">
            <div><label className="fox-label">Nome no jogo *</label><input value={form.nome} onChange={(e) => setForm({ ...form, nome: e.target.value })} className="fox-input" /></div>
            <div className="grid sm:grid-cols-2 gap-3">

            </div>
            <div><label className="fox-label">Elemento</label>
              <select value={form.elemento} onChange={(e) => setForm({ ...form, elemento: e.target.value })} className="fox-input">
                <option>Katon</option><option>Suiton</option><option>Doton</option><option>Raiton</option><option>Fuuton</option>
              </select>
            </div>
            <div><label className="fox-label">Motivação * — Por que quer entrar?</label><textarea value={form.motivacao} onChange={(e) => setForm({ ...form, motivacao: e.target.value })} rows="4" className="fox-input" placeholder="Sua história, seu motivo..." /></div>
          </div>
          <div className="flex gap-2 pt-2">
            <Btn onClick={() => setStep(1)} variant="ghost">Voltar</Btn>
            <Btn onClick={() => setStep(3)} variant="primary" disabled={!formValido} className="flex-1 justify-center">Prosseguir</Btn>
          </div>
        </div>
      )}

      {step === 3 && (
        <div className="fadein space-y-4">
          <div className="p-6 bg-gradient-to-br from-red-950/30 to-black border-2 border-orange-900/60 rounded-lg text-center">
            <ISkull className="w-12 h-12 text-orange-500 mx-auto mb-3" />
            <h3 className="text-orange-50 font-bold text-xl serif mb-2">O Juramento Final</h3>
            <p className="text-zinc-400 text-sm mb-6">Digite exatamente a frase abaixo:</p>
            <div className="bg-black/60 border border-orange-700 rounded py-4 px-6 mb-6 inline-block">
              <code className="text-orange-400 text-lg serif italic">"{FRASE_JURAMENTO}"</code>
            </div>
            <input value={fraseTypo} onChange={(e) => setFraseTypo(e.target.value)} className="fox-input text-center text-lg" placeholder="Digite a frase..." autoFocus />
            {fraseTypo && !fraseOk && <div className="text-red-500 text-xs mt-2">A frase não coincide exatamente.</div>}
          </div>
          <div className="flex gap-2 pt-2">
            <Btn onClick={() => setStep(2)} variant="ghost">Voltar</Btn>
            <Btn onClick={iniciarSelo} variant="primary" disabled={!fraseOk} className="flex-1 justify-center" size="lg"><IDrop className="w-4 h-4" /> Selar o Pacto</Btn>
          </div>
        </div>
      )}
    </div>
  );
}

    const m = data.missoes.find(x => x.id === id);

                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <h3 className="text-orange-50 font-bold text-lg">{m.titulo}</h3>
                    <span className={`text-xs px-2 py-0.5 rounded font-bold uppercase tracking-wider ${c.badge}`}>{c.label}</span>
                  </div>
                  <p className="text-zinc-400 text-sm leading-relaxed mb-2">{m.desc}</p>
                  <div className="text-zinc-600 text-xs mb-3">Atribuída por <strong className="text-orange-600">{atribuidor?.displayName || m.assignedBy}</strong> em {new Date(m.createdAt).toLocaleDateString("pt-BR")}</div>

                  {m.objetivos.length > 0 && (
                    <>
                      <div className="mb-2">
                        <div className="flex justify-between text-xs text-zinc-500 mb-1">
                          <span className="uppercase tracking-wider text-orange-600">Progresso</span>
                          <span>{prog}%</span>
                        </div>
                        <div className="h-1 bg-zinc-900 rounded overflow-hidden">
                          <div className="h-full bg-gradient-to-r from-orange-600 to-red-600 transition-all" style={{ width: `${prog}%` }} />
                        </div>
                      </div>
                      <div className="space-y-1.5 mt-3">
                        {m.objetivos.map((o, oi) => (
                          <label key={oi} className="flex items-center gap-2 text-sm cursor-pointer">
                            <input type="checkbox" checked={o.done} onChange={() => toggleObj(m.id, oi)} className="w-4 h-4 accent-orange-600" />
                            <span className={o.done ? "line-through text-zinc-600" : "text-zinc-300"}>{o.text}</span>
                          </label>
                        ))}
                      </div>
                    </>
                  )}

                  <div className="flex gap-2 mt-4 pt-3 border-t border-zinc-800">
                    <span className="text-xs text-zinc-600 uppercase tracking-wider mr-auto self-center">Marcar como:</span>
                    <Btn onClick={() => updateMissao(m.id, { status: "pendente" })} variant={m.status === "pendente" ? "default" : "ghost"}>Pendente</Btn>
                    <Btn onClick={() => updateMissao(m.id, { status: "andamento" })} variant={m.status === "andamento" ? "primary" : "ghost"}>Em andamento</Btn>
                    <Btn onClick={() => updateMissao(m.id, { status: "concluida" })} variant={m.status === "concluida" ? "success" : "ghost"}>Concluída</Btn>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function UsuariosManager({ data, setData }) {
  const [editando, setEditando] = useState(null);
  const [form, setForm] = useState({ username: "", password: "", displayName: "", role: "member", status: "Ativo", trio: "", level: 0 });
  const [erro, setErro] = useState("");

  const iniciarEdit = (u) => {
    setEditando(u.username);
    setForm({ ...u, password: "" });
    setErro("");
  };
  const iniciarNovo = () => {
    setEditando("__novo__");
    setForm({ username: "", password: "", displayName: "", role: "member", status: "Ativo", trio: "", level: 0 });
    setErro("");
  };
  const cancelar = () => { setEditando(null); setErro(""); };
  const salvar = () => {
    if (!form.username.trim() || !form.displayName.trim()) { setErro("Username e nome são obrigatórios."); return; }
    if (editando === "__novo__") {
      if (data.users.find(u => u.username === form.username)) { setErro("Username já existe."); return; }
      if (!form.password) { setErro("Senha obrigatória para novo usuário."); return; }
      setData(d => ({ ...d, users: [...d.users, { ...form, level: Number(form.level) || 0 }] }));
    } else {
      setData(d => ({
        ...d,
        users: d.users.map(u => u.username === editando ? { ...u, ...form, password: form.password || u.password, level: Number(form.level) || 0 } : u)
      }));
    }
    setEditando(null);
  };
  const remover = (username) => {
    if (username === "leader") { alert("O líder principal não pode ser removido."); return; }
    if (confirm(`Remover ${username}?`)) {
      setData(d => ({ ...d, users: d.users.filter(u => u.username !== username), missoes: d.missoes.filter(m => m.assignedTo !== username) }));
    }
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h3 className="text-orange-50 font-bold text-lg serif">Usuários ({data.users.length})</h3>
        {editando === null && <Btn onClick={iniciarNovo} variant="primary"><IPlus className="w-3 h-3" /> Novo Usuário</Btn>}
      </div>

      {editando !== null && (
        <div className="p-4 bg-zinc-950/80 border border-orange-700 rounded-lg space-y-3 fadein">
          <h4 className="text-orange-50 font-bold">{editando === "__novo__" ? "Novo Usuário" : `Editando ${editando}`}</h4>
          <div className="grid sm:grid-cols-2 gap-3">
            <div><label className="fox-label">Username (login)</label><input value={form.username} onChange={(e) => setForm({...form, username: e.target.value})} disabled={editando !== "__novo__"} className="fox-input" /></div>
            <div><label className="fox-label">Nome de exibição</label><input value={form.displayName} onChange={(e) => setForm({...form, displayName: e.target.value})} className="fox-input" /></div>
            <div><label className="fox-label">Senha {editando !== "__novo__" && "(deixe vazio p/ manter)"}</label><input type="text" value={form.password} onChange={(e) => setForm({...form, password: e.target.value})} className="fox-input" /></div>
            <div><label className="fox-label">Cargo</label>
              <select value={form.role} onChange={(e) => setForm({...form, role: e.target.value})} className="fox-input">
                {data.roles.map(r => <option key={r.id} value={r.id}>{r.nome}</option>)}
              </select>
            </div>
            <div><label className="fox-label">Status</label>
              <select value={form.status} onChange={(e) => setForm({...form, status: e.target.value})} className="fox-input">
                <option>Ativo</option><option>Oculto</option><option>Renegado</option><option>Procurado</option><option>Novo</option><option>Líder</option>
              </select>
            </div>
            <div><label className="fox-label">Trio</label><input value={form.trio} onChange={(e) => setForm({...form, trio: e.target.value})} className="fox-input" /></div>
            <div><label className="fox-label">Level</label><input type="number" value={form.level} onChange={(e) => setForm({...form, level: e.target.value})} className="fox-input" /></div>
          </div>
          {erro && <div className="text-red-500 text-xs">{erro}</div>}
          <div className="flex gap-2 pt-2 border-t border-zinc-800">
            <Btn onClick={cancelar} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
            <Btn onClick={salvar} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn>
          </div>
        </div>
      )}

      <div className="grid sm:grid-cols-2 gap-3">
        {data.users.map((u) => {
          const role = data.roles.find(r => r.id === u.role);
          return (
            <div key={u.username} className="p-4 bg-zinc-950/60 border border-zinc-800 rounded-lg">
              <div className="flex justify-between items-start mb-2 gap-2">
                <div className="min-w-0 flex-1">
                  <div className="text-orange-50 font-bold">{u.displayName}</div>
                  <div className="text-zinc-500 text-xs">@{u.username}</div>
                  <div className="text-xs mt-1" style={{ color: role?.cor }}>{role?.nome}</div>
                </div>
                <div className="flex gap-1">
                  <button onClick={() => iniciarEdit(u)} className="p-1.5 text-orange-400 hover:text-orange-300"><IEdit className="w-3.5 h-3.5" /></button>
                  {u.username !== "leader" && <button onClick={() => remover(u.username)} className="p-1.5 text-red-500 hover:text-red-400"><ITrash className="w-3.5 h-3.5" /></button>}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CargosManager({ data, setData }) {
  const [form, setForm] = useState({ nome: "", hasLeaderPerms: false, cor: "#7C2D12" });
  const [criando, setCriando] = useState(false);

  const criar = () => {
    if (!form.nome.trim()) return;
    const id = form.nome.toLowerCase().replace(/\s+/g, "_") + "_" + uid().slice(0, 4);
    setData(d => ({ ...d, roles: [...d.roles, { id, ...form }] }));
    setForm({ nome: "", hasLeaderPerms: false, cor: "#7C2D12" });
    setCriando(false);
  };
  const remover = (id) => {
    const role = data.roles.find(r => r.id === id);
    if (role?.protected) { alert("Este cargo é protegido."); return; }
    if (data.users.find(u => u.role === id)) { alert("Há usuários com esse cargo. Mude-os antes de remover."); return; }
    if (confirm(`Remover cargo ${role.nome}?`)) {
      setData(d => ({ ...d, roles: d.roles.filter(r => r.id !== id) }));
    }
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h3 className="text-orange-50 font-bold text-lg serif">Cargos ({data.roles.length})</h3>
        {!criando && <Btn onClick={() => setCriando(true)} variant="primary"><IPlus className="w-3 h-3" /> Novo Cargo</Btn>}
      </div>

      {criando && (
        <div className="p-4 bg-zinc-950/80 border border-orange-700 rounded-lg space-y-3 fadein">
          <h4 className="text-orange-50 font-bold">Novo Cargo Customizado</h4>
          <div><label className="fox-label">Nome do cargo</label><input value={form.nome} onChange={(e) => setForm({...form, nome: e.target.value})} className="fox-input" placeholder="Ex: Executor, Sábio, Espião..." /></div>
          <div className="flex items-center gap-3">
            <label className="fox-label mb-0">Cor</label>
            <input type="color" value={form.cor} onChange={(e) => setForm({...form, cor: e.target.value})} className="h-8 w-14 rounded bg-transparent border border-zinc-700" />
          </div>
          <label className="flex items-center gap-2 text-sm text-zinc-300 cursor-pointer">
            <input type="checkbox" checked={form.hasLeaderPerms} onChange={(e) => setForm({...form, hasLeaderPerms: e.target.checked})} className="w-4 h-4 accent-orange-600" />
            Este cargo tem permissões de líder (edição total)
          </label>
          <div className="flex gap-2 pt-2 border-t border-zinc-800">
            <Btn onClick={() => setCriando(false)} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
            <Btn onClick={criar} variant="primary"><ISave className="w-3 h-3" /> Criar</Btn>
          </div>
        </div>
      )}

      <div className="space-y-2">
        {data.roles.map((r) => {
          const count = data.users.filter(u => u.role === r.id).length;
          return (
            <div key={r.id} className="p-4 bg-zinc-950/60 border border-zinc-800 rounded-lg flex items-center gap-3">
              <div className="w-3 h-12 rounded" style={{ background: r.cor }} />
              <div className="flex-1 min-w-0">
                <div className="text-orange-50 font-bold">{r.nome} {r.protected && <span className="text-xs text-zinc-600">(protegido)</span>}</div>
                <div className="text-zinc-500 text-xs">{count} usuário(s) · {r.hasLeaderPerms ? <span className="text-orange-500">Permissões de líder</span> : "Membro comum"}</div>
              </div>
              {!r.protected && <button onClick={() => remover(r.id)} className="text-red-500 hover:text-red-400 p-2"><ITrash className="w-4 h-4" /></button>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function MissoesManager({ data, setData, usuario }) {
  const [criando, setCriando] = useState(false);
  const [form, setForm] = useState({ titulo: "", desc: "", assignedTo: "", objetivosText: "" });

  const criar = () => {
    if (!form.titulo.trim() || !form.assignedTo) return;
    const objetivos = form.objetivosText.split("\n").map(s => s.trim()).filter(Boolean).map(text => ({ text, done: false }));
    const nova = {
      id: uid(),
      titulo: form.titulo.trim(),
      desc: form.desc.trim(),
      assignedTo: form.assignedTo,
      assignedBy: usuario.username,
      createdAt: new Date().toISOString(),
      objetivos,
      status: "pendente",
    };
    setData(d => ({ ...d, missoes: [...d.missoes, nova] }));
    setForm({ titulo: "", desc: "", assignedTo: "", objetivosText: "" });
    setCriando(false);
  };
  const remover = (id) => {
    if (confirm("Remover esta missão?")) setData(d => ({ ...d, missoes: d.missoes.filter(m => m.id !== id) }));
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h3 className="text-orange-50 font-bold text-lg serif">Missões Atribuídas ({data.missoes.length})</h3>
        {!criando && <Btn onClick={() => setCriando(true)} variant="primary"><IPlus className="w-3 h-3" /> Nova Missão</Btn>}
      </div>

      {criando && (
        <div className="p-4 bg-zinc-950/80 border border-orange-700 rounded-lg space-y-3 fadein">
          <h4 className="text-orange-50 font-bold">Nova Missão</h4>
          <div><label className="fox-label">Atribuir a *</label>
            <select value={form.assignedTo} onChange={(e) => setForm({...form, assignedTo: e.target.value})} className="fox-input">
              <option value="">-- Selecione --</option>
              {data.users.map(u => <option key={u.username} value={u.username}>{u.displayName} (@{u.username})</option>)}
            </select>
          </div>
          <div><label className="fox-label">Título *</label><input value={form.titulo} onChange={(e) => setForm({...form, titulo: e.target.value})} className="fox-input" placeholder="Ex: Infiltração em Kirigakure" /></div>
          <div><label className="fox-label">Descrição</label><textarea value={form.desc} onChange={(e) => setForm({...form, desc: e.target.value})} rows="3" className="fox-input" placeholder="Contexto, objetivo geral..." /></div>
          <div><label className="fox-label">Objetivos (um por linha)</label>
            <textarea value={form.objetivosText} onChange={(e) => setForm({...form, objetivosText: e.target.value})} rows="5" className="fox-input" placeholder="Mapear o perímetro&#10;Identificar o alvo&#10;Relatar em 48h" />
          </div>
          <div className="flex gap-2 pt-2 border-t border-zinc-800">
            <Btn onClick={() => setCriando(false)} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
            <Btn onClick={criar} variant="primary" disabled={!form.titulo.trim() || !form.assignedTo}><ISave className="w-3 h-3" /> Enviar Missão</Btn>
          </div>
        </div>
      )}

      {data.missoes.length === 0 && !criando && (
        <div className="p-8 text-center bg-zinc-950/50 border border-zinc-800 rounded-lg text-zinc-600 italic">
          Nenhuma missão atribuída ainda.
        </div>
      )}

      <div className="space-y-3">
        {data.missoes.map((m) => {
          const c = STATUS_CFG[m.status];
          const target = data.users.find(u => u.username === m.assignedTo);
          const prog = m.objetivos.length > 0 ? Math.round(m.objetivos.filter(o => o.done).length / m.objetivos.length * 100) : 0;
          return (
            <div key={m.id} className={`p-4 rounded-lg border ${c.border} ${c.bg}`}>
              <div className="flex items-start justify-between gap-2 mb-2">
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2 flex-wrap mb-1">
                    <h4 className="text-orange-50 font-bold">{m.titulo}</h4>
                    <span className={`text-xs px-2 py-0.5 rounded font-bold uppercase tracking-wider ${c.badge}`}>{c.label}</span>
                  </div>
                  <div className="text-zinc-500 text-xs">→ {target?.displayName || m.assignedTo}</div>
                </div>
                <button onClick={() => remover(m.id)} className="text-red-500 p-1"><ITrash className="w-4 h-4" /></button>
              </div>
              {m.desc && <p className="text-zinc-400 text-sm mb-2">{m.desc}</p>}
              {m.objetivos.length > 0 && (
                <div className="text-xs text-zinc-500">
                  {m.objetivos.filter(o => o.done).length}/{m.objetivos.length} objetivos · {prog}%
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

      <div className="p-4 bg-zinc-950/60 border border-zinc-800 rounded">
        <div className="text-xs text-zinc-500 uppercase tracking-wider mb-2">Estatísticas</div>

          <div><div className="text-orange-50 font-bold">{data.juramentados.length}</div><div className="text-zinc-600 text-xs">juramentados</div></div>
        </div>

function LoginScreen({ data, onLogin }) {
  const [user, setUser] = useState("");
  const [pass, setPass] = useState("");
  const [erro, setErro] = useState("");

  const tentar = (e) => {
    e.preventDefault();
    const u = data.users.find(x => x.username.toLowerCase() === user.trim().toLowerCase() && x.password === pass);
    if (u) onLogin(u);
    else setErro("Credenciais inválidas. Contate o líder para obter acesso.");
  };

  return (
    <div className="min-h-screen bg-black flex items-center justify-center p-4 relative overflow-hidden">
      <div className="absolute inset-0 opacity-20" style={{
        backgroundImage: "radial-gradient(circle at 20% 30%, #7C2D12 0%, transparent 50%), radial-gradient(circle at 80% 70%, #B91C1C 0%, transparent 50%)"
      }} />
      <div className="relative w-full max-w-md">
        <div className="text-center mb-8">
          <div className="inline-block p-4 rounded-full border-2 border-orange-700 bg-black mb-4">
            <IFlame className="w-10 h-10 text-orange-500 pulse-fire" />
          </div>
          <div className="text-orange-600 text-xs uppercase tracking-[0.4em] mb-1">JIKKAI</div>
          <h1 className="text-5xl font-black text-orange-50 serif">F.O.X.</h1>
          <p className="text-zinc-600 text-sm italic mt-2">Portal Restrito</p>
        </div>
        <form onSubmit={tentar} className="bg-zinc-950/80 border border-orange-900/40 rounded-lg p-6 backdrop-blur space-y-4">
          <div><label className="fox-label">Identificação</label><input value={user} onChange={(e) => setUser(e.target.value)} className="fox-input" placeholder="Seu username" /></div>
          <div><label className="fox-label">Senha</label><input type="password" value={pass} onChange={(e) => setPass(e.target.value)} className="fox-input" placeholder="••••••••" /></div>
          {erro && <div className="text-red-500 text-xs">{erro}</div>}
          <button type="submit" className="w-full py-3 bg-gradient-to-r from-red-700 to-orange-700 hover:from-red-600 hover:to-orange-600 text-white font-black uppercase tracking-widest rounded transition-all flex items-center justify-center gap-2">
            <ILock className="w-4 h-4" /> Entrar nas Sombras
          </button>
          <div className="text-center text-zinc-700 text-xs pt-2">
            Solicite seu login ao<code className="text-orange-700"> líder</code>
          </div>
        </form>
      </div>
    </div>
  );
}

// ============ APP ============
const DEFAULT_DATA = {
  users: DEFAULT_USERS,
  roles: DEFAULT_ROLES,
  missoes: [],
  trios: DEFAULT_TRIOS,
  fases: DEFAULT_FASES,
  armas: DEFAULT_ARMAS,
  clas: DEFAULT_CLAS,
  historia: DEFAULT_HISTORIA,
  sokeFiguras: [],
  bunkeFiguras: [],
  juramentados: [],
};

// Migra dados antigos garantindo que novos campos existam
function migrate(raw) {
  if (!raw || !raw.users) return DEFAULT_DATA;
  const migrated = { ...DEFAULT_DATA, ...raw };
  // Se clas ainda não existe, cria a partir de Soke/Bunke padrão e migra as figuras antigas
  if (!raw.clas) {
    migrated.clas = [
      { ...DEFAULT_CLAS[0], figuras: raw.sokeFiguras || [] },
      { ...DEFAULT_CLAS[1], figuras: raw.bunkeFiguras || [] },
    ];
  }
  if (!raw.historia) migrated.historia = DEFAULT_HISTORIA;
  // Garante ids nas armas
  migrated.armas = (raw.armas || DEFAULT_ARMAS).map((a, i) => a.id ? a : { ...a, id: `arma_${i}_${Date.now().toString(36)}` });
  return migrated;
}

function App() {
  const [usuario, setUsuario] = useState(null);
  const [tab, setTab] = useState("home");
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saveStatus, setSaveStatus] = useState({ cloudOk: null, localOk: true, time: null, syncing: false });
  const isRemoteUpdate = useRef(false);
  const saveTimeoutRef = useRef(null);

  // Initial load + realtime subscription
  useEffect(() => {
    let subscription = null;
    (async () => {
      const loaded = await loadState();
      setData(migrate(loaded));
      setLoading(false);

      if (cloudClient) {
        subscription = cloudClient
          .channel("fox_state_changes")
          .on("postgres_changes", { event: "*", schema: "public", table: "fox_state" }, (payload) => {
            const newData = payload.new?.data;
            if (newData && Object.keys(newData).length > 0) {
              setData((current) => {
                const migrated = migrate(newData);
                if (JSON.stringify(current) === JSON.stringify(migrated)) return current;
                isRemoteUpdate.current = true;
                return migrated;
              });
            }
          })
          .subscribe();
      }
    })();
    return () => { if (subscription) subscription.unsubscribe(); };
  }, []);

  // Debounced save whenever data changes
  useEffect(() => {
    if (!data || loading) return;
    if (isRemoteUpdate.current) { isRemoteUpdate.current = false; return; }
    setSaveStatus(s => ({ ...s, syncing: true }));
    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(async () => {
      const res = await saveStateAsync(data);
      setSaveStatus({ ...res, time: new Date(), syncing: false });
    }, 500);
  }, [data, loading]);

  const usuarioAtual = usuario && data ? data.users.find(u => u.username === usuario.username) || usuario : null;
  const role = usuarioAtual && data ? data.roles.find(r => r.id === usuarioAtual.role) : null;
  const isLider = role?.hasLeaderPerms === true;
  const meuJuramento = data?.juramentados.find((j) => j.username === usuarioAtual?.username || j.nome.toLowerCase() === (usuarioAtual?.displayName || "").toLowerCase());
  const minhasMissoesCount = usuarioAtual && data ? data.missoes.filter(m => m.assignedTo === usuarioAtual.username && m.status !== "concluida").length : 0;

  const exportar = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `fox-portal-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const importar = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const novo = JSON.parse(ev.target.result);
        if (!novo.users || !novo.roles) throw new Error("Backup inválido");
        if (confirm("Isso substituirá TODOS os dados atuais (e serão sincronizados com a nuvem se ativada). Continuar?")) {
          setData(novo);
          alert("Backup restaurado!");
        }
      } catch (err) { alert("Arquivo inválido: " + err.message); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const juramentar = (dados) => setData(d => ({ ...d, juramentados: [...d.juramentados, dados] }));
  const removerJuramento = (idx) => setData(d => ({ ...d, juramentados: d.juramentados.filter((_, i) => i !== idx) }));

  if (loading || !data) {
    return (
      <div className="min-h-screen bg-black flex items-center justify-center">
        <div className="text-center">
          <IFlame className="w-12 h-12 text-orange-500 pulse-fire mx-auto mb-4" />
          <div className="text-orange-400 text-sm uppercase tracking-widest">Conectando ao portal...</div>
        </div>
      </div>
    );
  }

  if (!usuarioAtual) return <LoginScreen data={data} onLogin={setUsuario} />;

  const TABS = [
    { id: "home", label: "Visão Geral", icon: IFlame },
    { id: "historia", label: "História", icon: IBook },
    { id: "cla", label: "Clã Lamona", icon: ICrown },
    { id: "membros", label: "Membros", icon: IUsers },
    { id: "trios", label: "Trios", icon: ISwords },
    { id: "jikkai", label: "JIKKAI", icon: ITarget },
    { id: "armas", label: "Armas", icon: IShield },
    { id: "missoes", label: `Missões${minhasMissoesCount > 0 ? ` (${minhasMissoesCount})` : ""}`, icon: IClipboard },
    { id: "juramento", label: "Juramento", icon: ISkull },
    ...(isLider ? [{ id: "gerenciar", label: "Gerenciar", icon: ISettings }] : []),
  ];

  // Sync indicator
  const syncIndicator = (() => {
    if (!CLOUD_ENABLED) {
      return <div className="text-yellow-600 text-[9px]" title="Modo local — dados não compartilhados">⚠ Local</div>;
    }
    if (saveStatus.syncing) return <div className="text-zinc-400 text-[9px]">⟳ Sincronizando...</div>;
    if (saveStatus.cloudOk === true) return <div className="text-green-500 text-[9px] flex items-center gap-1"><ICheck className="w-3 h-3" />Sincronizado</div>;
    if (saveStatus.cloudOk === false) return <div className="text-red-500 text-[9px]">⚠ Erro sync</div>;
    return <div className="text-zinc-600 text-[9px]">—</div>;
  })();

  return (
    <div className="min-h-screen bg-black text-zinc-200">
      <header className="border-b border-orange-900/30 bg-black/80 backdrop-blur sticky top-0 z-10">
        <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <div className="p-2 rounded-full border border-orange-700 flex-shrink-0">
              <IFlame className="w-5 h-5 text-orange-500" />
            </div>
            <div className="min-w-0">
              <div className="text-orange-50 font-black tracking-widest serif">F.O.X.</div>
              <div className="text-zinc-600 text-[10px] uppercase tracking-widest truncate">Clã Lamona</div>
            </div>
          </div>
          <div className="flex items-center gap-3 flex-shrink-0">
            <div className="text-right hidden sm:block">
              <div className="text-orange-300 text-xs font-bold uppercase tracking-wider truncate max-w-[140px]">{usuarioAtual.displayName}</div>
              <div className="text-[9px]" style={{ color: role?.cor || "#71717a" }}>{role?.nome || usuarioAtual.role}</div>
            </div>
            <div className="text-right hidden md:block">{syncIndicator}</div>
            <button onClick={() => setUsuario(null)} className="p-2 text-zinc-500 hover:text-red-500 transition-colors">
              <ILogout className="w-4 h-4" />
            </button>
          </div>
        </div>
        <nav className="border-t border-zinc-900 bg-black/60">
          <div className="max-w-6xl mx-auto px-2 flex overflow-x-auto">
            {TABS.map((t) => {
              const I = t.icon;
              const active = tab === t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)} className={`flex items-center gap-2 px-4 py-3 text-xs uppercase tracking-wider whitespace-nowrap border-b-2 transition-colors ${active ? "border-orange-600 text-orange-400" : "border-transparent text-zinc-600 hover:text-zinc-300"}`}>
                  <I className="w-3.5 h-3.5" />
                  {t.label}
                </button>
              );
            })}
          </div>
        </nav>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-8">
        {tab === "home" && <HomePage data={data} usuario={usuarioAtual} missoesCount={minhasMissoesCount} />}
        {tab === "historia" && <HistoriaPage data={data} setData={setData} isLider={isLider} />}
        {tab === "cla" && <ClaPage data={data} setData={setData} isLider={isLider} />}
        {tab === "membros" && <MembrosPage data={data} />}
        {tab === "trios" && <TriosPage data={data} setData={setData} isLider={isLider} />}
        {tab === "jikkai" && <JikkaiPage data={data} setData={setData} isLider={isLider} />}
        {tab === "armas" && <ArmasPage data={data} setData={setData} isLider={isLider} />}
        {tab === "missoes" && <MinhasMissoesPage data={data} setData={setData} usuario={usuarioAtual} />}
        {tab === "juramento" && <JuramentoPage usuario={usuarioAtual} juramentado={meuJuramento} juramentar={juramentar} juramentados={data.juramentados} removerJuramento={removerJuramento} isLider={isLider} />}
        {tab === "gerenciar" && isLider && <GerenciarPage data={data} setData={setData} usuario={usuarioAtual} exportar={exportar} importar={importar} />}
      </main>

      <footer className="border-t border-zinc-900 mt-16 py-6 text-center text-zinc-700 text-xs">
        <p className="uppercase tracking-widest">F.O.X. · Clã Lamona · {new Date().getFullYear()}</p>
        <p className="italic mt-1">"Mais forte, mais livre, mais letal do que nunca."</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
