function ReputacaoSection({ data, setData, role, usuario, onOpen }) {
  const [filtroLealdade, setFiltroLealdade] = useState("Todos");
  const [filtroConduta, setFiltroConduta] = useState("Todos");
  const [busca, setBusca] = useState("");

  const membrosBase = (data.users || [])
    .filter(u => u.role !== "contratante")
    .map(u => ({ ...u, _indicadores: indicadoresMembro(data, u) }))
    .filter(u => filtroLealdade === "Todos" || (u.lealdade === filtroLealdade || (u.lealdade === "Pilar da F.O.X." && filtroLealdade === "Pilar da Jikkai")))
    .filter(u => filtroConduta === "Todos" || (u.conduta || "Limpo") === filtroConduta)
    .filter(u => {
      const termo = busca.trim().toLowerCase();
      if (!termo) return true;
      return [u.codinome, u.displayName, u.nomeRP, u.username].some(v => String(v || "").toLowerCase().includes(termo));
    });

  const membros = membrosBase.slice().sort((a, b) => {
    const conduta = condutaConfig(b.conduta).indice - condutaConfig(a.conduta).indice;
    if (conduta !== 0) return conduta;
    const lealdade = lealdadeConfig(b.lealdade).indice - lealdadeConfig(a.lealdade).indice;
    if (lealdade !== 0) return lealdade;
    return b._indicadores.pontuacao - a._indicadores.pontuacao;
  });

  const totalRegistros = (data.relatorios || []).length + (data.missoes || []).length + (data.contratos || []).length;
  const sobObservacao = membrosBase.filter(u => ["Sob observação", "Advertido", "Suspenso", "Risco interno"].includes(u.conduta || "Limpo")).length;
  const confiaveis = membrosBase.filter(u => ["Juramentado", "Veterano", "Pilar da Jikkai", "Pilar da F.O.X."].includes(u.lealdade)).length;
  const comSugestao = membrosBase.filter(u => {
    const i = u._indicadores;
    return (u.lealdade === "Pilar da F.O.X." ? "Pilar da Jikkai" : u.lealdade) !== i.lealdadeSugerida || (u.conduta || "Limpo") !== i.condutaSugerida || converterReputacaoLegada(u.reputacao) !== i.impactoSugerido;
  }).length;

  const atualizarMembro = (username, patch, registro = null) => {
    setData(d => ({
      ...d,
      users: (d.users || []).map(u => {
        if (u.username !== username) return u;
        return {
          ...u,
          ...patch,
          condutaRegistros: registro ? [registro, ...(u.condutaRegistros || [])].slice(0, 30) : (u.condutaRegistros || []),
        };
      }),
      activityLog: [...(d.activityLog || []), atividade("lealdade_conduta", usuario?.username, username, registro?.descricao || "Atualizou Lealdade & Conduta")],
    }));
  };

  const aplicarSugestao = (u) => {
    const i = indicadoresMembro(data, u);
    atualizarMembro(u.username, {
      lealdade: i.lealdadeSugerida,
      conduta: i.condutaSugerida,
      reputacao: i.impactoSugerido,
      lealdadeNota: `Sugestão aplicada pelo sistema com base em: ${i.resumo.join(" · ")}.`,
      condutaNota: `Conduta calculada por registros operacionais: ${i.falhas} falha(s), ${i.devolvidas} ajuste(s), ${i.alertas} alerta(s).`,
      reputacaoNota: `Impacto externo mantido como registro narrativo: ${i.impactoSugerido}.`,
      lealdadeAtualizadaEm: new Date().toISOString(),
      condutaAtualizadaEm: new Date().toISOString(),
      reputacaoAtualizadaEm: new Date().toISOString(),
    }, registroConduta("sistema", usuario?.username, `Aplicou sugestão automática: lealdade ${i.lealdadeSugerida}, conduta ${i.condutaSugerida}, impacto ${i.impactoSugerido}.`));
  };

  const registroRapido = (u, tipo) => {
    if (tipo === "merito") {
      const atual = u.lealdade === "Pilar da F.O.X." ? "Pilar da Jikkai" : (u.lealdade || "Observado");
      const proximo = LEALDADE_NIVEIS[Math.min(LEALDADE_NIVEIS.length - 1, Math.max(0, LEALDADE_NIVEIS.indexOf(atual)) + 1)] || atual;
      atualizarMembro(u.username, { lealdade: proximo, conduta: u.conduta || "Limpo", lealdadeAtualizadaEm: new Date().toISOString() }, registroConduta("merito", usuario?.username, `Mérito operacional registrado. Lealdade ajustada para ${proximo}.`));
    }
    if (tipo === "observacao") atualizarMembro(u.username, { conduta: "Sob observação", condutaAtualizadaEm: new Date().toISOString() }, registroConduta("observacao", usuario?.username, "Membro colocado sob observação pela liderança."));
    if (tipo === "advertencia") atualizarMembro(u.username, { conduta: "Advertido", condutaAtualizadaEm: new Date().toISOString() }, registroConduta("advertencia", usuario?.username, "Advertência disciplinar registrada."));
    if (tipo === "limpar") atualizarMembro(u.username, { conduta: "Limpo", condutaAtualizadaEm: new Date().toISOString() }, registroConduta("limpeza", usuario?.username, "Conduta normalizada após revisão."));
  };

  return (
    <div className="fadein space-y-5">
      <div className="grid sm:grid-cols-3 gap-3 p-4 rounded-xl border border-zinc-800 bg-zinc-950/60">
        <div>
          <label className="fox-label">Buscar membro</label>
          <input value={busca} onChange={e => setBusca(e.target.value)} className="fox-input" placeholder="Codinome, nome ou usuário" />
        </div>
        <div>
          <label className="fox-label">Lealdade interna</label>
          <select value={filtroLealdade} onChange={e => setFiltroLealdade(e.target.value)} className="fox-input">
            <option>Todos</option>
            {LEALDADE_NIVEIS.map(n => <option key={n}>{n}</option>)}
          </select>
        </div>
        <div>
          <label className="fox-label">Conduta</label>
          <select value={filtroConduta} onChange={e => setFiltroConduta(e.target.value)} className="fox-input">
            <option>Todos</option>
            {CONDUTA_NIVEIS.map(n => <option key={n}>{n}</option>)}
          </select>
        </div>
      </div>

      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="text-zinc-500 text-sm italic">{membros.length} {membros.length === 1 ? "registro encontrado" : "registros encontrados"} · {totalRegistros} sinais usados no cálculo</div>
        <div className="text-[10px] uppercase tracking-wider text-zinc-700">Capitães editam somente membros da própria divisão</div>
      </div>

      <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-4">
        {membros.map(u => {
          const i = u._indicadores;
          const podeEditar = podeEditarLealdadeConduta(data, usuario, role, u);
          const precisaAplicar = (u.lealdade === "Pilar da F.O.X." ? "Pilar da Jikkai" : u.lealdade) !== i.lealdadeSugerida || (u.conduta || "Limpo") !== i.condutaSugerida || converterReputacaoLegada(u.reputacao) !== i.impactoSugerido;
          const ultimos = (u.condutaRegistros || []).slice(0, 2);
          return (
            <div key={u.username} className="rounded-xl border border-zinc-800 bg-zinc-950/60 overflow-hidden hover:border-orange-900/70 transition-all">
              <button onClick={() => onOpen(u)} className="w-full text-left p-4 flex items-center gap-3 border-b border-zinc-800/70 hover:bg-black/30">
                <MemberAvatar user={u} size="md" />
                <div className="min-w-0 flex-1">
                  <div className="text-orange-50 font-black truncate">{getCodinome(u)}</div>
                  <div className="text-zinc-600 text-xs truncate">@{u.username} · {u.patente || "Sem patente"}</div>
                </div>
                <div className="text-right"><div className={(i.pontuacao >= 0 ? "text-green-400" : "text-red-400") + " text-lg font-black"}>{i.pontuacao}</div><div className="text-[8px] uppercase text-zinc-700">sinal</div></div>
              </button>
              <div className="p-4 space-y-3">
                <div className="grid grid-cols-3 gap-2">
                  <div className="p-2 rounded border border-orange-900/30 bg-black/40"><div className="text-[8px] uppercase tracking-wider text-orange-700 mb-1">Lealdade</div><ReputacaoBadge tipo="lealdade" valor={u.lealdade} compacto /></div>
                  <div className="p-2 rounded border border-yellow-900/30 bg-black/40"><div className="text-[8px] uppercase tracking-wider text-yellow-700 mb-1">Conduta</div><ReputacaoBadge tipo="conduta" valor={u.conduta || "Limpo"} compacto /></div>
                  <div className="p-2 rounded border border-sky-900/30 bg-black/40"><div className="text-[8px] uppercase tracking-wider text-sky-700 mb-1">Impacto</div><ReputacaoBadge tipo="impacto" valor={u.reputacao} compacto /></div>
                </div>

                <div className="grid grid-cols-4 gap-1 text-center">
                  {[[i.concluidas, "concl."], [i.relatorios.length, "relat."], [i.abertas, "ativas"], [i.falhas, "falhas"]].map(([v,l]) => <div key={l} className="p-2 rounded bg-black/40 border border-zinc-800"><div className="text-orange-200 font-black">{v}</div><div className="text-[8px] uppercase text-zinc-700">{l}</div></div>)}
                </div>

                {precisaAplicar && <div className="p-3 rounded-lg border border-sky-900/40 bg-sky-950/10">
                  <div className="text-[9px] uppercase tracking-wider text-sky-400 font-black">Sugestão automática</div>
                  <div className="flex flex-wrap gap-1 mt-2"><ReputacaoBadge tipo="lealdade" valor={i.lealdadeSugerida} compacto /><ReputacaoBadge tipo="conduta" valor={i.condutaSugerida} compacto /><ReputacaoBadge tipo="impacto" valor={i.impactoSugerido} compacto /></div>
                  {podeEditar && <button onClick={() => aplicarSugestao(u)} className="mt-3 w-full py-2 rounded border border-sky-700 bg-sky-950/30 text-sky-300 text-[10px] uppercase tracking-wider font-black hover:border-sky-400">Aplicar sugestão</button>}
                </div>}

                {podeEditar && <div className="grid grid-cols-2 gap-1">
                  <button onClick={() => registroRapido(u, "merito")} className="py-2 rounded border border-green-800 bg-green-950/20 text-green-300 text-[9px] uppercase tracking-wider font-black">Mérito</button>
                  <button onClick={() => registroRapido(u, "observacao")} className="py-2 rounded border border-yellow-800 bg-yellow-950/20 text-yellow-300 text-[9px] uppercase tracking-wider font-black">Observar</button>
                  <button onClick={() => registroRapido(u, "advertencia")} className="py-2 rounded border border-red-900 bg-red-950/20 text-red-300 text-[9px] uppercase tracking-wider font-black">Advertir</button>
                  <button onClick={() => registroRapido(u, "limpar")} className="py-2 rounded border border-zinc-700 bg-black/30 text-zinc-300 text-[9px] uppercase tracking-wider font-black">Limpar</button>
                </div>}

                {ultimos.length > 0 && <div className="pt-2 border-t border-zinc-800 space-y-1">
                  {ultimos.map(r => <div key={r.id || r.data} className="text-[10px] text-zinc-600 line-clamp-1"><span className="text-orange-700 uppercase">{r.tipo}</span> · {r.descricao}</div>)}
                </div>}
              </div>
            </div>
          );
        })}
      </div>

      {membros.length === 0 && <div className="p-10 text-center rounded-xl border border-zinc-800 bg-zinc-950/40 text-zinc-600 italic">Nenhum membro corresponde aos filtros.</div>}
    </div>
  );
}

function MembrosPage({ data, setData, role, usuario, viewerIsContratante, navigationRequest }) {
  const [subTab, setSubTab] = useState("lista");
  const [dossieAberto, setDossieAberto] = useState(null);

  useEffect(() => {
    if (navigationRequest?.tab !== "membros") return;
    if (["lista", "estrutura", "reputacao", "trios"].includes(navigationRequest.subTab)) setSubTab(navigationRequest.subTab);
  }, [navigationRequest?.token]);

  const podeEditarTrios = hasPerm(role, "edit_trios") || ["lider", "braco_direito", "conselheiro", "capitao_ramo"].includes(estruturaPosicaoRole(role));
  const usuariosVisiveis = (data.users || []).filter(u => u.role !== "contratante");
  const SUB_TABS = [
    { id: "lista", label: "Membros", icon: IUsers, badge: usuariosVisiveis.length || null },
    { id: "estrutura", label: "Estrutura", icon: ICrown, badge: null },
    { id: "reputacao", label: "Lealdade & Conduta", icon: IShield, badge: null },
    { id: "trios", label: "Divisões & Equipes", icon: ISwords, badge: (data.trios || []).length || null },
  ];
  return (
    <div>
      <div className="mb-5 bg-zinc-950/60 border border-zinc-800 rounded-lg p-1 flex gap-1 overflow-x-auto">
        {SUB_TABS.map(t => { const I = t.icon; const active = subTab === t.id; return (
          <button key={t.id} onClick={() => setSubTab(t.id)} className={`flex-1 min-w-[120px] flex items-center justify-center gap-2 px-4 py-2.5 rounded text-xs uppercase tracking-wider font-bold transition-all ${active ? "bg-gradient-to-r from-red-700 to-orange-700 text-white shadow-lg" : "text-zinc-500 hover:text-zinc-300 hover:bg-zinc-900"}`}>
            <I className="w-4 h-4" /><span>{t.label}</span>{t.badge && <span className={`text-[10px] px-1.5 py-0.5 rounded-full font-black ${active ? "bg-black/40 text-white" : "bg-orange-600 text-black"}`}>{t.badge}</span>}
          </button>
        ); })}
      </div>
      {subTab === "lista" && <MembrosListSection data={data} viewerIsContratante={viewerIsContratante} onOpen={setDossieAberto} />}
      {subTab === "estrutura" && <EstruturaSection data={data} onOpen={setDossieAberto} />}
      {subTab === "reputacao" && <ReputacaoSection data={data} setData={setData} role={role} usuario={usuario} onOpen={setDossieAberto} />}
      {subTab === "trios" && <TriosSection data={data} setData={setData} podeEditar={podeEditarTrios} role={role} usuario={usuario} />}
      {dossieAberto && <DossieModal membro={data.users.find(u => u.username === dossieAberto.username) || dossieAberto} data={data} onClose={() => setDossieAberto(null)} />}
    </div>
  );
}

function TriosSection({ data, setData, podeEditar, role, usuario }) {
  const [editando, setEditando] = useState(false);
  const [draftEquipes, setDraftEquipes] = useState(equipesJikkai(data));
  const [draftDivisoes, setDraftDivisoes] = useState(divisoesJikkai(data));
  const [abertas, setAbertas] = useState({});
  const [divisaoAtivaId, setDivisaoAtivaId] = useState("");
  const [equipeAtivaId, setEquipeAtivaId] = useState("");
  const usuarios = (data.users || []).filter(u => u.role !== "contratante");
  const fullAdmin = podeGerenciarTodasEquipes(role);
  const pos = estruturaPosicaoRole(role);
  const divisoesGerenciadas = fullAdmin ? draftDivisoes.map(d => d.id) : draftDivisoes.filter(d => d.capitaoUsername === usuario?.username).map(d => d.id);
  const podeCriarEquipe = podeEditar && (fullAdmin || (pos === "capitao_ramo" && divisoesGerenciadas.length > 0));
  const canEditEquipe = equipe => fullAdmin || divisoesGerenciadas.includes(equipe.divisaoId);
  const divisoesComando = fullAdmin ? draftDivisoes : draftDivisoes.filter(d => divisoesGerenciadas.includes(d.id));
  const divisaoAtiva = draftDivisoes.find(d => d.id === divisaoAtivaId) || divisoesComando[0] || draftDivisoes[0];
  const equipesDaDivisaoAtiva = divisaoAtiva ? draftEquipes.filter(t => t.divisaoId === divisaoAtiva.id) : [];
  const equipeAtiva = draftEquipes.find(t => t.id === equipeAtivaId) || equipesDaDivisaoAtiva[0];
  const podeEditarDivisaoAtiva = !!(podeEditar && divisaoAtiva && (fullAdmin || divisoesGerenciadas.includes(divisaoAtiva.id)));

  useEffect(() => {
    if (!editando) {
      setDraftEquipes(equipesJikkai(data));
      setDraftDivisoes(divisoesJikkai(data));
    }
  }, [data.trios, data.divisoes, editando]);

  useEffect(() => {
    const disponiveis = fullAdmin ? draftDivisoes : draftDivisoes.filter(d => d.capitaoUsername === usuario?.username);
    if (!disponiveis.length) return;
    if (!divisaoAtivaId || !disponiveis.some(d => d.id === divisaoAtivaId)) setDivisaoAtivaId(disponiveis[0].id);
  }, [draftDivisoes.length, editando, usuario?.username, role?.id]);

  useEffect(() => {
    const divisao = draftDivisoes.find(d => d.id === divisaoAtivaId) || (fullAdmin ? draftDivisoes[0] : draftDivisoes.find(d => d.capitaoUsername === usuario?.username));
    const equipes = divisao ? draftEquipes.filter(t => t.divisaoId === divisao.id) : [];
    if (!equipes.length) { if (equipeAtivaId) setEquipeAtivaId(""); return; }
    if (!equipeAtivaId || !equipes.some(t => t.id === equipeAtivaId)) setEquipeAtivaId(equipes[0].id);
  }, [draftEquipes.length, divisaoAtivaId, editando, usuario?.username, role?.id]);

  const salvar = () => {
    const divisoesLimpas = draftDivisoes.filter(d => String(d.nome || "").trim()).map((d, i) => ({
      ...d,
      id: d.id || "divisao_" + (slugEstrutura(d.nome) || uid()),
      nome: d.nome.trim(),
      desc: d.desc || "",
      cor: d.cor || "#D85A30",
      status: d.status || "ativa",
      capitaoUsername: d.capitaoUsername || "",
      ordem: Number.isFinite(Number(d.ordem)) ? Number(d.ordem) : i,
    }));
    const divPadrao = divisoesLimpas[0]?.id || "divisao_central";
    const equipesLimpas = draftEquipes.filter(t => String(t.nome || "").trim()).map(t => ({
      ...t,
      id: t.id || "equipe_" + (slugEstrutura(t.nome) || uid()),
      nome: t.nome.trim(),
      desc: t.desc || "",
      cor: t.cor || "#D85A30",
      divisaoId: t.divisaoId || divPadrao,
      tipo: t.tipo || "Ataque",
      status: t.status || "Ativa",
      liderUsername: t.liderUsername || "",
      membros: (t.membros || []).filter(m => m.username || m.nome).map(m => ({ ...m, papel: m.papel || "Soldado" })),
    }));
    setData(d => ({ ...d, divisoes: divisoesLimpas, trios: equipesLimpas }));
    setEditando(false);
  };

  const cancelar = () => { setDraftEquipes(equipesJikkai(data)); setDraftDivisoes(divisoesJikkai(data)); setEditando(false); };
  const addDivisao = () => setDraftDivisoes(ds => [...ds, { id: "divisao_" + uid(), nome: "Nova Divisão", desc: "Divisão operacional da Jikkai.", cor: "#D85A30", status: "ativa", capitaoUsername: "" }]);
  const updateDivisao = (i, patch) => setDraftDivisoes(ds => ds.map((d, idx) => idx === i ? { ...d, ...patch } : d));
  const removeDivisao = i => {
    const alvo = draftDivisoes[i];
    if (!alvo || !confirm(`Remover a divisão "${alvo.nome}"? As equipes dela ficarão na primeira divisão.`)) return;
    const resto = draftDivisoes.filter((_, idx) => idx !== i);
    const fallback = resto[0]?.id || "divisao_central";
    setDraftDivisoes(resto.length ? resto : DEFAULT_DIVISOES);
    setDraftEquipes(ts => ts.map(t => t.divisaoId === alvo.id ? { ...t, divisaoId: fallback } : t));
  };
  const addEquipe = divisaoId => setDraftEquipes(ts => [...ts, { id: "equipe_" + uid(), nome: "Nova Equipe", desc: "Equipe operacional.", cor: "#D85A30", divisaoId: divisaoId || divisoesGerenciadas[0] || draftDivisoes[0]?.id || "divisao_central", tipo: "Ataque", status: "Em formação", liderUsername: "", membros: [] }]);
  const updateEquipe = (id, patch) => setDraftEquipes(ts => ts.map(t => t.id === id ? { ...t, ...patch } : t));
  const removeEquipe = id => {
    const alvo = draftEquipes.find(t => t.id === id);
    if (!alvo || !confirm(`Arquivar/remover a equipe "${alvo.nome}"?`)) return;
    setDraftEquipes(ts => ts.filter(t => t.id !== id));
  };
  const addMembro = equipeId => updateEquipe(equipeId, { membros: [...(draftEquipes.find(t => t.id === equipeId)?.membros || []), { username: "", papel: "Soldado" }] });
  const updateMembro = (equipeId, mi, patch) => updateEquipe(equipeId, { membros: (draftEquipes.find(t => t.id === equipeId)?.membros || []).map((m, idx) => idx === mi ? { ...m, ...patch } : m) });
  const removeMembro = (equipeId, mi) => updateEquipe(equipeId, { membros: (draftEquipes.find(t => t.id === equipeId)?.membros || []).filter((_, idx) => idx !== mi) });
  const toggle = id => setAbertas(a => ({ ...a, [id]: !a[id] }));

  const divisaoIndex = id => draftDivisoes.findIndex(d => d.id === id);
  const updateDivisaoById = (id, patch) => {
    const i = divisaoIndex(id);
    if (i >= 0) updateDivisao(i, patch);
  };
  const criarEquipeComando = divisaoId => {
    const id = "equipe_" + uid();
    const baseDiv = divisaoId || divisaoAtiva?.id || divisoesComando[0]?.id || draftDivisoes[0]?.id || "divisao_central";
    const nova = { id, nome: "Nova Equipe", desc: "Equipe operacional.", cor: divisaoAtiva?.cor || "#D85A30", divisaoId: baseDiv, tipo: "Ataque", status: "Em formação", liderUsername: "", membros: [] };
    setDraftEquipes(ts => [...ts, nova]);
    setDivisaoAtivaId(baseDiv);
    setEquipeAtivaId(id);
    setAbertas(a => ({ ...a, [baseDiv]: true }));
  };
  const adicionarOuMoverMembro = (equipeId, username, papel = "Soldado") => {
    if (!equipeId || !username) return;
    setDraftEquipes(ts => ts.map(t => {
      const membrosSemUsuario = (t.membros || []).filter(m => m.username !== username);
      if (t.id !== equipeId) return { ...t, membros: membrosSemUsuario };
      return { ...t, membros: [...membrosSemUsuario, { username, papel }] };
    }));
  };
  const removerUsuarioDaEquipe = (equipeId, username) => {
    if (!equipeId || !username) return;
    updateEquipe(equipeId, { membros: (draftEquipes.find(t => t.id === equipeId)?.membros || []).filter(m => m.username !== username) });
  };
  const definirLiderEquipe = (equipeId, username) => {
    updateEquipe(equipeId, { liderUsername: username });
    if (username) adicionarOuMoverMembro(equipeId, username, "Líder de equipe");
  };
  const ondeUsuarioEsta = username => draftEquipes.filter(t => (t.membros || []).some(m => m.username === username)).map(t => t.nome).join(" · ");

  const renderMembroChip = (m, equipe) => {
    const u = usuarios.find(x => x.username === m.username) || usuarioPorIdentidade(usuarios, m.nome);
    const grupo = papelEquipeGrupo(m.papel);
    return u ? <div key={m.username || m.nome} className={`flex items-center gap-2 rounded-lg border px-2 py-2 ${grupo === "base" ? "border-zinc-800 bg-zinc-950/70" : "border-orange-900/30 bg-black/35"}`}>
      <MemberAvatar user={u} size="sm" />
      <div className="min-w-0"><div className="text-orange-50 text-xs font-black truncate">{getCodinome(u)}</div><div className="text-[9px] uppercase tracking-wider truncate" style={{ color: grupo === "base" ? "#71717a" : equipe.cor }}>{m.papel || "Soldado"}</div></div>
    </div> : <div key={m.nome} className="text-zinc-600 text-xs border border-zinc-800 rounded p-2">{m.nome || "Membro não vinculado"} · {m.papel || "Soldado"}</div>;
  };

  return (
    <div className="fadein space-y-5">
      <div className="flex justify-end flex-wrap gap-2">
        {podeEditar && !editando && <Btn onClick={() => setEditando(true)} variant="primary"><IEdit className="w-3 h-3" /> Editar estrutura</Btn>}
        {editando && <><Btn onClick={cancelar} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn><Btn onClick={salvar} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn></>}
      </div>

      {editando && podeEditar && <section className="rounded-2xl border border-orange-900/45 bg-gradient-to-br from-zinc-950 via-black to-red-950/10 overflow-hidden">
        <div className="p-4 border-b border-zinc-800 flex flex-col lg:flex-row lg:items-center justify-between gap-3">
          <div>
            <div className="text-[10px] uppercase tracking-[0.32em] text-orange-600">Painel de comando</div>
            <h4 className="text-xl font-black text-orange-50 serif">Montagem de divisões, capitães e equipes</h4>
            <p className="text-zinc-500 text-xs mt-1 max-w-3xl">O líder organiza todas as divisões. O capitão visualiza e edita somente a própria divisão, criando equipes e alocando soldados, recrutas e associados.</p>
          </div>
          <div className="flex flex-wrap gap-2 text-[10px] uppercase tracking-wider text-zinc-500">
            <span className="px-2 py-1 rounded border border-zinc-800 bg-black/50">{fullAdmin ? "Comando total" : "Comando da divisão"}</span>
            {divisaoAtiva && <span className="px-2 py-1 rounded border border-orange-900/40 bg-orange-950/10 text-orange-300">{divisaoAtiva.nome}</span>}
          </div>
        </div>
        <div className="grid xl:grid-cols-[280px_360px_1fr] gap-0 divide-y xl:divide-y-0 xl:divide-x divide-zinc-800">
          <div className="p-4 space-y-3">
            <div className="flex items-center justify-between gap-2">
              <div className="text-[9px] uppercase tracking-[0.25em] text-zinc-500 font-black">Divisões</div>
              {fullAdmin && <button onClick={addDivisao} className="px-2 py-1 rounded border border-orange-900/40 bg-orange-950/20 text-orange-300 text-[10px] font-black uppercase tracking-wider">+ Divisão</button>}
            </div>
            <div className="space-y-2 max-h-[330px] overflow-auto pr-1">
              {divisoesComando.map(d => {
                const capitao = usuarios.find(u => u.username === d.capitaoUsername);

const OBJETIVO_STATUS_CFG = {
  nao_iniciado: { label: "Não iniciado", cor: "#71717A", badge: "bg-zinc-900 text-zinc-400 border-zinc-700" },
  preparacao: { label: "Em preparação", cor: "#2563EB", badge: "bg-blue-950 text-blue-300 border-blue-800" },
  andamento: { label: "Em andamento", cor: "#EA580C", badge: "bg-orange-950 text-orange-300 border-orange-800" },
  parcial: { label: "Parcial", cor: "#CA8A04", badge: "bg-yellow-950 text-yellow-300 border-yellow-800" },
  bloqueado: { label: "Bloqueado", cor: "#DC2626", badge: "bg-red-950 text-red-300 border-red-800" },
  concluido: { label: "Concluído", cor: "#16A34A", badge: "bg-green-950 text-green-300 border-green-800" },
  fracassado: { label: "Fracassado", cor: "#7F1D1D", badge: "bg-red-950 text-red-400 border-red-900" },
  cancelado: { label: "Cancelado", cor: "#52525B", badge: "bg-zinc-950 text-zinc-600 border-zinc-800" },
};

const FASE_STATUS_CFG = {
  planejada: { label: "Planejada", cor: "#71717A", badge: "bg-zinc-900 text-zinc-400 border-zinc-700" },
  bloqueada: { label: "Bloqueada", cor: "#B91C1C", badge: "bg-red-950 text-red-300 border-red-800" },
  andamento: { label: "Em operação", cor: "#EA580C", badge: "bg-orange-950 text-orange-300 border-orange-800" },
  concluida: { label: "Concluída", cor: "#16A34A", badge: "bg-green-950 text-green-300 border-green-800" },
  suspensa: { label: "Suspensa", cor: "#CA8A04", badge: "bg-yellow-950 text-yellow-300 border-yellow-800" },
};

const RISCO_CFG = {
  Baixo: { indice: 1, cor: "#16A34A", badge: "bg-green-950 text-green-300 border-green-800" },
  Moderado: { indice: 2, cor: "#CA8A04", badge: "bg-yellow-950 text-yellow-300 border-yellow-800" },
  Elevado: { indice: 3, cor: "#EA580C", badge: "bg-orange-950 text-orange-300 border-orange-800" },
  Crítico: { indice: 4, cor: "#DC2626", badge: "bg-red-950 text-red-300 border-red-800" },
};

const PRIORIDADE_PESO = { Secundária: 1, Normal: 2, Importante: 3, Crítica: 5 };
const FONTE_ESTRATEGICA_CFG = {
  relatorio: { label: "Relatório", cor: "#A855F7" },
  mapa: { label: "Mapa", cor: "#38BDF8" },
  missao: { label: "Missão", cor: "#EA580C" },
  contrato: { label: "Contrato", cor: "#EF4444" },
  objetivo: { label: "Objetivo", cor: "#F59E0B" },
  comando: { label: "Comando", cor: "#F97316" },
};

function normalizarRisco(valor) {
  const v = String(valor || "").toLowerCase();
  if (v.includes("crít") || v.includes("letal")) return "Crítico";
  if (v.includes("alta") || v.includes("elev")) return "Elevado";
  if (v.includes("méd") || v.includes("moder")) return "Moderado";
  return RISCO_CFG[valor] ? valor : "Baixo";
}

function normalizarStatusObjetivo(status, done = false) {
  if (done) return "concluido";
  const mapa = { pendente: "nao_iniciado", andamento: "andamento", concluida: "concluido", concluido: "concluido" };
  return OBJETIVO_STATUS_CFG[status] ? status : (mapa[status] || "nao_iniciado");
}

function normalizarObjetivoEstrategico(obj, fase, index) {
  const status = normalizarStatusObjetivo(obj.status, obj.done);
  const progressoPadrao = status === "concluido" ? 100 : status === "parcial" ? 50 : status === "andamento" ? 25 : 0;
  const prioridade = PRIORIDADE_PESO[obj.prioridade] ? obj.prioridade : "Normal";
  return {
    id: obj.id || "obj_" + (fase.id || fase.n) + "_" + (index + 1),
    titulo: obj.titulo || obj.text || "Objetivo " + (index + 1),
    descricao: obj.descricao || "",
    status,
    progresso: Math.max(0, Math.min(100, Number(obj.progresso ?? progressoPadrao))),
    prioridade,
    peso: Number(obj.peso) || PRIORIDADE_PESO[prioridade],
    responsavel: obj.responsavel || "",
    apoioTipo: obj.apoioTipo || "",
    apoioId: obj.apoioId || "",
    prazo: obj.prazo || "",
    prazoTipo: obj.prazoTipo || "sem_prazo",
    risco: normalizarRisco(obj.risco || "Baixo"),
    bloqueio: obj.bloqueio || "",
    recursos: Array.isArray(obj.recursos) ? obj.recursos : (obj.recursosTexto ? String(obj.recursosTexto).split("\n").filter(Boolean) : []),
    missaoId: obj.missaoId || "",
    relatorioId: obj.relatorioId || "",
    contratoId: obj.contratoId || "",
    mapaId: obj.mapaId || "",
    observacoes: obj.observacoes || "",
    atualizadaEm: obj.atualizadaEm || "",
  };
}

function normalizarFaseEstrategica(fase, index) {
  const id = fase.id || "fase_" + (fase.n || index + 1);
  const base = { ...fase, id };
  const objetivos = (fase.objetivos || []).map((o, i) => normalizarObjetivoEstrategico(o, base, i));
  const statusLegado = { pendente: index === 0 ? "andamento" : "planejada", andamento: "andamento", concluida: "concluida" };
  return {
    ...fase,
    id,
    n: Number(fase.n) || index + 1,
    titulo: fase.titulo || "Fase " + (index + 1),
    desc: fase.desc || fase.descricao || "",
    status: FASE_STATUS_CFG[fase.status] ? fase.status : (statusLegado[fase.status] || "planejada"),
    objetivos,
    responsavelGeral: fase.responsavelGeral || "",
    prazo: fase.prazo || "",
    prazoTipo: fase.prazoTipo || "sem_prazo",
    riscoGeral: normalizarRisco(fase.riscoGeral || "Baixo"),
    progressoManualAtivo: Boolean(fase.progressoManualAtivo),
    progressoManual: Math.max(0, Math.min(100, Number(fase.progressoManual) || 0)),
    requisitos: Array.isArray(fase.requisitos) ? fase.requisitos.map((r, i) => typeof r === "string" ? { id: "req_" + id + "_" + i, texto: r, atendido: false } : { id: r.id || "req_" + id + "_" + i, texto: r.texto || r.text || "Requisito", atendido: Boolean(r.atendido) }) : [],
    atualizadaEm: fase.atualizadaEm || "",
  };
}

function progressoObjetivo(obj) {
  if (obj.status === "concluido") return 100;
  if (obj.status === "cancelado") return 0;
  return Math.max(0, Math.min(100, Number(obj.progresso) || 0));
}

function progressoFase(fase) {
  if (fase.progressoManualAtivo) return Math.max(0, Math.min(100, Number(fase.progressoManual) || 0));
  const objetivos = fase.objetivos || [];
  if (!objetivos.length) return fase.status === "concluida" ? 100 : 0;
  const pesoTotal = objetivos.reduce((s, o) => s + Math.max(1, Number(o.peso) || 1), 0);
  return Math.round(objetivos.reduce((s, o) => s + progressoObjetivo(o) * Math.max(1, Number(o.peso) || 1), 0) / pesoTotal);
}

function progressoGeralJikkai(fases) {
  const validas = fases || [];
  if (!validas.length) return 0;
  return Math.round(validas.reduce((s, f) => s + progressoFase(f), 0) / validas.length);
}

function prazoAtrasado(prazo, status) {
  if (!prazo || ["concluido", "concluida", "cancelado"].includes(status)) return false;
  const data = new Date(prazo + (String(prazo).length === 10 ? "T23:59:59" : ""));
  return !Number.isNaN(data.getTime()) && data.getTime() < Date.now();
}

function fonteLabel(tipo) {
  return FONTE_ESTRATEGICA_CFG[tipo] || FONTE_ESTRATEGICA_CFG.comando;
}

function coletarSinaisEstrategicos(data) {
  const sinais = [];
  const add = sinal => {
    if (!sinal?.titulo) return;
    sinais.push({
      id: sinal.id || "sinal_" + sinal.fonteTipo + "_" + (sinal.fonteId || uid()),
      titulo: sinal.titulo,
      descricao: sinal.descricao || "",
      risco: normalizarRisco(sinal.risco || "Moderado"),
      categoria: sinal.categoria || "Operacional",
      fonteTipo: sinal.fonteTipo || "comando",
      fonteId: sinal.fonteId || "",
      fonteNome: sinal.fonteNome || "",
      faseId: sinal.faseId || "",
      objetivoId: sinal.objetivoId || "",
      status: sinal.status || "ativo",
      criadoEm: sinal.criadoEm || sinal.data || "",
    });
  };

  (data.sinaisEstrategicos || []).filter(s => s.status !== "resolvido").forEach(s => add(s));
  (data.relatorios || []).filter(r => r.alertaJikkai && r.statusAlerta !== "resolvido").forEach(r => add({
    id: "relatorio_" + r.id,
    titulo: r.titulo,
    descricao: r.resumoEstrategico || r.descricao,
    risco: r.riscoJikkai || "Moderado",
    categoria: r.categoriaJikkai || "Inteligência",
    fonteTipo: "relatorio",
    fonteId: r.id,
    fonteNome: r.titulo,
    faseId: r.faseId,
    objetivoId: r.objetivoId,
    criadoEm: r.data,
  }));

  [...(data.mapaPontos || []), ...(data.mapaRotas || [])].forEach(item => {
    const texto = ((item.status || "") + " " + (item.desc || "")).toLowerCase();
    const automatico = item.alertaJikkai || item.type === "risco" || ["Alta", "Crítica"].includes(item.threat) || /compromet|hostil|bloquead|ameaça|perdido/.test(texto);
    if (!automatico || item.statusAlerta === "resolvido") return;
    add({
      id: "mapa_" + (item.kind || "point") + "_" + item.id,
      titulo: item.alertaTitulo || item.name,
      descricao: item.desc || "Situação: " + (item.status || "não informada") + ".",
      risco: item.riscoJikkai || item.threat,
      categoria: item.categoriaJikkai || "Territorial",
      fonteTipo: "mapa",
      fonteId: item.id,
      fonteNome: item.name,
      faseId: item.faseId,
      objetivoId: item.objetivoId,
      criadoEm: item.updatedAt || item.createdAt || data.mapaAtualizadoEm,
    });
  });

  (data.missoes || []).filter(m => m.status === "falhou").forEach(m => add({
    id: "missao_" + m.id,
    titulo: "Operação fracassada: " + m.titulo,
    descricao: m.relatorio?.resumo || m.desc,
    risco: "Elevado",
    categoria: "Operacional",
    fonteTipo: "missao",
    fonteId: m.id,
    fonteNome: m.titulo,
    faseId: m.faseId,
    objetivoId: m.objetivoId,
    criadoEm: m.updatedAt || m.createdAt,
  }));

  (data.contratos || []).filter(c => c.status === "Falhou" && (c.faseId || c.objetivoId)).forEach(c => add({
    id: "contrato_" + c.id,
    titulo: "Contrato fracassado: " + c.titulo,
    descricao: c.descricaoCurta || c.descricao,
    risco: "Elevado",
    categoria: "Operacional",
    fonteTipo: "contrato",
    fonteId: c.id,
    fonteNome: c.titulo,
    faseId: c.faseId,
    objetivoId: c.objetivoId,
    criadoEm: c.criadoEm,
  }));

  (data.fases || []).forEach(f => (f.objetivos || []).forEach(o => {
    if (o.status === "bloqueado" || prazoAtrasado(o.prazo, o.status) || RISCO_CFG[normalizarRisco(o.risco)].indice >= 3) {
      add({
        id: "objetivo_" + o.id,
        titulo: o.status === "bloqueado" ? "Objetivo bloqueado: " + o.titulo : prazoAtrasado(o.prazo, o.status) ? "Objetivo atrasado: " + o.titulo : "Risco em objetivo: " + o.titulo,
        descricao: o.bloqueio || o.observacoes || o.descricao,
        risco: o.risco || (o.status === "bloqueado" ? "Elevado" : "Moderado"),
        categoria: "Planejamento",
        fonteTipo: "objetivo",
        fonteId: o.id,
        fonteNome: o.titulo,
        faseId: f.id,
        objetivoId: o.id,
        criadoEm: o.atualizadaEm,
      });
    }
  }));

  const ordem = { Crítico: 4, Elevado: 3, Moderado: 2, Baixo: 1 };
  return sinais.sort((a, b) => (ordem[b.risco] || 0) - (ordem[a.risco] || 0) || new Date(b.criadoEm || 0) - new Date(a.criadoEm || 0));
}

  },

function normalizarSigilo(valor) {
  if (valor === "Interno") return "Restrito";
  return SIGILO_CFG[valor] ? valor : "Restrito";
}

function sigiloConfig(sigilo) {
  return SIGILO_CFG[normalizarSigilo(sigilo)];
}

function usuarioTemJuramento(data, usuario) {
  if (!usuario) return false;
  return (data?.juramentados || []).some(j =>
    j.username === usuario.username ||
    (j.nome || "").toLowerCase() === (usuario.displayName || "").toLowerCase()
  );
}

function nivelAcessoUsuario(data, usuario, roleInformado = null) {
  if (!usuario) return 0;
  const role = roleInformado || data?.roles?.find(r => r.id === usuario.role);
  if (role?.hasLeaderPerms === true) return 4;
  if (usuario.role === "contratante") return 1;
  if (usuario.role === "conselheiro" || ["soke", "bunke"].includes(usuario.cla)) return 3;
  if (usuarioTemJuramento(data, usuario)) return 2;
  return 1;
}

function podeVerSigilo(sigilo, data, usuario, role = null) {
  return nivelAcessoUsuario(data, usuario, role) >= sigiloConfig(sigilo).nivel;
}

function podeReceberSigilo(data, usuario, sigilo) {
  const role = data?.roles?.find(r => r.id === usuario?.role);
  return podeVerSigilo(sigilo, data, usuario, role);
}

function podeVerItemSigiloso(item, data, usuario, role = null) {
  if (!item || !usuario) return false;
  const sigilo = normalizarSigilo(item.sigilo || item.confidencialidade);
  if (podeVerSigilo(sigilo, data, usuario, role)) return true;
  if (usuarioParticipaMissao(item, usuario.username)) return true;
  if (item.autorUsername === usuario.username) return true;
  if (item.missaoId) {
    const missao = (data?.missoes || []).find(m => m.id === item.missaoId);
    if (missao && usuarioParticipaMissao(missao, usuario.username)) return true;
  }
  return false;
}

function niveisPermitidosPara(data, usuario, role = null) {
  const nivel = nivelAcessoUsuario(data, usuario, role);
  return SIGILO_NIVEIS.filter(s => SIGILO_CFG[s].nivel <= nivel);
}

function nomeResponsavelEstrategico(valor, data) {
  if (!valor) return "Não designado";
  const texto = String(valor);
  if (texto.startsWith("ramo:")) {
    const ramoId = texto.slice(5);
    const ramo = (data.clas || []).find(c => c.id === ramoId);
    return ramo ? "Família · " + ramo.nome : "Família não encontrada";
  }
  const membro = (data.users || []).find(u => u.username === texto);
  return membro ? getCodinome(membro) : texto;
}

function OperacaoRelacionada({ tipo, id, data }) {
  if (!id) return null;
  const colecao = tipo === "missao" ? data.missoes : tipo === "relatorio" ? data.relatorios : tipo === "contrato" ? data.contratos : [...(data.mapaPontos || []), ...(data.mapaRotas || [])];
  const item = (colecao || []).find(x => x.id === id);
  if (!item) return null;
  return <div className="flex items-center gap-2 p-2 rounded border border-zinc-800 bg-black/40"><FonteEstrategicaBadge tipo={tipo} /><span className="text-zinc-400 text-xs truncate">{item.titulo || item.name}</span></div>;
}

const CONFID_CFG = SIGILO_CFG;

function RelatorioModal({ relatorio, onSave, onClose, niveisPermitidos = SIGILO_NIVEIS, data }) {
  const editando = !!relatorio?.id;
  const [titulo, setTitulo] = useState(relatorio?.titulo || "");
  const [local, setLocal] = useState(relatorio?.local || "");
  const [descricao, setDescricao] = useState(relatorio?.descricao || "");
  const [tipoRelatorio, setTipoRelatorio] = useState(relatorio?.tipo || "Ocorrência sem missão");
  const [confidencialidade, setConfid] = useState(normalizarSigilo(relatorio?.confidencialidade || niveisPermitidos[Math.min(1, niveisPermitidos.length - 1)] || "Público"));
  const [alertaJikkai, setAlertaJikkai] = useState(Boolean(relatorio?.alertaJikkai));
  const [riscoJikkai, setRiscoJikkai] = useState(relatorio?.riscoJikkai || "Moderado");
  const [categoriaJikkai, setCategoriaJikkai] = useState(relatorio?.categoriaJikkai || "Inteligência");
  const [faseId, setFaseId] = useState(relatorio?.faseId || "");
  const [objetivoId, setObjetivoId] = useState(relatorio?.objetivoId || "");
  const [resumoEstrategico, setResumoEstrategico] = useState(relatorio?.resumoEstrategico || "");
  const [contratoId, setContratoId] = useState(relatorio?.contratoId || "");
  const [opcoesAvancadas, setOpcoesAvancadas] = useState(Boolean(relatorio?.alertaJikkai || relatorio?.faseId || relatorio?.objetivoId || editando));

  const mapaLocais = [
    ...(data?.mapaPontos || []).map(p => ({ ...p, mapaTipo: "ponto", mapaEtiqueta: p.type || p.kind || "local" })),
    ...(data?.mapaRotas || []).map(r => ({ ...r, mapaTipo: "rota", mapaEtiqueta: r.type || r.kind || "rota" })),
  ]
    .filter(item => item?.id && item?.name)
    .sort((a, b) => String(a.name).localeCompare(String(b.name), "pt-BR"));

  const mapaRefInicial = (() => {
    if (!relatorio?.mapaId) return "";
    const tipoSalvo = relatorio.mapaTipo || relatorio.mapaKind || "";
    if (tipoSalvo) return `${tipoSalvo}:${relatorio.mapaId}`;
    const ponto = (data?.mapaPontos || []).find(p => p.id === relatorio.mapaId);
    if (ponto) return `ponto:${relatorio.mapaId}`;
    const rota = (data?.mapaRotas || []).find(r => r.id === relatorio.mapaId);
    if (rota) return `rota:${relatorio.mapaId}`;
    return "";
  })();
  const [mapaRef, setMapaRef] = useState(mapaRefInicial);
  const mapaSelecionado = mapaLocais.find(item => `${item.mapaTipo}:${item.id}` === mapaRef);

  const contratosDisponiveis = (data?.contratos || [])
    .filter(c => c.status !== "Recusado")
    .slice()
    .sort((a, b) => {
      const peso = { "Em Andamento": 0, "Aberto": 1, "Proposta": 2, "Concluído": 3, "Falhou": 4 };
      return (peso[a.status] ?? 9) - (peso[b.status] ?? 9) || new Date(b.criadoEm || 0) - new Date(a.criadoEm || 0);
    });
  const contratoSelecionado = contratosDisponiveis.find(c => c.id === contratoId);
  const contratoCfgSelecionado = contratoSelecionado ? (CONTRATO_STATUS_CFG[contratoSelecionado.status] || CONTRATO_STATUS_CFG["Aberto"]) : null;
  const faseSelecionada = (data?.fases || []).find(f => f.id === faseId);

  const tiposRelatorio = [
    { id: "Relatório de missão", titulo: "Missão", desc: "Operação" },
    { id: "Relatório de contrato", titulo: "Contrato", desc: "Contrato" },
    { id: "Ocorrência sem missão", titulo: "Ocorrência", desc: "Sem missão" },
    { id: "Inteligência", titulo: "Inteligência", desc: "Informação" },
    { id: "Risco / alerta", titulo: "Risco", desc: "Alerta" },
    { id: "Registro narrativo", titulo: "Narrativo", desc: "RP" },
  ];

  const selecionarTipo = (tipo) => {
    setTipoRelatorio(tipo);
    if (tipo === "Risco / alerta") {
      setAlertaJikkai(true);
      setOpcoesAvancadas(true);
    }
    if (tipo !== "Relatório de contrato") setContratoId("");
  };

  const selecionarLocalMapa = (ref) => {
    setMapaRef(ref);
    const item = mapaLocais.find(x => `${x.mapaTipo}:${x.id}` === ref);
    if (item) setLocal(item.name || "");
  };

  const snapshotRelatorioAtual = () => ({
    ...(relatorio || {}),
    titulo,
    local,
    descricao,
    tipo: tipoRelatorio,
    confidencialidade,
    alertaJikkai,
    riscoJikkai,
    categoriaJikkai,
    faseId,
    objetivoId,
    resumoEstrategico,
    contratoId,
    mapaId: mapaSelecionado?.id || "",
    mapaTipo: mapaSelecionado?.mapaTipo || "",
    mapaNome: mapaSelecionado?.name || "",
    mapaCategoria: mapaSelecionado?.mapaEtiqueta || "",
  });

  const escolherLocalNoMapa = () => {
    try {
      localStorage.setItem(REPORT_DRAFT_KEY, JSON.stringify(snapshotRelatorioAtual()));
    } catch {}
    if (typeof window.foxOpenStrategicMap === "function") {
      window.foxOpenStrategicMap({ pickLocation: true });
    } else {
      try {
        localStorage.setItem(MAP_PICK_REQUEST_KEY, JSON.stringify({
          origem: "relatorio",
          returnTab: "jikkai",
          returnSubTab: "relatorios",
          returnAction: "retomar-relatorio-mapa",
          createdAt: new Date().toISOString(),
        }));
      } catch {}
      window.location.href = "./mapa.html?pick=relatorio";

  };

                {opcoesAvancadas && (

                        <div><label className="fox-label">Categoria</label><select value={categoriaJikkai} onChange={e => setCategoriaJikkai(e.target.value)} className="fox-input"><option>Inteligência</option><option>Operacional</option><option>Político</option><option>Diplomático</option><option>Exposição</option><option>Financeiro</option><option>Pessoal</option><option>Desconhecido</option></select></div>
                        <div><label className="fox-label">Fase</label><select value={faseId} onChange={e => { setFaseId(e.target.value); setObjetivoId(""); }} className="fox-input"><option value="">Plano geral</option>{(data?.fases || []).map(f => <option key={f.id} value={f.id}>Fase {f.n} · {f.titulo}</option>)}</select></div>
                        <div><label className="fox-label">Objetivo</label><select value={objetivoId} onChange={e => setObjetivoId(e.target.value)} className="fox-input" disabled={!faseSelecionada}><option value="">Toda a fase</option>{(faseSelecionada?.objetivos || []).map(o => <option key={o.id} value={o.id}>{o.titulo}</option>)}</select></div>
                        <div className="sm:col-span-2"><label className="fox-label">Resumo para comando</label><textarea rows="2" value={resumoEstrategico} onChange={e => setResumoEstrategico(e.target.value)} className="fox-input" placeholder="Ex: revisar rota, interromper contato, convocar equipe." /></div>

            <section className="rounded-xl border border-orange-900/40 bg-gradient-to-br from-red-950/10 to-black p-3 h-full flex flex-col min-h-[420px] lg:min-h-[520px]">

}
function RelatoriosSection({ data, setData, isLider, usuario, role, navigationRequest }) {
  const [modal, setModal] = useState(null); // null | {} (criar) | {id, ...} (editar)
  const niveisPermitidos = niveisPermitidosPara(data, usuario, role);

  const relatorios = (data.relatorios || []).slice().sort((a, b) => new Date(b.data) - new Date(a.data));
  const relatoriosLiberados = relatorios.filter(r => podeVerItemSigiloso(r, data, usuario, role));

  useEffect(() => {
    if (navigationRequest?.tab !== "jikkai" || navigationRequest?.subTab !== "relatorios") return;
    if (navigationRequest?.action === "novo-relatorio-avulso") setModal({ tipo: "Ocorrência sem missão" });
    if (navigationRequest?.action === "novo-relatorio-contrato") setModal({ tipo: "Relatório de contrato" });
    if (navigationRequest?.action === "novo-relatorio-risco") setModal({ tipo: "Risco / alerta", alertaJikkai: true, riscoJikkai: "Elevado" });
  }, [navigationRequest?.token]);

  useEffect(() => {
    if (navigationRequest?.tab !== "jikkai" || navigationRequest?.subTab !== "relatorios") return;
    let draft = null;
    let picked = null;
    try { draft = JSON.parse(localStorage.getItem(REPORT_DRAFT_KEY) || "null"); } catch {}
    try { picked = JSON.parse(localStorage.getItem(MAP_PICK_RESULT_KEY) || "null"); } catch {}
    if (!draft && !picked) return;

    const proximo = { ...(draft || { tipo: "Ocorrência sem missão" }) };
    if (picked) {
      proximo.mapaId = picked.id || "";
      proximo.mapaTipo = picked.mapaTipo || "";
      proximo.mapaNome = picked.name || "";
      proximo.mapaCategoria = picked.mapaCategoria || "";
      proximo.local = picked.name || proximo.local || "";
    }

    setModal(proximo);
    try {
      localStorage.removeItem(REPORT_DRAFT_KEY);
      localStorage.removeItem(MAP_PICK_RESULT_KEY);
      localStorage.removeItem(MAP_PICK_REQUEST_KEY);
    } catch {}
  }, [navigationRequest?.token, relatorios.length]);

  const criar = (form) => {
    const novo = {
      id: uid(),
      ...form,
      autorUsername: usuario?.username || "?",
      autorNome: usuario?.displayName || usuario?.username || "Desconhecido",
      data: new Date().toISOString(),
    };
    setData(d => ({ ...d, relatorios: [...(d.relatorios || []), novo] }));
    setModal(null);
  };

  const editar = (form) => {
    setData(d => ({
      ...d,
      relatorios: (d.relatorios || []).map(r => r.id === modal.id ? { ...r, ...form, editadoEm: new Date().toISOString() } : r),
    }));
    setModal(null);
  };

  const deletar = (id) => {
    if (!confirm("Deletar este relatório? Esta ação não pode ser desfeita.")) return;
    setData(d => ({ ...d, relatorios: (d.relatorios || []).filter(r => r.id !== id) }));
  };

  return (
    <div className="fadein">
      <div className="flex justify-end mb-4">
        <Btn onClick={() => setModal({ tipo: "Ocorrência sem missão" })} variant="primary"><IPlus className="w-3 h-3" /> Criar Relatório</Btn>
      </div>

      <div className="grid md:grid-cols-4 gap-3 mb-5">
        <button onClick={() => setModal({ tipo: "Ocorrência sem missão" })} className="p-4 rounded-xl border border-sky-900/40 bg-sky-950/10 text-left hover:border-sky-500 transition-colors">
          <div className="text-[9px] uppercase tracking-[0.28em] text-sky-400">Sem missão</div>
          <div className="text-orange-50 font-black serif mt-1">Criar relatório avulso</div>
          <p className="text-zinc-500 text-xs mt-2 leading-relaxed">Use quando algo importante aconteceu, mesmo sem operação formal.</p>
        </button>
        <button onClick={() => setModal({ tipo: "Relatório de contrato" })} className="p-4 rounded-xl border border-orange-900/40 bg-orange-950/10 text-left hover:border-orange-500 transition-colors">
          <div className="text-[9px] uppercase tracking-[0.28em] text-orange-400">Contrato</div>
          <div className="text-orange-50 font-black serif mt-1">Relatar contrato</div>
          <p className="text-zinc-500 text-xs mt-2 leading-relaxed">Vincule o relatório a um contrato ativo sem alterar equipe ou status.</p>
        </button>
        <button onClick={() => setModal({ tipo: "Inteligência" })} className="p-4 rounded-xl border border-purple-900/40 bg-purple-950/10 text-left hover:border-purple-500 transition-colors">
          <div className="text-[9px] uppercase tracking-[0.28em] text-purple-400">Informação</div>
          <div className="text-orange-50 font-black serif mt-1">Registrar inteligência</div>
          <p className="text-zinc-500 text-xs mt-2 leading-relaxed">Boatos, movimentações, encontros, rotas, riscos ou observações.</p>
        </button>
        <button onClick={() => setModal({ tipo: "Risco / alerta", alertaJikkai: true, riscoJikkai: "Elevado" })} className="p-4 rounded-xl border border-red-900/40 bg-red-950/10 text-left hover:border-red-500 transition-colors">
          <div className="text-[9px] uppercase tracking-[0.28em] text-red-400">Urgente</div>
          <div className="text-orange-50 font-black serif mt-1">Gerar alerta</div>
          <p className="text-zinc-500 text-xs mt-2 leading-relaxed">Use quando a informação deve aparecer no Painel JIKKAI.</p>
        </button>
      </div>

      {relatorios.length === 0 && (
        <div className="p-8 text-center bg-zinc-950/50 border border-zinc-800 rounded-lg">
          <IFile className="w-12 h-12 text-zinc-700 mx-auto mb-3" />
          <p className="text-zinc-500">Nenhum relatório registrado ainda.</p>
          <p className="text-zinc-700 text-xs italic mt-2">Crie um relatório quando uma missão terminar ou quando algo importante acontecer.</p>
        </div>
      )}

      <div className="grid md:grid-cols-2 gap-4">
        {relatorios.map((r) => {
          const sigilo = normalizarSigilo(r.confidencialidade);
          const c = sigiloConfig(sigilo);
          const autorizado = podeVerItemSigiloso(r, data, usuario, role);
          if (!autorizado) return <ConteudoCensurado key={r.id} sigilo={sigilo} tipo="RELATÓRIO" />;
          return (
            <div key={r.id} className={`rounded-lg border ${c.border} ${c.bg} p-5 fadein hover:border-orange-600 transition-colors`}>
              <div className="flex items-start justify-between gap-2 mb-2">
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider border" style={{ color: c.cor, borderColor: c.cor + "80", background: c.cor + "20" }}>
                      {c.codigo} · {sigilo}
                    </span>
                    {r.tipo && <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider bg-purple-950 text-purple-300 border border-purple-800">{r.tipo}</span>}
                    {r.statusAprovacao && <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider bg-zinc-900 text-zinc-400 border border-zinc-800">{r.statusAprovacao}</span>}
                    {r.alertaJikkai && <><FonteEstrategicaBadge tipo="relatorio" /><RiscoBadge risco={r.riscoJikkai} compacto /></>}
                    {r.mapaNome && <span className="text-sky-400 text-xs uppercase tracking-wider">Mapa: {r.mapaNome}</span>}
                    {!r.mapaNome && r.local && <span className="text-zinc-500 text-xs uppercase tracking-wider">{r.local}</span>}
                  </div>
                  <h3 className="text-orange-50 font-bold text-lg serif leading-tight">{r.titulo}</h3>
                  {r.missaoId && (() => {
                    const missao = (data.missoes || []).find(m => m.id === r.missaoId);
                    return missao ? <div className="text-purple-400 text-xs mt-1">Missão vinculada: {missao.titulo}</div> : null;
                  })()}
                  {r.contratoId && (() => {
                    const contrato = (data.contratos || []).find(c => c.id === r.contratoId);
                    return contrato ? <div className="text-orange-400 text-xs mt-1">Contrato vinculado: {contrato.titulo} · {contrato.status}</div> : null;
                  })()}
                  {r.mapaNome && <div className="text-sky-400 text-xs mt-1">Local do mapa: {r.mapaNome}{r.local && r.local !== r.mapaNome ? ` · ${r.local}` : ""}</div>}
                </div>
                {isLider && (
                  <div className="flex gap-1 flex-shrink-0">
                    <button onClick={() => setModal(r)} className="p-1.5 text-orange-400 hover:text-orange-300" title="Editar"><IEdit className="w-4 h-4" /></button>
                    <button onClick={() => deletar(r.id)} className="p-1.5 text-red-500 hover:text-red-400" title="Deletar"><ITrash className="w-4 h-4" /></button>
                  </div>
                )}
              </div>
              <p className="text-zinc-300 text-sm leading-relaxed whitespace-pre-wrap mt-3 mb-4">{r.descricao}</p>
              <div className="pt-3 border-t border-zinc-800/60 flex items-center justify-between text-xs text-zinc-600">
                <span>Por <strong className="text-orange-600">{r.autorNome}</strong></span>
                <span>{new Date(r.data).toLocaleString("pt-BR", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })}</span>
              </div>
              {r.editadoEm && <div className="text-[10px] text-zinc-700 italic mt-1">editado em {new Date(r.editadoEm).toLocaleDateString("pt-BR")}</div>}
            </div>
          );
        })}
      </div>

      {modal && (
        <RelatorioModal
          relatorio={modal}
          onSave={modal.id ? editar : criar}
          onClose={() => setModal(null)}
          niveisPermitidos={niveisPermitidos}
          data={data}
        />
      )}
    </div>
  );
}

function moedaContrato() { return "Yens"; }
function categoriaContratoLabel(id) {
  return CONTRATO_CATEGORIAS.find(c => c.id === id)?.label || "Contrato Geral";
}

function ContratoStatusTrail({ status }) {
  const passos = [
    { id: "Proposta", label: "Proposta" },
    { id: "Aberto", label: "Analise" },
    { id: "Em Andamento", label: "Execucao" },
    { id: "Concluído", label: "Conclusao" },
  ];
  const ordem = status === "Recusado" ? 1 : status === "Falhou" ? 3 : Math.max(0, passos.findIndex(p => p.id === status));
  return (
    <div className="rounded-lg border border-zinc-800 bg-black/40 p-3">
      <div className="grid grid-cols-4 gap-2">
        {passos.map((p, i) => {
          const ativo = i <= ordem && status !== "Recusado";
          const atual = p.id === status || (status === "Aberto" && p.id === "Aberto") || (status === "Falhou" && p.id === "Em Andamento");
          return (
            <div key={p.id} className="min-w-0">
              <div className={`h-1.5 rounded-full ${ativo ? "bg-orange-600" : "bg-zinc-800"}`} />
              <div className={`text-[9px] uppercase tracking-wider mt-1 truncate ${atual ? "text-orange-300 font-black" : ativo ? "text-zinc-300" : "text-zinc-700"}`}>{p.label}</div>
            </div>
          );
        })}
      </div>
      {(status === "Recusado" || status === "Falhou") && (
        <div className="text-[10px] uppercase tracking-wider text-red-400 mt-3">{status === "Recusado" ? "Proposta recusada pela lideranca" : "Operacao encerrada como falha"}</div>
      )}
    </div>
  );
}
