function ContratoAtribuicaoModal({ contrato, data, usuario, role, onSave, onClose }) {
  const escopos = escoposGerenciaveisOperacionais(data, usuario, role);
  const tipoInicial = escopos.equipes[0]?.id ? "equipe" : (escopos.divisoes[0]?.id ? "divisao" : "membro");
  const alvoInicial = escopos.equipes[0]?.id || escopos.divisoes[0]?.id || "";
  const [tipo, setTipo] = useState(tipoInicial);
  const [targetId, setTargetId] = useState(alvoInicial);
  const [sigilo, setSigilo] = useState("Restrito");
  const [objetivosText, setObjetivosText] = useState("Investigar o alvo\nExecutar conforme limites do contrato\nEnviar relatório final");
  const usuarios = (data.users || []).filter(u => u.role !== "contratante" && podeReceberSigilo(data, u, sigilo));
  const [manual, setManual] = useState([]);
  const participantes = (tipo === "membro" ? manual : participantesPorEscopoOperacional(data, tipo, targetId, []))
    .filter(username => usuarios.some(u => u.username === username));

  useEffect(() => {
    if (tipo === "equipe" && !escopos.equipes.some(e => e.id === targetId)) setTargetId(escopos.equipes[0]?.id || "");
    if (tipo === "divisao" && !escopos.divisoes.some(d => d.id === targetId)) setTargetId(escopos.divisoes[0]?.id || "");
  }, [tipo]);

  const mudarTipo = novoTipo => {
    setTipo(novoTipo);
    if (novoTipo === "equipe") setTargetId(escopos.equipes[0]?.id || "");
    if (novoTipo === "divisao") setTargetId(escopos.divisoes[0]?.id || "");
    if (novoTipo === "membro") setTargetId("");
  };
  const toggle = username => setManual(xs => xs.includes(username) ? xs.filter(x => x !== username) : [...xs, username]);
  const salvar = () => {
    if (participantes.length === 0) return;
    const equipe = tipo === "equipe" ? escopos.equipes.find(e => e.id === targetId) : null;
    onSave({
      attributionType: tipo,
      targetId,
      divisaoId: tipo === "divisao" ? targetId : (equipe?.divisaoId || ""),
      equipeId: tipo === "equipe" ? targetId : "",
      participants: Array.from(new Set(participantes)),
      sigilo,
      objetivosText,
      assignmentLabel: escopoOperacionalLabel(data, tipo, targetId, "Operadores selecionados"),
    });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm fadein" onClick={onClose}>
      <div className="bg-zinc-950 border border-red-700 rounded-lg shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
        <div className="p-5 border-b border-red-900/50 flex items-center justify-between sticky top-0 bg-zinc-950 z-10">
          <div>
            <div className="text-[10px] uppercase tracking-[0.35em] text-red-500">Designação operacional</div>
            <h3 className="text-xl font-bold text-orange-50 serif mt-1">Converter contrato em missão</h3>
            <p className="text-zinc-600 text-xs truncate max-w-[70vw]">{contrato.titulo}</p>
          </div>
          <button onClick={onClose} className="text-zinc-500 hover:text-red-400 p-1"><IX className="w-5 h-5" /></button>
        </div>
        <div className="p-5 space-y-4">
          <div className="grid grid-cols-3 gap-2">
            {[{id:"equipe", label:"Equipe"},{id:"divisao", label:"Divisão"},{id:"membro", label:"Membro"}].map(opt => (
              <button key={opt.id} type="button" onClick={() => mudarTipo(opt.id)} className={`rounded-lg border px-3 py-2 text-xs uppercase tracking-wider font-black ${tipo === opt.id ? "bg-red-700 border-red-500 text-white" : "bg-black border-zinc-800 text-zinc-500 hover:text-zinc-300"}`}>{opt.label}</button>
            ))}
          </div>
          <div className="grid sm:grid-cols-2 gap-3">
            <div>
              <label className="fox-label">Sigilo da missão</label>
              <select value={sigilo} onChange={e => setSigilo(e.target.value)} className="fox-input"><option>Restrito</option><option>Confidencial</option><option>Olhos do Líder</option></select>
            </div>
            {tipo === "equipe" && <div><label className="fox-label">Equipe responsável</label><select value={targetId} onChange={e => setTargetId(e.target.value)} className="fox-input"><option value="">— Selecione —</option>{escopos.equipes.map(e => { const d = divisoesJikkai(data).find(x => x.id === e.divisaoId); return <option key={e.id} value={e.id}>{e.nome} · {d?.nome || "Sem divisão"}</option>; })}</select></div>}
            {tipo === "divisao" && <div><label className="fox-label">Divisão responsável</label><select value={targetId} onChange={e => setTargetId(e.target.value)} className="fox-input"><option value="">— Selecione —</option>{escopos.divisoes.map(d => <option key={d.id} value={d.id}>{d.nome}</option>)}</select></div>}
          </div>
          {tipo === "membro" && <div><label className="fox-label">Operadores individuais</label><div className="grid sm:grid-cols-2 gap-2 p-3 bg-black border border-zinc-800 rounded max-h-48 overflow-y-auto">{usuarios.map(u => <label key={u.username} className="flex items-center gap-2 text-sm text-zinc-300 cursor-pointer p-1"><input type="checkbox" checked={manual.includes(u.username)} onChange={() => toggle(u.username)} className="w-4 h-4 accent-red-600" /><span>{getCodinome(u)} <span className="text-zinc-700">@{u.username}</span></span></label>)}</div></div>}
          <div className="p-3 rounded border border-zinc-800 bg-black/40">
            <div className="text-[10px] uppercase tracking-wider text-zinc-600 mb-2">Operadores que entrarão na missão ({participantes.length})</div>
            <div className="flex gap-1.5 flex-wrap">{participantes.map(p => { const u = data.users.find(x => x.username === p); return <span key={p} className="px-2 py-1 rounded border border-zinc-800 bg-zinc-950 text-zinc-300 text-[10px]">{u ? getCodinome(u) : p}</span>; })}{participantes.length === 0 && <span className="text-yellow-500 text-xs">Nenhum operador disponível neste escopo.</span>}</div>
          </div>
          <div><label className="fox-label">Objetivos gerados para a missão</label><textarea value={objetivosText} onChange={e => setObjetivosText(e.target.value)} rows="4" className="fox-input" /></div>
          <div className="p-3 rounded border border-purple-900/50 bg-purple-950/10 text-purple-200 text-xs">Após designar, o contrato ficará em andamento e a missão só poderá ser encerrada depois de relatório final enviado e aprovado.</div>
        </div>
        <div className="p-5 border-t border-zinc-800 flex gap-2 justify-end sticky bottom-0 bg-zinc-950">
          <Btn onClick={onClose} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
          <Btn onClick={salvar} variant="primary" disabled={participantes.length === 0}><ISwords className="w-3 h-3" /> Gerar missão</Btn>
        </div>
      </div>
    </div>
  );
}

function ContratosSection({ data, setData, isLider, usuario, role, viewerIsContratante, navigationRequest }) {
  const [modal, setModal] = useState(null);
  const [relatorioContrato, setRelatorioContrato] = useState(null);
  const [designarContrato, setDesignarContrato] = useState(null);
  const [confirmacao, setConfirmacao] = useState(null);
  const [aviso, setAviso] = useState(null);
  const [filtro, setFiltro] = useState("Todos");
  const [expandido, setExpandido] = useState(null);
  const [novaMsgPorContrato, setNovaMsgPorContrato] = useState({});
  const niveisPermitidosContrato = niveisPermitidosPara(data, usuario, role);

  useEffect(() => {
    if (navigationRequest?.tab !== "jikkai" || navigationRequest?.subTab !== "contratos") return;
    const action = String(navigationRequest.action || "");
    if (action.startsWith("contrato-designar:")) {
      const id = action.split(":")[1];
      const contrato = (data.contratos || []).find(c => c.id === id);
      if (contrato) { setExpandido(id); setDesignarContrato(contrato); }
    }
  }, [navigationRequest?.token]);

  // Helper local: nome a exibir respeitando sigilo do contratante e do viewer
  const podeVerAutorContrato = !!(isLider || role?.hasLeaderPerms || hasPerm(role, "edit_contracts") || ["lider", "conselheiro", "braco_direito"].includes(estruturaPosicaoRole(role)));
  const exibirNome = (username, nomeArmazenado) => {
    if (!username && !nomeArmazenado) return "?";
    const u = data.users?.find(x => x.username === username);
    if (viewerIsContratante) {
      // Se eu sou contratante e o username é o meu, mostro meu nome
      if (username === usuario?.username) return u?.displayName || u?.codinome || "Você";
      // Se quem criou é outro contratante, mostro o codinome dele
      if (u?.role === "contratante") return u.codinome || u.displayName || "Contratante";
      // Senão (operador da Jikkai), mascaro completamente
      return "Jikkai — Liderança";
    }
    // Membro comum não vê a identidade do contratante; só liderança/gestão de contratos vê.
    if (u?.role === "contratante" && !podeVerAutorContrato) return "Contratante externo";
    if (u) return nomeParaExibir(u, false);
    return nomeArmazenado || username || "?";
  };
  const exibirCriadorContrato = (contrato) => {
    if (!viewerIsContratante && contrato?.tipo === "externo" && !podeVerAutorContrato) return "Contratante externo";
    return exibirNome(contrato?.criadoPor, contrato?.criadoPorNome);
  };

  // Filtragem: contratante só vê seus próprios contratos + os "Aberto" (vitrine)
  const todosBruto = (data.contratos || []).slice().sort((a, b) => new Date(b.criadoEm) - new Date(a.criadoEm));
  const todos = viewerIsContratante
    ? todosBruto.filter(c => c.criadoPor === usuario?.username || c.status === "Aberto")
    : todosBruto;
  const contratos = filtro === "Todos" ? todos : todos.filter(c => c.status === filtro);

  const criar = (form) => {
    const tipo = viewerIsContratante ? "externo" : "interno";
    const statusInicial = viewerIsContratante ? "Proposta" : (form.status || "Aberto");
    const novo = {
      id: uid(),
      ...form,
      status: statusInicial,
      tipo,
      criadoPor: usuario?.username || "?",
      criadoPorNome: usuario?.displayName || usuario?.username || "Desconhecido",
      criadoEm: new Date().toISOString(),
      negociacoes: [],
    };
    setData(d => ({ ...d, contratos: [...(d.contratos || []), novo] }));
    setModal(null);
  };

  const editar = (form) => {
    setData(d => ({
      ...d,
      contratos: (d.contratos || []).map(c => c.id === modal.id ? { ...c, ...form } : c),
    }));
    setModal(null);
  };

  const deletar = (id) => {
    const contratoAtual = (data.contratos || []).find(c => c.id === id);
    if (!contratoAtual) {
      setAviso({
        title: "Contrato nao encontrado",
        message: "Recarregue a pagina e tente novamente.",
        tone: "danger",
      });
      return;
    }

    const missoesVinculadas = (data.missoes || []).filter(m => m.contratoId === id).length;
    const relatoriosVinculados = (data.relatorios || []).filter(r => r.contratoId === id).length;
    const avisoVinculos = (missoesVinculadas || relatoriosVinculados)
      ? `\n\nEste contrato possui ${missoesVinculadas} missão(ões) e ${relatoriosVinculados} relatório(s) vinculados. Eles serão mantidos, mas o vínculo com o contrato será removido para não quebrar o histórico.`
      : "";

    setConfirmacao({
      title: `Deletar "${contratoAtual.titulo}"?`,
      message: `Esta acao nao pode ser desfeita.${avisoVinculos}`,
      tone: "danger",
      confirmLabel: "Deletar",
      onConfirm: () => {
        setData(d => {
          const contratoAlvo = (d.contratos || []).find(c => c.id === id);
          if (!contratoAlvo) return d;
          const removidoEm = new Date().toISOString();
          return {
            ...d,
            contratos: (d.contratos || []).filter(c => c.id !== id),
            missoes: (d.missoes || []).map(m => m.contratoId === id ? {
              ...m,
              contratoId: null,
              contratoRemovidoTitulo: contratoAlvo.titulo,
              contratoRemovidoEm: removidoEm,
              source: m.source === "contrato" ? "manual" : m.source,
            } : m),
            relatorios: (d.relatorios || []).map(r => r.contratoId === id ? {
              ...r,
              contratoId: "",
              contratoTitulo: r.contratoTitulo || contratoAlvo.titulo,
              contratoRemovido: true,
              contratoRemovidoEm: removidoEm,
            } : r),
            activityLog: [...(d.activityLog || []), atividade("contrato_removido", usuario?.username, id, "Removeu o contrato " + contratoAlvo.titulo)],
          };
        });
        setExpandido(prev => prev === id ? null : prev);
        setDesignarContrato(prev => prev?.id === id ? null : prev);
        setRelatorioContrato(prev => prev?.contratoId === id ? null : prev);
      },
    });
  };

  const aprovarProposta = (id) => {
    setConfirmacao({
      title: "Aprovar proposta?",
      message: "Ela ficara aberta para os operadores aceitarem ou para a lideranca designar uma equipe.",
      tone: "success",
      confirmLabel: "Aprovar",
      onConfirm: () => setData(d => ({
        ...d,
        contratos: d.contratos.map(c => c.id === id ? { ...c, status: "Aberto", aprovadoEm: new Date().toISOString(), aprovadoPor: usuario?.username } : c),
      })),
    });
  };

  const recusarProposta = (id) => {
    setConfirmacao({
      title: "Recusar proposta?",
      message: "O contratante deixara de ver esta proposta entre contratos ativos.",
      tone: "danger",
      confirmLabel: "Recusar",
      onConfirm: () => setData(d => ({
        ...d,
        contratos: d.contratos.map(c => c.id === id ? { ...c, status: "Recusado", recusadoEm: new Date().toISOString() } : c),
      })),
    });
  };

  const adicionarNegociacao = (contratoId) => {
    const msg = (novaMsgPorContrato[contratoId] || "").trim();
    if (!msg) return;
    const nova = {
      autor: usuario?.username,
      autorRole: usuario?.role,
      mensagem: msg,
      data: new Date().toISOString(),
    };
    setData(d => ({
      ...d,
      contratos: d.contratos.map(c => c.id === contratoId ? { ...c, negociacoes: [...(c.negociacoes || []), nova] } : c),
    }));
    setNovaMsgPorContrato(s => ({ ...s, [contratoId]: "" }));
  };

  const criarRelatorioContrato = (form) => {
    const novo = {
      id: uid(),
      ...form,
      autorUsername: usuario?.username || "?",
      autorNome: usuario?.displayName || usuario?.username || "Desconhecido",
      data: new Date().toISOString(),
    };
    setData(d => ({ ...d, relatorios: [...(d.relatorios || []), novo] }));
    setRelatorioContrato(null);
  };

  const criarMissaoDeContrato = (contrato, config) => {
    const participantes = Array.from(new Set((config.participants || []).filter(Boolean)));
    if (!participantes.length) {
      setAviso({
        title: "Nenhum operador selecionado",
        message: "Escolha uma equipe, divisao ou operador antes de converter o contrato em missao.",
        tone: "danger",
      });
      return;
    }
    const missaoId = uid();
    const objetivos = (config.objetivosText || "").split("\n").map(s => s.trim()).filter(Boolean).map(text => ({ text, done: false }));
    const novaMissao = {
      id: missaoId,
      titulo: `[Contrato] ${contrato.titulo}`,
      desc: contrato.descricao || contrato.descricaoCurta,
      assignedTo: participantes[0],
      participants: participantes,
      aceites: [],
      assignedBy: usuario?.username || "lideranca",
      createdAt: new Date().toISOString(),
      objetivos,
      status: "atribuida",
      source: "contrato",
      sigilo: normalizarSigilo(config.sigilo || "Restrito"),
      contratoId: contrato.id,
      recompensa: `${contrato.valorRecompensa} ${moedaContrato(contrato.tipoRecompensa)}`,
      attributionType: config.attributionType || "membro",
      targetId: config.targetId || "",
      divisaoId: config.divisaoId || "",
      equipeId: config.equipeId || "",
      assignmentLabel: config.assignmentLabel || escopoOperacionalLabel(data, config.attributionType, config.targetId, "Operadores selecionados"),
      fluxoObrigatorio: true,
    };
    setData(d => ({
      ...d,
      missoes: [...(d.missoes || []), novaMissao],
      contratos: (d.contratos || []).map(c => c.id === contrato.id ? {
        ...c,
        status: "Em Andamento",
        aceitoPor: participantes[0],
        aceitoPorNome: novaMissao.assignmentLabel,
        aceitoEm: new Date().toISOString(),
        missaoId,
        attributionType: novaMissao.attributionType,
        targetId: novaMissao.targetId,
        divisaoId: novaMissao.divisaoId,
        equipeId: novaMissao.equipeId,
        assignmentLabel: novaMissao.assignmentLabel,
        responsaveis: participantes,
      } : c),
      activityLog: [...(d.activityLog || []), atividade("contrato_designado", usuario?.username, contrato.id, "Designou contrato para " + novaMissao.assignmentLabel)],
    }));
    window.notificarDiscordUsuarios(data, participantes, "contrato", mensagemDiscordMissao(data, novaMissao, "contrato"));
    setDesignarContrato(null);
    setAviso({
      title: "Contrato convertido em missao",
      message: "A equipe devera confirmar participacao e enviar relatorio final para encerrar a operacao.",
      tone: "success",
    });
  };

  const aceitar = (contrato) => {
    setConfirmacao({
      title: `Aceitar "${contrato.titulo}"?`,
      message: "Uma missao sera criada e atribuida a voce. Ao concluir, envie o relatorio final.",
      tone: "success",
      confirmLabel: "Aceitar contrato",
      onConfirm: () => criarMissaoDeContrato(contrato, {
        attributionType: "membro",
        targetId: usuario.username,
        participants: [usuario.username],
        sigilo: "Restrito",
        objetivosText: "Executar o contrato conforme limites definidos\nEnviar relatorio final",
        assignmentLabel: escopoOperacionalLabel(data, "membro", usuario.username, "Operador individual"),
      }),
    });
  };

  // Filtros disponíveis (contratante não vê "Recusado")
  const FILTROS = viewerIsContratante
    ? ["Todos", "Proposta", "Aberto", "Em Andamento", "Concluído", "Falhou"]
    : ["Todos", "Proposta", "Aberto", "Em Andamento", "Concluído", "Falhou", "Recusado"];

  const podeCriar = isLider || viewerIsContratante;
  const tituloHeader = viewerIsContratante ? "Contratos & Propostas" : "Contratos Jikkai";
  const labelBotaoCriar = viewerIsContratante ? "Solicitar Contrato" : "Forjar Contrato";
  const meusContratos = viewerIsContratante ? todosBruto.filter(c => c.criadoPor === usuario?.username) : [];
  const ultimoContrato = meusContratos[0];
  const contratosEmNegociacao = meusContratos.filter(c => ["Proposta", "Aberto"].includes(c.status)).length;
  const contratosEmOperacao = meusContratos.filter(c => c.status === "Em Andamento").length;
  const contratosFinalizados = meusContratos.filter(c => ["Concluído", "Falhou"].includes(c.status)).length;
  const proximaAcaoContratante = ultimoContrato
    ? (ultimoContrato.status === "Proposta" ? "Aguardando analise da lideranca"
      : ultimoContrato.status === "Aberto" ? "Proposta aprovada. Aguarde designacao ou negociacao"
      : ultimoContrato.status === "Em Andamento" ? "Operacao em andamento"
      : ultimoContrato.status === "Concluído" ? "Contrato concluido"
      : ultimoContrato.status === "Falhou" ? "Contrato encerrado como falha"
      : "Proposta recusada")
    : "Abra sua primeira proposta para a Jikkai.";

  return (
    <div className="fadein">
      {viewerIsContratante ? (
        <div className="mb-6 rounded-xl border border-orange-900/50 bg-gradient-to-br from-orange-950/20 via-black to-zinc-950 p-5 overflow-hidden">
          <div className="flex flex-col lg:flex-row gap-5 lg:items-end lg:justify-between">
            <div className="min-w-0">
              <div className="text-[10px] uppercase tracking-[0.32em] text-orange-600">Mesa de contratos</div>
              <h3 className="text-2xl font-black text-orange-50 serif mt-1">Solicite, negocie e acompanhe</h3>
              <p className="text-zinc-500 text-sm mt-2 max-w-2xl">Cada proposta fica registrada como um pergaminho. A lideranca avalia, responde pela negociacao e pode converter o pedido em operacao.</p>
            </div>
            <Btn onClick={() => setModal({})} variant="primary" size="md"><IPlus className="w-4 h-4" /> Solicitar contrato</Btn>
          </div>
          <div className="grid sm:grid-cols-4 gap-3 mt-5">
            <div className="p-3 rounded-lg border border-zinc-800 bg-black/40"><div className="text-2xl font-black text-orange-300">{meusContratos.length}</div><div className="text-[9px] uppercase tracking-wider text-zinc-600">Minhas propostas</div></div>
            <div className="p-3 rounded-lg border border-zinc-800 bg-black/40"><div className="text-2xl font-black text-purple-300">{contratosEmNegociacao}</div><div className="text-[9px] uppercase tracking-wider text-zinc-600">Em analise</div></div>
            <div className="p-3 rounded-lg border border-zinc-800 bg-black/40"><div className="text-2xl font-black text-orange-300">{contratosEmOperacao}</div><div className="text-[9px] uppercase tracking-wider text-zinc-600">Em operacao</div></div>
            <div className="p-3 rounded-lg border border-zinc-800 bg-black/40"><div className="text-2xl font-black text-green-300">{contratosFinalizados}</div><div className="text-[9px] uppercase tracking-wider text-zinc-600">Encerrados</div></div>
          </div>
          <div className="mt-4 grid lg:grid-cols-[1.1fr_0.9fr] gap-3">
            <div className="p-3 rounded-lg border border-zinc-800 bg-black/45">
              <div className="text-[10px] uppercase tracking-wider text-zinc-600 mb-2">Ultimo pergaminho</div>
              {ultimoContrato ? (
                <>
                  <div className="flex items-center gap-2 flex-wrap"><span className={`text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider ${(CONTRATO_STATUS_CFG[ultimoContrato.status] || CONTRATO_STATUS_CFG.Proposta).badge}`}>{ultimoContrato.status}</span><span className="text-orange-100 font-bold">{ultimoContrato.titulo}</span></div>
                  <div className="text-zinc-500 text-sm mt-2">{proximaAcaoContratante}</div>
                </>
              ) : <div className="text-zinc-600 text-sm italic">{proximaAcaoContratante}</div>}
            </div>
            <ContratoStatusTrail status={ultimoContrato?.status || "Proposta"} />
          </div>
        </div>
      ) : (
        podeCriar && <div className="flex justify-end mb-4"><Btn onClick={() => setModal({})} variant="primary"><IPlus className="w-3 h-3" /> {labelBotaoCriar}</Btn></div>
      )}

      <div className="flex gap-2 mb-6 flex-wrap">
        {FILTROS.map(f => {
          const active = filtro === f;
          const count = f === "Todos" ? todos.length : todos.filter(c => c.status === f).length;
          return (
            <button key={f} onClick={() => setFiltro(f)} className={`px-3 py-1.5 rounded text-xs uppercase tracking-wider font-bold border transition-colors ${active ? "bg-red-700 border-red-600 text-white" : "bg-zinc-950 border-zinc-800 text-zinc-500 hover:text-zinc-300 hover:border-zinc-700"}`}>
              {f} <span className="opacity-60">({count})</span>
            </button>
          );
        })}
      </div>

      {contratos.length === 0 && (
        <div className="p-8 text-center bg-zinc-950/50 border border-red-900/30 rounded-lg">
          <ISkull className="w-12 h-12 text-zinc-700 mx-auto mb-3" />
          <p className="text-zinc-500">{todos.length === 0 ? "Nenhum contrato ainda." : "Nenhum contrato neste filtro."}</p>
          {todos.length === 0 && podeCriar && <p className="text-zinc-700 text-xs italic mt-2">{viewerIsContratante ? "Solicite seu primeiro contrato à Jikkai" : "Forje o primeiro contrato de sangue."}</p>}
        </div>
      )}

      <div className="grid md:grid-cols-2 gap-4">
        {contratos.map((c) => {
          const sc = CONTRATO_STATUS_CFG[c.status] || CONTRATO_STATUS_CFG["Aberto"];
          const dc = DIFICULDADE_CFG[c.dificuldade] || DIFICULDADE_CFG["Médio"];
          const expanded = expandido === c.id;
          const podeAceitar = c.status === "Aberto" && usuario && !isLider && !viewerIsContratante;
          const aceito = c.aceitoPor === usuario?.username;
          const ehMinhaProposta = viewerIsContratante && c.criadoPor === usuario?.username;
          const ehProposta = c.status === "Proposta";
          const podeAprovar = isLider && ehProposta;
          // Pode adicionar negociação: criador da proposta, líder, ou membro interno em propostas/abertos
          const podeNegociar = (
            (ehMinhaProposta) ||
            (isLider && (ehProposta || c.status === "Aberto")) ||
            (!viewerIsContratante && !isLider && c.tipo === "externo" && (ehProposta || c.status === "Aberto"))
          );
          const negociacoes = c.negociacoes || [];
          const missaoVinculada = c.missaoId ? data.missoes?.find(m => m.id === c.missaoId) : null;
          const missaoCfg = missaoVinculada ? statusMissaoConfig(missaoVinculada.status) : null;
          const relatoriosVinculados = (data.relatorios || []).filter(r => r.contratoId === c.id && podeVerItemSigiloso(r, data, usuario, role));
          const podeRelatarContrato = !viewerIsContratante && ["Aberto", "Em Andamento", "Concluído", "Falhou"].includes(c.status);
          const escoposContrato = escoposGerenciaveisOperacionais(data, usuario, role);
          const podeDesignarOperacao = !viewerIsContratante && c.status === "Aberto" && (isLider || escoposContrato.temGestao);
          const responsavelContrato = c.assignmentLabel || (c.aceitoPor ? exibirNome(c.aceitoPor, c.aceitoPorNome) : "");

          return (
            <div key={c.id} className={`relative rounded-lg border-2 ${sc.border} ${sc.bg} p-5 fadein hover:border-red-500 transition-colors`}
                 style={{ backgroundImage: "radial-gradient(circle at top right, rgba(185,28,28,0.08), transparent 60%)" }}>
              {/* Selo de sangue no canto */}
              <div className="absolute top-3 right-3 opacity-20">
                {c.tipo === "externo" ? <IBriefcase className="w-12 h-12 text-orange-700" /> : <ISkull className="w-12 h-12 text-red-700" />}
              </div>

              <div className="relative">
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  <span className={`text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider ${sc.badge}`}>{c.status}</span>
                  <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider border" style={{ color: dc.cor, borderColor: dc.cor + "80", background: dc.cor + "15" }}>
                    {c.dificuldade}
                  </span>
                  {c.categoriaContrato && (
                    <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider border border-zinc-700 text-zinc-300 bg-black/40">
                      {categoriaContratoLabel(c.categoriaContrato)}
                    </span>
                  )}
                  {c.tipo === "externo" && (
                    <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider border border-orange-700 text-orange-300 bg-orange-950/40">
                      Solicitação Externa
                    </span>
                  )}
                  {negociacoes.length > 0 && (
                    <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider bg-zinc-800 text-zinc-400">
                      💬 {negociacoes.length}
                    </span>
                  )}
                </div>

                <h3 className="text-orange-50 font-bold text-lg serif leading-tight mb-1 pr-10">{c.titulo}</h3>
                <p className="text-zinc-400 text-sm mb-3">{c.descricaoCurta}</p>

                {/* Recompensa em destaque */}
                <div className="flex items-center gap-2 mb-3 p-2 bg-black/60 border border-red-900/40 rounded">
                  <div className="w-2 h-2 rounded-full bg-red-500 pulse-fire" />
                  <div className="text-xs uppercase tracking-wider text-zinc-500">{c.tipo === "externo" ? "Oferta:" : "Recompensa:"}</div>
                  <div className="text-orange-300 font-black text-sm">{Number(c.valorRecompensa || 0).toLocaleString("pt-BR")} <span className="text-orange-600 text-xs uppercase">{moedaContrato(c.tipoRecompensa)}</span></div>
                </div>

                {viewerIsContratante && ehMinhaProposta && <div className="mb-3"><ContratoStatusTrail status={c.status} /></div>}

                {responsavelContrato && (
                  <div className="mb-3 p-2 rounded border border-purple-900/40 bg-purple-950/10 text-xs">
                    <div className="uppercase tracking-wider text-purple-400 mb-1">Responsável operacional</div>
                    <div className="text-zinc-300">{responsavelContrato}</div>
                  </div>
                )}

                {expanded && (
                  <div className="space-y-2 mb-3">
                    {c.descricao && (
                      <div className="p-3 bg-black/40 border border-zinc-800 rounded">
                        <div className="text-[10px] uppercase tracking-wider text-orange-600 mb-1">Descrição completa</div>
                        <div className="text-sm text-zinc-300 whitespace-pre-wrap">{c.descricao}</div>
                      </div>
                    )}
                    {c.limites && (
                      <div className="p-3 bg-black/40 border border-red-900/40 rounded">
                        <div className="text-[10px] uppercase tracking-wider text-red-500 mb-1">Limites & Restrições</div>
                        <div className="text-sm text-zinc-300 whitespace-pre-wrap">{c.limites}</div>
                      </div>
                    )}
                    {c.prazo && (
                      <div className="p-3 bg-black/40 border border-zinc-800 rounded">
                        <div className="text-[10px] uppercase tracking-wider text-orange-600 mb-1">Prazo</div>
                        <div className="text-sm text-zinc-300">{c.prazo}</div>
                      </div>
                    )}
                    {c.observacoes && (
                      <div className="p-3 bg-black/40 border border-zinc-800 rounded">
                        <div className="text-[10px] uppercase tracking-wider text-orange-600 mb-1">Observações</div>
                        <div className="text-sm text-zinc-300 whitespace-pre-wrap">{c.observacoes}</div>
                      </div>
                    )}

                    {/* Negociações */}
                    {(negociacoes.length > 0 || podeNegociar) && (
                      <div className="p-3 bg-black/40 border border-zinc-800 rounded">
                        <div className="text-[10px] uppercase tracking-wider text-orange-600 mb-2">Negociação ({negociacoes.length})</div>
                        <div className="space-y-2 mb-2 max-h-60 overflow-y-auto">
                          {negociacoes.map((n, ni) => {
                            const ehContratanteAutor = n.autorRole === "contratante";
                            const nomeAutor = exibirNome(n.autor, null);
                            return (
                              <div key={ni} className={`p-2 rounded text-sm border ${ehContratanteAutor ? "bg-orange-950/20 border-orange-900/40" : "bg-red-950/20 border-red-900/40"}`}>
                                <div className="flex items-center justify-between mb-1">
                                  <strong className={ehContratanteAutor ? "text-orange-400 text-xs" : "text-red-400 text-xs"}>{nomeAutor}</strong>
                                  <span className="text-[10px] text-zinc-600">{new Date(n.data).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span>
                                </div>
                                <div className="text-zinc-300 whitespace-pre-wrap">{n.mensagem}</div>
                              </div>
                            );
                          })}
                          {negociacoes.length === 0 && <div className="text-zinc-700 text-xs italic">Nenhuma mensagem ainda.</div>}
                        </div>
                        {podeNegociar && (
                          <div className="flex gap-2">
                            <input
                              value={novaMsgPorContrato[c.id] || ""}
                              onChange={(e) => setNovaMsgPorContrato(s => ({ ...s, [c.id]: e.target.value }))}
                              onKeyDown={(e) => e.key === "Enter" && (e.preventDefault(), adicionarNegociacao(c.id))}
                              placeholder="Adicionar contraproposta ou mensagem..."
                              className="fox-input"
                            />
                            <Btn onClick={() => adicionarNegociacao(c.id)} variant="primary"><IPlus className="w-3 h-3" /></Btn>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}


                {missaoVinculada && (
                  <div className={`mb-3 p-2 rounded border ${missaoCfg.border} ${missaoCfg.bg} flex items-center justify-between gap-2`}>
                    <div className="min-w-0">
                      <div className="text-[10px] uppercase tracking-wider text-zinc-600">Fluxo operacional</div>
                      <div className="text-xs text-zinc-300 truncate">{missaoVinculada.titulo}</div>
                    </div>
                    <span className={`text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider whitespace-nowrap ${missaoCfg.badge}`}>{missaoCfg.label}</span>
                  </div>
                )}

                {relatoriosVinculados.length > 0 && (
                  <div className="mb-3 p-3 rounded border border-orange-900/40 bg-orange-950/10">
                    <div className="text-[10px] uppercase tracking-wider text-orange-600 mb-2">Relatórios vinculados ({relatoriosVinculados.length})</div>
                    <div className="space-y-1">
                      {relatoriosVinculados.slice(0, 3).map(r => (
                        <div key={r.id} className="text-xs text-zinc-400 flex items-center justify-between gap-2">
                          <span className="truncate">{r.titulo}</span>
                          <span className="text-zinc-700 flex-shrink-0">{new Date(r.data).toLocaleDateString("pt-BR")}</span>
                        </div>
                      ))}
                      {relatoriosVinculados.length > 3 && <div className="text-[10px] text-zinc-700 italic">+ {relatoriosVinculados.length - 3} relatório(s) no arquivo</div>}
                    </div>
                  </div>
                )}

                {c.aceitoPor && (
                  <div className="text-xs text-zinc-600 mb-3">
                    Aceito por <strong className="text-orange-500">{exibirNome(c.aceitoPor, c.aceitoPorNome)}</strong>
                    {c.aceitoEm && ` em ${new Date(c.aceitoEm).toLocaleDateString("pt-BR")}`}
                  </div>
                )}

                <div className="flex gap-2 mt-3 pt-3 border-t border-red-900/30 flex-wrap">
                  <Btn onClick={() => setExpandido(expanded ? null : c.id)} variant="ghost">
                    {expanded ? "Recolher" : "Detalhes"}
                  </Btn>
                  {podeDesignarOperacao && (
                    <Btn onClick={() => setDesignarContrato(c)} variant="primary">
                      <ISwords className="w-3 h-3" /> Designar equipe/divisão
                    </Btn>
                  )}
                  {podeRelatarContrato && (
                    <Btn
                      onClick={() => setRelatorioContrato({
                        tipo: "Relatório de contrato",
                        contratoId: c.id,
                        titulo: `Relatório — ${c.titulo}`,
                        local: "",
                        confidencialidade: c.status === "Aberto" ? "Restrito" : "Confidencial",
                      })}
                      variant="default"
                    >
                      <IFile className="w-3 h-3" /> Relatório deste contrato
                    </Btn>
                  )}
                  {podeAprovar && (
                    <>
                      <Btn onClick={() => aprovarProposta(c.id)} variant="primary"><ICheck className="w-3 h-3" /> Aprovar</Btn>
                      <Btn onClick={() => recusarProposta(c.id)} variant="danger"><IX className="w-3 h-3" /> Recusar</Btn>
                    </>
                  )}
                  {podeAceitar && (
                    <Btn onClick={() => aceitar(c)} variant="primary" className="ml-auto">
                      <ISkull className="w-3 h-3" /> Aceitar Contrato
                    </Btn>
                  )}
                  {aceito && c.status === "Em Andamento" && (
                    <span className="ml-auto text-xs uppercase tracking-wider text-orange-500 self-center font-bold">Você aceitou este</span>
                  )}
                  {(isLider || (viewerIsContratante && ehMinhaProposta && ehProposta)) && (
                    <div className="flex gap-1 ml-auto">
                      <button type="button" onClick={(e) => { e.preventDefault(); e.stopPropagation(); setModal(c); }} className="p-1.5 text-orange-400 hover:text-orange-300" title="Editar" aria-label="Editar contrato"><IEdit className="w-4 h-4" /></button>
                      {(isLider || ehMinhaProposta) && (
                        <button type="button" onClick={(e) => { e.preventDefault(); e.stopPropagation(); deletar(c.id); }} className="p-1.5 text-red-500 hover:text-red-400" title="Deletar" aria-label="Deletar contrato"><ITrash className="w-4 h-4" /></button>
                      )}
                    </div>
                  )}
                </div>

                <div className="text-[10px] text-zinc-700 italic mt-2">
                  {c.tipo === "externo" ? "Solicitado" : "Forjado"} por {exibirCriadorContrato(c)} · {new Date(c.criadoEm).toLocaleDateString("pt-BR")}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {designarContrato && (
        <ContratoAtribuicaoModal
          contrato={designarContrato}
          data={data}
          usuario={usuario}
          role={role}
          onSave={(config) => criarMissaoDeContrato(designarContrato, config)}
          onClose={() => setDesignarContrato(null)}
        />
      )}

      {relatorioContrato && (
        <RelatorioModal
          relatorio={relatorioContrato}
          onSave={criarRelatorioContrato}
          onClose={() => setRelatorioContrato(null)}
          niveisPermitidos={niveisPermitidosContrato}
          data={data}
        />
      )}

      {modal && (
        <ContratoModal
          contrato={modal.id ? modal : null}
          onSave={modal.id ? editar : criar}
          onClose={() => setModal(null)}
          viewerIsContratante={viewerIsContratante}
        />
      )}
      <PortalDecisionModal dialog={confirmacao} onClose={() => setConfirmacao(null)} />
      <PortalNoticeModal notice={aviso} onClose={() => setAviso(null)} />
    </div>
  );
}

function AlertaEstrategicoModal({ faseAtual, onSave, onClose }) {
  const [titulo, setTitulo] = useState("");
  const [descricao, setDescricao] = useState("");
  const [risco, setRisco] = useState("Moderado");
  const valido = titulo.trim().length > 0;
  const salvar = () => {
    if (!valido) return;
    onSave({ titulo: titulo.trim(), descricao: descricao.trim(), risco });
  };
  return (
    <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm fadein" onClick={onClose}>
      <div className="w-full max-w-2xl rounded-xl border border-red-800 bg-zinc-950 shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
        <div className="p-5 border-b border-red-900/50 flex items-start gap-3">
          <div className="w-10 h-10 rounded-lg border border-red-800 bg-red-950/25 text-red-300 flex items-center justify-center flex-shrink-0"><IAlert className="w-5 h-5" /></div>
          <div className="min-w-0">
            <div className="text-[10px] uppercase tracking-[0.32em] text-red-500">Alerta estrategico</div>
            <h3 className="text-orange-50 font-black serif text-xl mt-1">Registrar sinal para o comando</h3>
            <p className="text-zinc-500 text-sm mt-2">O alerta entrara no painel JIKKAI e ficara vinculado a fase atual do plano.</p>
          </div>
          <button onClick={onClose} className="ml-auto text-zinc-500 hover:text-red-400 p-1"><IX className="w-5 h-5" /></button>
        </div>
        <div className="p-5 space-y-4">
          <div className="p-3 rounded-lg border border-orange-900/40 bg-orange-950/10 text-xs text-orange-200">
            Fase vinculada: <strong>{faseAtual ? `Fase ${faseAtual.n} - ${faseAtual.titulo}` : "Plano Jikkai"}</strong>
          </div>
          <div>
            <label className="fox-label">Titulo do alerta *</label>
            <input value={titulo} onChange={e => setTitulo(e.target.value)} className="fox-input" autoFocus placeholder="Ex: rota de Kiri sob observacao" />
          </div>
          <div>
            <label className="fox-label">Situacao, consequencia e resposta recomendada</label>
            <textarea value={descricao} onChange={e => setDescricao(e.target.value)} rows="5" className="fox-input" placeholder="Descreva o sinal, quem deve agir e qual risco ele cria para a Jikkai." />
          </div>
          <div>
            <label className="fox-label">Nivel de risco</label>
            <select value={risco} onChange={e => setRisco(e.target.value)} className="fox-input">
              <option>Baixo</option>
              <option>Moderado</option>
              <option>Elevado</option>
              <option>Crítico</option>
            </select>
          </div>
        </div>
        <div className="p-4 bg-black/35 border-t border-zinc-800 flex gap-2 justify-end flex-wrap">
          <Btn onClick={onClose} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
          <Btn onClick={salvar} variant="primary" disabled={!valido}><ISave className="w-3 h-3" /> Registrar alerta</Btn>
        </div>
      </div>
    </div>
  );
}

function PlanoSection({ data, setData, isLider, usuario = null }) {
  const [aba, setAba] = useState("visao");
  const [faseAberta, setFaseAberta] = useState(null);
  const [editandoFase, setEditandoFase] = useState(null);
  const [alertaModal, setAlertaModal] = useState(false);

  const fases = data.fases || [];
  const sinais = coletarSinaisEstrategicos(data);
  const progressoGeral = progressoGeralJikkai(fases);
  const faseAtual = fases.find(f => f.status === "andamento") || fases.find(f => f.status !== "concluida") || fases[fases.length - 1];
  const objetivos = fases.flatMap(f => (f.objetivos || []).map(o => ({ ...o, faseId: f.id })));
  const concluidos = objetivos.filter(o => o.status === "concluido").length;
  const bloqueados = objetivos.filter(o => o.status === "bloqueado").length;
  const criticos = sinais.filter(s => s.risco === "Crítico").length;
  const operacoesAtivas = (data.missoes || []).filter(m => ["atribuida", "aceita", "andamento", "revisao", "devolvida"].includes(m.status)).length;

  const salvarFase = (faseId, patch) => {
    setData(d => ({
      ...d,
      fases: (d.fases || []).map(f => f.id === faseId ? { ...f, ...patch } : f),
      activityLog: [...(d.activityLog || []), atividade("fase_atualizada", usuario?.username || "lideranca", faseId, "Atualizou a fase " + patch.titulo + " do plano Jikkai")],
    }));
    setEditandoFase(null);
  };

  const criarAlertaManual = (form) => {
    const titulo = form.titulo || "";
    const descricao = form.descricao || "";
    const risco = normalizarRisco(form.risco || "Moderado");
    const faseId = faseAtual?.id || "";
    setData(d => ({
      ...d,
      sinaisEstrategicos: [...(d.sinaisEstrategicos || []), {
        id: "sinal_" + uid(),
        titulo: titulo.trim(),
        descricao: descricao.trim(),
        risco,
        categoria: "Comando",
        fonteTipo: "comando",
        fonteId: "",
        fonteNome: "Decisão do comando",
        faseId,
        objetivoId: "",
        status: "ativo",
        criadoEm: new Date().toISOString(),
        criadoPor: usuario?.username || "lideranca",
      }],
      activityLog: [...(d.activityLog || []), atividade("alerta_estrategico_criado", usuario?.username || "lideranca", faseId || "jikkai", "Criou o alerta estratégico: " + titulo.trim())],
    }));
    setAlertaModal(false);
  };

  const resolverAlertaManual = sinal => {
    if (sinal.fonteTipo !== "comando") return;
    setData(d => ({
      ...d,
      sinaisEstrategicos: (d.sinaisEstrategicos || []).map(s => s.id === sinal.id ? { ...s, status: "resolvido", resolvidoEm: new Date().toISOString() } : s),
      activityLog: [...(d.activityLog || []), atividade("alerta_estrategico_resolvido", usuario?.username || "lideranca", sinal.id, "Resolveu o alerta estratégico: " + sinal.titulo)],
    }));
  };

  const abrirMapa = () => {
    if (typeof window.foxOpenStrategicMap === "function") window.foxOpenStrategicMap();
    else window.location.href = "./mapa.html";
  };
  const tabs = [
    { id: "visao", label: "Visão Geral", icon: ITarget },
    { id: "fases", label: "Fases", icon: IClipboard },
    { id: "riscos", label: "Riscos", icon: IAlert },
    { id: "historico", label: "Histórico", icon: IBook },
  ];

  if (faseAberta) {
    const fase = fases.find(f => f.id === faseAberta);
    if (fase) {
      const responsavelLabel = nomeResponsavelEstrategico(fase.responsavelGeral, data);
      const requisitosAtendidos = (fase.requisitos || []).filter(r => r.atendido).length;
      const sinaisDaFase = sinais.filter(s => s.faseId === fase.id);
      return <div className="fadein space-y-6">
        <button onClick={() => setFaseAberta(null)} className="text-zinc-500 hover:text-orange-400 text-xs uppercase tracking-wider">← Voltar à central de comando</button>
        <div className="p-6 rounded-2xl border border-orange-800/50 bg-gradient-to-br from-red-950/20 to-black">
          <div className="flex items-start justify-between gap-4"><div><div className="text-[10px] uppercase tracking-[0.35em] text-orange-600">Fase {String(fase.n).padStart(2, "0")}</div><h1 className="text-3xl font-black text-orange-50 serif mt-1">{fase.titulo}</h1><p className="text-zinc-400 mt-2 max-w-3xl">{fase.desc}</p></div>{isLider && <Btn onClick={() => setEditandoFase(fase.id)} variant="primary"><IEdit className="w-3 h-3" /> Editar fase</Btn>}</div>
          <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mt-6">
            <div className="p-3 rounded border border-zinc-800 bg-black/40"><div className="text-[9px] uppercase tracking-wider text-zinc-600">Progresso</div><div className="text-2xl font-black text-orange-300 mt-1">{progressoFase(fase)}%</div></div>
            <div className="p-3 rounded border border-zinc-800 bg-black/40"><div className="text-[9px] uppercase tracking-wider text-zinc-600">Risco</div><div className="mt-2"><RiscoBadge risco={fase.riscoGeral} /></div></div>
            <div className="p-3 rounded border border-zinc-800 bg-black/40"><div className="text-[9px] uppercase tracking-wider text-zinc-600">Responsável</div><div className="text-orange-100 font-bold mt-1">{responsavelLabel}</div></div>
            <div className="p-3 rounded border border-zinc-800 bg-black/40"><div className="text-[9px] uppercase tracking-wider text-zinc-600">Prazo</div><div className="text-orange-100 font-bold mt-1">{fase.prazo ? new Date(fase.prazo + "T00:00:00").toLocaleDateString("pt-BR") : "Sem prazo"}</div></div>
          </div>
        </div>

        {sinaisDaFase.length > 0 && <section><div className="text-[9px] uppercase tracking-[0.25em] text-red-500 mb-3">Alertas que afetam esta fase</div><div className="grid lg:grid-cols-2 gap-3">{sinaisDaFase.map(s => <SinalEstrategicoCard key={s.id} sinal={s} data={data} onOpenPhase={setFaseAberta} onOpenMap={abrirMapa} />)}</div></section>}

        <section><div className="text-[9px] uppercase tracking-[0.25em] text-orange-600 mb-3">Objetivos estratégicos</div><div className="space-y-3">{(fase.objetivos || []).map(o => <ObjetivoEstrategicoCard key={o.id} objetivo={o} data={data} isLider={isLider} onEdit={() => setEditandoFase(fase.id)} />)}</div></section>

        {(fase.requisitos || []).length > 0 && <section className="p-4 rounded-xl border border-zinc-800 bg-zinc-950/60"><div className="flex items-center justify-between gap-3 mb-3"><div><div className="text-[9px] uppercase tracking-[0.25em] text-orange-600">Requisitos do selo</div><div className="text-zinc-600 text-xs mt-1">{requisitosAtendidos} de {fase.requisitos.length} atendidos</div></div><div className="text-orange-300 font-black">{fase.requisitos.length ? Math.round(requisitosAtendidos / fase.requisitos.length * 100) : 0}%</div></div><div className="space-y-2">{fase.requisitos.map(r => <div key={r.id} className="flex items-center gap-2 text-sm">{r.atendido ? <ICheck className="w-4 h-4 text-green-500" /> : <ILock className="w-4 h-4 text-zinc-700" />}<span className={r.atendido ? "text-zinc-300" : "text-zinc-600"}>{r.texto}</span></div>)}</div></section>}

        {editandoFase === fase.id && <div className="fixed inset-0 z-[80] overflow-y-auto bg-black/95 p-4 sm:p-8"><div className="max-w-5xl mx-auto bg-zinc-950 border border-orange-700 rounded-xl p-5"><FaseEditor fase={fase} data={data} onCancel={() => setEditandoFase(null)} onSave={patch => salvarFase(fase.id, patch)} /></div></div>}
      </div>;
    }
  }

  return <div className="fadein">
    {isLider && <div className="flex justify-end mb-4"><Btn onClick={() => setAlertaModal(true)} variant="primary"><IAlert className="w-3 h-3" /> Novo alerta</Btn></div>}

    <div className="p-5 rounded-2xl border border-orange-900/40 bg-gradient-to-br from-red-950/20 via-black to-black mb-6">
      <div className="flex flex-col lg:flex-row lg:items-end gap-6"><div className="flex-1"><div className="text-[10px] uppercase tracking-[0.35em] text-orange-600">Plano geral</div><div className="flex items-end gap-3 mt-1"><div className="text-5xl sm:text-6xl font-black text-orange-50 serif leading-none">{progressoGeral}<span className="text-2xl text-orange-600">%</span></div><div className="flex-1 mb-2"><div className="h-3 bg-zinc-900 rounded overflow-hidden"><div className="h-full bg-gradient-to-r from-red-700 to-orange-500" style={{ width: progressoGeral + "%" }} /></div></div></div><div className="text-zinc-500 text-sm mt-2">Fase atual: <strong className="text-orange-200">{faseAtual ? "FASE " + faseAtual.n + " — " + faseAtual.titulo : "Nenhuma fase ativa"}</strong></div></div>

    {aba === "visao" && <div className="space-y-7">

      <section><div className="text-[9px] uppercase tracking-[0.25em] text-orange-600 mb-3">Fases do plano</div><div className="grid lg:grid-cols-2 gap-4">{fases.map(f => <FaseEstrategicaCard key={f.id} fase={f} data={data} isLider={isLider} onOpen={() => setFaseAberta(f.id)} onEdit={() => setEditandoFase(f.id)} />)}</div></section>
    </div>}

    {aba === "fases" && <div className="grid lg:grid-cols-2 gap-4">{fases.map(f => <FaseEstrategicaCard key={f.id} fase={f} data={data} isLider={isLider} onOpen={() => setFaseAberta(f.id)} onEdit={() => setEditandoFase(f.id)} />)}</div>}

    {aba === "riscos" && <div className="space-y-4">{sinais.length ? sinais.map(s => <div key={s.id} className="relative"><SinalEstrategicoCard sinal={s} data={data} onOpenPhase={setFaseAberta} onOpenMap={abrirMapa} />{isLider && s.fonteTipo === "comando" && <button onClick={() => resolverAlertaManual(s)} className="absolute bottom-3 right-3 text-[9px] uppercase tracking-wider text-green-500">Marcar resolvido</button>}</div>) : <div className="p-12 text-center rounded-xl border border-zinc-800 bg-zinc-950/40"><IShield className="w-12 h-12 text-green-700 mx-auto mb-3" /><div className="text-green-400 font-bold">Nenhum alerta ativo</div><div className="text-zinc-600 text-sm mt-1">As fontes integradas não indicam riscos no momento.</div></div>}</div>}

    {aba === "historico" && <div className="space-y-2">{(data.activityLog || []).filter(a => ["fase_atualizada", "alerta_estrategico_criado", "alerta_estrategico_resolvido"].includes(a.tipo)).slice().reverse().map(a => <div key={a.id} className="p-3 rounded border border-zinc-800 bg-zinc-950/50 flex items-start gap-3"><IBook className="w-4 h-4 text-orange-600 mt-0.5" /><div><div className="text-zinc-300 text-sm">{a.descricao}</div><div className="text-[10px] text-zinc-700 mt-1">{a.ator} · {new Date(a.data).toLocaleString("pt-BR")}</div></div></div>)}</div>}

    {alertaModal && <AlertaEstrategicoModal faseAtual={faseAtual} onSave={criarAlertaManual} onClose={() => setAlertaModal(false)} />}
    {editandoFase && (() => { const fase = fases.find(f => f.id === editandoFase); return fase ? <div className="fixed inset-0 z-[80] overflow-y-auto bg-black/95 p-4 sm:p-8"><div className="max-w-5xl mx-auto bg-zinc-950 border border-orange-700 rounded-xl p-5"><FaseEditor fase={fase} data={data} onCancel={() => setEditandoFase(null)} onSave={patch => salvarFase(fase.id, patch)} /></div></div> : null; })()}
  </div>;
}

function JikkaiPage({ data, setData, isLider, usuario, role, viewerIsContratante, navigationRequest }) {
  const [subTab, setSubTab] = useState(viewerIsContratante ? "contratos" : "plano");

  // Se contratante, força sub-aba contratos
  useEffect(() => {
    if (viewerIsContratante && subTab !== "contratos") setSubTab("contratos");
  }, [viewerIsContratante, subTab]);

  useEffect(() => {
    if (viewerIsContratante || navigationRequest?.tab !== "jikkai") return;
    if (["plano", "contratos", "relatorios"].includes(navigationRequest.subTab)) setSubTab(navigationRequest.subTab);
  }, [navigationRequest?.token, viewerIsContratante]);

  const contratosAbertos = (data.contratos || []).filter(c => c.status === "Aberto").length;
  const relatoriosCount = (data.relatorios || []).filter(r => podeVerItemSigiloso(r, data, usuario, role)).length;

  const SUB_TABS = [
    { id: "plano", label: "Plano", icon: ITarget, badge: null },
    { id: "contratos", label: "Contratos", icon: ISwords, badge: contratosAbertos > 0 ? contratosAbertos : null },
    { id: "relatorios", label: "Relatórios", icon: IFile, badge: relatoriosCount > 0 ? relatoriosCount : null },
  ];

  // Modo contratante: pula sub-tabs e renderiza só ContratosSection com header próprio
  if (viewerIsContratante) {
    return <ContratosSection data={data} setData={setData} isLider={isLider} usuario={usuario} role={role} viewerIsContratante={true} navigationRequest={navigationRequest} />;
    return (
      <div>
        <SectionTitle icon={ISwords} sub="Contratos disponíveis para aquisição">Contratos Jikkai</SectionTitle>
        <div className="mb-6 p-4 bg-zinc-950/60 border border-orange-900/30 rounded-lg flex items-start gap-3">
          <IBriefcase className="w-5 h-5 text-orange-500 flex-shrink-0 mt-0.5" />
          <div className="text-sm text-zinc-400 leading-relaxed">
            Esta é a mesa pública de contratos da Jikkai. Solicite um serviço pelo pergaminho guiado, acompanhe o status por aqui e use os detalhes do contrato para negociar termos com a liderança.
          </div>
        </div>
        <ContratosSection data={data} setData={setData} isLider={isLider} usuario={usuario} role={role} viewerIsContratante={true} navigationRequest={navigationRequest} />
      </div>
    );
  }

  return (
    <div>
      <SectionTitle icon={ITarget}>JIKKAI</SectionTitle>

      {/* Sub-navegação */}
      <div className="mb-8 bg-zinc-950/60 border border-zinc-800 rounded-lg p-1 flex gap-1 overflow-x-auto">
        {SUB_TABS.map(t => {
          const I = t.icon;
          const active = subTab === t.id;
          return (
            <button
              key={t.id}
              onClick={() => setSubTab(t.id)}
              className={`flex-1 min-w-[120px] flex items-center justify-center gap-2 px-4 py-2.5 rounded text-xs uppercase tracking-wider font-bold transition-all ${active ? "bg-gradient-to-r from-red-700 to-orange-700 text-white shadow-lg" : "text-zinc-500 hover:text-zinc-300 hover:bg-zinc-900"}`}
            >
              <I className="w-4 h-4" />
              <span>{t.label}</span>
              {t.badge && (
                <span className={`text-[10px] px-1.5 py-0.5 rounded-full font-black ${active ? "bg-black/40 text-white" : "bg-orange-600 text-black"}`}>{t.badge}</span>
              )}
            </button>
          );
        })}
      </div>

      {subTab === "plano" && <PlanoSection data={data} setData={setData} isLider={isLider} usuario={usuario} />}
      {subTab === "contratos" && <ContratosSection data={data} setData={setData} isLider={isLider} usuario={usuario} role={role} viewerIsContratante={false} navigationRequest={navigationRequest} />}
      {subTab === "relatorios" && <RelatoriosSection data={data} setData={setData} isLider={isLider} usuario={usuario} role={role} navigationRequest={navigationRequest} />}
    </div>
  );
}

// ============ ARMAS ============
function ArmasPage({ data, setData, isLider }) {
  const [editando, setEditando] = useState(false);
  const [draft, setDraft] = useState(data.armas);

  useEffect(() => { if (!editando) setDraft(data.armas); }, [data.armas, editando]);

  const salvar = () => { setData(d => ({ ...d, armas: draft.filter(a => a.nome.trim()) })); setEditando(false); };
  const cancelar = () => { setDraft(data.armas); setEditando(false); };
  const updateArma = (i, patch) => setDraft(draft.map((a, idx) => idx === i ? { ...a, ...patch } : a));
  const removeArma = (i) => setDraft(draft.filter((_, idx) => idx !== i));
  const addArma = () => setDraft([...draft, { id: uid(), nome: "Nova Arma", vila: "", dificuldade: "Médio", status: "Não capturada", cor: "#D85A30" }]);

  const toggleCap = (i) => setData(d => ({
    ...d,
    armas: d.armas.map((a, idx) => idx === i ? { ...a, status: a.status === "Capturada" ? "Não capturada" : "Capturada" } : a)
  }));

  const action = isLider && (
    editando ? (
      <div className="flex gap-2">
        <Btn onClick={cancelar} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
        <Btn onClick={salvar} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn>
      </div>
    ) : (
      <Btn onClick={() => setEditando(true)} variant="default"><IEdit className="w-3 h-3" /> Editar Armas</Btn>
    )
  );

  const armas = editando ? draft : data.armas;

  return (
    <div>
      <SectionTitle icon={ISwords} sub="Relíquias lendárias" action={action}>Armas Lendárias</SectionTitle>
      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
        {armas.map((a, i) => {
          const cap = a.status === "Capturada";
          return (
            <div key={a.id || i} className={`rounded-lg border overflow-hidden ${cap ? "border-green-700 bg-green-950/10" : "border-zinc-800 bg-gradient-to-br from-zinc-950 to-black"}`}>
              <div className="p-5 border-b border-zinc-800" style={{ background: `linear-gradient(135deg, ${a.cor}22, transparent)` }}>
                {editando ? (
                  <div className="space-y-2">
                    <input value={a.nome} onChange={(e) => updateArma(i, { nome: e.target.value })} placeholder="Nome" className="fox-input" />
                    <input value={a.vila} onChange={(e) => updateArma(i, { vila: e.target.value })} placeholder="Vila de origem" className="fox-input" />
                    <div className="flex gap-2 items-center">
                      <label className="fox-label mb-0">Cor</label>
                      <input type="color" value={a.cor} onChange={(e) => updateArma(i, { cor: e.target.value })} className="h-8 w-14 rounded bg-transparent border border-zinc-700" />
                      <button onClick={() => { if (confirm(`Remover ${a.nome}?`)) removeArma(i); }} className="mobile-tap col-span-2 sm:col-span-1 sm:ml-auto text-red-300 bg-red-950/80 p-2 rounded flex items-center justify-center"><ITrash className="w-4 h-4" /></button>
                    </div>
                  </div>
                ) : (
                  <>
                    <div className="text-xs uppercase tracking-widest mb-1" style={{ color: a.cor }}>{a.vila}</div>
                    <h3 className="text-2xl font-black text-orange-50 serif">{a.nome}</h3>
                  </>
                )}
              </div>
              <div className="p-5 space-y-3">
                {editando ? (
                  <>
                    <div>
                      <label className="fox-label">Dificuldade</label>
                      <select value={a.dificuldade} onChange={(e) => updateArma(i, { dificuldade: e.target.value })} className="fox-input">
                        <option>Fácil</option><option>Médio</option><option>Difícil</option><option>Impossível</option>
                      </select>
                    </div>
                    <div>
                      <label className="fox-label">Status</label>
                      <select value={a.status} onChange={(e) => updateArma(i, { status: e.target.value })} className="fox-input">
                        <option>Não capturada</option><option>Capturada</option><option>Em custódia de aliado</option><option>Perdida</option>
                      </select>
                    </div>
                  </>
                ) : (
                  <>
                    <div className="flex justify-between text-sm"><span className="text-zinc-500 uppercase tracking-wider text-xs">Dificuldade</span><span className="text-orange-300 font-bold">{a.dificuldade}</span></div>
                    <div className="flex justify-between text-sm"><span className="text-zinc-500 uppercase tracking-wider text-xs">Status</span><span className={`font-bold ${cap ? "text-green-400" : "text-red-400"}`}>{a.status}</span></div>
                    {isLider && <Btn onClick={() => toggleCap(i)} variant={cap ? "danger" : "primary"} className="w-full justify-center mt-2">{cap ? "Marcar como não capturada" : "Marcar como capturada"}</Btn>}
                  </>
                )}
              </div>
            </div>
          );
        })}
        {editando && (
          <button onClick={addArma} className="rounded-lg border-2 border-dashed border-zinc-800 hover:border-orange-700 text-zinc-600 hover:text-orange-500 py-16 flex flex-col items-center gap-2 transition-colors">
            <IPlus className="w-8 h-8" />
            <span className="uppercase tracking-wider text-xs font-bold">Nova Arma</span>
          </button>
        )}
      </div>
    </div>
  );
}

function buildStorageKey(usuario) {
  return `${BUILD_STORAGE_PREFIX}:${usuario?.username || "local"}`;
}
function buildClampInt(value, max = 999) {
  const n = Number(String(value ?? "").replace(/\D/g, ""));
  if (!Number.isFinite(n)) return 0;
  return Math.max(0, Math.min(Math.floor(n), max));
}
function buildBaseLevelForRank(rank) {
  return Number(rank?.pointLevelCap) || Math.floor((Number(rank?.maxAttributePoints) || 0) / BUILD_POINTS_PER_LEVEL) || 1;
}
function buildDefaultLevel(usuario, rankId = "genin") {
  const userLevel = buildClampInt(usuario?.level, 999);
  if (userLevel > 0) return userLevel;
  const rank = BUILD_RANKS.find(r => r.id === rankId) || BUILD_RANKS[0];
  return buildBaseLevelForRank(rank);
}
function buildLevelValue(build, rank, usuario) {
  const level = buildClampInt(build?.level ?? usuario?.level ?? buildBaseLevelForRank(rank), 999);
  return Math.max(1, level);
}
function buildEarnedAttributePoints(build, rank, usuario) {
  return buildLevelValue(build, rank, usuario) * BUILD_POINTS_PER_LEVEL + Number(rank?.bonusAttributePoints || 0);
}
function buildMaxAttributePoints(build, rank, usuario) {
  const earned = buildEarnedAttributePoints(build, rank, usuario);
  const rankCap = Number(rank?.maxAttributePoints) || earned;
  return Math.max(0, Math.min(earned, rankCap));
}
function buildLockedAttributePoints(build, rank, usuario) {
  return Math.max(0, buildEarnedAttributePoints(build, rank, usuario) - buildMaxAttributePoints(build, rank, usuario));
}
function createDefaultBuild(usuario) {
  return {
    name: usuario?.nomeRP || usuario?.displayName || "Novo shinobi",
    rankId: "genin",
    level: buildDefaultLevel(usuario, "genin"),
    lineageId: "uchiha",
    elementId: "fire",
    attributes: { ...BUILD_ZERO_ATTRS },
    training: { ...BUILD_ZERO_TRAINING },
    equipments: { weaponId: "", equipment1Id: "", equipment2Id: "", bandanaId: "", ninjaToolId: "" },
    generalSkillIds: ["kage-bunshin", "rasengan", "kiru-no-chakra", ""],
    buffSkillIds: [],
    skillLevels: {},
  };
}
function normalizeBuild(raw, usuario) {
  const fallback = createDefaultBuild(usuario);
  const base = raw && typeof raw === "object" ? raw : {};
  const rankId = base.rankId || fallback.rankId;
  return {
    ...fallback,
    ...base,
    rankId,
    level: buildClampInt(base.level ?? buildDefaultLevel(usuario, rankId), 999),
    attributes: { ...fallback.attributes, ...(base.attributes || {}) },
    training: { ...fallback.training, ...(base.training || {}) },
    equipments: { ...fallback.equipments, ...(base.equipments || {}) },
    generalSkillIds: Array.isArray(base.generalSkillIds) ? [...base.generalSkillIds, "", "", "", ""].slice(0, 4) : fallback.generalSkillIds,
    buffSkillIds: Array.isArray(base.buffSkillIds) ? base.buffSkillIds : [],
    skillLevels: { ...(base.skillLevels || {}) },
  };
}
function buildHasMeaningfulData(raw, usuario) {
  if (!raw || typeof raw !== "object") return false;
  const build = normalizeBuild(raw, usuario);
  const fallback = createDefaultBuild(usuario);
  const trainingTotal = BUILD_COMBAT_ATTRS.reduce((sum, attr) => sum + Number(build.training?.[attr] || 0), 0);
  const hasEquipment = Object.values(build.equipments || {}).some(Boolean);
  const hasIdentityChange =
    build.name !== fallback.name ||
    build.rankId !== fallback.rankId ||
    Number(build.level || 0) !== Number(fallback.level || 0) ||
    build.lineageId !== fallback.lineageId ||
    build.elementId !== fallback.elementId;
  return buildDistributedPoints(build) > 0 || trainingTotal > 0 || hasEquipment || hasIdentityChange;
}
function buildPointValue(attr, value) {
  return (attr === "vida" || attr === "chakra") ? Number(value || 0) * 10 : Number(value || 0);
}
function buildDistributedPoints(build) {
  return BUILD_ATTR_IDS.reduce((sum, attr) => sum + Number(build.attributes?.[attr] || 0), 0);
}
function buildEquipmentStats(equipments) {
  const total = { ...BUILD_ZERO_ATTRS };
  Object.values(equipments || {}).filter(Boolean).forEach(id => {
    const item = BUILD_EQUIPMENTS.find(e => e.id === id);
    Object.entries(item?.stats || {}).forEach(([attr, value]) => { total[attr] += buildPointValue(attr, value); });
  });
  return total;
}
function buildActiveBuffs(build) {
  const all = [...BUILD_BUFF_SKILLS, ...(BUILD_LINEAGE_BUFFS[build.lineageId] || [])];
  return all.filter(skill => (build.buffSkillIds || []).includes(skill.id));
}
function buildFinalStats(build, rank) {
  const stats = { ...rank.baseStats };
  const percent = {};
  BUILD_ATTR_IDS.forEach(attr => { stats[attr] += buildPointValue(attr, build.attributes?.[attr] || 0); });
  BUILD_COMBAT_ATTRS.forEach(attr => { stats[attr] += Number(build.training?.[attr] || 0); });
  const equipmentStats = buildEquipmentStats(build.equipments);
  BUILD_ATTR_IDS.forEach(attr => { stats[attr] += Number(equipmentStats[attr] || 0); });
  buildActiveBuffs(build).forEach(skill => {
    (skill.effects || []).forEach(effect => {
      Object.entries(effect.stats || {}).forEach(([attr, value]) => { stats[attr] += Number(value || 0); });
      Object.entries(effect.percentStats || {}).forEach(([attr, value]) => { percent[attr] = (percent[attr] || 0) + Number(value || 0); });
      const level = build.skillLevels?.[skill.id];
      const chosenLevel = (effect.levels || []).find(l => l.level === Number(level)) || (effect.levels || [])[0];
      Object.entries(chosenLevel?.stats || {}).forEach(([attr, value]) => { stats[attr] += Number(value || 0); });
      Object.entries(chosenLevel?.percentStats || {}).forEach(([attr, value]) => { percent[attr] = (percent[attr] || 0) + Number(value || 0); });
    });
  });
  Object.entries(percent).forEach(([attr, value]) => { stats[attr] = Math.round(stats[attr] * (1 + Number(value || 0) / 100)); });
  return stats;
}
function buildLineagePrimaryForKageBunshin(lineageId) {
  return lineageId === "yuuhi" ? "genjutsu" : "taijutsu";
}
function buildSkillDamage(skill, finalStats, lineageId) {
  if (!skill || skill.baseDamage === undefined) return null;
  const attr = skill.usesLineagePrimary ? buildLineagePrimaryForKageBunshin(lineageId) : skill.scalingAttribute;
  const base = Number(skill.baseDamage || 0);
  const scale = Number(skill.scalingPercent || 0);
  return { attr, value: Math.round(base + Number(finalStats[attr] || 0) * scale), base, scale };
}
function buildEquipmentOptions(slot, build) {
  const type = slot === "bandanaId" ? "accessory" : "equipment";
  const otherSlot = slot === "equipment1Id" ? "equipment2Id" : slot === "equipment2Id" ? "equipment1Id" : "";
  const otherId = otherSlot ? build.equipments?.[otherSlot] : "";
  const otherIsHat = otherId && (otherId === "hat" || otherId.endsWith("-hat"));
  return BUILD_EQUIPMENTS.filter(item => {
    if (item.type !== type) return false;
    if (otherId && item.id === otherId) return false;
    if (otherIsHat && (item.id === "hat" || item.id.endsWith("-hat"))) return false;
    return true;
  });
}
function BuildStepper({ label, value, max, onChange, disabled = false }) {
  const current = Number(value || 0);
  const set = (next) => onChange(buildClampInt(next, max));
  return (
    <div className="grid grid-cols-[34px_minmax(0,1fr)_34px] h-10 rounded-md border border-zinc-800 bg-black/50 overflow-hidden">
      <button type="button" aria-label={`Diminuir ${label}`} disabled={disabled || current <= 0} onClick={() => set(current - 1)} className="mobile-tap border-r border-zinc-800 text-zinc-500 disabled:opacity-30 hover:text-orange-300">-</button>
      <input aria-label={label} type="number" min="0" max={max} value={current} onChange={e => set(e.target.value)} disabled={disabled} className="bg-transparent text-center text-sm font-black text-orange-50 outline-none disabled:text-zinc-700" />
      <button type="button" aria-label={`Aumentar ${label}`} disabled={disabled || current >= max} onClick={() => set(current + 1)} className="mobile-tap border-l border-zinc-800 text-zinc-500 disabled:opacity-30 hover:text-orange-300">+</button>
    </div>
  );
}

    const current = buildDistributedPoints(b);
    const autoRank = BUILD_RANKS.find(r => r.id === b.rankId) || BUILD_RANKS[0];
    let left = Math.max(0, buildMaxAttributePoints(b, autoRank, usuario) - current);
    if (!left) return b;
    const attributes = { ...b.attributes };
    const base = Math.floor(left / BUILD_ATTR_IDS.length);
    let rest = left % BUILD_ATTR_IDS.length;

      `Linhagem: ${lineage.name} | Elemento: ${element.name}`,

function normalizarFraseRitual(valor) {
  return String(valor || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function distanciaLevenshtein(a, b) {
  const anterior = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let diagonal = anterior[0];
    anterior[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const acima = anterior[j];
      anterior[j] = Math.min(
        anterior[j] + 1,
        anterior[j - 1] + 1,
        diagonal + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
      diagonal = acima;
    }
  }
  return anterior[b.length];
}

function fraseJuramentoAceita(valor) {
  const digitada = normalizarFraseRitual(valor);
  const alvo = normalizarFraseRitual(FRASE_JURAMENTO);
  if (!digitada) return false;
  if (digitada === alvo) return true;

  const variacoes = [
    FRASE_JURAMENTO,
    "Que o meu próprio sangue queime, que as correntes da minha alma me esmaguem se eu trair este juramento",
    "Que meu próprio sangue queime, que as correntes da minha alma me esmaguem se eu trair esse juramento",
    "Que meu próprio sangue queime e que as correntes da minha alma me esmaguem se eu trair este juramento",
    "Que meu próprio sangue queime, que as correntes da minha alma me esmaguem caso eu traia este juramento",
  ].map(normalizarFraseRitual);
  if (variacoes.includes(digitada)) return true;

  const distancia = distanciaLevenshtein(digitada, alvo);
  const similaridade = 1 - distancia / Math.max(alvo.length, digitada.length, 1);
  const palavrasObrigatorias = ["sangue", "queime", "correntes", "alma", "esmaguem", "trair", "juramento"];
  const presentes = palavrasObrigatorias.filter(palavra => digitada.includes(palavra)).length;
  return similaridade >= 0.88 || (presentes >= 6 && digitada.length >= alvo.length * 0.75);
}

  });

  const [selando, setSelando] = useState(false);

  useEffect(() => { setAceitos(new Array(mandamentos.length).fill(false)); }, [mandamentos.length]);

  const escolherFoto = (e) => {
    const file = e.target.files?.[0];
    setFotoErro("");
    if (!file) return;
    if (!file.type.startsWith("image/")) { setFotoErro("Escolha uma imagem JPG, PNG ou WEBP."); return; }
    if (file.size > 6 * 1024 * 1024) { setFotoErro("A imagem deve ter no máximo 6 MB."); return; }
    const reader = new FileReader();
    reader.onerror = () => setFotoErro("Não foi possível ler a imagem.");
    reader.onload = () => {
      const imagem = new Image();
      imagem.onerror = () => setFotoErro("A imagem não pôde ser processada.");
      imagem.onload = () => {
        const limite = 960;
        const escala = Math.min(1, limite / Math.max(imagem.naturalWidth, imagem.naturalHeight));
        const largura = Math.max(1, Math.round(imagem.naturalWidth * escala));
        const altura = Math.max(1, Math.round(imagem.naturalHeight * escala));
        const canvas = document.createElement("canvas");
        canvas.width = largura;
        canvas.height = altura;
        const ctx = canvas.getContext("2d");
        if (!ctx) { setFotoErro("Seu navegador não conseguiu preparar a imagem."); return; }
        ctx.drawImage(imagem, 0, 0, largura, altura);
        setFotoUrl(canvas.toDataURL("image/jpeg", 0.78));
      };
      imagem.src = reader.result;
    };
    reader.readAsDataURL(file);
  };

              <input ref={fotoRef} type="file" accept="image/jpeg,image/png,image/webp" onChange={escolherFoto} className="hidden" />

              {!fotoUrl && <div className="py-8 text-center text-zinc-700 text-xs italic border border-dashed border-zinc-800 rounded">Você poderá concluir o juramento sem anexar uma imagem.</div>}

      {step === 3 && (

            <p className="text-zinc-400 text-sm mb-5">Antes de selar o pacto, vincule sua marca do Discord. O ID ficará gravado no dossiê para chamados futuros da Jikkai.</p>

            <p className="text-zinc-400 text-sm mb-6">Depois, digite a frase abaixo. Pequenos erros de acentuação, pontuação ou digitação são tolerados:</p>

            <input value={fraseTypo} onChange={(e) => setFraseTypo(e.target.value)} className="fox-input text-center text-lg" placeholder="Digite a frase..." autoFocus />
            {fraseTypo && !fraseOk && <div className="text-red-500 text-xs mt-2">A frase ainda está diferente demais do juramento.</div>}
            {!discordOk && <div className="text-indigo-300 text-xs mt-3 uppercase tracking-wider font-bold">Vincule o Discord para liberar o selo final.</div>}

        </div>
      )}
    </div>
  );
}

function IntroducaoEstruturaAtual({ data, usuario }) {
  const membros = (data.users || []).filter(u => u.role !== "contratante" && u.status !== "Oculto");
  const roleOf = u => (data.roles || []).find(r => r.id === u.role);
  const posOf = u => estruturaPosicaoRole(roleOf(u));
  const lideranca = membros.filter(u => posOf(u) === "lider");
  const conselheiros = membros.filter(u => posOf(u) === "conselheiro");
  return (
    <div className="space-y-7">
      <div className="text-center"><div className="text-[10px] uppercase tracking-[0.35em] text-orange-600">Estrutura atual</div><h3 className="text-2xl font-black text-orange-50 serif mt-1">A hierarquia que recebe você</h3><p className="text-zinc-500 text-sm mt-2">Os registros são carregados dos cargos e ramos atuais da Jikkai.</p></div>
      <div className="relative min-h-[230px] sm:min-h-[210px] max-w-4xl mx-auto">
        <div className="text-center text-[9px] uppercase tracking-[0.3em] text-red-600 mb-3">Liderança</div>
        <div className="flex flex-wrap justify-center gap-3">{lideranca.map(u => <div key={u.username} className="w-40 p-3 rounded-xl border border-orange-600 bg-gradient-to-b from-red-950/40 to-black text-center"><MemberAvatar user={u} size="lg" className="mx-auto mb-2" /><div className="text-orange-50 font-black truncate">{getCodinome(u)}</div><div className="text-[9px] uppercase tracking-wider text-orange-600">{u.patente || roleOf(u)?.nome}</div></div>)}</div>
        <div className="mt-5 sm:mt-0 sm:absolute sm:right-0 sm:top-14"><div className="text-center text-[9px] uppercase tracking-[0.3em] text-orange-700 mb-3">Conselheiro</div><div className="flex flex-wrap justify-center gap-3">{conselheiros.length ? conselheiros.map(u => <div key={u.username} className="w-36 p-3 rounded-xl border border-zinc-800 bg-zinc-950/70 text-center"><MemberAvatar user={u} size="md" className="mx-auto mb-2" /><div className="text-orange-50 font-bold truncate">{getCodinome(u)}</div><div className="text-[9px] uppercase tracking-wider text-zinc-600">{u.patente || roleOf(u)?.nome || "Conselheiro"}</div></div>) : <div className="w-36 p-3 rounded-xl border border-dashed border-zinc-800 text-center text-zinc-700 text-xs italic">Não designado</div>}</div></div>
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        {(data.clas || []).map(ramo => {
          const integrantes = membros.filter(u => u.cla === ramo.id && !["lider", "conselheiro", "oculto", "fora"].includes(posOf(u)));
          const capitaes = integrantes.filter(u => posOf(u) === "capitao_ramo");
          const operadores = integrantes.filter(u => posOf(u) !== "capitao_ramo");

        })}
