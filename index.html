  );
}

function IntroducaoPrimeiroAcesso({ data, usuario, juramentado, juramentar, onAtualizarPerfil, onConcluir, onLogout }) {
  const [etapa, setEtapa] = useState(0);
  const [avatarErro, setAvatarErro] = useState("");
  const [avatarStatus, setAvatarStatus] = useState("");
  const avatarInputRef = useRef();
  const escolherAvatarIniciacao = (e) => {
    const arquivo = e.target.files?.[0];
    setAvatarErro("");
    setAvatarStatus("");
    if (!arquivo) return;
    if (!arquivo.type.startsWith("image/")) {
      setAvatarErro("Escolha uma imagem JPG, PNG ou WEBP.");
      return;
    }
    if (arquivo.size > 6 * 1024 * 1024) {
      setAvatarErro("A imagem deve ter no máximo 6 MB.");
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => setAvatarErro("Não foi possível ler a imagem.");
    reader.onload = () => {
      const imagem = new Image();
      imagem.onerror = () => setAvatarErro("A imagem não pôde ser processada.");
      imagem.onload = () => {
        const lado = Math.min(imagem.naturalWidth, imagem.naturalHeight);
        const sx = Math.max(0, (imagem.naturalWidth - lado) / 2);
        const sy = Math.max(0, (imagem.naturalHeight - lado) / 2);
        const tamanho = 384;
        const canvas = document.createElement("canvas");
        canvas.width = tamanho;
        canvas.height = tamanho;
        const ctx = canvas.getContext("2d");
        if (!ctx) {
          setAvatarErro("Seu navegador não conseguiu preparar a imagem.");
          return;
        }
        ctx.drawImage(imagem, sx, sy, lado, lado, 0, 0, tamanho, tamanho);
        onAtualizarPerfil?.({
          avatarUrl: canvas.toDataURL("image/jpeg", 0.82),
          avatarStoragePath: "",
        });
        setAvatarStatus("Foto registrada no seu dossiê.");
      };
      imagem.src = reader.result;
    };
    reader.readAsDataURL(arquivo);
  };
  const ramo = (data.clas || []).find(c => c.id === usuario.cla);
  const cargo = (data.roles || []).find(r => r.id === usuario.role);
  const recrutador = (data.users || []).find(u => u.username === usuario.criadoPor);
  const total = 6;
  const avancar = () => setEtapa(v => Math.min(total - 1, v + 1));
  const voltar = () => setEtapa(v => Math.max(0, v - 1));

  return (
    <div className="min-h-screen bg-black text-zinc-200 relative overflow-hidden">
      <div className="fixed inset-0 opacity-25 pointer-events-none" style={{ backgroundImage: "radial-gradient(circle at 20% 15%, #7C2D12 0%, transparent 38%), radial-gradient(circle at 80% 80%, #C2410C 0%, transparent 36%)" }} />
      <div className="relative max-w-5xl mx-auto px-4 py-6 sm:py-10">
        <div className="flex items-center justify-between gap-3 mb-6"><div><div className="text-[9px] uppercase tracking-[0.4em] text-orange-600">Protocolo de iniciação</div><div className="text-orange-50 font-black serif text-xl">JIKKAI · F.O.X.</div></div><button onClick={onLogout} className="flex items-center gap-2 text-zinc-600 hover:text-red-400 text-xs uppercase tracking-wider"><ILogout className="w-4 h-4" /> Sair</button></div>
        <div className="flex gap-1 mb-6">{Array.from({ length: total }).map((_, i) => <div key={i} className={"h-1 flex-1 rounded " + (i <= etapa ? "bg-gradient-to-r from-red-700 to-orange-600" : "bg-zinc-900")} />)}</div>

        <div className="rounded-2xl border border-orange-900/50 bg-zinc-950/85 backdrop-blur p-5 sm:p-8 shadow-2xl">
          {etapa === 0 && (
            <div className="fadein text-center">
              <div className="text-[10px] uppercase tracking-[0.35em] text-orange-600 mb-3">Identidade reconhecida</div>
              <MemberAvatar user={usuario} size="xl" className="mx-auto mb-4" />
              <input ref={avatarInputRef} type="file" accept="image/jpeg,image/png,image/webp" onChange={escolherAvatarIniciacao} className="hidden" />
              <Btn onClick={() => avatarInputRef.current?.click()} variant="ghost" className="mx-auto">
                <IUpload className="w-3 h-3" /> {usuario.avatarUrl ? "Trocar foto" : "Adicionar foto"}
              </Btn>
              <div className="text-zinc-600 text-[10px] mt-2">Opcional · recorte quadrado automático · até 6 MB</div>
              {avatarStatus && <div className="text-green-400 text-xs mt-2">{avatarStatus}</div>}
              {avatarErro && <div className="text-red-400 text-xs mt-2">{avatarErro}</div>}
              <h1 className="text-4xl font-black text-orange-50 serif mt-5">{getCodinome(usuario)}</h1>
              <div className="text-zinc-500 italic mt-1">{usuario.nomeRP || usuario.displayName}</div>
              <div className="grid sm:grid-cols-2 gap-3 max-w-2xl mx-auto mt-7 text-left">
                {[
                  ["Ramo", ramo?.nome || "Aguardando designação"],
                  ["Patente", usuario.patente || "Recruta em Observação"],
                  ["Selo de acesso", "Nível " + (usuario.nivelAcesso || 1)],
                  ["Responsável pelo ingresso", recrutador ? getCodinome(recrutador) : "Comando da Jikkai"],
                ].map(([l, v]) => <div key={l} className="p-3 rounded-lg border border-zinc-800 bg-black/40"><div className="text-[9px] uppercase tracking-wider text-orange-700">{l}</div><div className="text-zinc-200 text-sm mt-1">{v}</div></div>)}
              </div>
              <p className="text-zinc-500 text-sm max-w-xl mx-auto mt-6">Seu selo foi reconhecido. Antes de entrar no portal, você conhecerá a organização, sua estrutura e as responsabilidades que assumirá.</p>
              <div className="mt-7"><Btn onClick={avancar} variant="primary" size="lg">Confirmar identidade</Btn></div>
            </div>
          )}

          {etapa === 1 && <div className="fadein"><div className="text-center mb-7"><IFlame className="w-16 h-16 text-orange-500 mx-auto mb-3 pulse-fire" /><div className="text-[10px] uppercase tracking-[0.35em] text-orange-600">Introdução</div><h2 className="text-3xl font-black text-orange-50 serif mt-1">O que é a Jikkai</h2></div><div className="max-w-3xl mx-auto space-y-4 text-zinc-300 leading-relaxed"><p>A <strong className="text-orange-400">Jikkai</strong> é a estrutura estratégica responsável por preservar a ordem, conduzir operações e manter vivo o legado da F.O.X.</p><p>Ela reúne liderança, conselho, ramos, divisões e células operacionais. Cada integrante possui uma função, um selo de acesso e responsabilidade sobre aquilo que conhece e executa.</p><div className="p-5 border-l-4 border-orange-600 bg-orange-950/10 italic text-orange-100">À espreita nas trevas, manter a ordem. Nós somos sombras, entretanto mostramos o caminho.</div><p>Entrar não significa apenas receber uma conta. Significa ocupar uma posição registrada dentro da organização.</p></div><div className="flex gap-2 mt-8"><Btn onClick={voltar} variant="ghost">Voltar</Btn><Btn onClick={avancar} variant="primary" className="flex-1 justify-center">Conhecer a estrutura</Btn></div></div>}

          {etapa === 2 && <div className="fadein"><IntroducaoEstruturaAtual data={data} usuario={usuario} /><div className="flex gap-2 mt-8"><Btn onClick={voltar} variant="ghost">Voltar</Btn><Btn onClick={avancar} variant="primary" className="flex-1 justify-center">Entendi meu lugar</Btn></div></div>}

          {etapa === 3 && <div className="fadein"><div className="text-center mb-7"><IShield className="w-14 h-14 text-orange-500 mx-auto mb-3" /><div className="text-[10px] uppercase tracking-[0.35em] text-orange-600">Conduta</div><h2 className="text-3xl font-black text-orange-50 serif mt-1">O peso do seu selo</h2></div><div className="grid sm:grid-cols-2 gap-4 max-w-3xl mx-auto">{[["Respeitar a hierarquia","Ordens, decisões e conflitos seguem a cadeia de comando registrada."],["Preservar informações","Pergaminhos internos não devem ser levados para fora da organização sem autorização."],["Responder pelos próprios atos","Toda ação realizada em nome da Jikkai possui consequências no RP."],["Registrar acontecimentos","Missões, relatórios e fatos relevantes mantêm a história oficial viva."],["Não usar o nome sem autorização","A reputação da Jikkai não pode ser empenhada em decisões pessoais."],["Honrar o pacto","O juramento formaliza sua entrada e sua lealdade interna."]].map(([t,d]) => <div key={t} className="p-4 rounded-lg border border-zinc-800 bg-black/40"><div className="text-orange-300 font-bold text-sm">{t}</div><p className="text-zinc-500 text-xs leading-relaxed mt-2">{d}</p></div>)}</div><div className="flex gap-2 mt-8"><Btn onClick={voltar} variant="ghost">Voltar</Btn><Btn onClick={avancar} variant="primary" className="flex-1 justify-center">Prosseguir ao juramento</Btn></div></div>}

          {etapa === 4 && <div className="fadein">{juramentado ? <div className="space-y-5"><div className="p-4 rounded-lg border border-green-900/50 bg-green-950/10 flex items-start gap-3"><ICheck className="w-5 h-5 text-green-500 mt-0.5" /><div><div className="text-green-300 font-bold">Juramento anterior localizado</div><p className="text-zinc-500 text-sm mt-1">Seu registro foi preservado. Não será necessário repetir o pacto.</p></div></div><JuramentadoView juramentado={juramentado} modoIniciacao /><div className="flex gap-2"><Btn onClick={voltar} variant="ghost">Voltar</Btn><Btn onClick={() => setEtapa(5)} variant="primary" className="flex-1 justify-center">Validar registro e continuar</Btn></div></div> : <JuramentoPage usuario={usuario} juramentado={null} juramentar={juramentar} data={data} modoIniciacao onConcluido={() => setEtapa(5)} />}</div>}

          {etapa === 5 && <div className="fadein text-center py-5"><ICheck className="w-20 h-20 text-green-500 mx-auto mb-5" /><div className="text-[10px] uppercase tracking-[0.4em] text-green-600">Iniciação concluída</div><h2 className="text-4xl font-black text-orange-50 serif mt-2">Seu registro está ativo</h2><p className="text-zinc-400 max-w-xl mx-auto mt-4 leading-relaxed">Você conhece a Jikkai, reconhece sua estrutura e possui um juramento selado. Apresente-se ao responsável pelo seu ingresso e aguarde sua primeira designação.</p><div className="mt-7 p-4 rounded-lg border border-orange-900/40 bg-orange-950/10 max-w-md mx-auto"><div className="text-[9px] uppercase tracking-wider text-orange-700">Status</div><div className="text-orange-300 font-black mt-1">MEMBRO INICIADO · SELO NÍVEL {usuario.nivelAcesso || 1}</div></div><div className="mt-8"><Btn onClick={onConcluir} variant="primary" size="lg"><ILock className="w-4 h-4" /> Entrar pelo selo</Btn></div></div>}
        </div>

function RegistroJuramentosManager({ data, setData, usuario }) {
  const [busca, setBusca] = useState("");
  const registros = (data.juramentados || []).map((j, index) => ({ j, index })).filter(({ j }) => {
    const termo = busca.trim().toLowerCase();
    return !termo || [j.nome, j.username, j.linhagem, j.elemento].some(v => String(v || "").toLowerCase().includes(termo));
  }).sort((a, b) => new Date(b.j.data || 0) - new Date(a.j.data || 0));
  const remover = (registro) => {
    if (!confirm("Remover o juramento de " + registro.nome + "? O membro continuará existindo no portal.")) return;
    setData(d => ({ ...d, juramentados: (d.juramentados || []).filter((_, i) => i !== registro.__index), activityLog: [...(d.activityLog || []), atividade("juramento_removido", usuario?.username, registro.username, "Removeu o registro de juramento de " + registro.nome)] }));
  };
  const reabrir = username => {
    if (!username || !confirm("Reabrir a introdução de primeiro acesso para este membro? O juramento atual será preservado.")) return;
    setData(d => ({ ...d, users: d.users.map(u => u.username === username ? { ...u, iniciacaoStatus: "pendente", iniciacaoReabertaEm: new Date().toISOString() } : u), activityLog: [...(d.activityLog || []), atividade("iniciacao_reaberta", usuario?.username, username, "Reabriu o protocolo de iniciação")]}));
  };
  return (
    <div className="space-y-5">
      <div><h3 className="text-orange-50 font-bold text-lg serif">Arquivo de Juramentos ({(data.juramentados || []).length})</h3><p className="text-zinc-600 text-xs mt-1">Visão exclusiva da liderança. Os membros continuam vendo apenas o próprio registro.</p></div>
      <input value={busca} onChange={e => setBusca(e.target.value)} className="fox-input" placeholder="Buscar por nome, usuário, linhagem ou elemento" />
      <div className="grid md:grid-cols-2 gap-4">
        {registros.map(({ j, index }) => {
          const membro = data.users.find(u => u.username === j.username) || usuarioPorIdentidade(data.users, j.nome);
          const registro = { ...j, __index: index };
          return <div key={j.id || index} className="rounded-xl overflow-hidden border border-orange-900/40 bg-zinc-950/70">{j.fotoUrl && <img src={j.fotoUrl} alt="Registro visual" className="w-full h-44 object-cover border-b border-orange-900/30" />}<div className="p-4"><div className="flex items-start justify-between gap-3"><div><div className="text-orange-50 font-black">{j.nome}</div><div className="text-zinc-600 text-xs">@{j.username || membro?.username || "registro-legado"} · {new Date(j.data).toLocaleDateString("pt-BR")}</div></div><span className="text-[9px] uppercase tracking-wider px-2 py-1 rounded border border-orange-900 text-orange-500">v{j.versao || 1}</span></div><div className="text-zinc-500 text-xs mt-3">{j.linhagem || "Sem linhagem"} · {j.elemento || "Sem elemento"}</div>{j.motivacao && <p className="text-zinc-400 italic text-sm mt-3 line-clamp-3">“{j.motivacao}”</p>}<div className="flex gap-2 mt-4 pt-3 border-t border-zinc-800">{membro && <Btn onClick={() => reabrir(membro.username)} variant="ghost" className="text-[10px]">Refazer introdução</Btn>}<Btn onClick={() => remover(registro)} variant="danger" className="ml-auto"><ITrash className="w-3 h-3" /> Remover</Btn></div></div></div>;
        })}
      </div>
      {registros.length === 0 && <div className="p-8 text-center rounded-lg border border-zinc-800 text-zinc-600 italic">Nenhum juramento encontrado.</div>}
    </div>
  );
}

function MinhasMissoesPage({ data, setData, usuario, role, onNavigate, navigationRequest }) {
  const [filtro, setFiltro] = useState("Ativas");
  const [relatorioMissao, setRelatorioMissao] = useState(null);
  const [destaqueMissaoId, setDestaqueMissaoId] = useState("");


  const todasMinhas = (data.missoes || [])
    .filter(m => usuarioParticipaMissao(m, usuario.username))
    .slice()
    .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  const ativas = todasMinhas.filter(m => !MISSAO_STATUS_TERMINAIS.includes(m.status));
  const encerradas = todasMinhas.filter(m => MISSAO_STATUS_TERMINAIS.includes(m.status));
  const minhas = filtro === "Ativas" ? ativas : filtro === "Encerradas" ? encerradas : todasMinhas;

  useEffect(() => {
    if (navigationRequest?.tab !== "missoes") return;
    const action = String(navigationRequest.action || "");
    const id = action.split(":")[1];
    if (!id) return;
    const alvo = (data.missoes || []).find(m => m.id === id && usuarioParticipaMissao(m, usuario.username));
    if (!alvo) return;
    setFiltro("Ativas");
    setDestaqueMissaoId(id);
    if (action.startsWith("relatorio-missao:")) setRelatorioMissao(alvo);
    setTimeout(() => {
      try { document.getElementById("missao-" + id)?.scrollIntoView({ behavior: "smooth", block: "center" }); } catch {}
    }, 80);
  }, [navigationRequest?.token]);

  const updateMissao = (id, patch) => setData(d => ({
    ...d,
    missoes: d.missoes.map(m => m.id === id ? { ...m, ...patch, updatedAt: new Date().toISOString() } : m),
  }));

  const toggleObj = (id, oi) => {
    const m = data.missoes.find(x => x.id === id);
    const objetivos = m.objetivos || [];
    updateMissao(id, { objetivos: objetivos.map((o, idx) => idx === oi ? { ...o, done: !o.done } : o) });
  };

  const confirmarParticipacao = (m) => {
    const participantes = participantesDaMissao(m);
    const aceites = Array.from(new Set([...(m.aceites || []), usuario.username]));
    const todosAceitaram = participantes.every(p => aceites.includes(p));
    updateMissao(m.id, {
      aceites,
      status: todosAceitaram ? "aceita" : "atribuida",
      acceptedAt: todosAceitaram ? new Date().toISOString() : m.acceptedAt,
    });
  };

  const recusarParticipacao = (m) => {
    if (!confirm(`Recusar a missão "${m.titulo}"? A liderança será informada pelo status da operação.`)) return;
    updateMissao(m.id, {
      status: "recusada",
      recusadaPor: usuario.username,
      recusadaEm: new Date().toISOString(),
    });
  };

  const iniciarMissao = (m) => updateMissao(m.id, {
    status: "andamento",
    startedAt: m.startedAt || new Date().toISOString(),
    feedbackRevisao: "",
  });

  const enviarRelatorio = (form) => {
    const m = relatorioMissao;
    if (!m) return;
    const relatorioId = uid();
    const novoRelatorio = {
      id: relatorioId,
      titulo: `[Operação] ${m.titulo}`,
      local: m.local || "",
      descricao: form.descricao,
      resumo: form.resumo,
      resultado: form.resultado,
      evidencias: form.evidencias,
      confidencialidade: normalizarSigilo(m.sigilo || "Restrito"),
      tipo: "Relatório de missão",
      statusAprovacao: "Pendente",
      missaoId: m.id,
      contratoId: m.contratoId || null,
      autorUsername: usuario.username,
      autorNome: usuario.displayName || usuario.codinome || usuario.username,
      data: new Date().toISOString(),
    };
    setData(d => ({
      ...d,
      relatorios: [...(d.relatorios || []), novoRelatorio],
      missoes: d.missoes.map(x => x.id === m.id ? {
        ...x,
        status: "revisao",
        relatorioFinalId: relatorioId,
        enviadoRevisaoEm: new Date().toISOString(),
        feedbackRevisao: "",
        updatedAt: new Date().toISOString(),
      } : x),
    }));
    setRelatorioMissao(null);
  };

  if (todasMinhas.length === 0) {
    return (
      <div>
        <div className="p-8 text-center bg-zinc-950/50 border border-zinc-800 rounded-lg">
          <IClipboard className="w-12 h-12 text-zinc-700 mx-auto mb-3" />
          <p className="text-zinc-500">Nenhuma missão atribuída no momento.</p>
          <p className="text-zinc-700 text-xs italic mt-2">Aguarde designação da liderança, conselheiro ou capitão da divisão.</p>
          <p className="text-purple-400 text-xs mt-3 max-w-xl mx-auto">Se algo relevante acontecer mesmo sem missão, registre em JIKKAI → Relatórios.</p>
          <Btn onClick={() => onNavigate?.("jikkai", "relatorios", "novo-relatorio-avulso")} variant="primary" className="mx-auto mt-5"><IFile className="w-3 h-3" /> Criar relatório avulso</Btn>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="flex gap-2 mb-4 flex-wrap">
        {["Ativas", "Encerradas", "Todas"].map(f => {
          const count = f === "Ativas" ? ativas.length : f === "Encerradas" ? encerradas.length : todasMinhas.length;
          return (
            <button key={f} onClick={() => setFiltro(f)} className={`px-3 py-1.5 rounded text-xs uppercase tracking-wider font-bold border ${filtro === f ? "bg-orange-700 border-orange-600 text-white" : "bg-zinc-950 border-zinc-800 text-zinc-500"}`}>
              {f} <span className="opacity-60">({count})</span>
            </button>
          );
        })}
      </div>

      {minhas.length === 0 && (
        <div className="p-8 text-center bg-zinc-950/50 border border-zinc-800 rounded-lg text-zinc-600 italic">
          <div>Nenhuma missão neste filtro.</div>
          <Btn onClick={() => onNavigate?.("jikkai", "relatorios", "novo-relatorio-avulso")} variant="ghost" className="mx-auto mt-4"><IFile className="w-3 h-3" /> Criar relatório avulso</Btn>
        </div>
      )}

      <div className="space-y-4">
        {minhas.map((m) => {
          const c = statusMissaoConfig(m.status);
          const sigilo = normalizarSigilo(m.sigilo);
          const objetivos = m.objetivos || [];
          const prog = objetivos.length > 0 ? Math.round(objetivos.filter(o => o.done).length / objetivos.length * 100) : 0;
          const atribuidor = data.users.find(u => u.username === m.assignedBy);
          const participantes = participantesDaMissao(m);
          const aceites = m.aceites || [];
          const euAceitei = aceites.includes(usuario.username);
          const podeEditarObjetivos = ["aceita", "andamento", "devolvida"].includes(m.status);
          const relatorio = m.relatorioFinalId ? (data.relatorios || []).find(r => r.id === m.relatorioFinalId) : null;
          const contrato = m.contratoId ? (data.contratos || []).find(x => x.id === m.contratoId) : null;

          return (
            <div id={`missao-${m.id}`} key={m.id} className={`mission-card-mobile p-5 rounded-lg border ${destaqueMissaoId === m.id ? "ring-2 ring-orange-500 ring-offset-2 ring-offset-black " : ""}${c.border} ${c.bg} fadein`}>
              <div className="flex items-start gap-4">
                <div className={`flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center ${c.circle}`}>
                  {m.status === "concluida" ? <ICheck className="w-5 h-5" /> : m.status === "falhou" ? <IAlert className="w-5 h-5" /> : <IClipboard className="w-5 h-5" />}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <h3 className="text-orange-50 font-bold text-lg">{m.titulo}</h3>
                    <span className={`text-xs px-2 py-0.5 rounded font-bold uppercase tracking-wider ${c.badge}`}>{c.label}</span>
                    <SigiloBadge sigilo={sigilo} compacto />
                    {m.contratoId && <span className="text-[10px] px-2 py-0.5 rounded border border-red-800 text-red-300 uppercase tracking-wider">Contrato</span>}
                  </div>
                  <p className="text-zinc-400 text-sm leading-relaxed mb-2">{m.desc}</p>
                  <div className="text-zinc-600 text-xs mb-2">
                    Atribuída por <strong className="text-orange-600">{atribuidor?.displayName || atribuidor?.codinome || m.assignedBy}</strong> em {new Date(m.createdAt).toLocaleDateString("pt-BR")}
                  </div>
                  <div className="text-zinc-500 text-xs mb-3">
                    Equipe: {participantes.map(p => data.users.find(u => u.username === p)?.codinome || data.users.find(u => u.username === p)?.displayName || p).join(", ")}
                    {participantes.length > 1 && <span className="text-zinc-700"> · {aceites.length}/{participantes.length} confirmações</span>}
                  </div>

                  {contrato && (
                    <div className="mb-3 p-3 bg-black/40 border border-red-900/40 rounded text-xs">
                      <div className="uppercase tracking-wider text-red-500 mb-1">Contrato vinculado</div>
                      <div className="text-zinc-300">{contrato.titulo}</div>
                      {m.recompensa && <div className="text-orange-400 mt-1">Recompensa: {m.recompensa}</div>}
                    </div>
                  )}

                  {m.feedbackRevisao && (
                    <div className="mb-3 p-3 bg-yellow-950/30 border border-yellow-800 rounded">
                      <div className="text-[10px] uppercase tracking-wider text-yellow-500 mb-1">Ajustes solicitados pela liderança</div>
                      <div className="text-yellow-100 text-sm whitespace-pre-wrap">{m.feedbackRevisao}</div>
                    </div>
                  )}

                  {objetivos.length > 0 && (
                    <>
                      <div className="mb-2">
                        <div className="flex justify-between text-xs text-zinc-500 mb-1">
                          <span className="uppercase tracking-wider text-orange-600">Progresso</span>
                          <span>{prog}%</span>
                        </div>
                        <div className="h-1 bg-zinc-900 rounded overflow-hidden">
                          <div className="h-full bg-gradient-to-r from-orange-600 to-red-600 transition-all" style={{ width: `${prog}%` }} />
                        </div>
                      </div>
                      <div className="space-y-1.5 mt-3">
                        {objetivos.map((o, oi) => (
                          <label key={oi} className={`flex items-center gap-2 text-sm ${podeEditarObjetivos ? "cursor-pointer" : "cursor-default"}`}>
                            <input type="checkbox" checked={o.done} onChange={() => podeEditarObjetivos && toggleObj(m.id, oi)} disabled={!podeEditarObjetivos} className="w-4 h-4 accent-orange-600 disabled:opacity-40" />
                            <span className={o.done ? "line-through text-zinc-600" : "text-zinc-300"}>{o.text}</span>
                          </label>
                        ))}
                      </div>
                    </>
                  )}

                  {relatorio && (
                    <div className="mt-4 p-3 bg-black/40 border border-purple-900/50 rounded">
                      <div className="flex items-center justify-between gap-2 mb-1">
                        <span className="text-[10px] uppercase tracking-wider text-purple-400">Relatório final · {relatorio.resultado || "Sem resultado"}</span>
                        <span className="text-[10px] text-zinc-600">{relatorio.statusAprovacao || "Pendente"}</span>
                      </div>
                      {relatorio.resumo && <div className="text-zinc-300 text-sm">{relatorio.resumo}</div>}
                    </div>
                  )}

                  <div className="flex gap-2 mt-4 pt-3 border-t border-zinc-800 flex-wrap">
                    {(m.status === "atribuida" || m.status === "pendente") && !euAceitei && (
                      <>
                        <Btn onClick={() => confirmarParticipacao(m)} variant="primary"><ICheck className="w-3 h-3" /> Confirmar participação</Btn>
                        <Btn onClick={() => recusarParticipacao(m)} variant="danger"><IX className="w-3 h-3" /> Recusar</Btn>
                      </>
                    )}
                    {m.status === "atribuida" && euAceitei && (
                      <span className="text-xs text-zinc-500 self-center">Aguardando confirmação dos demais operadores.</span>
                    )}
                    {m.status === "aceita" && (
                      <Btn onClick={() => iniciarMissao(m)} variant="primary"><ISwords className="w-3 h-3" /> Iniciar operação</Btn>
                    )}
                    {m.status === "devolvida" && (
                      <Btn onClick={() => iniciarMissao(m)} variant="primary"><IEdit className="w-3 h-3" /> Retomar ajustes</Btn>
                    )}
                    {m.status === "andamento" && (
                      <Btn onClick={() => setRelatorioMissao(m)} variant="primary" className="ml-auto"><IFile className="w-3 h-3" /> Enviar relatório da missão</Btn>
                    )}
                    {m.status === "revisao" && (
                      <span className="text-xs uppercase tracking-wider text-purple-400 self-center">Relatório enviado. Aguardando decisão da liderança.</span>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {relatorioMissao && <RelatorioMissaoModal missao={relatorioMissao} onSave={enviarRelatorio} onClose={() => setRelatorioMissao(null)} />}
    </div>
  );
}

// ============ GERENCIAR (Admin) ============
function GerenciarPage({ data, setData, usuario, role, exportar, importar, navigationRequest }) {
  const isLider = role?.hasLeaderPerms === true;
  const podeUsuarios = isLider || hasPerm(role,"manage_users");
  const podeCargos = isLider || hasPerm(role,"manage_roles") || estruturaPosicaoRole(role) === "conselheiro";
  const podeRamos = isLider;
  const podeJuramentos = isLider;
  const podeBackup = isLider;
  const podeDiscord = isLider;
  const primeiraAba = podeUsuarios?"usuarios":podeCargos?"cargos":podeRamos?"ramos":podeDiscord?"discord":"backup";
  const [aba, setAba] = useState(primeiraAba);
  useEffect(() => {
    if (navigationRequest?.tab !== "gerenciar") return;
    if (navigationRequest.action === "iniciacoes-pendentes" && podeUsuarios) { setAba("usuarios"); return; }
    if (["usuarios", "cargos", "ramos", "juramentos", "discord", "backup"].includes(navigationRequest.subTab)) setAba(navigationRequest.subTab);
  }, [navigationRequest?.token]);

  return (
    <div>
      <SectionTitle icon={ISettings} sub="Painel administrativo do líder">Gerenciar</SectionTitle>

      <div className="flex gap-2 mb-6 border-b border-zinc-800 overflow-x-auto">
        {[
          podeUsuarios && { id: "usuarios", label: "Usuários", icon: IUsers },
          podeCargos && { id: "cargos", label: "Cargos", icon: ICrown },
          podeRamos && { id: "ramos", label: "Divisões", icon: IShield },
          podeJuramentos && { id: "juramentos", label: "Juramentos", icon: ISkull },
          podeDiscord && { id: "discord", label: "Discord", icon: IShield },
          podeBackup && { id: "backup", label: "Backup", icon: IDownload },
        ].filter(Boolean).map(t => {
          const I = t.icon;
          return (
            <button key={t.id} onClick={() => setAba(t.id)} className={`flex items-center gap-2 px-4 py-2 text-xs uppercase tracking-wider whitespace-nowrap border-b-2 ${aba === t.id ? "border-orange-600 text-orange-400" : "border-transparent text-zinc-600 hover:text-zinc-300"}`}>
              <I className="w-3.5 h-3.5" /> {t.label}
            </button>
          );
        })}
      </div>

      {aba === "usuarios" && <UsuariosManager data={data} setData={setData} usuario={usuario} navigationAction={navigationRequest?.tab === "gerenciar" ? navigationRequest.action : ""} />}
      {aba === "cargos" && <CargosManager data={data} setData={setData} usuario={usuario} role={role} />}
      {aba === "ramos" && <RamosManager data={data} setData={setData} usuario={usuario} />}
      {aba === "juramentos" && <RegistroJuramentosManager data={data} setData={setData} usuario={usuario} />}
      {aba === "discord" && <DiscordManager data={data} setData={setData} usuario={usuario} />}
      {aba === "backup" && <BackupManager data={data} exportar={exportar} importar={importar} />}
    </div>
  );
}

function UsuariosManager({ data, setData, usuario, navigationAction }) {
  const vazio = () => ({
    username: "", password: "", displayName: "", nomeRP: "", codinome: "", role: "member",
    status: "Novo", level: 0, cla: "", elemento: "", linhagem: "", vilaOrigem: "",
    patente: "", especialidade: "", bio: "", estruturaNivel: "operador", respondeA: "",
    nivelAcesso: 1, iniciacaoStatus: "pendente", avatarUrl: "", avatarStoragePath: "",
    reputacao: "Baixo perfil", lealdade: "Observado", conduta: "Limpo", reputacaoNota: "", lealdadeNota: "", condutaNota: "", condutaRegistros: [],
  });
  const [editando, setEditando] = useState(null);
  const [form, setForm] = useState(vazio());
  const [erro, setErro] = useState("");
  const cargosConvite = (data.roles || []).filter(r => r.id !== "leader" && r.hasLeaderPerms !== true);
  const cargoConvitePadrao = cargosConvite.find(r => r.id === "recruta")?.id || cargosConvite.find(r => r.id === "member")?.id || cargosConvite[0]?.id || "recruta";
  const contratanteRoleId = cargosConvite.find(r => r.id === "contratante")?.id || "contratante";
  const [conviteAberto, setConviteAberto] = useState(false);
  const [conviteForm, setConviteForm] = useState({ tipo: "recruta", rolePadrao: cargoConvitePadrao, nivelAcesso: 1, validadeDias: 7, categoriasLiberadas: [], discordObrigatorio: true, nomeConvidado: "", tituloConvidado: "", vilaConvidado: "", mensagemPersonalizada: "", codinomeReservado: "" });
  const [conviteGerado, setConviteGerado] = useState(null);
  const [conviteStatus, setConviteStatus] = useState("");
  const conviteFormEhContratante = conviteForm.tipo === "contratante" || conviteForm.rolePadrao === "contratante";
  const pendentesIniciacao = (data.users || []).filter(u => u.role !== "contratante" && u.iniciacaoStatus === "pendente");
  const focoIniciacoes = navigationAction === "iniciacoes-pendentes";
  useEffect(() => {
    if (!focoIniciacoes) return;
    setEditando(null);
    setTimeout(() => document.getElementById("iniciacoes-pendentes")?.scrollIntoView({ behavior: "smooth", block: "start" }), 80);
  }, [navigationAction, pendentesIniciacao.length]);

  const categoriasCodinome = Array.from(new Set((data.codinomes || []).map(c => c.categoria).filter(Boolean))).sort();
  const convitesRecentes = (data.convitesEntrada || []).slice().sort((a, b) => new Date(b.criadoEm || 0) - new Date(a.criadoEm || 0)).slice(0, 8);
  const codinomesDisponiveis = codinomesDisponiveisParaConvite(data, { categoriasLiberadas: conviteForm.categoriasLiberadas });

  const alterarTipoConvite = (tipo) => {
    setConviteForm(f => ({
      ...f,
      tipo,
      rolePadrao: tipo === "contratante" ? contratanteRoleId : (f.rolePadrao === "contratante" ? cargoConvitePadrao : f.rolePadrao),
      nivelAcesso: tipo === "contratante" ? Math.max(1, Number(f.nivelAcesso) || 1) : f.nivelAcesso,
      discordObrigatorio: tipo === "contratante" ? false : f.discordObrigatorio,
    }));
    setConviteStatus("");
  };

  const gerarConviteEntrada = () => {
    let token = gerarTokenConvite();
    const usados = new Set((data.convitesEntrada || []).map(c => normalizarTokenConvite(c.token)));
    while (usados.has(token)) token = gerarTokenConvite();
    const now = new Date();
    const validadeDias = Number(conviteForm.validadeDias) || 7;
    const rolePadraoFinal = conviteFormEhContratante ? contratanteRoleId : (conviteForm.rolePadrao || cargoConvitePadrao);
    const nomeConvidado = String(conviteForm.nomeConvidado || "").trim();
    const tituloConvidado = String(conviteForm.tituloConvidado || "").trim();
    const vilaConvidado = String(conviteForm.vilaConvidado || "").trim();
    const nomeFormal = [tituloConvidado, nomeConvidado].filter(Boolean).join(" ").trim();
    const mensagemPersonalizada = String(conviteForm.mensagemPersonalizada || "").trim();
    const conviteTemPersonalizacao = Boolean(nomeFormal || vilaConvidado || mensagemPersonalizada || String(conviteForm.codinomeReservado || "").trim());
    const codinomeReservado = conviteFormEhContratante ? codinomeNome(conviteForm.codinomeReservado || (nomeConvidado ? nomeFormal : "")) : "";
    if (conviteFormEhContratante && codinomeReservado) {
      const testeConvite = { tipo: "contratante", rolePadrao: rolePadraoFinal, token, codinomeReservado };
      if (!codinomeDisponivelParaConvite(data, codinomeReservado, testeConvite)) {
        setConviteStatus("O codinome reservado do contratante ja esta em uso ou bloqueado.");
        return;
      }
    }
    const convite = {
      id: "convite_" + uid(),
      token,
      tipo: conviteForm.tipo || "recruta",
      rolePadrao: rolePadraoFinal,
      nivelAcesso: Math.max(1, Math.min(5, Number(conviteForm.nivelAcesso) || 1)),
      status: "pendente",
      criadoPor: usuario?.username || "leader",
      criadoEm: now.toISOString(),
      expiraEm: new Date(now.getTime() + validadeDias * 24 * 60 * 60 * 1000).toISOString(),
      usadoPor: "",
      usadoEm: "",
      codinomeEscolhido: "",
      discordObrigatorio: conviteForm.discordObrigatorio !== false,
      categoriasLiberadas: conviteForm.categoriasLiberadas || [],
      nomeConvidado,
      tituloConvidado,
      vilaConvidado,
      mensagemPersonalizada,
      codinomeReservado,
      apresentacaoContratante: conviteFormEhContratante,
    };
    setData(d => ({
      ...d,
      convitesEntrada: [...(d.convitesEntrada || []), convite],
      codinomes: conviteFormEhContratante && codinomeReservado
        ? normalizarBancoCodinomes([...(d.codinomes || []), normalizarCodinomeEntrada({ nome: codinomeReservado, categoria: "Contratantes", descricao: "Codinome reservado por Selo de Entrada externo.", status: "reservado", reservadoParaConvite: convite.token, reservadoEm: now.toISOString(), conviteId: convite.id })], d.users || [])
        : d.codinomes,
      activityLog: [...(d.activityLog || []), atividade("convite_criado", usuario?.username, convite.token, "Gerou um Selo de Entrada")],
    }));
    setConviteGerado(convite);
    setConviteStatus(conviteFormEhContratante ? (conviteTemPersonalizacao ? "Selo personalizado de contratante gerado. Envie o link para o contato externo." : "Selo de contratante gerado sem tratamento personalizado. Envie o link para o contato externo.") : "Selo de Entrada gerado. Envie o link para o novo membro.");
  };

  const copiarLinkConvite = async (convite) => {
    const link = linkConvitePortal(convite.token);
    try {
      await navigator.clipboard.writeText(link);
      setConviteStatus("Link copiado para a área de transferência.");
    } catch {
      setConviteStatus(link);
    }
  };

  const revogarConvite = (convite) => {
    if (!confirm("Revogar este Selo de Entrada?")) return;
    setData(d => ({
      ...d,
      convitesEntrada: (d.convitesEntrada || []).map(c => c.id === convite.id ? { ...c, status: "cancelado", canceladoEm: new Date().toISOString(), canceladoPor: usuario?.username || "leader" } : c),
      activityLog: [...(d.activityLog || []), atividade("convite_revogado", usuario?.username, convite.token, "Revogou um Selo de Entrada")],
    }));
  };

  const toggleCategoriaConvite = (categoria) => {
    setConviteForm(f => {
      const atual = new Set(f.categoriasLiberadas || []);
      if (atual.has(categoria)) atual.delete(categoria); else atual.add(categoria);
      return { ...f, categoriasLiberadas: Array.from(atual) };
    });
  };

  const iniciarEdit = u => { setEditando(u.username); setForm({ ...normalizarMembro(u), password: "" }); setErro(""); };
  const iniciarNovo = () => { setEditando("__novo__"); setForm(vazio()); setErro(""); };
  const cancelar = () => { setEditando(null); setErro(""); };
  const salvar = () => {
    if (!form.username.trim() || !form.displayName.trim()) { setErro("Username e nome são obrigatórios."); return; }
    if (editando === "__novo__" && data.users.some(u => u.username.toLowerCase() === form.username.trim().toLowerCase())) { setErro("Username já existe."); return; }
    if (form.codinome?.trim() && codinomeUsadoPorOutroUsuario(data.users || [], form.codinome, editando === "__novo__" ? "" : editando)) { setErro("Este codinome já pertence a outro membro."); return; }
    if (editando === "__novo__" && !form.password) { setErro("Senha obrigatória para novo usuário."); return; }
    const username = form.username.trim();
    const anteriorAntesSalvar = editando !== "__novo__" ? data.users.find(u => u.username === editando) : null;
    const cargoAntigoAntes = anteriorAntesSalvar ? data.roles.find(r => r.id === anteriorAntesSalvar.role) : null;
    const cargoNovoAntes = data.roles.find(r => r.id === form.role);
    const houvePromocao = Boolean(anteriorAntesSalvar && cargoNovoAntes && anteriorAntesSalvar.role !== form.role);
    setData(d => {
      if (editando === "__novo__") {
        const novo = normalizarMembro({ ...form, username, nomeRP: form.nomeRP || form.displayName, level: Number(form.level) || 0, nivelAcesso: Number(form.nivelAcesso) || 1, estruturaNivel: estruturaPosicaoRole(d.roles.find(r => r.id === form.role)), criadoEm: new Date().toISOString(), criadoPor: usuario?.username || "lideranca", iniciacaoStatus: "pendente" }, false);
        return { ...d, users: [...d.users, novo], codinomes: atualizarBancoCodinomeUsuario(d.codinomes || [], "", novo.codinome, novo.username), activityLog: [...(d.activityLog || []), atividade("membro_criado", usuario?.username, username, `Criou o registro de ${getCodinome(novo)}`)] };
      }
      const anterior = d.users.find(u => u.username === editando);
      const cargoAtual = d.roles.find(r => r.id === form.role);
      const patenteFinal = anterior?.role !== form.role ? cargoAtual?.nome || form.patente : form.patente;
      const atualizado = normalizarMembro({ ...anterior, ...form, patente: patenteFinal, username: editando, password: form.password || anterior.password, level: Number(form.level) || 0, nivelAcesso: Number(form.nivelAcesso) || 1, estruturaNivel: estruturaPosicaoRole(cargoAtual) });
      return { ...d, users: d.users.map(u => u.username === editando ? atualizado : u), codinomes: atualizarBancoCodinomeUsuario(d.codinomes || [], anterior?.codinome || "", atualizado.codinome, editando), activityLog: [...(d.activityLog || []), atividade("membro_editado", usuario?.username, editando, `Atualizou o dossiê administrativo de ${getCodinome(atualizado)}`)] };
    });
    if (houvePromocao) {
      setTimeout(async () => {
        try {
          const conteudo = mensagemDiscordPromocao(data, anteriorAntesSalvar, cargoAntigoAntes?.nome || anteriorAntesSalvar.role || "Não definido", cargoNovoAntes.nome, getCodinome(usuario));
          await window.notificarDiscordUsuarios(data, [anteriorAntesSalvar.username], "promocao", conteudo);
        } catch (e) {
          console.warn("Falha ao notificar promoção por Discord", e);
        }
      }, 80);
    }
    setEditando(null);
  };
  const remover = username => {
    if (username === "leader") { alert("O líder principal não pode ser removido."); return; }
    if (!confirm(`Remover ${username}?`)) return;
    setData(d => {
      const alvo = d.users.find(u => u.username === username);
      return {
        ...d,
        users: d.users.filter(u => u.username !== username),
        codinomes: atualizarBancoCodinomeUsuario(d.codinomes || [], alvo?.codinome || "", "", username),
        missoes: (d.missoes || []).map(m => ({ ...m, assignedTo: m.assignedTo === username ? "" : m.assignedTo, participants: (m.participants || []).filter(p => p !== username), aceites: (m.aceites || []).filter(p => p !== username) })),
        trios: (d.trios || []).map(t => ({ ...t, membros: (t.membros || []).filter(m => m.username !== username) })),
        activityLog: [...(d.activityLog || []), atividade("membro_removido", usuario?.username, username, `Removeu @${username} da organização`)],
      };
    });
  };
  return (

          <div key={u.username} className="p-4 bg-zinc-950/60 border border-zinc-800 rounded-lg flex gap-3">
