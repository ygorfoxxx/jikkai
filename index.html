function RegistroJuramentosManager({ data, setData, usuario }) {
  const [busca, setBusca] = useState("");
  const registros = (data.juramentados || []).map((j, index) => ({ j, index })).filter(({ j }) => {
    const termo = busca.trim().toLowerCase();
    return !termo || [j.nome, j.username, j.linhagem, j.elemento].some(v => String(v || "").toLowerCase().includes(termo));
  }).sort((a, b) => new Date(b.j.data || 0) - new Date(a.j.data || 0));
  const remover = (registro) => {
    if (!confirm("Remover o juramento de " + registro.nome + "? O membro continuará existindo no portal.")) return;
    setData(d => ({ ...d, juramentados: (d.juramentados || []).filter((_, i) => i !== registro.__index), activityLog: [...(d.activityLog || []), atividade("juramento_removido", usuario?.username, registro.username, "Removeu o registro de juramento de " + registro.nome)] }));
  };
  const reabrir = username => {
    if (!username || !confirm("Reabrir a introdução de primeiro acesso para este membro? O juramento atual será preservado.")) return;
    setData(d => ({ ...d, users: d.users.map(u => u.username === username ? { ...u, iniciacaoStatus: "pendente", iniciacaoReabertaEm: new Date().toISOString() } : u), activityLog: [...(d.activityLog || []), atividade("iniciacao_reaberta", usuario?.username, username, "Reabriu o protocolo de iniciação")]}));
  };
  return (
    <div className="space-y-5">
      <div><h3 className="text-orange-50 font-bold text-lg serif">Arquivo de Juramentos ({(data.juramentados || []).length})</h3><p className="text-zinc-600 text-xs mt-1">Visão exclusiva da liderança. Os membros continuam vendo apenas o próprio registro.</p></div>
      <input value={busca} onChange={e => setBusca(e.target.value)} className="fox-input" placeholder="Buscar por nome, usuário, linhagem ou elemento" />
      <div className="grid md:grid-cols-2 gap-4">
        {registros.map(({ j, index }) => {
          const membro = data.users.find(u => u.username === j.username) || usuarioPorIdentidade(data.users, j.nome);
          const registro = { ...j, __index: index };
          return <div key={j.id || index} className="rounded-xl overflow-hidden border border-orange-900/40 bg-zinc-950/70">{j.fotoUrl && <img src={j.fotoUrl} alt="Registro visual" className="w-full h-44 object-cover border-b border-orange-900/30" />}<div className="p-4"><div className="flex items-start justify-between gap-3"><div><div className="text-orange-50 font-black">{j.nome}</div><div className="text-zinc-600 text-xs">@{j.username || membro?.username || "registro-legado"} · {new Date(j.data).toLocaleDateString("pt-BR")}</div></div><span className="text-[9px] uppercase tracking-wider px-2 py-1 rounded border border-orange-900 text-orange-500">v{j.versao || 1}</span></div><div className="text-zinc-500 text-xs mt-3">{j.linhagem || "Sem linhagem"} · {j.elemento || "Sem elemento"}</div>{j.motivacao && <p className="text-zinc-400 italic text-sm mt-3 line-clamp-3">“{j.motivacao}”</p>}<div className="flex gap-2 mt-4 pt-3 border-t border-zinc-800">{membro && <Btn onClick={() => reabrir(membro.username)} variant="ghost" className="text-[10px]">Refazer introdução</Btn>}<Btn onClick={() => remover(registro)} variant="danger" className="ml-auto"><ITrash className="w-3 h-3" /> Remover</Btn></div></div></div>;
        })}
      </div>
      {registros.length === 0 && <div className="p-8 text-center rounded-lg border border-zinc-800 text-zinc-600 italic">Nenhum juramento encontrado.</div>}
    </div>
  );
}

// ============ MINHAS MISSÕES ============
function MinhasMissoesPage({ data, setData, usuario, role }) {
  const [filtro, setFiltro] = useState("Ativas");
  const [relatorioMissao, setRelatorioMissao] = useState(null);

  const todasMinhas = (data.missoes || [])
    .filter(m => usuarioParticipaMissao(m, usuario.username))
    .slice()
    .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  const ativas = todasMinhas.filter(m => !MISSAO_STATUS_TERMINAIS.includes(m.status));
  const encerradas = todasMinhas.filter(m => MISSAO_STATUS_TERMINAIS.includes(m.status));
  const minhas = filtro === "Ativas" ? ativas : filtro === "Encerradas" ? encerradas : todasMinhas;

  const updateMissao = (id, patch) => setData(d => ({
    ...d,
    missoes: d.missoes.map(m => m.id === id ? { ...m, ...patch, updatedAt: new Date().toISOString() } : m),
  }));

  const toggleObj = (id, oi) => {
    const m = data.missoes.find(x => x.id === id);
    const objetivos = m.objetivos || [];
    updateMissao(id, { objetivos: objetivos.map((o, idx) => idx === oi ? { ...o, done: !o.done } : o) });
  };

  const confirmarParticipacao = (m) => {
    const participantes = participantesDaMissao(m);
    const aceites = Array.from(new Set([...(m.aceites || []), usuario.username]));
    const todosAceitaram = participantes.every(p => aceites.includes(p));
    updateMissao(m.id, {
      aceites,
      status: todosAceitaram ? "aceita" : "atribuida",
      acceptedAt: todosAceitaram ? new Date().toISOString() : m.acceptedAt,
    });
  };

  const recusarParticipacao = (m) => {
    if (!confirm(`Recusar a missão "${m.titulo}"? A liderança será informada pelo status da operação.`)) return;
    updateMissao(m.id, {
      status: "recusada",
      recusadaPor: usuario.username,
      recusadaEm: new Date().toISOString(),
    });
  };

  const iniciarMissao = (m) => updateMissao(m.id, {
    status: "andamento",
    startedAt: m.startedAt || new Date().toISOString(),
    feedbackRevisao: "",
  });

  const enviarRelatorio = (form) => {
    const m = relatorioMissao;
    if (!m) return;
    const relatorioId = uid();
    const novoRelatorio = {
      id: relatorioId,
      titulo: `[Operação] ${m.titulo}`,
      local: m.local || "",
      descricao: form.descricao,
      resumo: form.resumo,
      resultado: form.resultado,
      evidencias: form.evidencias,
      confidencialidade: normalizarSigilo(m.sigilo || "Restrito"),
      tipo: "Operacional",
      statusAprovacao: "Pendente",
      missaoId: m.id,
      contratoId: m.contratoId || null,
      autorUsername: usuario.username,
      autorNome: usuario.displayName || usuario.codinome || usuario.username,
      data: new Date().toISOString(),
    };
    setData(d => ({
      ...d,
      relatorios: [...(d.relatorios || []), novoRelatorio],
      missoes: d.missoes.map(x => x.id === m.id ? {
        ...x,
        status: "revisao",
        relatorioFinalId: relatorioId,
        enviadoRevisaoEm: new Date().toISOString(),
        feedbackRevisao: "",
        updatedAt: new Date().toISOString(),
      } : x),
    }));
    setRelatorioMissao(null);
  };

  if (todasMinhas.length === 0) {
    return (
      <div>
        <SectionTitle icon={IClipboard} sub="Missões atribuídas a você">Minhas Missões</SectionTitle>
        <div className="p-8 text-center bg-zinc-950/50 border border-zinc-800 rounded-lg">
          <IClipboard className="w-12 h-12 text-zinc-700 mx-auto mb-3" />
          <p className="text-zinc-500">Nenhuma missão atribuída no momento.</p>
          <p className="text-zinc-700 text-xs italic mt-2">Aguarde ordens da liderança.</p>
        </div>
      </div>
    );
  }

  return (
    <div>
      <SectionTitle icon={IClipboard} sub={`${ativas.length} ${ativas.length === 1 ? "operação ativa" : "operações ativas"}`}>Minhas Missões</SectionTitle>

      <div className="flex gap-2 mb-6 flex-wrap">
        {["Ativas", "Encerradas", "Todas"].map(f => {
          const count = f === "Ativas" ? ativas.length : f === "Encerradas" ? encerradas.length : todasMinhas.length;
          return (
            <button key={f} onClick={() => setFiltro(f)} className={`px-3 py-1.5 rounded text-xs uppercase tracking-wider font-bold border ${filtro === f ? "bg-orange-700 border-orange-600 text-white" : "bg-zinc-950 border-zinc-800 text-zinc-500"}`}>
              {f} <span className="opacity-60">({count})</span>
            </button>
          );
        })}
      </div>

      {minhas.length === 0 && (
        <div className="p-8 text-center bg-zinc-950/50 border border-zinc-800 rounded-lg text-zinc-600 italic">Nenhuma missão neste filtro.</div>
      )}

      <div className="space-y-4">
        {minhas.map((m) => {
          const c = statusMissaoConfig(m.status);
          const sigilo = normalizarSigilo(m.sigilo);
          const objetivos = m.objetivos || [];
          const prog = objetivos.length > 0 ? Math.round(objetivos.filter(o => o.done).length / objetivos.length * 100) : 0;
          const atribuidor = data.users.find(u => u.username === m.assignedBy);
          const participantes = participantesDaMissao(m);
          const aceites = m.aceites || [];
          const euAceitei = aceites.includes(usuario.username);
          const podeEditarObjetivos = ["aceita", "andamento", "devolvida"].includes(m.status);
          const relatorio = m.relatorioFinalId ? (data.relatorios || []).find(r => r.id === m.relatorioFinalId) : null;
          const contrato = m.contratoId ? (data.contratos || []).find(x => x.id === m.contratoId) : null;

          return (
            <div key={m.id} className={`p-5 rounded-lg border ${c.border} ${c.bg} fadein`}>
              <div className="flex items-start gap-4">
                <div className={`flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center ${c.circle}`}>
                  {m.status === "concluida" ? <ICheck className="w-5 h-5" /> : m.status === "falhou" ? <IAlert className="w-5 h-5" /> : <IClipboard className="w-5 h-5" />}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <h3 className="text-orange-50 font-bold text-lg">{m.titulo}</h3>
                    <span className={`text-xs px-2 py-0.5 rounded font-bold uppercase tracking-wider ${c.badge}`}>{c.label}</span>
                    <SigiloBadge sigilo={sigilo} compacto />
                    {m.contratoId && <span className="text-[10px] px-2 py-0.5 rounded border border-red-800 text-red-300 uppercase tracking-wider">Contrato</span>}
                  </div>
                  <p className="text-zinc-400 text-sm leading-relaxed mb-2">{m.desc}</p>
                  <div className="text-zinc-600 text-xs mb-2">
                    Atribuída por <strong className="text-orange-600">{atribuidor?.displayName || atribuidor?.codinome || m.assignedBy}</strong> em {new Date(m.createdAt).toLocaleDateString("pt-BR")}
                  </div>
                  <div className="text-zinc-500 text-xs mb-3">
                    Equipe: {participantes.map(p => data.users.find(u => u.username === p)?.codinome || data.users.find(u => u.username === p)?.displayName || p).join(", ")}
                    {participantes.length > 1 && <span className="text-zinc-700"> · {aceites.length}/{participantes.length} confirmações</span>}
                  </div>

                  {contrato && (
                    <div className="mb-3 p-3 bg-black/40 border border-red-900/40 rounded text-xs">
                      <div className="uppercase tracking-wider text-red-500 mb-1">Contrato vinculado</div>
                      <div className="text-zinc-300">{contrato.titulo}</div>
                      {m.recompensa && <div className="text-orange-400 mt-1">Recompensa: {m.recompensa}</div>}
                    </div>
                  )}

                  {m.feedbackRevisao && (
                    <div className="mb-3 p-3 bg-yellow-950/30 border border-yellow-800 rounded">
                      <div className="text-[10px] uppercase tracking-wider text-yellow-500 mb-1">Ajustes solicitados pela liderança</div>
                      <div className="text-yellow-100 text-sm whitespace-pre-wrap">{m.feedbackRevisao}</div>
                    </div>
                  )}

                  {objetivos.length > 0 && (
                    <>
                      <div className="mb-2">
                        <div className="flex justify-between text-xs text-zinc-500 mb-1">
                          <span className="uppercase tracking-wider text-orange-600">Progresso</span>
                          <span>{prog}%</span>
                        </div>
                        <div className="h-1 bg-zinc-900 rounded overflow-hidden">
                          <div className="h-full bg-gradient-to-r from-orange-600 to-red-600 transition-all" style={{ width: `${prog}%` }} />
                        </div>
                      </div>
                      <div className="space-y-1.5 mt-3">
                        {objetivos.map((o, oi) => (
                          <label key={oi} className={`flex items-center gap-2 text-sm ${podeEditarObjetivos ? "cursor-pointer" : "cursor-default"}`}>
                            <input type="checkbox" checked={o.done} onChange={() => podeEditarObjetivos && toggleObj(m.id, oi)} disabled={!podeEditarObjetivos} className="w-4 h-4 accent-orange-600 disabled:opacity-40" />
                            <span className={o.done ? "line-through text-zinc-600" : "text-zinc-300"}>{o.text}</span>
                          </label>
                        ))}
                      </div>
                    </>
                  )}

                  {relatorio && (
                    <div className="mt-4 p-3 bg-black/40 border border-purple-900/50 rounded">
                      <div className="flex items-center justify-between gap-2 mb-1">
                        <span className="text-[10px] uppercase tracking-wider text-purple-400">Relatório final · {relatorio.resultado || "Sem resultado"}</span>
                        <span className="text-[10px] text-zinc-600">{relatorio.statusAprovacao || "Pendente"}</span>
                      </div>
                      {relatorio.resumo && <div className="text-zinc-300 text-sm">{relatorio.resumo}</div>}
                    </div>
                  )}

                  <div className="flex gap-2 mt-4 pt-3 border-t border-zinc-800 flex-wrap">
                    {(m.status === "atribuida" || m.status === "pendente") && !euAceitei && (
                      <>
                        <Btn onClick={() => confirmarParticipacao(m)} variant="primary"><ICheck className="w-3 h-3" /> Confirmar participação</Btn>
                        <Btn onClick={() => recusarParticipacao(m)} variant="danger"><IX className="w-3 h-3" /> Recusar</Btn>
                      </>
                    )}
                    {m.status === "atribuida" && euAceitei && (
                      <span className="text-xs text-zinc-500 self-center">Aguardando confirmação dos demais operadores.</span>
                    )}
                    {m.status === "aceita" && (
                      <Btn onClick={() => iniciarMissao(m)} variant="primary"><ISwords className="w-3 h-3" /> Iniciar operação</Btn>
                    )}
                    {m.status === "devolvida" && (
                      <Btn onClick={() => iniciarMissao(m)} variant="primary"><IEdit className="w-3 h-3" /> Retomar ajustes</Btn>
                    )}
                    {m.status === "andamento" && (
                      <Btn onClick={() => setRelatorioMissao(m)} variant="primary" className="ml-auto"><IFile className="w-3 h-3" /> Enviar relatório final</Btn>
                    )}
                    {m.status === "revisao" && (
                      <span className="text-xs uppercase tracking-wider text-purple-400 self-center">Relatório enviado. Aguardando decisão da liderança.</span>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {relatorioMissao && <RelatorioMissaoModal missao={relatorioMissao} onSave={enviarRelatorio} onClose={() => setRelatorioMissao(null)} />}
    </div>
  );
}

// ============ GERENCIAR (Admin) ============
function GerenciarPage({ data, setData, usuario, role, exportar, importar }) {
  const isLider = role?.hasLeaderPerms === true;
  const podeUsuarios = isLider || hasPerm(role,"manage_users");
  const podeMissoes = isLider || hasPerm(role,"manage_missions");
  const podeCargos = isLider || hasPerm(role,"manage_roles");
  const podeRamos = isLider;
  const podeJuramentos = isLider;
  const podeBackup = isLider;
  const primeiraAba = podeUsuarios?"usuarios":podeMissoes?"missoes":podeCargos?"cargos":"backup";
  const [aba, setAba] = useState(primeiraAba);

  return (
    <div>
      <SectionTitle icon={ISettings} sub="Painel administrativo do líder">Gerenciar</SectionTitle>

      <div className="flex gap-2 mb-6 border-b border-zinc-800 overflow-x-auto">
        {[
          podeUsuarios && { id: "usuarios", label: "Usuários", icon: IUsers },
          podeCargos && { id: "cargos", label: "Cargos", icon: ICrown },
          podeRamos && { id: "ramos", label: "Ramos", icon: IShield },
          podeJuramentos && { id: "juramentos", label: "Juramentos", icon: ISkull },
          podeMissoes && { id: "missoes", label: "Missões", icon: IClipboard },
          podeBackup && { id: "backup", label: "Backup", icon: IDownload },
        ].filter(Boolean).map(t => {
          const I = t.icon;
          return (
            <button key={t.id} onClick={() => setAba(t.id)} className={`flex items-center gap-2 px-4 py-2 text-xs uppercase tracking-wider whitespace-nowrap border-b-2 ${aba === t.id ? "border-orange-600 text-orange-400" : "border-transparent text-zinc-600 hover:text-zinc-300"}`}>
              <I className="w-3.5 h-3.5" /> {t.label}
            </button>
          );
        })}
      </div>

      {aba === "usuarios" && <UsuariosManager data={data} setData={setData} usuario={usuario} />}
      {aba === "cargos" && <CargosManager data={data} setData={setData} />}
      {aba === "ramos" && <RamosManager data={data} setData={setData} usuario={usuario} />}
      {aba === "juramentos" && <RegistroJuramentosManager data={data} setData={setData} usuario={usuario} />}
      {aba === "missoes" && <MissoesManager data={data} setData={setData} usuario={usuario} role={role} />}
      {aba === "backup" && <BackupManager data={data} exportar={exportar} importar={importar} />}
    </div>
  );
}

function UsuariosManager({ data, setData, usuario }) {
  const vazio = () => ({
    username: "", password: "", displayName: "", nomeRP: "", codinome: "", role: "member",
    status: "Novo", level: 0, cla: "", elemento: "", linhagem: "", vilaOrigem: "",
    patente: "", especialidade: "", bio: "", estruturaNivel: "operador", respondeA: "",
    nivelAcesso: 1, iniciacaoStatus: "pendente", avatarUrl: "", avatarStoragePath: "",
    reputacao: "Desconhecido", lealdade: "Observado", reputacaoNota: "", lealdadeNota: "",
  });
  const [editando, setEditando] = useState(null);
  const [form, setForm] = useState(vazio());
  const [erro, setErro] = useState("");
  const iniciarEdit = u => { setEditando(u.username); setForm({ ...normalizarMembro(u), password: "" }); setErro(""); };
  const iniciarNovo = () => { setEditando("__novo__"); setForm(vazio()); setErro(""); };
  const cancelar = () => { setEditando(null); setErro(""); };
  const salvar = () => {
    if (!form.username.trim() || !form.displayName.trim()) { setErro("Username e nome são obrigatórios."); return; }
    if (editando === "__novo__" && data.users.some(u => u.username.toLowerCase() === form.username.trim().toLowerCase())) { setErro("Username já existe."); return; }
    if (editando === "__novo__" && !form.password) { setErro("Senha obrigatória para novo usuário."); return; }
    const username = form.username.trim();
    setData(d => {
      if (editando === "__novo__") {
        const novo = normalizarMembro({ ...form, username, nomeRP: form.nomeRP || form.displayName, level: Number(form.level) || 0, nivelAcesso: Number(form.nivelAcesso) || 1, criadoEm: new Date().toISOString(), criadoPor: usuario?.username || "lideranca", iniciacaoStatus: "pendente" }, false);
        return { ...d, users: [...d.users, novo], activityLog: [...(d.activityLog || []), atividade("membro_criado", usuario?.username, username, `Criou o registro de ${getCodinome(novo)}`)] };
      }
      const anterior = d.users.find(u => u.username === editando);
      const atualizado = normalizarMembro({ ...anterior, ...form, username: editando, password: form.password || anterior.password, level: Number(form.level) || 0, nivelAcesso: Number(form.nivelAcesso) || 1 });
      return { ...d, users: d.users.map(u => u.username === editando ? atualizado : u), activityLog: [...(d.activityLog || []), atividade("membro_editado", usuario?.username, editando, `Atualizou o dossiê administrativo de ${getCodinome(atualizado)}`)] };
    });
    setEditando(null);
  };
  const remover = username => {
    if (username === "leader") { alert("O líder principal não pode ser removido."); return; }
    if (!confirm(`Remover ${username}?`)) return;
    setData(d => ({
      ...d,
      users: d.users.filter(u => u.username !== username),
      missoes: (d.missoes || []).map(m => ({ ...m, assignedTo: m.assignedTo === username ? "" : m.assignedTo, participants: (m.participants || []).filter(p => p !== username), aceites: (m.aceites || []).filter(p => p !== username) })),
      trios: (d.trios || []).map(t => ({ ...t, membros: (t.membros || []).filter(m => m.username !== username) })),
      activityLog: [...(d.activityLog || []), atividade("membro_removido", usuario?.username, username, `Removeu @${username} da organização`)],
    }));
  };
  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between"><div><h3 className="text-orange-50 font-bold text-lg serif">Dossiês administrativos ({data.users.length})</h3><p className="text-zinc-600 text-xs mt-1">Campos de comando, acesso e posição hierárquica.</p></div>{editando === null && <Btn onClick={iniciarNovo} variant="primary"><IPlus className="w-3 h-3" /> Novo Membro</Btn>}</div>
      {editando !== null && (
        <div className="p-4 bg-zinc-950/80 border border-orange-700 rounded-lg space-y-4 fadein">
          <h4 className="text-orange-50 font-bold">{editando === "__novo__" ? "Novo membro da Jikkai" : `Editando ${editando}`}</h4>
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
            <div><label className="fox-label">Username (login)</label><input value={form.username} onChange={e => setForm({ ...form, username: e.target.value })} disabled={editando !== "__novo__"} className="fox-input" /></div>
            <div><label className="fox-label">Nome de exibição</label><input value={form.displayName} onChange={e => setForm({ ...form, displayName: e.target.value })} className="fox-input" /></div>
            <div><label className="fox-label">Nome de RP</label><input value={form.nomeRP || ""} onChange={e => setForm({ ...form, nomeRP: e.target.value })} className="fox-input" /></div>
            <div><label className="fox-label">Codinome oficial</label><input value={form.codinome || ""} onChange={e => setForm({ ...form, codinome: e.target.value })} className="fox-input" /></div>
            <div><label className="fox-label">Senha {editando !== "__novo__" && "(vazio mantém)"}</label><input type="text" value={form.password || ""} onChange={e => setForm({ ...form, password: e.target.value })} className="fox-input" /></div>
            <div><label className="fox-label">Cargo</label><select value={form.role} onChange={e => setForm({ ...form, role: e.target.value })} className="fox-input">{data.roles.map(r => <option key={r.id} value={r.id}>{r.nome}</option>)}</select></div>
            <div><label className="fox-label">Patente</label><input value={form.patente || ""} onChange={e => setForm({ ...form, patente: e.target.value })} className="fox-input" placeholder="Ex: Executor, Capitão..." /></div>
            <div><label className="fox-label">Status</label><select value={form.status} onChange={e => setForm({ ...form, status: e.target.value })} className="fox-input"><option>Ativo</option><option>Oculto</option><option>Renegado</option><option>Procurado</option><option>Novo</option><option>Líder</option></select></div>
            <div><label className="fox-label">Ramo</label><select value={form.cla || ""} onChange={e => setForm({ ...form, cla: e.target.value })} className="fox-input"><option value="">— Sem ramo —</option>{(data.clas || []).map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}</select></div>
            <div><label className="fox-label">Reputação externa</label><select value={form.reputacao || "Desconhecido"} onChange={e => setForm({ ...form, reputacao: e.target.value, reputacaoAtualizadaEm: new Date().toISOString() })} className="fox-input">{REPUTACAO_NIVEIS.map(n => <option key={n}>{n}</option>)}</select></div>
            <div><label className="fox-label">Lealdade interna</label><select value={form.lealdade || "Observado"} onChange={e => setForm({ ...form, lealdade: e.target.value, lealdadeAtualizadaEm: new Date().toISOString() })} className="fox-input">{LEALDADE_NIVEIS.map(n => <option key={n}>{n}</option>)}</select></div>
            <div><label className="fox-label">Posição na estrutura</label><select value={form.estruturaNivel || "operador"} onChange={e => setForm({ ...form, estruturaNivel: e.target.value })} className="fox-input"><option value="lideranca">Liderança</option><option value="conselho">Conselho</option><option value="comandante">Comandante de divisão</option><option value="operador">Operador</option></select></div>
            <div><label className="fox-label">Responde a</label><select value={form.respondeA || ""} onChange={e => setForm({ ...form, respondeA: e.target.value })} className="fox-input"><option value="">— Comando geral —</option>{data.users.filter(u => u.username !== editando && u.role !== "contratante").map(u => <option key={u.username} value={u.username}>{getCodinome(u)}</option>)}</select></div>
            <div><label className="fox-label">Nível de acesso</label><select value={form.nivelAcesso || 1} onChange={e => setForm({ ...form, nivelAcesso: Number(e.target.value) })} className="fox-input">{[1,2,3,4,5].map(n => <option key={n} value={n}>Nível {n}</option>)}</select></div>
            <div><label className="fox-label">Elemento</label><input value={form.elemento || ""} onChange={e => setForm({ ...form, elemento: e.target.value })} className="fox-input" /></div>
            <div><label className="fox-label">Linhagem</label><input value={form.linhagem || ""} onChange={e => setForm({ ...form, linhagem: e.target.value })} className="fox-input" /></div>
            <div><label className="fox-label">Vila de origem</label><input value={form.vilaOrigem || ""} onChange={e => setForm({ ...form, vilaOrigem: e.target.value })} className="fox-input" /></div>
            <div><label className="fox-label">Especialidade</label><input value={form.especialidade || ""} onChange={e => setForm({ ...form, especialidade: e.target.value })} className="fox-input" /></div>
            <div><label className="fox-label">Level</label><input type="number" value={form.level || 0} onChange={e => setForm({ ...form, level: e.target.value })} className="fox-input" /></div>
            <div><label className="fox-label">Iniciação</label><select value={form.iniciacaoStatus || "pendente"} onChange={e => setForm({ ...form, iniciacaoStatus: e.target.value })} className="fox-input"><option value="pendente">Pendente</option><option value="concluida">Concluída</option></select></div>
            <div className="sm:col-span-2 lg:col-span-3"><label className="fox-label">Justificativa da reputação</label><textarea rows="2" value={form.reputacaoNota || ""} onChange={e => setForm({ ...form, reputacaoNota: e.target.value })} className="fox-input" placeholder="Motivo da classificação externa" /></div>
            <div className="sm:col-span-2 lg:col-span-3"><label className="fox-label">Justificativa da lealdade</label><textarea rows="2" value={form.lealdadeNota || ""} onChange={e => setForm({ ...form, lealdadeNota: e.target.value })} className="fox-input" placeholder="Motivo da classificação interna" /></div>
            <div className="sm:col-span-2 lg:col-span-3"><label className="fox-label">Descrição / observação de dossiê</label><textarea rows="3" value={form.bio || ""} onChange={e => setForm({ ...form, bio: e.target.value })} className="fox-input" /></div>
          </div>
          {erro && <div className="text-red-500 text-xs">{erro}</div>}
          <div className="flex gap-2 pt-2 border-t border-zinc-800"><Btn onClick={cancelar} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn><Btn onClick={salvar} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn></div>
        </div>
      )}
      <div className="grid sm:grid-cols-2 gap-3">
        {data.users.map(u => { const role = data.roles.find(r => r.id === u.role); const cla = data.clas.find(c => c.id === u.cla); return (
          <div key={u.username} className="p-4 bg-zinc-950/60 border border-zinc-800 rounded-lg flex gap-3">
            <MemberAvatar user={u} size="md" />
            <div className="min-w-0 flex-1"><div className="text-orange-50 font-bold truncate">{getCodinome(u)}</div><div className="text-zinc-500 text-xs italic truncate">{u.nomeRP || u.displayName}</div><div className="text-zinc-600 text-[10px]">@{u.username}</div><div className="text-xs mt-1" style={{ color: role?.cor }}>{u.patente || role?.nome}</div><div className="text-[10px] text-zinc-600 mt-1">{cla?.nome || "Sem ramo"} · Acesso {u.nivelAcesso || 1} · {u.iniciacaoStatus === "pendente" ? "Iniciação pendente" : "Iniciado"}</div><div className="flex flex-wrap gap-1 mt-2"><ReputacaoBadge tipo="reputacao" valor={u.reputacao} compacto /><ReputacaoBadge tipo="lealdade" valor={u.lealdade} compacto /></div></div>
            <div className="flex gap-1"><button onClick={() => iniciarEdit(u)} className="p-1.5 text-orange-400 hover:text-orange-300"><IEdit className="w-3.5 h-3.5" /></button>{u.username !== "leader" && <button onClick={() => remover(u.username)} className="p-1.5 text-red-500 hover:text-red-400"><ITrash className="w-3.5 h-3.5" /></button>}</div>
          </div>
        ); })}
      </div>
    </div>
  );
}

function RamosManager({ data, setData, usuario }) {
  const [criando, setCriando] = useState(false);
  const [form, setForm] = useState({ nome: "", tipo: "Divisão", cor: "#7C2D12", descricao: "" });
  const [erro, setErro] = useState("");
  const criar = () => {
    const nome = form.nome.trim();
    if (!nome) { setErro("O nome do ramo é obrigatório."); return; }
    setData(d => {
      const base = slugEstrutura(nome) || "ramo";
      let id = base;
      let n = 2;
      while ((d.clas || []).some(c => c.id === id)) id = base + "-" + n++;
      const ramo = { id, nome, tipo: form.tipo.trim() || "Divisão", cor: form.cor || "#7C2D12", icon: "shield", descricao: form.descricao.trim(), figuras: [], protected: false };
      return { ...d, clas: [...(d.clas || []), ramo], activityLog: [...(d.activityLog || []), atividade("ramo_criado", usuario?.username, id, "Criou o ramo " + nome)] };
    });
    setForm({ nome: "", tipo: "Divisão", cor: "#7C2D12", descricao: "" });
    setErro("");
    setCriando(false);
  };
  const remover = ramo => {
    if (["soke", "bunke"].includes(ramo.id) || ramo.protected) { alert("Soke e Bunke são ramos protegidos."); return; }
    const quantidade = (data.users || []).filter(u => u.cla === ramo.id).length;
    if (quantidade) { alert("Transfira os membros deste ramo antes de removê-lo."); return; }
    if (!confirm("Remover o ramo " + ramo.nome + "?")) return;
    setData(d => ({ ...d, clas: (d.clas || []).filter(c => c.id !== ramo.id), activityLog: [...(d.activityLog || []), atividade("ramo_removido", usuario?.username, ramo.id, "Removeu o ramo " + ramo.nome)] }));
  };
  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between gap-3">
        <div><h3 className="text-orange-50 font-bold text-lg serif">Ramos da Jikkai ({(data.clas || []).length})</h3><p className="text-zinc-600 text-xs">Crie divisões além de Soke e Bunke. Depois, aloque os membros em Usuários.</p></div>
        {!criando && <Btn onClick={() => setCriando(true)} variant="primary"><IPlus className="w-3 h-3" /> Novo Ramo</Btn>}
      </div>
      {criando && (
        <div className="p-4 border border-orange-700 rounded-lg bg-zinc-950/80 space-y-3 fadein">
          <div className="grid sm:grid-cols-2 gap-3">
            <div><label className="fox-label">Nome *</label><input value={form.nome} onChange={e => setForm({...form, nome:e.target.value})} className="fox-input" /></div>
            <div><label className="fox-label">Tipo</label><input value={form.tipo} onChange={e => setForm({...form, tipo:e.target.value})} className="fox-input" placeholder="Divisão, família, inteligência..." /></div>
            <div><label className="fox-label">Cor</label><input type="color" value={form.cor} onChange={e => setForm({...form, cor:e.target.value})} className="h-10 w-full bg-black border border-zinc-700 rounded" /></div>
            <div><label className="fox-label">Descrição</label><input value={form.descricao} onChange={e => setForm({...form, descricao:e.target.value})} className="fox-input" /></div>
          </div>
          {erro && <div className="text-red-400 text-sm">{erro}</div>}
          <div className="flex gap-2"><Btn onClick={() => setCriando(false)} variant="ghost">Cancelar</Btn><Btn onClick={criar} variant="primary"><ISave className="w-3 h-3" /> Criar ramo</Btn></div>
        </div>
      )}
      <div className="grid md:grid-cols-2 gap-3">
        {(data.clas || []).map(ramo => {
          const quantidade = (data.users || []).filter(u => u.cla === ramo.id && u.role !== "contratante").length;
          const protegido = ["soke", "bunke"].includes(ramo.id) || ramo.protected;
          return <div key={ramo.id} className="p-4 rounded-lg border bg-zinc-950/60" style={{borderColor:(ramo.cor || "#7C2D12")+"80"}}>
            <div className="flex justify-between gap-3"><div><div className="text-[9px] uppercase tracking-wider text-zinc-600">{ramo.tipo || "Divisão"} · {quantidade} membros</div><div className="font-black text-lg serif" style={{color:ramo.cor}}>{ramo.nome}</div><p className="text-zinc-500 text-xs mt-2">{ramo.descricao || "Sem descrição."}</p></div>
            {!protegido && <button onClick={() => remover(ramo)} className="text-red-500"><ITrash className="w-4 h-4" /></button>}</div>
          </div>;
        })}
      </div>
    </div>
  );
}

function CargosManager({ data, setData }) {
  const [form, setForm] = useState({ nome: "", hasLeaderPerms: false, cor: "#7C2D12" });
  const [criando, setCriando] = useState(false);

  const criar = () => {
    if (!form.nome.trim()) return;
    const id = form.nome.toLowerCase().replace(/\s+/g, "_") + "_" + uid().slice(0, 4);
    setData(d => ({ ...d, roles: [...d.roles, { id, ...form }] }));
    setForm({ nome: "", hasLeaderPerms: false, cor: "#7C2D12" });
    setCriando(false);
  };
  const remover = (id) => {
    const role = data.roles.find(r => r.id === id);
    if (role?.protected) { alert("Este cargo é protegido."); return; }
    if (data.users.find(u => u.role === id)) { alert("Há usuários com esse cargo. Mude-os antes de remover."); return; }
    if (confirm(`Remover cargo ${role.nome}?`)) {
      setData(d => ({ ...d, roles: d.roles.filter(r => r.id !== id) }));
    }
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h3 className="text-orange-50 font-bold text-lg serif">Cargos ({data.roles.length})</h3>
        {!criando && <Btn onClick={() => setCriando(true)} variant="primary"><IPlus className="w-3 h-3" /> Novo Cargo</Btn>}
      </div>

      {criando && (
        <div className="p-4 bg-zinc-950/80 border border-orange-700 rounded-lg space-y-3 fadein">
          <h4 className="text-orange-50 font-bold">Novo Cargo Customizado</h4>
          <div><label className="fox-label">Nome do cargo</label><input value={form.nome} onChange={(e) => setForm({...form, nome: e.target.value})} className="fox-input" placeholder="Ex: Executor, Sábio, Espião..." /></div>
          <div className="flex items-center gap-3">
            <label className="fox-label mb-0">Cor</label>
            <input type="color" value={form.cor} onChange={(e) => setForm({...form, cor: e.target.value})} className="h-8 w-14 rounded bg-transparent border border-zinc-700" />
          </div>
          <label className="flex items-center gap-2 text-sm text-zinc-300 cursor-pointer">
            <input type="checkbox" checked={form.hasLeaderPerms} onChange={(e) => setForm({...form, hasLeaderPerms: e.target.checked})} className="w-4 h-4 accent-orange-600" />
            Este cargo tem permissões de líder (edição total)
          </label>
          <div className="flex gap-2 pt-2 border-t border-zinc-800">
            <Btn onClick={() => setCriando(false)} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
            <Btn onClick={criar} variant="primary"><ISave className="w-3 h-3" /> Criar</Btn>
          </div>
        </div>
      )}

      <div className="space-y-2">
        {data.roles.map((r) => {
          const count = data.users.filter(u => u.role === r.id).length;
          const isLeader = r.hasLeaderPerms === true;
          const togglePerm = (pid) => {
            setData(d => ({
              ...d,
              roles: d.roles.map(x => x.id === r.id ? { ...x, permissions: (x.permissions || []).includes(pid) ? x.permissions.filter(p => p !== pid) : [...(x.permissions || []), pid] } : x),
            }));
          };
          return (
            <div key={r.id} className="p-4 bg-zinc-950/60 border border-zinc-800 rounded-lg">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-3 h-12 rounded" style={{ background: r.cor }} />
                <div className="flex-1 min-w-0">
                  <div className="text-orange-50 font-bold">{r.nome} {r.protected && <span className="text-xs text-zinc-600">(protegido)</span>}</div>
                  <div className="text-zinc-500 text-xs">{count} usuário(s) · {isLeader ? <span className="text-orange-500">Permissões totais de líder</span> : `${(r.permissions || []).length} permissões`}</div>
                </div>
                {!r.protected && <button onClick={() => remover(r.id)} className="text-red-500 hover:text-red-400 p-2"><ITrash className="w-4 h-4" /></button>}
              </div>
              {!isLeader && r.id !== "contratante" && (
                <div className="mt-3 pt-3 border-t border-zinc-800 grid sm:grid-cols-2 gap-1">
                  {PERMISSIONS_LIST.map(p => (
                    <label key={p.id} className="flex items-start gap-2 text-xs text-zinc-300 cursor-pointer hover:text-orange-300 p-1">
                      <input type="checkbox" checked={(r.permissions || []).includes(p.id)} onChange={() => togglePerm(p.id)} className="w-3.5 h-3.5 accent-orange-600 mt-0.5" />
                      <span><strong>{p.label}</strong><br/><span className="text-zinc-600 text-[10px]">{p.desc}</span></span>
                    </label>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function MissoesManager({ data, setData, usuario, role }) {
  const [criando, setCriando] = useState(false);
  const [filtro, setFiltro] = useState("Ativas");
  const [expandida, setExpandida] = useState(null);
  const niveisPermitidos = niveisPermitidosPara(data, usuario, role);
  const sigiloInicial = niveisPermitidos.includes("Restrito") ? "Restrito" : niveisPermitidos[0] || "Público";
  const [form, setForm] = useState({ titulo: "", desc: "", participants: [], objetivosText: "", sigilo: sigiloInicial });

  const usuariosElegiveis = data.users
    .filter(u => u.role !== "contratante")
    .filter(u => podeReceberSigilo(data, u, form.sigilo));

  const mudarSigilo = (sigilo) => {
    const permitidos = new Set(
      data.users.filter(u => u.role !== "contratante" && podeReceberSigilo(data, u, sigilo)).map(u => u.username)
    );
    setForm(f => ({ ...f, sigilo, participants: f.participants.filter(p => permitidos.has(p)) }));
  };

  const toggleParticipante = (username) => {
    setForm(f => ({
      ...f,
      participants: f.participants.includes(username)
        ? f.participants.filter(x => x !== username)
        : [...f.participants, username],
    }));
  };

  const criar = () => {
    if (!form.titulo.trim() || form.participants.length === 0) return;
    const objetivos = form.objetivosText.split("\n").map(s => s.trim()).filter(Boolean).map(text => ({ text, done: false }));
    const nova = {
      id: uid(),
      titulo: form.titulo.trim(),
      desc: form.desc.trim(),
      assignedTo: form.participants[0],
      participants: form.participants,
      aceites: [],
      assignedBy: usuario.username,
      createdAt: new Date().toISOString(),
      objetivos,
      status: "atribuida",
      sigilo: normalizarSigilo(form.sigilo),
      source: "manual",
    };
    setData(d => ({ ...d, missoes: [...d.missoes, nova] }));
    setForm({ titulo: "", desc: "", participants: [], objetivosText: "", sigilo: sigiloInicial });
    setCriando(false);
  };

  const remover = (id) => {
    if (confirm("Remover esta missão? O contrato e os relatórios vinculados não serão apagados.")) {
      setData(d => ({ ...d, missoes: d.missoes.filter(m => m.id !== id) }));
    }
  };

  const atualizar = (id, patch) => setData(d => ({
    ...d,
    missoes: d.missoes.map(m => m.id === id ? { ...m, ...patch, updatedAt: new Date().toISOString() } : m),
  }));

  const iniciarPelaLideranca = (m) => {
    if (!confirm(`Iniciar "${m.titulo}" mesmo sem todas as confirmações?`)) return;
    atualizar(m.id, { status: "andamento", startedAt: m.startedAt || new Date().toISOString() });
  };

  const devolverParaAjustes = (m) => {
    const feedback = prompt("Explique quais ajustes o operador deve fazer no relatório:", m.feedbackRevisao || "");
    if (feedback == null || !feedback.trim()) return;
    setData(d => ({
      ...d,
      missoes: d.missoes.map(x => x.id === m.id ? {
        ...x,
        status: "devolvida",
        feedbackRevisao: feedback.trim(),
        devolvidaEm: new Date().toISOString(),
        devolvidaPor: usuario.username,
      } : x),
      relatorios: (d.relatorios || []).map(r => r.id === m.relatorioFinalId ? {
        ...r,
        statusAprovacao: "Ajustes solicitados",
        feedbackAprovacao: feedback.trim(),
        revisadoPor: usuario.username,
        revisadoEm: new Date().toISOString(),
      } : r),
    }));
  };

  const aprovarResultado = (m) => {
    const relatorio = (data.relatorios || []).find(r => r.id === m.relatorioFinalId);
    if (!relatorio) { alert("Relatório final não encontrado."); return; }
    const falhou = relatorio.resultado === "Falha";
    const statusFinal = falhou ? "falhou" : "concluida";
    const statusContrato = falhou ? "Falhou" : "Concluído";
    const texto = falhou ? "confirmar a falha da operação" : "aprovar a conclusão da operação";
    if (!confirm(`Deseja ${texto}? O contrato vinculado também será atualizado.`)) return;

    setData(d => ({
      ...d,
      missoes: d.missoes.map(x => x.id === m.id ? {
        ...x,
        status: statusFinal,
        concluidaEm: new Date().toISOString(),
        aprovadaPor: usuario.username,
        feedbackRevisao: "",
      } : x),
      relatorios: (d.relatorios || []).map(r => r.id === m.relatorioFinalId ? {
        ...r,
        statusAprovacao: "Aprovado",
        aprovadoPor: usuario.username,
        aprovadoEm: new Date().toISOString(),
      } : r),
      contratos: (d.contratos || []).map(c => c.id === m.contratoId ? {
        ...c,
        status: statusContrato,
        finalizadoEm: new Date().toISOString(),
        resultadoMissao: relatorio.resultado,
        relatorioFinalId: relatorio.id,
      } : c),
    }));
  };

  const arquivar = (m) => {
    if (!confirm(`Arquivar a missão "${m.titulo}"?`)) return;
    atualizar(m.id, { status: "arquivada", arquivadaEm: new Date().toISOString() });
  };

  const todas = (data.missoes || []).slice().sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  const ativas = todas.filter(m => !MISSAO_STATUS_TERMINAIS.includes(m.status));
  const encerradas = todas.filter(m => MISSAO_STATUS_TERMINAIS.includes(m.status));
  const missoes = filtro === "Ativas" ? ativas : filtro === "Encerradas" ? encerradas : todas;

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div>
          <h3 className="text-orange-50 font-bold text-lg serif">Centro de Operações ({todas.length})</h3>
          <p className="text-zinc-600 text-xs">Atribuição → aceite → execução → relatório → aprovação → encerramento.</p>
        </div>
        {!criando && <Btn onClick={() => setCriando(true)} variant="primary"><IPlus className="w-3 h-3" /> Nova Missão</Btn>}
      </div>

      {criando && (
        <div className="p-4 bg-zinc-950/80 border border-orange-700 rounded-lg space-y-3 fadein">
          <h4 className="text-orange-50 font-bold">Nova Missão</h4>
          <div className="grid sm:grid-cols-[220px_1fr] gap-3 items-start">
            <div>
              <label className="fox-label">Classificação de sigilo</label>
              <select value={form.sigilo} onChange={(e) => mudarSigilo(e.target.value)} className="fox-input">
                {niveisPermitidos.map(n => <option key={n}>{n}</option>)}
              </select>
            </div>
            <div className={`p-3 rounded border ${sigiloConfig(form.sigilo).border} ${sigiloConfig(form.sigilo).bg}`}>
              <div className="mb-1"><SigiloBadge sigilo={form.sigilo} /></div>
              <p className="text-zinc-500 text-xs leading-relaxed">{sigiloConfig(form.sigilo).desc}</p>
            </div>
          </div>
          <div>
            <label className="fox-label">Escalar operadores autorizados *</label>
            <div className="grid sm:grid-cols-2 gap-2 p-3 bg-black border border-zinc-800 rounded max-h-56 overflow-y-auto">
              {usuariosElegiveis.map(u => (
                <label key={u.username} className="flex items-center gap-2 text-sm text-zinc-300 cursor-pointer p-1 hover:text-orange-300">
                  <input type="checkbox" checked={form.participants.includes(u.username)} onChange={() => toggleParticipante(u.username)} className="w-4 h-4 accent-orange-600" />
                  <span>{u.codinome || u.displayName || u.username} <span className="text-zinc-700">(@{u.username})</span></span>
                </label>
              ))}
            </div>
            <div className="text-zinc-600 text-[10px] mt-1">
              O primeiro operador selecionado será o responsável principal. A lista já respeita a autorização exigida por {sigiloConfig(form.sigilo).codigo}.
            </div>
          </div>
          <div><label className="fox-label">Título *</label><input value={form.titulo} onChange={(e) => setForm({...form, titulo: e.target.value})} className="fox-input" placeholder="Ex: Infiltração em Kirigakure" /></div>
          <div><label className="fox-label">Descrição</label><textarea value={form.desc} onChange={(e) => setForm({...form, desc: e.target.value})} rows="3" className="fox-input" placeholder="Contexto, objetivo geral, riscos e limites..." /></div>
          <div><label className="fox-label">Objetivos (um por linha)</label>
            <textarea value={form.objetivosText} onChange={(e) => setForm({...form, objetivosText: e.target.value})} rows="5" className="fox-input" placeholder="Mapear o perímetro&#10;Identificar o alvo&#10;Relatar em 48h" />
          </div>
          <div className="flex gap-2 pt-2 border-t border-zinc-800">
            <Btn onClick={() => setCriando(false)} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
            <Btn onClick={criar} variant="primary" disabled={!form.titulo.trim() || form.participants.length === 0}><ISave className="w-3 h-3" /> Atribuir Missão</Btn>
          </div>
        </div>
      )}

      <div className="flex gap-2 flex-wrap">
        {["Ativas", "Encerradas", "Todas"].map(f => {
          const count = f === "Ativas" ? ativas.length : f === "Encerradas" ? encerradas.length : todas.length;
          return <button key={f} onClick={() => setFiltro(f)} className={`px-3 py-1.5 rounded text-xs uppercase tracking-wider font-bold border ${filtro === f ? "bg-orange-700 border-orange-600 text-white" : "bg-zinc-950 border-zinc-800 text-zinc-500"}`}>{f} ({count})</button>;
        })}
      </div>

      {missoes.length === 0 && !criando && (
        <div className="p-8 text-center bg-zinc-950/50 border border-zinc-800 rounded-lg text-zinc-600 italic">Nenhuma missão neste filtro.</div>
      )}

      <div className="space-y-3">
        {missoes.map((m) => {
          const c = statusMissaoConfig(m.status);
          const sigilo = normalizarSigilo(m.sigilo);
          const autorizado = podeVerItemSigiloso(m, data, usuario, role);
          if (!autorizado) return <ConteudoCensurado key={m.id} sigilo={sigilo} tipo="OPERAÇÃO" />;
          const participantes = participantesDaMissao(m);
          const objetivos = m.objetivos || [];
          const prog = objetivos.length > 0 ? Math.round(objetivos.filter(o => o.done).length / objetivos.length * 100) : 0;
          const relatorio = m.relatorioFinalId ? (data.relatorios || []).find(r => r.id === m.relatorioFinalId) : null;
          const contrato = m.contratoId ? (data.contratos || []).find(x => x.id === m.contratoId) : null;
          const expanded = expandida === m.id;
          return (
            <div key={m.id} className={`p-4 rounded-lg border ${c.border} ${c.bg}`}>
              <div className="flex items-start justify-between gap-2">
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2 flex-wrap mb-1">
                    <h4 className="text-orange-50 font-bold">{m.titulo}</h4>
                    <span className={`text-xs px-2 py-0.5 rounded font-bold uppercase tracking-wider ${c.badge}`}>{c.label}</span>
                    <SigiloBadge sigilo={sigilo} compacto />
                    {m.contratoId && <span className="text-[10px] px-2 py-0.5 rounded border border-red-800 text-red-300 uppercase tracking-wider">Contrato</span>}
                  </div>
                  <div className="text-zinc-500 text-xs">
                    → {participantes.map(p => data.users.find(u => u.username === p)?.codinome || data.users.find(u => u.username === p)?.displayName || p).join(", ")}
                    {participantes.length > 0 && <span className="text-zinc-700"> · {(m.aceites || []).length}/{participantes.length} aceitaram</span>}
                  </div>
                </div>
                <div className="flex gap-1">
                  <button onClick={() => setExpandida(expanded ? null : m.id)} className="text-orange-400 p-1" title="Detalhes">{expanded ? "−" : "+"}</button>
                  <button onClick={() => remover(m.id)} className="text-red-500 p-1" title="Remover"><ITrash className="w-4 h-4" /></button>
                </div>
              </div>

              {m.desc && <p className="text-zinc-400 text-sm mt-2">{m.desc}</p>}
              {objetivos.length > 0 && <div className="text-xs text-zinc-500 mt-2">{objetivos.filter(o => o.done).length}/{objetivos.length} objetivos · {prog}%</div>}

              {expanded && (
                <div className="mt-4 pt-4 border-t border-zinc-800 space-y-3 fadein">

// Migra dados antigos garantindo que novos campos existam
function migrate(raw) {
  if (!raw || !raw.users) raw = DEFAULT_DATA;
  const migrated = { ...DEFAULT_DATA, ...raw };
  if (!raw.clas) {
    migrated.clas = [
      { ...DEFAULT_CLAS[0], figuras: raw.sokeFiguras || [] },
      { ...DEFAULT_CLAS[1], figuras: raw.bunkeFiguras || [] },
    ];
  }
  if (!raw.historia) migrated.historia = DEFAULT_HISTORIA;
  if (!raw.mandamentos || !Array.isArray(raw.mandamentos) || raw.mandamentos.length === 0) {
    migrated.mandamentos = DEFAULT_MANDAMENTOS;
  }
  if (!raw.relatorios) migrated.relatorios = [];
  migrated.relatorios = (raw.relatorios || []).map(r => ({
    ...r,
    confidencialidade: normalizarSigilo(r.confidencialidade || "Restrito"),
  }));
  if (!raw.contratos) migrated.contratos = [];
  if (!raw.galeria) migrated.galeria = [];
  if (!raw.activityLog) migrated.activityLog = [];
  if (!raw.missoes) migrated.missoes = [];
  migrated.missoes = (raw.missoes || []).map(m => {
    const participants = Array.from(new Set([...(Array.isArray(m.participants) ? m.participants : []), m.assignedTo].filter(Boolean)));
    const status = m.status === "pendente" ? "atribuida" : (m.status || "atribuida");
    const jaEstavaEmExecucao = ["aceita", "andamento", "revisao", "devolvida", "concluida", "falhou", "arquivada"].includes(status);
    return {
      ...m,
      participants,
      aceites: Array.isArray(m.aceites) ? m.aceites : (jaEstavaEmExecucao ? participants : []),
      objetivos: Array.isArray(m.objetivos) ? m.objetivos : [],
      status,
      sigilo: normalizarSigilo(m.sigilo || "Restrito"),
      source: m.source || (m.contratoId ? "contrato" : "manual"),
    };
  });
  if (!raw.visaoGeralContratantes) migrated.visaoGeralContratantes = DEFAULT_DATA.visaoGeralContratantes;
  // Garante o formato completo do dossiê sem apagar campos antigos.
  migrated.users = (raw.users || DEFAULT_USERS).map(u => normalizarMembro({
    ...u,
    codinome: u.codinome != null ? u.codinome : "",
    cla: u.cla != null ? u.cla : "",
  }, true));
  // Preserva juramentos antigos, normaliza os registros e reconhece quem já realizou o pacto.
  migrated.juramentados = (Array.isArray(raw.juramentados) ? raw.juramentados : []).map((j, index) => ({
    ...j,
    id: j.id || "juramento_legado_" + (j.username || slugEstrutura(j.nome) || index),
    fotoUrl: j.fotoUrl || "",
    versao: Number(j.versao) || 1,
    origem: j.origem || "legado",
  }));
  migrated.users = migrated.users.map(u => {
    const juramentoExistente = juramentoDoUsuario(migrated.juramentados, u);
    if (!juramentoExistente) return u;
    const nivelAtual = lealdadeConfig(u.lealdade).indice;
    const nivelJuramentado = lealdadeConfig("Juramentado").indice;
    return {
      ...u,
      iniciacaoStatus: "concluida",
      iniciacaoConcluidaEm: u.iniciacaoConcluidaEm || juramentoExistente.data || new Date().toISOString(),
      iniciacaoVersao: Number(u.iniciacaoVersao) || 1,
      lealdade: nivelAtual < nivelJuramentado ? "Juramentado" : u.lealdade,
      lealdadeNota: u.lealdadeNota || "Juramento anterior reconhecido e preservado pelo Protocolo de Iniciação.",
    };
  });
  // Liga integrantes antigos dos trios a usernames reais e cria IDs estáveis.
  migrated.trios = (raw.trios || DEFAULT_TRIOS).map((t, i) => ({
    ...t,
    id: t.id || `trio_${slugEstrutura(t.nome) || i}`,
    membros: (t.membros || []).map(m => {
      const encontrado = m.username ? migrated.users.find(u => u.username === m.username) : usuarioPorIdentidade(migrated.users, m.nome);
      return { ...m, username: m.username || encontrado?.username || "" };
    }),
  }));
  // Garante cargos protegidos + permissions[]
  let rolesOut = (raw.roles || DEFAULT_ROLES).map(r => ({
    ...r,
    permissions: Array.isArray(r.permissions) ? r.permissions : [],
  }));
  if (!rolesOut.find(r => r.id === "contratante")) {
    rolesOut.push({ id: "contratante", nome: "Contratante", hasLeaderPerms: false, protected: true, cor: "#22C55E", permissions: [] });
  }
  // Rebaixa conselheiro: agora usa permissões granulares
  rolesOut = rolesOut.map(r => {
    if (r.id === "conselheiro" && r.hasLeaderPerms === true) {
      return { ...r, hasLeaderPerms: false, permissions: r.permissions.length > 0 ? r.permissions : ["manage_users", "manage_missions"] };
    }
    return r;
  });
  migrated.roles = rolesOut;
  migrated.armas = (raw.armas || DEFAULT_ARMAS).map((a, i) => a.id ? a : { ...a, id: `arma_${i}_${Date.now().toString(36)}` });
  migrated.fases = (migrated.fases || DEFAULT_FASES).map((fase, index) => normalizarFaseEstrategica(fase, index));
  migrated.sinaisEstrategicos = Array.isArray(migrated.sinaisEstrategicos) ? migrated.sinaisEstrategicos : [];
  return migrated;
}

function MusicPlayer() {
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [muted, setMuted] = useState(true);
  const unmutedOnce = useRef(false);

  useEffect(() => {
    const a = audioRef.current;
    if (!a) return;
    a.volume = 0.5;
    a.muted = true;
    a.play().then(() => setPlaying(true)).catch(() => setPlaying(false));

    // Função global que o LoginScreen chama no clique de "Entrar nas Sombras"
    window.foxStartMusic = () => {
      if (unmutedOnce.current) return;
      unmutedOnce.current = true;
      const audio = audioRef.current;
      if (!audio) return;
      audio.muted = false;
      audio.volume = 0.5;
      setMuted(false);
      audio.play().then(() => setPlaying(true)).catch((err) => console.warn("autoplay falhou:", err));
    };

    // Fallback: desmuta no PRIMEIRO clique/toque/tecla em qualquer lugar (caso usuário já esteja logado e recarregue)
    const ativarSom = () => {
      if (unmutedOnce.current) return;
      window.foxStartMusic();
    };
    window.addEventListener("click", ativarSom, { once: true });
    window.addEventListener("touchstart", ativarSom, { once: true });
    window.addEventListener("keydown", ativarSom, { once: true });
    return () => {
      window.removeEventListener("click", ativarSom);
      window.removeEventListener("touchstart", ativarSom);
      window.removeEventListener("keydown", ativarSom);
      delete window.foxStartMusic;
    };
  }, []);

  const toggle = () => {
    const a = audioRef.current;
    if (!a) return;
    if (playing) { a.pause(); setPlaying(false); }
    else { a.play().then(() => setPlaying(true)).catch(() => {}); }
  };
  const toggleMute = () => {
    const a = audioRef.current;
    if (!a) return;
    a.muted = !a.muted;
    setMuted(a.muted);
    unmutedOnce.current = true;
    if (!a.muted && !playing) { a.play().then(() => setPlaying(true)).catch(() => {}); }
  };

  return (
    <div className="fixed bottom-20 right-3 sm:bottom-4 sm:right-4 z-40 bg-black/90 backdrop-blur border border-orange-700/60 rounded-full shadow-2xl flex items-center gap-2 px-3 py-2 max-w-[calc(100vw-1.5rem)]">
      <audio
        ref={audioRef}
        src="https://jikkai.vercel.app/themesong.mp3"
        loop
        preload="auto"
        crossOrigin="anonymous"
        onError={(e) => console.error("erro audio:", e)}
      />
      <button onClick={toggle} className="text-orange-400 hover:text-orange-300 p-1 text-sm" title={playing ? "Pausar" : "Tocar"}>
        {playing ? "⏸" : "▶"}
      </button>
      <button onClick={toggleMute} className="text-orange-400 hover:text-orange-300 p-1 text-sm" title={muted ? "Ativar som" : "Mudo"}>
        {muted ? "🔇" : "🔊"}
      </button>
      <span className="text-[9px] uppercase tracking-wider text-orange-600 pr-1 hidden sm:inline">F.O.X. Theme</span>
    </div>
  );
}

function App() {
  const [usuario, setUsuario] = useState(null);

  const [mobileMoreOpen, setMobileMoreOpen] = useState(false);
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saveStatus, setSaveStatus] = useState({ cloudOk: null, localOk: true, time: null, syncing: false });
  const isRemoteUpdate = useRef(false);
  const saveTimeoutRef = useRef(null);

  // Initial load + realtime subscription
  useEffect(() => {
    let subscription = null;
    (async () => {
      const loaded = await loadState();
      setData(migrate(loaded));
      setLoading(false);

      if (cloudClient) {
        subscription = cloudClient
          .channel("fox_state_changes")
          .on("postgres_changes", { event: "*", schema: "public", table: "fox_state" }, (payload) => {
            const newData = payload.new?.data;
            if (newData && Object.keys(newData).length > 0) {
              setData((current) => {
                const migrated = migrate(newData);
                if (JSON.stringify(current) === JSON.stringify(migrated)) return current;
                isRemoteUpdate.current = true;
                return migrated;
              });
            }
          })
          .subscribe();
      }
    })();
    return () => { if (subscription) subscription.unsubscribe(); };
  }, []);

  // Debounced save whenever data changes
  useEffect(() => {
    if (!data || loading) return;
    if (isRemoteUpdate.current) { isRemoteUpdate.current = false; return; }
    setSaveStatus(s => ({ ...s, syncing: true }));
    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(async () => {
      const res = await saveStateAsync(data);
      setSaveStatus({ ...res, time: new Date(), syncing: false });
    }, 500);
  }, [data, loading]);

  const usuarioAtual = usuario && data ? data.users.find(u => u.username === usuario.username) || usuario : null;
  const role = usuarioAtual && data ? data.roles.find(r => r.id === usuarioAtual.role) : null;


  // Compartilha a identidade e o cargo da sessão atual com o mapa estratégico.
  // A senha ainda é exigida antes de qualquer alteração cartográfica.
  useEffect(() => {
    try {
      if (usuarioAtual && role) {
        localStorage.setItem("fox-map-viewer", JSON.stringify({
          username: usuarioAtual.username,
          roleId: role.id,
          updatedAt: new Date().toISOString(),
        }));
      } else {
        localStorage.removeItem("fox-map-viewer");
      }
    } catch {}
  }, [usuarioAtual?.username, role?.id]);
  const isLider = role?.hasLeaderPerms === true;
  const podeGerenciar = isLider || hasPerm(role, "manage_users") || hasPerm(role, "manage_missions") || hasPerm(role, "manage_roles");
  const isContratante = usuarioAtual?.role === "contratante";
  const meuJuramento = juramentoDoUsuario(data?.juramentados, usuarioAtual);
  const nivelAcesso = nivelAcessoUsuario(data, usuarioAtual, role);
  const minhaAutorizacao = SIGILO_NIVEIS[Math.max(0, nivelAcesso - 1)] || "Público";
  const minhasMissoesCount = usuarioAtual && data ? data.missoes.filter(m => usuarioParticipaMissao(m, usuarioAtual.username) && !MISSAO_STATUS_TERMINAIS.includes(m.status)).length : 0;

  // Se contratante e tab não permitida, força "visaogeral"
  useEffect(() => {
    if (isContratante && tab !== "visaogeral" && tab !== "jikkai" && tab !== "arquivos") {
      setTab("visaogeral");
    }
  }, [isContratante, tab]);

  const exportar = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `fox-portal-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const importar = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const novo = JSON.parse(ev.target.result);
        if (!novo.users || !novo.roles) throw new Error("Backup inválido");
        if (confirm("Isso substituirá TODOS os dados atuais (e serão sincronizados com a nuvem se ativada). Continuar?")) {
          setData(novo);
          alert("Backup restaurado!");
        }
      } catch (err) { alert("Arquivo inválido: " + err.message); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const juramentar = (dados) => setData(d => {
    const registros = Array.isArray(d.juramentados) ? d.juramentados : [];
    const existente = juramentoDoUsuario(registros, { username: dados.username, displayName: dados.nome, nomeRP: dados.nome, codinome: dados.nome });
    const registro = {
      ...existente,
      ...dados,
      id: dados.id || existente?.id || "juramento_" + uid(),
      fotoUrl: dados.fotoUrl || existente?.fotoUrl || "",
      versao: Number(dados.versao) || Number(existente?.versao) || 2,
      origem: dados.origem || existente?.origem || "portal",
    };
    const juramentados = existente
      ? registros.map(j => j === existente ? registro : j)
      : [...registros, registro];
    return {
      ...d,
      juramentados,
      users: d.users.map(u => {
        if (u.username !== dados.username) return u;
        const atual = lealdadeConfig(u.lealdade).indice;
        const juramentado = lealdadeConfig("Juramentado").indice;
        return {
          ...u,
          nomeRP: u.nomeRP || dados.nome || u.displayName,
          linhagem: u.linhagem || dados.linhagem || "",
          elemento: u.elemento || dados.elemento || "",
          lealdade: atual < juramentado ? "Juramentado" : u.lealdade,
          lealdadeAtualizadaEm: new Date().toISOString(),
          lealdadeNota: u.lealdadeNota || "Juramento formal registrado pelo portal.",
        };
      }),
      activityLog: [...(d.activityLog || []), atividade(existente ? "juramento_atualizado" : "juramento_registrado", dados.username, dados.username, existente ? "Atualizou o próprio registro de juramento" : "Concluiu o juramento e alcançou a lealdade Juramentado")],
    };
  });
  const removerJuramento = (idx) => setData(d => ({ ...d, juramentados: d.juramentados.filter((_, i) => i !== idx) }));
  const concluirIniciacao = (username) => setData(d => ({
    ...d,
    users: d.users.map(u => u.username === username ? {
      ...u,
      iniciacaoStatus: "concluida",
      iniciacaoConcluidaEm: new Date().toISOString(),
      iniciacaoVersao: 1,
    } : u),
    activityLog: [...(d.activityLog || []), atividade("iniciacao_concluida", username, username, "Concluiu o Protocolo de Iniciação da Jikkai")],
  }));

  if (loading || !data) {
    return (
      <div className="min-h-screen bg-black flex items-center justify-center">
        <div className="text-center">
          <IFlame className="w-12 h-12 text-orange-500 pulse-fire mx-auto mb-4" />
          <div className="text-orange-400 text-sm uppercase tracking-widest">Conectando ao portal...</div>
        </div>
      </div>
    );
  }

  if (!usuarioAtual) return <LoginScreen data={data} onLogin={setUsuario} />;

  if (!isContratante && !isLider && usuarioAtual.iniciacaoStatus === "pendente") {
    return <IntroducaoPrimeiroAcesso
      data={data}
      usuario={usuarioAtual}
      juramentado={meuJuramento}
      juramentar={juramentar}
      onAtualizarPerfil={(patch) => setData(d => ({
        ...d,
        users: d.users.map(u => {
          if (u.username !== usuarioAtual.username) return u;
          const atualizado = { ...u, ...patch };
          return { ...atualizado, perfilCompleto: perfilCompletoUsuario(atualizado) };
        }),
        activityLog: [...(d.activityLog || []), atividade("foto_iniciacao_atualizada", usuarioAtual.username, usuarioAtual.username, "Atualizou a foto durante a identificação de primeiro acesso")],
      }))}
      onConcluir={() => concluirIniciacao(usuarioAtual.username)}
      onLogout={() => setUsuario(null)}
    />;
  }

  const TABS = isContratante ? [
    { id: "visaogeral", label: "Visão Geral", icon: IBriefcase },
    { id: "jikkai", label: "Contratos F.O.X.", icon: ITarget },
    { id: "arquivos", label: "Arquivo Público", icon: ILock },
  ] : [
    { id: "home", label: "Visão Geral", icon: IFlame },
    { id: "historia", label: "História", icon: IBook },
    { id: "cla", label: "Clã Lamona", icon: ICrown },
    { id: "membros", label: "Membros", icon: IUsers },
    { id: "jikkai", label: "JIKKAI", icon: ITarget },
    { id: "armas", label: "Armas", icon: IShield },
    { id: "missoes", label: `Missões${minhasMissoesCount > 0 ? ` (${minhasMissoesCount})` : ""}`, icon: IClipboard },
    { id: "juramento", label: "Juramento", icon: ISkull },
    ...(isLider ? [
      { id: "visaogeral", label: "Vitrine", icon: IBriefcase },
    ] : []),
    ...(podeGerenciar ? [
      { id: "gerenciar", label: "Gerenciar", icon: ISettings },
    ] : []),
  ];

  const mobilePrimaryIds = isContratante
    ? ["visaogeral", "jikkai", "arquivos"]
    : ["home", "historia", "membros", "jikkai"];
  const mobilePrimaryTabs = TABS.filter(t => mobilePrimaryIds.includes(t.id));
  const mobileMoreTabs = TABS.filter(t => !mobilePrimaryIds.includes(t.id) && t.id !== "cla");
  const mobileMoreActive = mobileMoreTabs.some(t => t.id === tab);
  const selecionarTabMobile = (id) => {
    setTab(id);
    setMobileMoreOpen(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  // Sync indicator
  const syncIndicator = (() => {
    if (!CLOUD_ENABLED) {
      return <div className="text-yellow-600 text-[9px]" title="Modo local — dados não compartilhados">⚠ Local</div>;
    }
    if (saveStatus.syncing) return <div className="text-zinc-400 text-[9px]">⟳ Sincronizando...</div>;
    if (saveStatus.cloudOk === true) return <div className="text-green-500 text-[9px] flex items-center gap-1"><ICheck className="w-3 h-3" />Sincronizado</div>;
    if (saveStatus.cloudOk === false) return <div className="text-red-500 text-[9px]">⚠ Erro sync</div>;
    return <div className="text-zinc-600 text-[9px]">—</div>;
  })();

  return (
    <div className="min-h-screen bg-black text-zinc-200">
      <header className="border-b border-orange-900/30 bg-black/80 backdrop-blur sticky top-0 z-10">
        <div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <div className="p-2 rounded-full border border-orange-700 flex-shrink-0">
              <IFlame className="w-5 h-5 text-orange-500" />
            </div>
            <div className="min-w-0">
              <div className="text-orange-50 font-black tracking-widest serif">F.O.X.</div>
              <div className="text-zinc-600 text-[10px] uppercase tracking-widest truncate">Clã Lamona</div>
            </div>
          </div>
          <div className="flex items-center gap-3 flex-shrink-0">
            <MemberAvatar user={usuarioAtual} size="sm" className="hidden sm:flex" />
            <div className="text-right hidden sm:block">
              <div className="text-orange-300 text-xs font-bold uppercase tracking-wider truncate max-w-[160px]">{getCodinome(usuarioAtual)}</div>
              {!isContratante && usuarioAtual.displayName && (
                <div className="text-zinc-600 text-[9px] truncate max-w-[160px]">{usuarioAtual.displayName}</div>
              )}
              <div className="text-[9px]" style={{ color: role?.cor || "#71717a" }}>{role?.nome || usuarioAtual.role}</div>
              <div className="text-[8px] text-zinc-600 uppercase tracking-wider">{sigiloConfig(minhaAutorizacao).codigo} · {minhaAutorizacao}</div>
            </div>
            <div className="text-right hidden md:block">{syncIndicator}</div>
            <button onClick={() => setUsuario(null)} className="p-2 text-zinc-500 hover:text-red-500 transition-colors">
              <ILogout className="w-4 h-4" />
            </button>
          </div>
        </div>
        <nav className="hidden sm:block border-t border-zinc-900 bg-black/60">
          <div className="max-w-6xl mx-auto px-2 flex overflow-x-auto">
            {TABS.map((t) => {
              const I = t.icon;
              const active = tab === t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)} className={`flex items-center gap-2 px-4 py-3 text-xs uppercase tracking-wider whitespace-nowrap border-b-2 transition-colors ${active ? "border-orange-600 text-orange-400" : "border-transparent text-zinc-600 hover:text-zinc-300"}`}>
                  <I className="w-3.5 h-3.5" />
                  {t.label}
                </button>
              );
            })}
          </div>
        </nav>
      </header>

      <main className="max-w-6xl mx-auto px-3 sm:px-4 py-4 sm:py-8 pb-28 sm:pb-8">
        {tab === "home" && !isContratante && <HomePage data={data} usuario={usuarioAtual} missoesCount={minhasMissoesCount} />}
        {tab === "historia" && !isContratante && <HistoriaPage data={data} setData={setData} role={role} usuario={usuarioAtual} />}
        {tab === "cla" && !isContratante && <ClaPage data={data} setData={setData} role={role} />}
        {tab === "membros" && !isContratante && <MembrosPage data={data} setData={setData} role={role} usuario={usuarioAtual} viewerIsContratante={isContratante} />}
        {tab === "jikkai" && <JikkaiPage data={data} setData={setData} isLider={isLider} usuario={usuarioAtual} role={role} viewerIsContratante={isContratante} />}
        {tab === "armas" && !isContratante && <ArmasPage data={data} setData={setData} isLider={isLider} />}
        {tab === "missoes" && !isContratante && <MinhasMissoesPage data={data} setData={setData} usuario={usuarioAtual} role={role} />}
        {tab === "juramento" && !isContratante && <JuramentoPage usuario={usuarioAtual} juramentado={meuJuramento} juramentar={juramentar} juramentados={data.juramentados} removerJuramento={removerJuramento} isLider={isLider} data={data} />}
        {tab === "visaogeral" && <VisaoGeralContratantes data={data} setData={setData} isLider={isLider} />}
        {tab === "arquivos" && isContratante && <ArquivoPublicoPage data={data} />}
        {tab === "gerenciar" && podeGerenciar && <GerenciarPage data={data} setData={setData} usuario={usuarioAtual} role={role} exportar={exportar} importar={importar} />}
      </main>

      {mobileMoreOpen && (
        <div className="sm:hidden fixed inset-0 z-[90]">
          <button aria-label="Fechar menu" onClick={() => setMobileMoreOpen(false)} className="absolute inset-0 bg-black/80 backdrop-blur-sm" />
          <div className="mobile-sheet-panel absolute inset-x-0 bottom-0 rounded-t-3xl border-t border-orange-800 bg-zinc-950 shadow-2xl overflow-y-auto">
            <div className="sticky top-0 z-10 bg-zinc-950/95 backdrop-blur border-b border-zinc-800 px-4 py-4 flex items-center justify-between">
              <div><div className="text-[9px] uppercase tracking-[0.3em] text-orange-600">Navegação</div><div className="text-lg font-black text-orange-50 serif">Mais opções</div></div>
              <button onClick={() => setMobileMoreOpen(false)} className="mobile-tap flex items-center justify-center rounded-full border border-zinc-800 text-zinc-400"><IX className="w-5 h-5" /></button>
            </div>
            <div className="p-3 grid grid-cols-2 gap-2">
              {mobileMoreTabs.map(t => { const I = t.icon; return (
                <button key={t.id} onClick={() => selecionarTabMobile(t.id)} className={`min-h-20 rounded-xl border p-3 flex flex-col items-center justify-center gap-2 text-center ${tab === t.id ? "border-orange-600 bg-orange-950/40 text-orange-300" : "border-zinc-800 bg-black/50 text-zinc-400"}`}>
                  <I className="w-5 h-5" /><span className="text-[10px] uppercase tracking-wider font-bold leading-tight">{t.label}</span>
                </button>
              ); })}
              {!isContratante && <a href="./mapa.html" className="min-h-20 rounded-xl border border-sky-900 bg-sky-950/20 p-3 flex flex-col items-center justify-center gap-2 text-sky-300 text-center"><ITarget className="w-5 h-5" /><span className="text-[10px] uppercase tracking-wider font-bold">Mapa Estratégico</span></a>}
              <button onClick={() => { setUsuario(null); setMobileMoreOpen(false); }} className="min-h-20 rounded-xl border border-red-900 bg-red-950/20 p-3 flex flex-col items-center justify-center gap-2 text-red-300"><ILogout className="w-5 h-5" /><span className="text-[10px] uppercase tracking-wider font-bold">Sair</span></button>
            </div>
          </div>
        </div>
      )}

      <nav className="sm:hidden fixed inset-x-0 bottom-0 z-[95] border-t border-orange-900/50 bg-black/95 backdrop-blur-xl mobile-safe-bottom">
        <div className="grid" style={{ gridTemplateColumns: `repeat(${mobilePrimaryTabs.length + 1}, minmax(0, 1fr))` }}>
          {mobilePrimaryTabs.map(t => { const I = t.icon; const active = tab === t.id; return (
            <button key={t.id} onClick={() => selecionarTabMobile(t.id)} className={`min-h-[62px] px-1 py-2 flex flex-col items-center justify-center gap-1 border-t-2 ${active ? "border-orange-500 text-orange-400 bg-orange-950/20" : "border-transparent text-zinc-600"}`}>
              <I className="w-5 h-5" /><span className="text-[8px] uppercase tracking-wide font-bold leading-none text-center">{t.id === "visaogeral" ? "Início" : t.label.replace(/ (.+)$/, "")}</span>
            </button>
          ); })}
          <button onClick={() => setMobileMoreOpen(true)} className={`min-h-[62px] px-1 py-2 flex flex-col items-center justify-center gap-1 border-t-2 ${mobileMoreOpen || mobileMoreActive ? "border-orange-500 text-orange-400 bg-orange-950/20" : "border-transparent text-zinc-600"}`}>
            <ISettings className="w-5 h-5" /><span className="text-[8px] uppercase tracking-wide font-bold">Mais</span>
          </button>
        </div>
      </nav>

      <footer className="border-t border-zinc-900 mt-10 sm:mt-16 pt-6 pb-28 sm:py-6 text-center text-zinc-700 text-xs">
        <p className="uppercase tracking-widest">F.O.X. · Clã Lamona · {new Date().getFullYear()}</p>
        <p className="italic mt-1">"Mais forte, mais livre, mais letal do que nunca."</p>
      </footer>
      <MusicPlayer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</html>
