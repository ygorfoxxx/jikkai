  /* jikkai-shadow-ops-v1: atmosfera de organização clandestina */
  @keyframes jikkai-scan { 0% { transform: translateY(-100%); opacity:.18; } 100% { transform: translateY(100%); opacity:.04; } }
  @keyframes jikkai-grid-drift { 0% { background-position: 0 0, 0 0; } 100% { background-position: 42px 78px, -68px 34px; } }
  @keyframes jikkai-terminal-caret { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  @keyframes jikkai-glitch { 0%,100% { transform:translate(0); filter:none; } 20% { transform:translate(-1px,1px); filter:contrast(1.25); } 40% { transform:translate(1px,-1px); } 60% { transform:translate(-1px,0); } 80% { transform:translate(1px,1px); } }
  @keyframes jikkai-bar { 0% { width:0%; } 18% { width:28%; } 48% { width:58%; } 72% { width:82%; } 100% { width:100%; } }
  @keyframes jikkai-pulse-ring { 0% { transform:scale(.86); opacity:.65; } 100% { transform:scale(1.25); opacity:0; } }
  .shadow-ops-bg {
    position:relative;
    background:
      radial-gradient(circle at 18% 12%, rgba(234,88,12,.18), transparent 34%),
      radial-gradient(circle at 86% 74%, rgba(153,27,27,.18), transparent 38%),
      #030303;
    overflow:hidden;
  }
  .shadow-ops-bg:before {
    content:"";
    position:absolute;
    inset:-40%;
    background-image:
      linear-gradient(rgba(234,88,12,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(234,88,12,.045) 1px, transparent 1px);
    background-size: 42px 42px, 42px 42px;
    animation:jikkai-grid-drift 15s linear infinite;
    transform:rotate(-7deg);
    pointer-events:none;
  }
  .shadow-ops-bg:after {
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(180deg, transparent 0%, rgba(234,88,12,.16) 48%, transparent 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 1px, transparent 3px, transparent 7px);
    mix-blend-mode:screen;
    animation:jikkai-scan 3.2s linear infinite;
    pointer-events:none;
  }
  .jikkai-terminal-card {
    position:relative;
    border:1px solid rgba(234,88,12,.48);
    background:linear-gradient(180deg, rgba(9,9,11,.94), rgba(0,0,0,.96));
    box-shadow:0 0 0 1px rgba(234,88,12,.08), 0 24px 90px rgba(0,0,0,.75), inset 0 0 40px rgba(124,45,18,.12);
  }
  .jikkai-terminal-card:before {
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:linear-gradient(90deg, transparent, rgba(234,88,12,.08), transparent);
    pointer-events:none;
  }
  .jikkai-caret:after { content:"_"; animation:jikkai-terminal-caret .9s step-end infinite; color:#fb923c; }
  .jikkai-glitch { animation:jikkai-glitch 1.45s steps(2,end) infinite; }
  .jikkai-loader-line { position:relative; overflow:hidden; background:#09090b; border:1px solid rgba(234,88,12,.35); }
  .jikkai-loader-line > span { display:block; height:100%; background:linear-gradient(90deg,#7f1d1d,#ea580c,#fed7aa); box-shadow:0 0 20px rgba(234,88,12,.65); animation:jikkai-bar 2.6s ease-in-out forwards; }
  .jikkai-status-line { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  .jikkai-ring { position:absolute; inset:-8px; border:1px solid rgba(234,88,12,.55); border-radius:999px; animation:jikkai-pulse-ring 1.4s ease-out infinite; }
  .jikkai-transition-overlay {
    position:fixed; inset:0; z-index:100000;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(5px);
    pointer-events:none;
  }
  .jikkai-transition-overlay .mini {
    width:min(420px, calc(100vw - 32px));
  }

function normalizarPosicaoEstrutura(role) {
  const valor = String(role?.estruturaPosicao || role?.estruturaNivel || "").trim();

  const nome = String(role?.nome || role?.id || "").toLowerCase();

  if (role?.id === "contratante" || /contratante|externo/.test(nome)) return "fora";
  return "operador";
}

function estruturaPosicaoRole(role) {
  return normalizarPosicaoEstrutura(role);

function normalizarMandamentosJikkai(lista) {
  const arr = Array.isArray(lista) ? lista.map(m => String(m || "").trim()).filter(Boolean) : [];
  const legadoLamona = arr.some(m => /Lamona|trai o clã|palavra do líder é lei/i.test(m));
  const igualLegado = arr.length === OLD_DEFAULT_MANDAMENTOS.length && arr.every((m, i) => m === OLD_DEFAULT_MANDAMENTOS[i]);
  if (!arr.length || legadoLamona || igualLegado) return [...DEFAULT_MANDAMENTOS];
  const cinco = arr.slice(0, DEFAULT_MANDAMENTOS.length);
  while (cinco.length < DEFAULT_MANDAMENTOS.length) cinco.push(DEFAULT_MANDAMENTOS[cinco.length]);

}

function nomeUsernamePara(username, users, viewerIsContratante) {

const REPUTACAO_NIVEIS = ["Baixo perfil", "Rumores locais", "Exposto", "Procurado", "Temido"];

function reputacaoConfig(valor) {
  return REPUTACAO_CFG[valor] || REPUTACAO_CFG[converterReputacaoLegada(valor)] || REPUTACAO_CFG["Baixo perfil"];
}

function lealdadeConfig(valor) {
  return LEALDADE_CFG[valor] || LEALDADE_CFG.Observado;
}

function condutaConfig(valor) {
  return CONDUTA_CFG[valor] || CONDUTA_CFG.Limpo;
}

function converterReputacaoLegada(valor) {
  const mapa = { "Desconhecido": "Baixo perfil", "Sussurros": "Rumores locais", "Temido": "Temido", "Procurado": "Procurado", "Lenda das Sombras": "Temido" };
  return mapa[valor] || valor || "Baixo perfil";
}

function ReputacaoBadge({ tipo, valor, compacto = false }) {
  const conduta = tipo === "conduta";
  const interno = tipo === "lealdade";
  const impacto = tipo === "impacto" || tipo === "reputacao";
  const valorNormalizado = impacto ? converterReputacaoLegada(valor) : (valor === "Pilar da F.O.X." ? "Pilar da Jikkai" : valor);
  const config = conduta ? condutaConfig(valorNormalizado) : interno ? lealdadeConfig(valorNormalizado) : reputacaoConfig(valorNormalizado);
  const Icone = conduta ? IAlert : interno ? IShield : ITarget;
  return (
    <span className={`inline-flex items-center gap-1 rounded border font-black uppercase tracking-wider ${config.badge} ${compacto ? "text-[8px] px-1.5 py-0.5" : "text-[10px] px-2 py-1"}`} title={config.desc}>
      <Icone className={compacto ? "w-2.5 h-2.5" : "w-3 h-3"} />
      {valorNormalizado || (conduta ? "Limpo" : interno ? "Observado" : "Baixo perfil")}
    </span>
  );
}

function registroConduta(tipo, ator, descricao) {
  return { id: uid(), tipo, ator: ator || "sistema", descricao: descricao || "Registro interno", data: new Date().toISOString() };
}

function indicadoresMembro(data, membro) {
  const username = membro?.username;
  const missoes = (data?.missoes || []).filter(m => usuarioParticipaMissao(m, username));
  const relatorios = (data?.relatorios || []).filter(r => r.autorUsername === username);
  const contratos = (data?.contratos || []).filter(c => c.aceitoPor === username || c.criadoPor === username);
  const concluidas = missoes.filter(m => m.status === "concluida").length;
  const falhas = missoes.filter(m => m.status === "falhou").length;
  const devolvidas = missoes.filter(m => m.status === "devolvida").length;
  const abertas = missoes.filter(m => !MISSAO_STATUS_TERMINAIS.includes(m.status)).length;
  const alertas = relatorios.filter(r => r.alertaJikkai).length;
  const contratosConcluidos = contratos.filter(c => c.status === "Concluído").length;
  const registros = Array.isArray(membro?.condutaRegistros) ? membro.condutaRegistros : [];
  const meritos = registros.filter(r => r.tipo === "merito").length;
  const advertencias = registros.filter(r => ["advertencia", "observacao", "suspensao"].includes(r.tipo)).length;

  let lealdadeSugerida = membro?.iniciacaoStatus !== "concluida" ? "Observado" : "Recruta";
  if (membro?.iniciacaoStatus === "concluida" && (concluidas >= 1 || relatorios.length >= 1)) lealdadeSugerida = "Juramentado";
  if (concluidas >= 3 && relatorios.length >= 3) lealdadeSugerida = "Veterano";
  if (concluidas >= 6 && relatorios.length >= 6 && falhas === 0) lealdadeSugerida = "Pilar da Jikkai";
  if (falhas >= 2 || advertencias >= 2) lealdadeSugerida = "Observado";

  let condutaSugerida = "Limpo";
  if (devolvidas >= 2 || falhas >= 1 || alertas >= 2 || advertencias >= 1) condutaSugerida = "Sob observação";
  if (advertencias >= 2 || falhas >= 2) condutaSugerida = "Advertido";
  if ((membro?.conduta || "") === "Suspenso") condutaSugerida = "Suspenso";
  if ((membro?.conduta || "") === "Risco interno") condutaSugerida = "Risco interno";

  let impactoSugerido = "Baixo perfil";
  if (alertas >= 1 || contratosConcluidos >= 1) impactoSugerido = "Rumores locais";
  if (alertas >= 3 || falhas >= 1) impactoSugerido = "Exposto";
  if ((membro?.reputacao || "") === "Procurado") impactoSugerido = "Procurado";
  if ((membro?.reputacao || "") === "Temido" || (membro?.reputacao || "") === "Lenda das Sombras") impactoSugerido = "Temido";

  const pontuacao = concluidas * 3 + relatorios.length * 2 + contratosConcluidos * 3 + meritos * 2 - falhas * 4 - devolvidas - advertencias * 3;
  const resumo = [
    `${concluidas} missão${concluidas === 1 ? "" : "ões"} concluída${concluidas === 1 ? "" : "s"}`,
    `${relatorios.length} relatório${relatorios.length === 1 ? "" : "s"}`,
    `${abertas} ativa${abertas === 1 ? "" : "s"}`,
    `${falhas} falha${falhas === 1 ? "" : "s"}`,
  ];
  return { missoes, relatorios, contratos, concluidas, falhas, devolvidas, abertas, alertas, contratosConcluidos, meritos, advertencias, pontuacao, lealdadeSugerida, condutaSugerida, impactoSugerido, resumo };
}

function podeEditarLealdadeConduta(data, viewer, viewerRole, alvo) {
  if (!viewer || !alvo) return false;
  const pos = estruturaPosicaoRole(viewerRole);
  if (isRootUser(viewer) || viewerRole?.hasLeaderPerms || pos === "lider" || pos === "conselheiro" || pos === "braco_direito") return true;
  if (pos === "capitao_ramo") {
    const divs = new Set(divisoesDoCapitao(data, viewer).map(d => d.id));
    return equipesJikkai(data).some(e => divs.has(e.divisaoId) && (e.membros || []).some(m => m.username === alvo.username));
  }
  return false;
}

  { id: "elemento", label: "Elemento", peso: 12 },

];

function valorDossie(u, campo) {
  if (!u) return "";
  if (campo === "avatarUrl") return u.avatarUrl || "";
  return String(u[campo] || "").trim();
}

function progressoDossieUsuario(u) {
  if (!u) return { pct: 0, completos: 0, total: DOSSIE_FIELDS.length, faltando: DOSSIE_FIELDS.map(f => f.label), essenciaisOk: false };
  let pontos = 0;
  const faltando = [];
  const totalPeso = DOSSIE_FIELDS.reduce((s, f) => s + (Number(f.peso) || 0), 0) || DOSSIE_FIELDS.length;
  DOSSIE_FIELDS.forEach(f => {
    if (valorDossie(u, f.id)) pontos += (Number(f.peso) || 0);
    else faltando.push(f.label);
  });
  const pct = Math.max(0, Math.min(100, Math.round((pontos / totalPeso) * 100)));
  const essenciaisOk = MEMBER_PROFILE_FIELDS.every(c => Boolean(valorDossie(u, c)));
  return { pct, completos: DOSSIE_FIELDS.length - faltando.length, total: DOSSIE_FIELDS.length, faltando, essenciaisOk };
}

function perfilCompletoUsuario(u) {
  if (!u) return false;
  const progresso = progressoDossieUsuario(u);
  return progresso.essenciaisOk && progresso.pct >= 70;
}

function funcaoOperacionalDoMembro(data, membro) {
  const equipe = trioDoUsuario(data, membro?.username);
  const vinculo = (equipe?.membros || []).find(m => m.username === membro?.username);
  const divisao = equipe ? divisoesJikkai(data).find(d => d.id === equipe.divisaoId) : null;
  return { equipe, vinculo, divisao };
}


function sugestoesDossieAutomaticas(data, membro) {
  const familia = familiaDoMembro(data, membro) || null;
  const { equipe, vinculo, divisao } = funcaoOperacionalDoMembro(data, membro);
  const role = (data?.roles || []).find(r => r.id === membro?.role);
  const especialidadePorEquipe = equipe?.tipo && equipe.tipo !== "Equipe" ? equipe.tipo : "";
  const funcaoPorEquipe = vinculo?.papel || (equipe?.liderUsername === membro?.username ? "Líder de equipe" : "");
  const estiloPorEspecialidade = (() => {
    const base = String(membro?.especialidade || especialidadePorEquipe || "").toLowerCase();
    if (base.includes("intel") || base.includes("recon") || base.includes("infil")) return "Furtivo";
    if (base.includes("suporte") || base.includes("méd") || base.includes("med")) return "Suporte";
    if (base.includes("defesa") || base.includes("escolta")) return "Defensivo";
    if (base.includes("ataque") || base.includes("executor")) return "Curta distância";
    return "";
  })();
  return {
    nomeRP: membro?.nomeRP || membro?.displayName || getCodinome(membro),
    linhagem: membro?.linhagem || familia?.nome || "",
    especialidade: membro?.especialidade || especialidadePorEquipe || "Operador Jikkai",
    funcaoPreferida: membro?.funcaoPreferida || funcaoPorEquipe || "Soldado",
    estiloCombate: membro?.estiloCombate || estiloPorEspecialidade,
    equipamentoPrincipal: membro?.equipamentoPrincipal || "",
    graduacaoShinobi: membro?.graduacaoShinobi || membro?.patente || role?.nome || "",
    divisaoNome: divisao?.nome || "Sem divisão",
    equipeNome: equipe?.nome || "Sem equipe",
    cargoNome: membro?.patente || role?.nome || membro?.role || "Membro",
  };
}

function timelineAutomaticaMembro(data, membro) {
  if (!membro) return [];
  const username = membro.username;
  const eventos = [];
  const add = (dataEvento, titulo, desc, tipo = "registro") => {
    if (!titulo) return;
    eventos.push({ id: uid(), data: dataEvento || new Date().toISOString(), titulo, desc: desc || "", tipo });
  };

  if (membro.criadoEm) add(membro.criadoEm, "Membro criado", "Registro aberto na Jikkai.", "dossie");
  if (membro.iniciacaoConcluidaEm) add(membro.iniciacaoConcluidaEm, "Iniciação concluída", "Protocolo de entrada finalizado.", "juramento");
  const { equipe, vinculo, divisao } = funcaoOperacionalDoMembro(data, membro);
  if (equipe) add(equipe.updatedAt || equipe.createdAt || membro.criadoEm || new Date().toISOString(), "Alocado em equipe", `${equipe.nome}${divisao ? " · " + divisao.nome : ""}${vinculo?.papel ? " · " + vinculo.papel : ""}`, "equipe");

  (data.missoes || []).filter(m => usuarioParticipaMissao(m, username)).forEach(m => {
    add(m.createdAt, "Missão atribuída", m.titulo, "missao");
    if (m.startedAt) add(m.startedAt, "Missão em andamento", m.titulo, "missao");
    if (m.relatorioFinalId) add(m.relatorioEnviadoEm || m.updatedAt || m.createdAt, "Relatório final enviado", m.titulo, "relatorio");
    if (m.concluidaEm) add(m.concluidaEm, statusMissaoConfig(m.status).label, m.titulo, "missao");
  });

  (data.relatorios || []).filter(r => r.autorUsername === username).forEach(r => {
    add(r.data || r.createdAt, "Relatório registrado", r.titulo || r.resumo || r.tipo || "Relatório", "relatorio");
  });

  (membro.condutaRegistros || []).forEach(r => {
    add(r.data || r.criadoEm, r.tipo || "Registro de conduta", r.motivo || r.descricao || r.nota || "", "conduta");
  });

  (data.activityLog || []).filter(a => a.alvo === username || String(a.descricao || "").includes(getCodinome(membro)) || String(a.descricao || "").includes(username)).forEach(a => {
    if (/senha|backup|foto_iniciacao/i.test(`${a.tipo} ${a.descricao}`)) return;
    add(a.data, a.descricao || a.tipo || "Atividade", a.ator ? `Registrado por ${a.ator}` : "", "atividade");
  });

  return eventos
    .filter(e => e.data)
    .sort((a, b) => new Date(b.data || 0) - new Date(a.data || 0))
    .slice(0, 9);
}

function normalizarMembro(u, existente = true) {
  const base = {
    avatarUrl: "", avatarStoragePath: "", nomeRP: "", elemento: "", linhagem: "",
    vilaOrigem: "", patente: "", especialidade: "", funcaoPreferida: "", disponibilidadeOperacional: "",
    estiloCombate: "", equipamentoPrincipal: "", restricoesOperacionais: "", bio: "", estruturaNivel: "operador",
    graduacaoShinobi: "", registroShinobi: "", naturezaChakraSecundaria: "", tecnicaAssinatura: "", invocacao: "", statusNukenin: "",
    buildShinobi: null,
    respondeA: "", nivelAcesso: 1, iniciacaoStatus: existente ? "concluida" : "pendente",
    criadoEm: "", criadoPor: "", perfilCompleto: false,
    iniciacaoConcluidaEm: "", iniciacaoVersao: 0, iniciacaoReabertaEm: "",
    conviteTipo: "", conviteNomeConvidado: "", conviteTituloConvidado: "", conviteVilaConvidado: "", conviteMensagemPersonalizada: "",
    onboardingContratanteStatus: "", onboardingContratanteConcluidoEm: "",
    reputacao: "Baixo perfil", lealdade: "", conduta: "Limpo", reputacaoNota: "", lealdadeNota: "", condutaNota: "", condutaRegistros: [],
    discordId: "", discordUsername: "", discordGlobalName: "", discordTag: "", discordAvatar: "", discordVerificado: false, discordVerificadoEm: "", discordDmMissoes: true, discordDmContratos: true, discordDmRelatorios: true,
    reputacaoAtualizadaEm: "", lealdadeAtualizadaEm: "", condutaAtualizadaEm: "",
  };
  const out = { ...base, ...u };
  if (!existente && !String(out.patente || "").trim()) out.patente = "Recruta em Observação";
  out.nomeRP = out.nomeRP || out.displayName || "";
  out.nivelAcesso = Math.max(1, Math.min(5, Number(out.nivelAcesso) || 1));
  out.reputacao = converterReputacaoLegada(out.reputacao);
  if (!REPUTACAO_NIVEIS.includes(out.reputacao)) out.reputacao = "Baixo perfil";
  if (out.lealdade === "Pilar da F.O.X.") out.lealdade = "Pilar da Jikkai";
  if (!u?.lealdade) out.lealdade = out.role === "leader" ? "Pilar da Jikkai" : (existente ? "Recruta" : "Observado");
  if (!LEALDADE_NIVEIS.includes(out.lealdade)) out.lealdade = existente ? "Recruta" : "Observado";
  if (!CONDUTA_NIVEIS.includes(out.conduta)) out.conduta = "Limpo";
  if (!Array.isArray(out.condutaRegistros)) out.condutaRegistros = [];
  out.perfilCompleto = perfilCompletoUsuario(out);
  return out;
}

function slugEstrutura(valor) {
  return String(valor || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

function usuarioPorIdentidade(users, identidade) {
  const alvo = slugEstrutura(identidade);
  if (!alvo) return null;
  return (users || []).find(u => [u.username, u.codinome, u.displayName, u.nomeRP].some(v => slugEstrutura(v) === alvo)) || null;
}

function trioDoUsuario(data, username) {
  return (data?.trios || []).find(t => (t.membros || []).some(m => m.username === username)) || null;
}

function atividade(tipo, ator, alvo, descricao) {
  return {
    id: uid(), tipo, ator: ator || "sistema", alvo: alvo || "", descricao: descricao || "",
    data: new Date().toISOString(),
  };
}

function iniciaisMembro(u) {
  const nome = getCodinome(u);
  return nome.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join("").toUpperCase() || "FX";
}

function MemberAvatar({ user, size = "md", className = "" }) {

  const classes = sizes[size] || sizes.md;

    <div className={`${classes} ${className} relative rounded-full overflow-hidden border border-orange-800/70 bg-gradient-to-br from-red-950 to-black flex items-center justify-center flex-shrink-0 shadow-lg`}>

      )}

}

function codinomeIgual(a, b) { return codinomeId(a) === codinomeId(b); }

  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function normalizarCodinomeEntrada(c, fallback = {}) {
  const nome = codinomeNome(c?.nome || fallback.nome);
  const id = codinomeId(c?.id || nome);
  const status = CODINOME_STATUS.includes(c?.status) ? c.status : (fallback.status || "disponivel");
  return {
    id,
    nome: nome || fallback.nome || id,
    categoria: c?.categoria || fallback.categoria || "Geral",
    descricao: c?.descricao || fallback.descricao || "",

    restrito: Boolean(c?.restrito || fallback.restrito || CODINOMES_RESTRITOS_PADRAO.includes(id)),

function normalizarBancoCodinomes(rawCodinomes, users = []) {
  const porId = new Map();
  DEFAULT_CODINOMES.forEach(c => porId.set(c.id, normalizarCodinomeEntrada(c)));
  (Array.isArray(rawCodinomes) ? rawCodinomes : []).forEach(c => {
    const normalizado = normalizarCodinomeEntrada(c, porId.get(codinomeId(c?.id || c?.nome)) || {});
    if (normalizado.id) porId.set(normalizado.id, { ...(porId.get(normalizado.id) || {}), ...normalizado });
  });

  // VIPER é permanente do líder.
  const viper = porId.get("viper") || normalizarCodinomeEntrada({ nome: "VIPER", categoria: "Liderança" });
  porId.set("viper", { ...viper, nome: "VIPER", categoria: "Liderança", status: "em_uso", restrito: true, usadoPor: "leader", usadoEm: viper.usadoEm || new Date().toISOString(), descricao: viper.descricao || "Codinome permanente do líder da Jikkai." });

  CODINOMES_RESTRITOS_PADRAO.forEach(id => {
    const c = porId.get(id);
    if (c && c.status !== "em_uso") porId.set(id, { ...c, restrito: true, status: "restrito" });
  });

  (users || []).forEach(u => {
    const nome = codinomeNome(u.codinome);
    if (!nome) return;
    const id = codinomeId(nome);
    if (id === "viper" && u.username !== "leader") return;
    const atual = porId.get(id) || normalizarCodinomeEntrada({ nome, categoria: "Personalizado" });
    porId.set(id, { ...atual, nome: atual.nome || nome, status: "em_uso", usadoPor: u.username, usadoEm: atual.usadoEm || u.criadoEm || new Date().toISOString() });
  });

  return Array.from(porId.values()).sort((a, b) => {
    if (a.id === "viper") return -1;
    if (b.id === "viper") return 1;
    const peso = { em_uso: 0, restrito: 1, disponivel: 2, reservado: 3, aposentado: 4, banido: 5 };
    return (peso[a.status] ?? 9) - (peso[b.status] ?? 9) || a.nome.localeCompare(b.nome);
  });
}
function codinomeUsadoPorOutroUsuario(users, nome, ignoreUsername = "") {
  const id = codinomeId(nome);
  if (!id) return false;
  return (users || []).some(u => u.username !== ignoreUsername && codinomeId(u.codinome) === id);
}
function codinomeDisponivelParaConvite(data, nome, convite = null) {
  const id = codinomeId(nome);
  if (!id) return false;
  if (codinomeUsadoPorOutroUsuario(data?.users || [], nome, "")) return false;
  const reservadoContratante = conviteEhContratante(convite) && conviteCodinomeReservado(convite) && codinomeIgual(nome, conviteCodinomeReservado(convite));
  const c = (data?.codinomes || []).find(x => x.id === id || codinomeId(x.nome) === id);
  if (reservadoContratante) {
    if (!c) return true;
    if (c.status === "disponivel" && !c.restrito) return true;
    if (c.status === "reservado" && convite && c.reservadoParaConvite === convite.token) return true;
    return false;
  }
  if (!c) return conviteEhContratante(convite);
  if (c.status === "disponivel" && !c.restrito) return true;
  if (c.status === "reservado" && convite && c.reservadoParaConvite === convite.token) return true;
  return false;
}
function codinomesDisponiveisParaConvite(data, convite = null) {
  const categoriasLiberadas = Array.isArray(convite?.categoriasLiberadas) ? convite.categoriasLiberadas.filter(Boolean) : [];
  return (data?.codinomes || [])
    .filter(c => codinomeDisponivelParaConvite(data, c.nome, convite))
    .filter(c => !categoriasLiberadas.length || categoriasLiberadas.includes(c.categoria))
    .sort((a, b) => a.nome.localeCompare(b.nome));
}
function conviteEhContratante(convite) {
  return convite?.tipo === "contratante" || convite?.rolePadrao === "contratante";
}
function conviteNomeFormal(convite) {
  const titulo = String(convite?.tituloConvidado || "").trim();
  const nome = String(convite?.nomeConvidado || "").trim();
  return [titulo, nome].filter(Boolean).join(" ").trim();
}
function conviteCodinomeGenerico(token) {

  return compacto ? `Contratante ${compacto}` : "Contratante externo";
}
function conviteCodinomeReservado(convite) {
  const reservado = codinomeNome(convite?.codinomeReservado || "");
  const reservadoGenerico = conviteEhContratante(convite) && reservado && codinomeIgual(reservado, conviteCodinomeGenerico(convite?.token));
  if (reservado && !reservadoGenerico) return reservado;
  const nome = String(convite?.nomeConvidado || "").trim();

}
function atualizarBancoCodinomeUsuario(codinomes = [], anteriorCodinome = "", novoCodinome = "", username = "", conviteId = "") {
  const lista = normalizarBancoCodinomes(codinomes, []);
  const anteriorId = codinomeId(anteriorCodinome);
  const novoId = codinomeId(novoCodinome);
  let out = lista.map(c => ({ ...c }));
  if (anteriorId && anteriorId !== novoId) {
    out = out.map(c => c.id === anteriorId && c.usadoPor === username && c.id !== "viper" ? { ...c, status: "aposentado", usadoPor: username, aposentadoEm: new Date().toISOString() } : c);
  }
  if (novoId) {
    const existente = out.find(c => c.id === novoId);
    const entrada = { ...(existente || normalizarCodinomeEntrada({ nome: novoCodinome, categoria: "Personalizado" })), id: novoId, nome: existente?.nome || codinomeNome(novoCodinome), status: "em_uso", restrito: existente?.restrito || novoId === "viper", usadoPor: username, usadoEm: existente?.usadoEm || new Date().toISOString(), reservadoParaConvite: "", conviteId };
    out = existente ? out.map(c => c.id === novoId ? entrada : c) : [...out, entrada];

function registrarUsuarioPorConviteEstado(data, token, cadastro) {

function discordRedirectUri() {
  try {
    const url = new URL(window.location.href);
    url.hash = "";
    return url.origin + url.pathname;
  } catch {
    return window.location.href.split("#")[0];
  }
}

function discordAvatarUrl(user) {
  if (!user?.id || !user?.avatar) return "";
  const ext = String(user.avatar).startsWith("a_") ? "gif" : "png";
  return `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=128`;
}

function iniciarVerificacaoDiscord(username) {
  const state = uid();
  const redirect = discordRedirectUri();
  try {
    localStorage.setItem(DISCORD_OAUTH_STORAGE_KEY, JSON.stringify({ state, username, redirect, createdAt: new Date().toISOString() }));
  } catch {}
  const params = new URLSearchParams({
    response_type: "token",
    client_id: DISCORD_CLIENT_ID,
    scope: "identify",
    state,
    redirect_uri: redirect,
    prompt: "consent",
  });
  window.location.href = "https://discord.com/oauth2/authorize?" + params.toString();
}

async function enviarDmDiscordParaUsuario(usuario, content) {
  if (!discordBotConfigurado()) return { ok: false, skipped: true, reason: "Bot token não configurado" };
  if (!usuario?.discordId) return { ok: false, skipped: true, reason: "Usuário sem Discord ID" };

  const resp = await fetch("/api/discord-dm", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      discordId: String(usuario.discordId),
      content: String(content || "").slice(0, 1900),
      // Mantido porque você pediu token configurável pelo portal.
      // O ideal é usar variável de ambiente DISCORD_BOT_TOKEN na Vercel.
      botToken: discordBotTokenAtual(),
    }),
  });

  let payload = null;
  try { payload = await resp.json(); } catch {}
  if (!resp.ok || !payload?.ok) {
    const detalhe = payload?.error || payload?.detail || resp.statusText || "Falha desconhecida";
    throw new Error(`Falha ao enviar DM (${resp.status}) ${detalhe}`);
  }
  return { ok: true, user: usuario.username, discordId: usuario.discordId, channelId: payload.channelId };
}

async function notificarDiscordUsuarios(data, usernames = [], tipo = "missao", content = "") {
  const nomes = Array.from(new Set((usernames || []).filter(Boolean)));
  const resultados = [];

  if (!nomes.length) {
    return [{ ok: false, skipped: true, reason: "Nenhum destinatário informado" }];
  }

  for (const username of nomes) {
    const alvo = (data?.users || []).find(u => u.username === username);
    if (!alvo) {
      resultados.push({ ok: false, skipped: true, user: username, reason: "Usuário não encontrado no portal" });
      continue;
    }

    if (!alvo.discordVerificado || !alvo.discordId) {
      resultados.push({ ok: false, skipped: true, user: username, reason: `${getCodinome(alvo)} não tem Discord verificado no dossiê` });
      continue;
    }

    if (!podeReceberDmDiscord(alvo, tipo)) {
      resultados.push({ ok: false, skipped: true, user: username, reason: `${getCodinome(alvo)} desativou este tipo de aviso` });
      continue;
    }

    try {
      const enviado = await enviarDmDiscordParaUsuario(alvo, content);
      resultados.push({ ...enviado, user: username, ok: true });
    } catch (e) {
      resultados.push({ ok: false, user: username, reason: e?.message || String(e) });
    }
  }

  return resultados;
}

async function loadState() {
  // Tenta nuvem primeiro
  if (cloudClient) {
    try {
      const { data, error } = await cloudClient.from("fox_state").select("data").eq("id", 1).single();
      if (!error && data?.data && Object.keys(data.data).length > 0) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data.data)); } catch {}
        return data.data;
      }
    } catch (e) { console.error("cloud load error", e); }
  }
  // Fallback: localStorage
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { console.error("local load error", e); return null; }
}

async function saveStateAsync(s) {
  let cloudOk = null; // null = não configurado
  if (cloudClient) {
    try {
      const { error } = await cloudClient.from("fox_state").upsert({ id: 1, data: s, updated_at: new Date().toISOString() });
      cloudOk = !error;
      if (error) console.error("cloud save error", error);
    } catch (e) { cloudOk = false; console.error(e); }
  }
  let localOk = false;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); localOk = true; }
  catch (e) { console.error("local save error", e); }
  return { cloudOk, localOk };
}

function useMediaQuery(query) {
  const [matches, setMatches] = useState(() => typeof window !== "undefined" && window.matchMedia(query).matches);
  useEffect(() => {
    if (typeof window === "undefined") return;
    const media = window.matchMedia(query);
    const update = () => setMatches(media.matches);
    update();
    media.addEventListener?.("change", update);
    return () => media.removeEventListener?.("change", update);
  }, [query]);
  return matches;
}

function destinoSinalVisaoGeral(sinal) {
  if (sinal?.fonteTipo === "mapa") return { tab: "mapa" };
  if (sinal?.fonteTipo === "missao") return { tab: "missoes" };
  if (sinal?.fonteTipo === "relatorio") return { tab: "jikkai", subTab: "relatorios" };
  if (sinal?.fonteTipo === "contrato") return { tab: "jikkai", subTab: "contratos" };
  return { tab: "jikkai", subTab: "plano" };
}

function sinalAutorizadoNaVisaoGeral(sinal, data, usuario, role) {
  if (!sinal) return false;
  if (sinal.fonteTipo === "relatorio") {
    const relatorio = (data.relatorios || []).find(r => r.id === sinal.fonteId);
    return !relatorio || podeVerItemSigiloso(relatorio, data, usuario, role);
  }
  if (sinal.fonteTipo === "missao") {
    const missao = (data.missoes || []).find(m => m.id === sinal.fonteId);
    return !missao || podeVerItemSigiloso(missao, data, usuario, role);
  }
  return true;
}

function HomePage({ data, usuario, role, isLider, onNavigate }) {
  const membrosFox = (data.users || []).filter(u => u.role !== "contratante" && u.status !== "Oculto");
  const roleOf = u => (data.roles || []).find(r => r.id === u.role);
  const ramoUsuario = (data.clas || []).find(c => c.id === usuario?.cla);
  const trioUsuario = trioDoUsuario(data, usuario?.username);
  const cargoUsuario = roleOf(usuario);
  const lideresJikkai = membrosFox.filter(u => estruturaPosicaoRole(roleOf(u)) === "lider");
  const nomesLideranca = lideresJikkai.length ? lideresJikkai.map(getCodinome).join(" · ") : "Não designada";
  const juramentoUsuario = juramentoDoUsuario(data.juramentados, usuario);

  const faseAtiva = (data.fases || []).find(f => f.status === "andamento") || (data.fases || []).find(f => f.status !== "concluida") || (data.fases || [])[0];
  const progressoGeral = progressoGeralJikkai(data.fases || []);
  const progressoAtual = faseAtiva ? progressoFase(faseAtiva) : 0;
  const objetivosAtuais = faseAtiva?.objetivos || [];
  const objetivosConcluidos = objetivosAtuais.filter(o => o.status === "concluido").length;
  const objetivosBloqueados = objetivosAtuais.filter(o => o.status === "bloqueado").length;
  const objetivosAndamento = objetivosAtuais.filter(o => ["preparacao", "andamento", "parcial"].includes(o.status)).length;

  const statusInativos = ["concluida", "falhou", "recusada", "arquivada"];
  const minhasMissoes = (data.missoes || []).filter(m => {
    const participa = m.assignedTo === usuario?.username || (m.participants || []).includes(usuario?.username);
    return participa && !statusInativos.includes(m.status) && podeVerItemSigiloso(m, data, usuario, role);
  });
  const missoesAguardando = minhasMissoes.filter(m => ["atribuida", "pendente", "devolvida"].includes(m.status));
  const missoesEmAndamento = minhasMissoes.filter(m => ["aceita", "andamento"].includes(m.status));
  const missoesRevisaoMinhas = minhasMissoes.filter(m => m.status === "revisao");
  const relatoriosMeus = (data.relatorios || []).filter(r => r.autorUsername === usuario?.username && podeVerItemSigiloso(r, data, usuario, role));

  const sinaisTodos = coletarSinaisEstrategicos(data);
  const sinaisVisiveis = sinaisTodos.filter(s => sinalAutorizadoNaVisaoGeral(s, data, usuario, role));
  const sinaisOcultos = Math.max(0, sinaisTodos.length - sinaisVisiveis.length);
  const maiorRisco = sinaisVisiveis[0]?.risco || (objetivosBloqueados ? "Elevado" : "Baixo");
  const riscoCfg = RISCO_CFG[normalizarRisco(maiorRisco)] || RISCO_CFG.Baixo;

  const divisoesOperacionais = divisoesJikkai(data);
  const equipesOperacionais = equipesJikkai(data);
  const escoposOperacionaisHome = escoposGerenciaveisOperacionais(data, usuario, role);
  const posicaoHome = estruturaPosicaoRole(role);
  const isCapitaoDivisao = posicaoHome === "capitao_ramo";
  const divisoesVisiveisPendencias = isLider ? divisoesOperacionais : (isCapitaoDivisao ? escoposOperacionaisHome.divisoes : []);
  const equipesVisiveisPendencias = isLider ? equipesOperacionais : (isCapitaoDivisao ? escoposOperacionaisHome.equipes : []);
  const divisoesSemCapitaoLista = divisoesVisiveisPendencias.filter(d => !d.capitaoUsername);
  const equipesSemLiderLista = equipesVisiveisPendencias.filter(e => !e.liderUsername);
  const membrosPendentesLista = membrosFox.filter(u => u.iniciacaoStatus === "pendente");
  const membrosDossieIncompleto = membrosFox.filter(u => !perfilCompletoUsuario(u));
  const missoesRevisaoTodas = (data.missoes || []).filter(m => m.status === "revisao");
  const missoesRevisaoLista = isLider ? missoesRevisaoTodas : missoesRevisaoTodas.filter(m => !isCapitaoDivisao || !m.divisaoId || divisoesVisiveisPendencias.some(d => d.id === m.divisaoId));
  const contratosSemDesignacaoLista = (data.contratos || []).filter(c => c.status === "Aberto" && !c.missaoId && !c.aceitoPor && !c.assignmentLabel);
  const missoesSemRelatorioLista = (data.missoes || []).filter(m => ["aceita", "andamento"].includes(m.status) && !(data.relatorios || []).some(r => r.missaoId === m.id) && (isLider || !isCapitaoDivisao || !m.divisaoId || divisoesVisiveisPendencias.some(d => d.id === m.divisaoId)));
  const membrosSemEquipeLista = membrosFox.filter(u => !["lider", "conselheiro", "braco_direito", "fora", "oculto"].includes(estruturaPosicaoRole(roleOf(u))) && !trioDoUsuario(data, u.username));
  const propostasLista = (data.contratos || []).filter(c => c.status === "Proposta");
  const divisoesSemCapitao = divisoesSemCapitaoLista.length;
  const equipesSemLider = equipesSemLiderLista.length;
  const membrosPendentes = membrosPendentesLista.length;
  const dossiesIncompletos = membrosDossieIncompleto.length;
  const missoesRevisao = missoesRevisaoLista.length;
  const contratosSemDesignacao = contratosSemDesignacaoLista.length;
  const missoesSemRelatorio = missoesSemRelatorioLista.length;
  const membrosSemEquipe = membrosSemEquipeLista.length;
  const propostas = propostasLista.length;
  const membrosEquipesSemLider = Array.from(new Set(equipesSemLiderLista.flatMap(e => {
    const div = divisoesOperacionais.find(d => d.id === e.divisaoId);
    return [div?.capitaoUsername, ...(e.membros || []).map(m => m.username)].filter(Boolean);
  })));
  const participantesMissoesSemRelatorio = Array.from(new Set(missoesSemRelatorioLista.flatMap(m => [m.assignedTo, ...(m.participants || [])].filter(Boolean))));
  const liderancaPodeCobrarPendencias = !!(isLider || role?.hasLeaderPerms || ["lider", "conselheiro", "braco_direito"].includes(posicaoHome));
  const montarCobranca = (usernames, pendencia, motivo) => {
    const lista = Array.from(new Set((usernames || []).filter(Boolean)));
    return liderancaPodeCobrarPendencias && lista.length ? { usernames: lista, pendencia, motivo } : null;
  };

  const prioridades = [];
  const addPrioridade = item => {
    if (!item?.titulo || prioridades.some(p => p.titulo === item.titulo)) return;
    prioridades.push(item);
  };

  if (missoesAguardando.length) addPrioridade({ titulo: "Missão aguardando sua confirmação", desc: missoesAguardando[0].titulo, tab: "missoes", action: `aceitar-missao:${missoesAguardando[0].id}`, cor: "#EA580C" });
  if (missoesEmAndamento.length) addPrioridade({ titulo: "Operação em andamento", desc: "Atualize objetivos e prepare o relatório final quando concluir.", tab: "missoes", action: `relatorio-missao:${missoesEmAndamento[0].id}`, cor: "#A855F7" });
  if (missoesRevisaoMinhas.length) addPrioridade({ titulo: "Relatório enviado para revisão", desc: "Aguarde aprovação da liderança ou ajustes solicitados.", tab: "missoes", cor: "#38BDF8" });
  if (!perfilCompletoUsuario(usuario)) addPrioridade({ titulo: "Concluir seu dossiê", desc: "Complete foto, identidade, elemento, linhagem e vila para facilitar designações.", tab: "perfil", subTab: "dossie", cor: "#CA8A04" });

  if (isLider) {
    if (missoesRevisao) addPrioridade({ titulo: `${missoesRevisao} ${missoesRevisao === 1 ? "missão aguarda" : "missões aguardam"} aprovação`, desc: "Relatórios operacionais esperando decisão da liderança.", tab: "missoes", cor: "#A855F7" });
    if (propostas) addPrioridade({ titulo: `${propostas} ${propostas === 1 ? "proposta externa" : "propostas externas"}`, desc: "Contratos enviados aguardam análise.", tab: "jikkai", subTab: "contratos", cor: "#EF4444" });
    if (membrosPendentes) addPrioridade({ titulo: `${membrosPendentes} ${membrosPendentes === 1 ? "iniciação pendente" : "iniciações pendentes"}`, desc: "Novos membros ainda não concluíram o protocolo de entrada.", tab: "gerenciar", subTab: "usuarios", action: "iniciacoes-pendentes", cor: "#F59E0B", cobranca: montarCobranca(membrosPendentesLista.map(u => u.username), "Iniciação pendente", "Conclua o protocolo de entrada e finalize o juramento no portal.") });
    if (missoesSemRelatorio) { const missaoSemRel = missoesSemRelatorioLista[0]; addPrioridade({ titulo: `${missoesSemRelatorio} ${missoesSemRelatorio === 1 ? "missão está" : "missões estão"} sem relatório`, desc: "Operações em andamento precisam de relatório para serem encerradas.", tab: "missoes", action: missaoSemRel ? `relatorio-missao:${missaoSemRel.id}` : "", cor: "#38BDF8", cobranca: montarCobranca(participantesMissoesSemRelatorio, "Missão sem relatório", "Envie o relatório final da missão para que a liderança possa encerrar o pergaminho.") }); }

// ============ GALERIA DE SOMBRAS ============
function GaleriaModal({ onSave, onClose, usuario }) {
  const [modo, setModo] = useState("upload"); // "upload" | "url"
  const [titulo, setTitulo] = useState("");
  const [descricao, setDescricao] = useState("");
  const [url, setUrl] = useState("");
  const [arquivo, setArquivo] = useState(null);
  const [preview, setPreview] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [erro, setErro] = useState(null);
  const fileInputRef = useRef();

  const escolherArquivo = (e) => {
    setErro(null);
    const f = e.target.files?.[0];
    if (!f) return;
    if (!f.type.startsWith("image/")) {
      setErro("O arquivo precisa ser uma imagem (PNG, JPG, GIF, WEBP).");
      return;
    }
    if (f.size > 5 * 1024 * 1024) {
      setErro("Imagem muito grande. Máximo: 5MB.");
      return;
    }
    setArquivo(f);
    const reader = new FileReader();
    reader.onload = (ev) => setPreview(ev.target.result);
    reader.readAsDataURL(f);
  };

  const enviarUpload = async () => {
    if (!arquivo) { setErro("Selecione uma imagem primeiro."); return; }
    if (!titulo.trim()) { setErro("Dê um título à imagem."); return; }
    if (!cloudClient) {
      setErro("Selamento em nuvem não configurada — upload indisponível.");
      return;
    }
    setUploading(true);
    setErro(null);
    try {
      const ext = (arquivo.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "");
      const path = `${Date.now()}-${uid()}.${ext}`;
      const { error: upErr } = await cloudClient.storage.from("galeria").upload(path, arquivo, {
        contentType: arquivo.type,
        upsert: false,
      });
      if (upErr) throw upErr;
      const { data: pubData } = cloudClient.storage.from("galeria").getPublicUrl(path);
      const publicUrl = pubData?.publicUrl;
      if (!publicUrl) throw new Error("Não foi possível obter a URL pública.");
      onSave({
        id: uid(),
        url: publicUrl,
        storagePath: path,
        titulo: titulo.trim(),
        descricao: descricao.trim(),
        autor: usuario?.username || "?",
        autorNome: usuario?.displayName || usuario?.username || "Desconhecido",
        data: new Date().toISOString(),
        source: "upload",
      });
    } catch (err) {
      console.error("upload error", err);
      setErro(`Erro no upload: ${err.message || "verifique o bucket 'galeria' no Supabase."}`);
      setUploading(false);
    }
  };

  const enviarUrl = () => {
    setErro(null);
    if (!url.trim()) { setErro("Cole a URL da imagem."); return; }
    if (!/^https?:\/\/.+/i.test(url.trim())) { setErro("URL inválida. Deve começar com http:// ou https://"); return; }
    if (!titulo.trim()) { setErro("Dê um título à imagem."); return; }
    onSave({
      id: uid(),
      url: url.trim(),
      storagePath: null,
      titulo: titulo.trim(),
      descricao: descricao.trim(),
      autor: usuario?.username || "?",
      autorNome: usuario?.displayName || usuario?.username || "Desconhecido",
      data: new Date().toISOString(),
      source: "url",
    });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm fadein" onClick={uploading ? null : onClose}>
      <div className="bg-zinc-950 border border-orange-700 rounded-lg shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
        <div className="p-5 border-b border-orange-900/50 flex items-center justify-between sticky top-0 bg-zinc-950 z-10">
          <div className="flex items-center gap-3">
            <IImage className="w-6 h-6 text-orange-500" />
            <h3 className="text-xl font-bold text-orange-50 serif">Adicionar à Galeria</h3>
          </div>
          <button onClick={onClose} disabled={uploading} className="text-zinc-500 hover:text-red-400 p-1 disabled:opacity-30"><IX className="w-5 h-5" /></button>
        </div>

        <div className="p-5 space-y-4">
          {/* Toggle modo */}
          <div className="flex gap-1 bg-zinc-900/60 border border-zinc-800 rounded p-1">
            <button
              onClick={() => { setModo("upload"); setErro(null); }}
              className={`flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded text-xs uppercase tracking-wider font-bold transition-all ${modo === "upload" ? "bg-orange-700 text-white" : "text-zinc-500 hover:text-zinc-300"}`}
              disabled={uploading}
            >
              <IUpload className="w-3 h-3" /> Enviar Arquivo
            </button>
            <button
              onClick={() => { setModo("url"); setErro(null); }}
              className={`flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded text-xs uppercase tracking-wider font-bold transition-all ${modo === "url" ? "bg-orange-700 text-white" : "text-zinc-500 hover:text-zinc-300"}`}
              disabled={uploading}
            >
              <ILink className="w-3 h-3" /> Por URL
            </button>
          </div>

          {modo === "upload" && (
            <div>
              <label className="fox-label">Imagem (max 5MB)</label>
              <input ref={fileInputRef} type="file" accept="image/*" onChange={escolherArquivo} disabled={uploading} className="hidden" />
              {!preview ? (
                <button
                  onClick={() => fileInputRef.current?.click()}
                  disabled={uploading}
                  className="w-full border-2 border-dashed border-zinc-800 hover:border-orange-700 rounded-lg p-8 text-center text-zinc-500 hover:text-orange-400 transition-colors disabled:opacity-50"
                >
                  <IUpload className="w-10 h-10 mx-auto mb-2" />
                  <div className="text-sm font-bold uppercase tracking-wider">Clique para escolher</div>
                  <div className="text-xs text-zinc-600 mt-1">PNG, JPG, GIF, WEBP</div>
                </button>
              ) : (
                <div className="relative">
                  <img src={preview} alt="preview" className="w-full max-h-64 object-contain bg-black rounded border border-orange-900/40" />
                  <button
                    onClick={() => { setArquivo(null); setPreview(null); fileInputRef.current.value = ""; }}
                    disabled={uploading}
                    className="absolute top-2 right-2 bg-black/80 border border-red-700 text-red-400 hover:bg-red-950 p-1.5 rounded"
                  >
                    <IX className="w-4 h-4" />
                  </button>
                  <div className="text-xs text-zinc-500 mt-2 truncate">{arquivo?.name} · {(arquivo?.size / 1024).toFixed(0)}KB</div>
                </div>
              )}
            </div>
          )}

          {modo === "url" && (
            <div>
              <label className="fox-label">URL da imagem</label>
              <input
                value={url}
                onChange={(e) => setUrl(e.target.value)}
                disabled={uploading}
                className="fox-input"
                placeholder="https://exemplo.com/imagem.png"
              />
              {url && /^https?:\/\/.+/i.test(url) && (
                <img src={url} alt="preview" className="mt-3 w-full max-h-64 object-contain bg-black rounded border border-orange-900/40" onError={(e) => e.target.style.display = "none"} />
              )}
            </div>
          )}

          <div>
            <label className="fox-label">Título *</label>
            <input value={titulo} onChange={(e) => setTitulo(e.target.value)} disabled={uploading} className="fox-input" placeholder="Ex: Confronto na ponte de Konoha" />
          </div>
          <div>
            <label className="fox-label">Descrição / contexto do RP</label>
            <textarea value={descricao} onChange={(e) => setDescricao(e.target.value)} rows="3" disabled={uploading} className="fox-input" placeholder="Quem estava, o que aconteceu, qual o contexto..." />
          </div>

          {erro && (
            <div className="p-3 bg-red-950/40 border border-red-800 rounded text-red-300 text-sm flex items-start gap-2">
              <IAlert className="w-4 h-4 flex-shrink-0 mt-0.5" />
              <span>{erro}</span>
            </div>
          )}
        </div>

        <div className="p-5 border-t border-zinc-800 flex gap-2 justify-end sticky bottom-0 bg-zinc-950">
          <Btn onClick={onClose} variant="ghost" disabled={uploading}><IX className="w-3 h-3" /> Cancelar</Btn>
          {modo === "upload" ? (
            <Btn onClick={enviarUpload} variant="primary" disabled={uploading || !arquivo || !titulo.trim()}>
              {uploading ? <><ILoader className="w-3 h-3 animate-spin" /> Enviando...</> : <><IUpload className="w-3 h-3" /> Enviar para Galeria</>}
            </Btn>
          ) : (
            <Btn onClick={enviarUrl} variant="primary" disabled={!url.trim() || !titulo.trim()}>
              <ILink className="w-3 h-3" /> Adicionar
            </Btn>
          )}
        </div>
      </div>
    </div>
  );
}

        </div>
      )}
    </div>
  );
}

function LinhaDoTempoSection({ data, setData, podeEditar }) {
  const [editando, setEditando] = useState(false);
  const [draft, setDraft] = useState(data.historia);

  useEffect(() => { if (!editando) setDraft(data.historia); }, [data.historia, editando]);

  const salvar = () => { setData(d => ({ ...d, historia: draft.filter(e => e.evento.trim()) })); setEditando(false); };
  const cancelar = () => { setDraft(data.historia); setEditando(false); };
  const update = (i, field, val) => setDraft(draft.map((e, idx) => idx === i ? { ...e, [field]: val } : e));
  const remove = (i) => setDraft(draft.filter((_, idx) => idx !== i));
  const add = () => setDraft([...draft, { id: uid(), era: "Nova Era", evento: "Novo evento", desc: "" }]);
  const move = (i, dir) => {
    const ni = i + dir;
    if (ni < 0 || ni >= draft.length) return;
    const n = [...draft];
    [n[i], n[ni]] = [n[ni], n[i]];
    setDraft(n);
  };

  const eventos = editando ? draft : data.historia;

  return (
    <div className="fadein">
      <div className="flex items-center justify-between mb-6 gap-3 flex-wrap">
        <div className="border-l-4 border-orange-600 pl-4">
          <div className="flex items-center gap-3">
            <IBook className="w-6 h-6 text-orange-500" />
            <h2 className="text-2xl font-bold text-orange-50 tracking-wide serif">Linha do Tempo</h2>
          </div>
          <p className="text-zinc-500 text-sm mt-1 italic">Da queda de Uzushio ao nascimento da F.O.X.</p>
        </div>
        {podeEditar && (editando ? (
          <div className="flex gap-2">
            <Btn onClick={cancelar} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
            <Btn onClick={salvar} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn>
          </div>
        ) : (
          <Btn onClick={() => setEditando(true)} variant="default"><IEdit className="w-3 h-3" /> Editar</Btn>
        ))}
      </div>
      <div className="relative pl-8 space-y-6 border-l-2 border-orange-900/40">
        {eventos.map((e, i) => (
          <div key={e.id || i} className="relative">
            <div className="absolute -left-[42px] w-5 h-5 rounded-full bg-black border-2 border-orange-600 flex items-center justify-center">
              <div className="w-1.5 h-1.5 bg-orange-500 rounded-full" />
            </div>
            {editando ? (
              <div className="space-y-2 p-3 bg-zinc-950/60 border border-orange-900/30 rounded">
                <div className="flex flex-col sm:flex-row gap-2">
                  <input value={e.era} onChange={(ev) => update(i, "era", ev.target.value)} placeholder="Era (ex: Era Antiga)" className="fox-input" />
                  <div className="flex gap-2 w-full sm:w-auto">
                    <button onClick={() => move(i, -1)} className="mobile-tap flex-1 sm:flex-none px-3 bg-zinc-900 border border-zinc-800 rounded text-zinc-400" title="Subir">↑</button>
                    <button onClick={() => move(i, 1)} className="mobile-tap flex-1 sm:flex-none px-3 bg-zinc-900 border border-zinc-800 rounded text-zinc-400" title="Descer">↓</button>
                    <button onClick={() => remove(i)} className="mobile-tap flex-1 sm:flex-none px-3 bg-red-950/80 text-red-300 rounded"><ITrash className="w-4 h-4 mx-auto" /></button>
                  </div>
                </div>
                <input value={e.evento} onChange={(ev) => update(i, "evento", ev.target.value)} placeholder="Título do evento" className="fox-input" />
                <textarea value={e.desc} onChange={(ev) => update(i, "desc", ev.target.value)} rows="3" placeholder="Descrição do evento" className="fox-input" />
              </div>
            ) : (
              <>
                <div className="text-orange-600 text-xs uppercase tracking-widest mb-1">{e.era}</div>
                <h3 className="text-xl font-bold text-orange-50 mb-2 serif">{e.evento}</h3>
                <p className="text-zinc-400 leading-relaxed">{e.desc}</p>
              </>
            )}
          </div>
        ))}
        {editando && (
          <div className="relative">
            <div className="absolute -left-[42px] w-5 h-5 rounded-full bg-black border-2 border-zinc-700 flex items-center justify-center">
              <IPlus className="w-3 h-3 text-zinc-700" />
            </div>
            <Btn onClick={add} variant="ghost" className="w-full justify-center"><IPlus className="w-3 h-3" /> Adicionar evento</Btn>
          </div>
        )}
      </div>
    </div>
  );
}

              className={`min-w-0 sm:min-w-[140px] sm:flex-1 min-h-14 sm:min-h-0 flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 px-2 sm:px-4 py-2.5 rounded-lg text-[9px] sm:text-xs uppercase tracking-wide sm:tracking-wider font-bold transition-all ${active ? "bg-gradient-to-r from-red-700 to-orange-700 text-white shadow-lg" : "text-zinc-500 hover:text-zinc-300 hover:bg-zinc-900"}`}
            >
              <I className="w-4 h-4 flex-shrink-0" />
              <span className="sm:hidden leading-tight text-center">{t.mobileLabel}</span>
              <span className="hidden sm:inline leading-tight text-center">{t.label}</span>
              {t.badge && (
                <span className={`text-[9px] px-1.5 py-0.5 rounded-full font-black ${active ? "bg-black/40 text-white" : "bg-orange-600 text-black"}`}>{t.badge}</span>
              )}
            </button>
          );
        })}
      </div>

      {subTab === "timeline" && <LinhaDoTempoSection data={data} setData={setData} podeEditar={hasPerm(role,"edit_history")} />}
      {subTab === "cla" && <ClaPage data={data} setData={setData} role={role} embedded />}
      {subTab === "galeria" && <GaleriaSection data={data} setData={setData} isLider={hasPerm(role,"edit_gallery")} usuario={usuario} />}
    </div>
  );
}

// ============ FIGURAS ============
function FigurasEditor({ figuras, onChange, isLider, cor }) {
  const [editando, setEditando] = useState(false);
  const [draft, setDraft] = useState(figuras);
  // cor pode vir como hex (#D85A30) ou legado ("red"/"orange"); normaliza para hex
  const hex = typeof cor === "string" && cor.startsWith("#") ? cor : (cor === "red" ? "#B91C1C" : "#D85A30");
  const corStyle = { borderColor: hex + "66", background: "#000000" };

  useEffect(() => { if (!editando) setDraft(figuras); }, [figuras, editando]);

  const add = () => setDraft([...draft, { nome: "", desc: "" }]);
  const remove = (i) => setDraft(draft.filter((_, idx) => idx !== i));
  const update = (i, field, val) => setDraft(draft.map((f, idx) => idx === i ? { ...f, [field]: val } : f));
  const salvar = () => { onChange(draft.filter(f => f.nome.trim())); setEditando(false); };
  const cancelar = () => { setDraft(figuras); setEditando(false); };

  return (
    <div>
      <div className="flex items-center justify-between mb-2 gap-2 flex-wrap">
        <div className="text-xs uppercase tracking-wider font-semibold" style={{ color: hex }}>Figuras de destaque</div>
        {isLider && !editando && <Btn onClick={() => setEditando(true)} variant="ghost"><IEdit className="w-3 h-3" /> Editar</Btn>}
        {isLider && editando && (
          <div className="flex gap-2">
            <Btn onClick={cancelar} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
            <Btn onClick={salvar} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn>
          </div>
        )}
      </div>

      {!editando && figuras.length === 0 && (
        <div className="text-zinc-600 text-sm italic p-4 bg-black/40 border border-zinc-900 rounded">
          Nenhuma figura registrada ainda.{isLider && " Clique em Editar para adicionar."}
        </div>
      )}

      {!editando && figuras.length > 0 && (
        <div className="grid sm:grid-cols-2 md:grid-cols-3 gap-2 text-sm">
          {figuras.map((f, i) => (
            <div key={i} className="p-3 bg-black/60 border rounded" style={corStyle}>
              <div className="font-bold" style={{ color: hex }}>{f.nome}</div>
              <div className="text-zinc-500 text-xs">{f.desc}</div>
            </div>
          ))}
        </div>
      )}

      {editando && (
        <div className="space-y-2">
          {draft.map((f, i) => (
            <div key={i} className="p-3 bg-black/60 border rounded flex gap-2 items-start" style={corStyle}>
              <div className="flex-1 space-y-2">
                <input value={f.nome} onChange={(e) => update(i, "nome", e.target.value)} placeholder="Nome" className="fox-input" />
                <input value={f.desc} onChange={(e) => update(i, "desc", e.target.value)} placeholder="Descrição curta" className="fox-input" />
              </div>
              <button onClick={() => remove(i)} className="text-red-500 hover:text-red-400 p-2"><ITrash className="w-4 h-4" /></button>
            </div>
          ))}
          <Btn onClick={add} variant="ghost" className="w-full justify-center"><IPlus className="w-3 h-3" /> Adicionar figura</Btn>
        </div>
      )}
    </div>
  );
}

const CLA_ICONS = {
  crown: ICrown,
  skull: ISkull,
  flame: IFlame,
  swords: ISwords,
  shield: IShield,
  users: IUsers,
  book: IBook,
  target: ITarget,
};

function ClaPage({ data, setData, role, embedded = false }) {
  const podeEditar = hasPerm(role, "edit_clans");
  const [editando, setEditando] = useState(false);
  const [draft, setDraft] = useState(data.clas);
  const [editMandamentos, setEditMandamentos] = useState(false);
  const [draftMandamentos, setDraftMandamentos] = useState(normalizarMandamentosJikkai(data.mandamentos));

  useEffect(() => { if (!editando) setDraft(data.clas); }, [data.clas, editando]);
  useEffect(() => { if (!editMandamentos) setDraftMandamentos(normalizarMandamentosJikkai(data.mandamentos)); }, [data.mandamentos, editMandamentos]);

  const salvar = () => { setData(d => ({ ...d, clas: draft.filter(c => c.nome.trim()) })); setEditando(false); };
  const cancelar = () => { setDraft(data.clas); setEditando(false); };
  const updateCla = (i, patch) => setDraft(draft.map((c, idx) => idx === i ? { ...c, ...patch } : c));
  const removeCla = (i) => setDraft(draft.filter((_, idx) => idx !== i));
  const addCla = () => setDraft([...draft, { id: "cla_" + uid().slice(0, 6), nome: "Novo Clã", tipo: "Ramo", cor: "#7C2D12", icon: "shield", descricao: "", figuras: [] }]);

  const updateFigurasDireto = (i, figuras) => {
    setData(d => ({ ...d, clas: d.clas.map((c, idx) => idx === i ? { ...c, figuras } : c) }));
  };

  // Editor de Mandamentos
  const salvarMandamentos = () => {
    setData(d => ({ ...d, mandamentos: normalizarMandamentosJikkai(draftMandamentos) }));
    setEditMandamentos(false);
  };
  const cancelarMandamentos = () => { setDraftMandamentos(normalizarMandamentosJikkai(data.mandamentos)); setEditMandamentos(false); };
  const updateMandamento = (i, val) => setDraftMandamentos(draftMandamentos.map((m, idx) => idx === i ? val : m));
    const moveMandamento = (i, dir) => {
    const ni = i + dir;
    if (ni < 0 || ni >= draftMandamentos.length) return;
    const n = [...draftMandamentos];
    [n[i], n[ni]] = [n[ni], n[i]];
    setDraftMandamentos(n);
  };

  const action = podeEditar && (
    editando ? (
      <div className="flex gap-2">
        <Btn onClick={cancelar} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
        <Btn onClick={salvar} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn>
      </div>
    ) : (
      <Btn onClick={() => setEditando(true)} variant="default"><IEdit className="w-3 h-3" /> Editar Clãs</Btn>
    )
  );

  const clas = editando ? draft : data.clas;
  const mandamentos = editMandamentos ? normalizarMandamentosJikkai(draftMandamentos) : normalizarMandamentosJikkai(data.mandamentos);

  // Lista membros não-contratantes filtrados por clã
  const membrosDoCla = (claId) => (data.users || []).filter(u => u.role !== "contratante" && u.cla === claId);
  const semCla = (data.users || []).filter(u => u.role !== "contratante" && !u.cla);

  return (
    <div className="space-y-8">
      {embedded ? (
        <div className="mb-6 border-l-4 border-orange-600 pl-4">
          <div className="text-[9px] uppercase tracking-[0.3em] text-orange-600">Legado familiar</div>
          <h2 className="text-2xl font-black text-orange-50 serif mt-1">Clã Lamona</h2>
          <p className="text-zinc-500 text-sm mt-1 italic">A família que antecede a F.O.X.; seus ramos, membros e figuras.</p>
          {action && <div className="mt-3">{action}</div>}
        </div>
      ) : (
        <SectionTitle icon={ICrown} sub="As faces do clã Lamona" action={action}>Clãs</SectionTitle>
      )}

      {clas.map((c, ci) => {
        const I = CLA_ICONS[c.icon] || IShield;
        const membros = membrosDoCla(c.id);
        return (
          <div key={c.id || ci} className="rounded-lg border p-4 sm:p-6" style={{
            borderColor: c.cor + "80",
            background: `linear-gradient(135deg, ${c.cor}15, #000)`
          }}>
            {editando ? (
              <div className="space-y-3 mb-4">
                <div className="flex flex-col sm:flex-row gap-2 items-start">
                  <input value={c.nome} onChange={(e) => updateCla(ci, { nome: e.target.value })} placeholder="Nome do clã" className="fox-input flex-1 min-w-[200px]" />
                  <input value={c.tipo} onChange={(e) => updateCla(ci, { tipo: e.target.value })} placeholder="Tipo (badge)" className="fox-input w-full sm:w-32" />
                </div>
                <div className="grid grid-cols-2 sm:flex gap-2 items-end sm:items-center">
                  <label className="fox-label mb-0 col-span-2 sm:col-span-1">ID (interno)</label>
                  <input value={c.id} onChange={(e) => updateCla(ci, { id: e.target.value.toLowerCase().replace(/[^a-z0-9_]/g, "") })} className="fox-input w-32" />
                  <label className="fox-label mb-0 ml-2">Ícone</label>
                  <select value={c.icon} onChange={(e) => updateCla(ci, { icon: e.target.value })} className="fox-input w-auto">
                    {Object.keys(CLA_ICONS).map(k => <option key={k} value={k}>{k}</option>)}
                  </select>
                  <label className="fox-label mb-0 ml-2">Cor</label>
                  <input type="color" value={c.cor} onChange={(e) => updateCla(ci, { cor: e.target.value })} className="h-8 w-14 rounded bg-transparent border border-zinc-700" />
                  <button onClick={() => { if (confirm(`Remover ${c.nome}?`)) removeCla(ci); }} className="mobile-tap col-span-2 sm:col-span-1 sm:ml-auto text-red-300 bg-red-950/80 p-2 rounded flex items-center justify-center"><ITrash className="w-4 h-4" /></button>
                </div>
                <textarea value={c.descricao} onChange={(e) => updateCla(ci, { descricao: e.target.value })} rows="6" placeholder="História, descrição, identidade do clã..." className="fox-input" />
              </div>
            ) : (
              <>
                <div className="flex items-center gap-3 mb-3 flex-wrap">
                  <I className="w-7 h-7" style={{ color: c.cor }} />
                  <h3 className="text-2xl font-bold text-orange-50 serif">{c.nome}</h3>
                  {c.tipo && <span className="text-xs px-2 py-0.5 rounded uppercase tracking-wider border" style={{ color: c.cor, borderColor: c.cor + "80", background: c.cor + "20" }}>{c.tipo}</span>}
                  <span className="ml-auto text-xs text-zinc-500">{membros.length} {membros.length === 1 ? "membro" : "membros"}</span>
                </div>
                <p className="text-zinc-400 leading-relaxed mb-4 whitespace-pre-wrap">{c.descricao}</p>

                {/* Membros do clã */}
                {membros.length > 0 && (
                  <div className="mb-4 p-4 bg-black/40 border border-zinc-800 rounded">
                    <div className="text-xs uppercase tracking-wider mb-3" style={{ color: c.cor }}>Membros</div>
                    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2">
                      {membros.map(u => {
                        const ur = data.roles.find(r => r.id === u.role);
                        return (
                          <div key={u.username} className="flex items-center gap-2 p-2 bg-zinc-950/60 border border-zinc-800 rounded">
                            <div className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: ur?.cor || "#71717a" }} />
                            <div className="min-w-0 flex-1">
                              <div className="text-orange-50 text-sm font-bold truncate">{getCodinome(u)}</div>
                              <div className="text-zinc-600 text-[10px] truncate">{ur?.nome || u.role}</div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}
              </>
            )}
            <FigurasEditor figuras={c.figuras || []} onChange={(f) => updateFigurasDireto(ci, f)} isLider={podeEditar && !editando} cor={c.cor} />
          </div>
        );
      })}

      {editando && (
        <button onClick={addCla} className="w-full rounded-lg border-2 border-dashed border-zinc-800 hover:border-orange-700 text-zinc-600 hover:text-orange-500 py-10 flex flex-col items-center gap-2 transition-colors">
          <IPlus className="w-8 h-8" />
          <span className="uppercase tracking-wider text-xs font-bold">Adicionar Novo Clã</span>
        </button>
      )}

      {/* Membros sem clã (aviso pro líder) */}
      {!editando && semCla.length > 0 && podeEditar && (
        <div className="rounded-lg border border-yellow-800/50 bg-yellow-950/20 p-4">
          <div className="flex items-center gap-2 text-yellow-400 text-sm font-bold uppercase tracking-wider mb-2">
            <IAlert className="w-4 h-4" /> {semCla.length} {semCla.length === 1 ? "membro sem clã" : "membros sem clã"}
          </div>
          <div className="text-zinc-400 text-xs mb-2">Atribua um clã a cada membro em <strong>Gerenciar → Usuários</strong>:</div>
          <div className="flex flex-wrap gap-2">
            {semCla.map(u => (
              <span key={u.username} className="text-xs px-2 py-1 bg-zinc-950/60 border border-zinc-800 rounded text-zinc-300">{getCodinome(u)}</span>
            ))}
          </div>
        </div>
      )}

      {/* Mandamentos */}
      <div>
        <div className="flex items-center justify-between mb-3 gap-2">
          <div><h3 className="text-xl font-bold text-orange-50 serif">Os {mandamentos.length} Mandamentos da Jikkai</h3><p className="text-zinc-600 text-xs mt-1">Código da organização, separado do legado Lamona.</p></div>
          {podeEditar && (editMandamentos ? (
            <div className="flex gap-2">
              <Btn onClick={cancelarMandamentos} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
              <Btn onClick={salvarMandamentos} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn>
            </div>
          ) : (
            <Btn onClick={() => setEditMandamentos(true)} variant="default"><IEdit className="w-3 h-3" /> Editar</Btn>
          ))}
        </div>
        <div className="space-y-2">
          {mandamentos.map((m, i) => (
            <div key={i} className="flex flex-col sm:flex-row gap-3 p-3 bg-zinc-950/50 border border-zinc-800 rounded items-start">
              <span className="text-orange-600 font-bold flex-shrink-0">{String(i + 1).padStart(2, "0")}</span>
              {editMandamentos ? (
                <>
                  <input value={m} onChange={(e) => updateMandamento(i, e.target.value)} className="fox-input flex-1" />

                    <button onClick={() => moveMandamento(i, 1)} className="mobile-tap flex-1 sm:flex-none px-3 bg-zinc-900 border border-zinc-800 rounded text-zinc-400" title="Descer">↓</button>
                    
                  </div>
                </>
              ) : (
                <span className="text-zinc-300">{m}</span>
              )}
            </div>
          ))}
        </div>
        {editMandamentos && (
          <div className="mt-3 text-xs text-yellow-500/80 italic">
            ⚠ O juramento da Jikkai possui sempre 5 mandamentos. Edite o texto e a ordem, mas mantenha o código da organização.
          </div>
        )}
      </div>
    </div>
  );
}

function familiaDoMembro(data, membro) {
  return (data.clas || []).find(c => c.id === membro?.cla);
}

function divisoesJikkai(data) {
  const base = Array.isArray(data.divisoes) && data.divisoes.length ? data.divisoes : DEFAULT_DIVISOES;
  return base.map((d, i) => ({
    id: d.id || "divisao_" + (slugEstrutura(d.nome) || i),
    nome: d.nome || "Divisão " + (i + 1),
    desc: d.desc || d.descricao || "Divisão operacional da Jikkai.",
    cor: d.cor || ["#D85A30", "#B91C1C", "#7C2D12", "#EA580C"][i % 4],
    status: d.status || "ativa",
    capitaoUsername: d.capitaoUsername || d.capitao || "",
  }));
}

function equipesJikkai(data) {
  const divisoes = divisoesJikkai(data);
  const divPadrao = divisoes[0]?.id || "divisao_central";
  return (data.trios || []).map((t, i) => {
    const membros = (t.membros || []).map(m => {
      const encontrado = m.username ? (data.users || []).find(u => u.username === m.username) : usuarioPorIdentidade(data.users || [], m.nome);
      return { ...m, username: m.username || encontrado?.username || "", papel: m.papel || "Soldado" };
    });
    const liderPorPapel = membros.find(m => String(m.papel || "").toLowerCase().includes("líder") || String(m.papel || "").toLowerCase().includes("lider"));
    return {
      ...t,
      id: t.id || "equipe_" + (slugEstrutura(t.nome) || i),
      nome: t.nome || "Equipe " + (i + 1),
      desc: t.desc || t.descricao || "Equipe operacional da Jikkai.",
      cor: t.cor || "#D85A30",
      divisaoId: t.divisaoId || t.ramoId || divPadrao,
      tipo: t.tipo || "Ataque",
      status: t.status || "Ativa",
      liderUsername: t.liderUsername || liderPorPapel?.username || "",
      membros,
    };
  });
}

function papelEquipeGrupo(papel) {
  const p = String(papel || "").toLowerCase();
  if (p.includes("recruta") || p.includes("associado") || p.includes("prospect")) return "base";
  return "soldado";
}

function podeGerenciarTodasEquipes(role) {
  const pos = estruturaPosicaoRole(role);
  return !!(role?.hasLeaderPerms || hasPerm(role, "edit_trios") || pos === "lider" || pos === "braco_direito" || pos === "conselheiro");
}

function divisoesDoCapitao(data, usuario) {
  if (!usuario) return [];
  return divisoesJikkai(data).filter(d => d.capitaoUsername === usuario.username);
}


function membrosDaEquipeOperacional(data, equipeId) {
  const equipe = equipesJikkai(data).find(e => e.id === equipeId);
  if (!equipe) return [];
  return Array.from(new Set((equipe.membros || []).map(m => m.username).filter(Boolean)));
}

function membrosDaDivisaoOperacional(data, divisaoId) {
  const divisao = divisoesJikkai(data).find(d => d.id === divisaoId);
  const equipes = equipesJikkai(data).filter(e => e.divisaoId === divisaoId);
  const nomes = equipes.flatMap(e => (e.membros || []).map(m => m.username).filter(Boolean));
  if (divisao?.capitaoUsername) nomes.unshift(divisao.capitaoUsername);
  return Array.from(new Set(nomes.filter(Boolean)));
}

function escopoOperacionalLabel(data, tipo, alvoId, fallback = "") {
  if (tipo === "divisao") {
    const d = divisoesJikkai(data).find(x => x.id === alvoId);
    return d ? "Divisão · " + d.nome : fallback || "Divisão";
  }
  if (tipo === "equipe") {
    const e = equipesJikkai(data).find(x => x.id === alvoId);
    const d = e ? divisoesJikkai(data).find(x => x.id === e.divisaoId) : null;
    return e ? "Equipe · " + e.nome + (d ? " / " + d.nome : "") : fallback || "Equipe";
  }
  if (tipo === "membro") {
    const u = (data.users || []).find(x => x.username === alvoId);
    return u ? "Membro · " + getCodinome(u) : fallback || "Membro";
  }
  return fallback || "Escopo não definido";
}

function participantesPorEscopoOperacional(data, tipo, alvoId, fallback = []) {
  if (tipo === "divisao") return membrosDaDivisaoOperacional(data, alvoId);
  if (tipo === "equipe") return membrosDaEquipeOperacional(data, alvoId);
  if (tipo === "membro") return alvoId ? [alvoId] : [];
  return Array.from(new Set((fallback || []).filter(Boolean)));
}

function escoposGerenciaveisOperacionais(data, usuario, role) {
  const pos = estruturaPosicaoRole(role);
  const fullAdmin = !!(isRootUser(usuario) || role?.hasLeaderPerms || ["lider", "conselheiro", "braco_direito"].includes(pos));
  const temGestao = fullAdmin || hasPerm(role, "manage_missions") || hasPerm(role, "edit_contracts");
  const todasDivisoes = divisoesJikkai(data);
  const todasEquipes = equipesJikkai(data);
  let divisoes = [];
  if (fullAdmin || (temGestao && pos !== "capitao_ramo")) divisoes = todasDivisoes;
  else if (pos === "capitao_ramo") divisoes = todasDivisoes.filter(d => d.capitaoUsername === usuario?.username);
  const ids = new Set(divisoes.map(d => d.id));
  const equipes = (fullAdmin || (temGestao && pos !== "capitao_ramo")) ? todasEquipes : todasEquipes.filter(e => ids.has(e.divisaoId));
  return { fullAdmin, temGestao, divisoes, equipes };
}
