};

function ContratoModal({ contrato, onSave, onClose, viewerIsContratante }) {
  const editando = !!contrato?.id;
  const [titulo, setTitulo] = useState(contrato?.titulo || "");
  const [descricaoCurta, setDescCurta] = useState(contrato?.descricaoCurta || "");
  const [descricao, setDescricao] = useState(contrato?.descricao || "");
  const [valorRecompensa, setValor] = useState(contrato?.valorRecompensa || 100);
  const [tipoRecompensa, setTipo] = useState(contrato?.tipoRecompensa || "Pontos de Sangue");
  const [dificuldade, setDificuldade] = useState(contrato?.dificuldade || "Médio");
  const [status, setStatus] = useState(contrato?.status || (viewerIsContratante ? "Proposta" : "Aberto"));
  const [limites, setLimites] = useState(contrato?.limites || "");
  const [prazo, setPrazo] = useState(contrato?.prazo || "");
  const [observacoes, setObservacoes] = useState(contrato?.observacoes || "");

  const valido = titulo.trim() && descricaoCurta.trim();

  const salvar = () => {
    if (!valido) return;
    onSave({
      titulo: titulo.trim(),
      descricaoCurta: descricaoCurta.trim(),
      descricao: descricao.trim(),
      valorRecompensa: Number(valorRecompensa) || 0,
      tipoRecompensa,
      dificuldade,
      status,
      limites: limites.trim(),
      prazo: prazo.trim(),
      observacoes: observacoes.trim(),
    });
  };

  const tituloModal = editando
    ? "Editar Contrato"
    : (viewerIsContratante ? "Solicitar Contrato à F.O.X." : "Forjar Novo Contrato");

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm fadein" onClick={onClose}>
      <div className="bg-zinc-950 border border-red-700 rounded-lg shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
        <div className="p-5 border-b border-red-900/50 flex items-center justify-between sticky top-0 bg-zinc-950 z-10">
          <div className="flex items-center gap-3">
            {viewerIsContratante ? <IBriefcase className="w-6 h-6 text-orange-500" /> : <ISkull className="w-6 h-6 text-red-500" />}
            <h3 className="text-xl font-bold text-orange-50 serif">{tituloModal}</h3>
          </div>
          <button onClick={onClose} className="text-zinc-500 hover:text-red-400 p-1"><IX className="w-5 h-5" /></button>
        </div>
        <div className="p-5 space-y-4">
          {viewerIsContratante && !editando && (
            <div className="p-3 bg-orange-950/30 border border-orange-900/50 rounded text-xs text-orange-300 leading-relaxed">
              Sua solicitação ficará marcada como <strong>Proposta</strong> e será analisada pela liderança da F.O.X.
              Você poderá negociar os termos através das mensagens dentro do contrato.
            </div>
          )}
          <div>
            <label className="fox-label">Título *</label>
            <input value={titulo} onChange={(e) => setTitulo(e.target.value)} className="fox-input" placeholder={viewerIsContratante ? "Ex: Eliminação de rival comercial" : "Ex: Eliminar mercador de Konoha"} autoFocus />
          </div>
          <div>
            <label className="fox-label">Resumo *</label>
            <input value={descricaoCurta} onChange={(e) => setDescCurta(e.target.value)} className="fox-input" placeholder="Uma linha que aparece no card" />
          </div>
          <div>
            <label className="fox-label">Descrição completa</label>
            <textarea value={descricao} onChange={(e) => setDescricao(e.target.value)} rows="5" className="fox-input" placeholder={viewerIsContratante ? "Contexto do serviço, alvo, motivação..." : "Detalhes do contrato, alvo, contexto..."} />
          </div>
          <div className="grid sm:grid-cols-3 gap-3">
            <div>
              <label className="fox-label">{viewerIsContratante ? "Valor oferecido" : "Recompensa"}</label>
              <input type="number" value={valorRecompensa} onChange={(e) => setValor(e.target.value)} className="fox-input" />
            </div>
            <div>
              <label className="fox-label">Moeda</label>
              <select value={tipoRecompensa} onChange={(e) => setTipo(e.target.value)} className="fox-input">
                <option>Pontos de Sangue</option>
                <option>Ryō</option>
              </select>
            </div>
            <div>
              <label className="fox-label">Dificuldade estimada</label>
              <select value={dificuldade} onChange={(e) => setDificuldade(e.target.value)} className="fox-input">
                <option>Fácil</option><option>Médio</option><option>Difícil</option><option>Letal</option>
              </select>
            </div>
          </div>
          <div>
            <label className="fox-label">Limites e restrições</label>
            <textarea value={limites} onChange={(e) => setLimites(e.target.value)} rows="3" className="fox-input" placeholder="Ex: Sem baixas civis. Sem testemunhas. Não usar fuinjutsu proibido..." />
          </div>
          <div className="grid sm:grid-cols-2 gap-3">
            <div>
              <label className="fox-label">Prazo</label>
              <input value={prazo} onChange={(e) => setPrazo(e.target.value)} className="fox-input" placeholder="Ex: 7 dias, até o próximo plenilúnio..." />
            </div>
            <div>
              <label className="fox-label">Observações extras</label>
              <input value={observacoes} onChange={(e) => setObservacoes(e.target.value)} className="fox-input" placeholder="Notas adicionais" />
            </div>
          </div>
          {editando && !viewerIsContratante && (
            <div>
              <label className="fox-label">Status</label>
              <select value={status} onChange={(e) => setStatus(e.target.value)} className="fox-input">
                <option>Proposta</option>
                <option>Aberto</option>
                <option>Em Andamento</option>
                <option>Concluído</option>
                <option>Falhou</option>
                <option>Recusado</option>
              </select>
            </div>
          )}
        </div>
        <div className="p-5 border-t border-zinc-800 flex gap-2 justify-end sticky bottom-0 bg-zinc-950">
          <Btn onClick={onClose} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
          <Btn onClick={salvar} variant="primary" disabled={!valido}>
            <ISave className="w-3 h-3" /> {editando ? "Salvar" : (viewerIsContratante ? "Enviar Solicitação" : "Forjar Contrato")}
          </Btn>
        </div>
      </div>
    </div>
  );
}

function ContratosSection({ data, setData, isLider, usuario, viewerIsContratante }) {
  const [modal, setModal] = useState(null);
  const [filtro, setFiltro] = useState("Todos");
  const [expandido, setExpandido] = useState(null);
  const [novaMsgPorContrato, setNovaMsgPorContrato] = useState({});

  // Helper local: nome a exibir respeitando o viewer
  const exibirNome = (username, nomeArmazenado) => {
    if (!username && !nomeArmazenado) return "?";
    const u = data.users?.find(x => x.username === username);
    if (viewerIsContratante) {
      // Se eu sou contratante e o username é o meu, mostro meu nome
      if (username === usuario?.username) return u?.displayName || u?.codinome || "Você";
      // Se quem criou é outro contratante, mostro o codinome dele
      if (u?.role === "contratante") return u.codinome || u.displayName || "Contratante";
      // Senão (operador da F.O.X.), mascaro completamente
      return "F.O.X. — Liderança";
    }
    if (u) return nomeParaExibir(u, false);
    return nomeArmazenado || username || "?";
  };

  // Filtragem: contratante só vê seus próprios contratos + os "Aberto" (vitrine)
  const todosBruto = (data.contratos || []).slice().sort((a, b) => new Date(b.criadoEm) - new Date(a.criadoEm));
  const todos = viewerIsContratante
    ? todosBruto.filter(c => c.criadoPor === usuario?.username || c.status === "Aberto")
    : todosBruto;
  const contratos = filtro === "Todos" ? todos : todos.filter(c => c.status === filtro);

  const criar = (form) => {
    const tipo = viewerIsContratante ? "externo" : "interno";
    const statusInicial = viewerIsContratante ? "Proposta" : (form.status || "Aberto");
    const novo = {
      id: uid(),
      ...form,
      status: statusInicial,
      tipo,
      criadoPor: usuario?.username || "?",
      criadoPorNome: usuario?.displayName || usuario?.username || "Desconhecido",
      criadoEm: new Date().toISOString(),
      negociacoes: [],
    };
    setData(d => ({ ...d, contratos: [...(d.contratos || []), novo] }));
    setModal(null);
  };

  const editar = (form) => {
    setData(d => ({
      ...d,
      contratos: (d.contratos || []).map(c => c.id === modal.id ? { ...c, ...form } : c),
    }));
    setModal(null);
  };

  const deletar = (id) => {
    if (!confirm("Deletar este contrato? Esta ação não pode ser desfeita.")) return;
    setData(d => ({ ...d, contratos: (d.contratos || []).filter(c => c.id !== id) }));
  };

  const aprovarProposta = (id) => {
    if (!confirm("Aprovar esta proposta? Ela ficará aberta para os operadores aceitarem.")) return;
    setData(d => ({
      ...d,
      contratos: d.contratos.map(c => c.id === id ? { ...c, status: "Aberto", aprovadoEm: new Date().toISOString(), aprovadoPor: usuario?.username } : c),
    }));
  };

  const recusarProposta = (id) => {
    if (!confirm("Recusar esta proposta?")) return;
    setData(d => ({
      ...d,
      contratos: d.contratos.map(c => c.id === id ? { ...c, status: "Recusado", recusadoEm: new Date().toISOString() } : c),
    }));
  };

  const adicionarNegociacao = (contratoId) => {
    const msg = (novaMsgPorContrato[contratoId] || "").trim();
    if (!msg) return;
    const nova = {
      autor: usuario?.username,
      autorRole: usuario?.role,
      mensagem: msg,
      data: new Date().toISOString(),
    };
    setData(d => ({
      ...d,
      contratos: d.contratos.map(c => c.id === contratoId ? { ...c, negociacoes: [...(c.negociacoes || []), nova] } : c),
    }));
    setNovaMsgPorContrato(s => ({ ...s, [contratoId]: "" }));
  };

  const aceitar = (contrato) => {
    if (!confirm(`Aceitar o contrato "${contrato.titulo}"? Será criada uma missão atribuída a você.`)) return;
    const missaoId = uid();
    const novaMissao = {
      id: missaoId,
      titulo: `[Contrato] ${contrato.titulo}`,
      desc: contrato.descricao || contrato.descricaoCurta,
      assignedTo: usuario.username,
      participants: [usuario.username],
      aceites: [],
      assignedBy: contrato.criadoPor,
      createdAt: new Date().toISOString(),
      objetivos: [],
      status: "atribuida",
      source: "contrato",
      sigilo: "Restrito",
      contratoId: contrato.id,
      recompensa: `${contrato.valorRecompensa} ${contrato.tipoRecompensa}`,
    };
    setData(d => ({
      ...d,
      missoes: [...d.missoes, novaMissao],
      contratos: d.contratos.map(c => c.id === contrato.id ? {
        ...c,
        status: "Em Andamento",
        aceitoPor: usuario.username,
        aceitoPorNome: usuario.displayName || usuario.username,
        aceitoEm: new Date().toISOString(),
        missaoId,
      } : c),
    }));
    alert("Contrato convertido em missão. Confirme sua participação na aba Missões.");
  };

  // Filtros disponíveis (contratante não vê "Recusado")
  const FILTROS = viewerIsContratante
    ? ["Todos", "Proposta", "Aberto", "Em Andamento", "Concluído", "Falhou"]
    : ["Todos", "Proposta", "Aberto", "Em Andamento", "Concluído", "Falhou", "Recusado"];

  const podeCriar = isLider || viewerIsContratante;
  const tituloHeader = viewerIsContratante ? "Contratos & Propostas" : "Contratos — Mercenários";
  const labelBotaoCriar = viewerIsContratante ? "Solicitar Contrato" : "Forjar Contrato";

  return (
    <div className="fadein">
      <div className="flex items-center justify-between mb-6 gap-3 flex-wrap">
        <div className="border-l-4 border-red-700 pl-4">
          <div className="flex items-center gap-3">
            <ISwords className="w-6 h-6 text-red-500" />
            <h2 className="text-2xl font-bold text-red-50 tracking-wide serif">{tituloHeader}</h2>
          </div>
          <p className="text-zinc-500 text-sm mt-1 italic">{todos.length} {todos.length === 1 ? "contrato" : "contratos"}</p>
        </div>
        {podeCriar && <Btn onClick={() => setModal({})} variant="primary"><IPlus className="w-3 h-3" /> {labelBotaoCriar}</Btn>}
      </div>

      <div className="flex gap-2 mb-6 flex-wrap">
        {FILTROS.map(f => {
          const active = filtro === f;
          const count = f === "Todos" ? todos.length : todos.filter(c => c.status === f).length;
          return (
            <button key={f} onClick={() => setFiltro(f)} className={`px-3 py-1.5 rounded text-xs uppercase tracking-wider font-bold border transition-colors ${active ? "bg-red-700 border-red-600 text-white" : "bg-zinc-950 border-zinc-800 text-zinc-500 hover:text-zinc-300 hover:border-zinc-700"}`}>
              {f} <span className="opacity-60">({count})</span>
            </button>
          );
        })}
      </div>

      {contratos.length === 0 && (
        <div className="p-8 text-center bg-zinc-950/50 border border-red-900/30 rounded-lg">
          <ISkull className="w-12 h-12 text-zinc-700 mx-auto mb-3" />
          <p className="text-zinc-500">{todos.length === 0 ? "Nenhum contrato ainda." : "Nenhum contrato neste filtro."}</p>
          {todos.length === 0 && podeCriar && <p className="text-zinc-700 text-xs italic mt-2">{viewerIsContratante ? "Solicite seu primeiro contrato à F.O.X." : "Forje o primeiro contrato de sangue."}</p>}
        </div>
      )}

      <div className="grid md:grid-cols-2 gap-4">
        {contratos.map((c) => {
          const sc = CONTRATO_STATUS_CFG[c.status] || CONTRATO_STATUS_CFG["Aberto"];
          const dc = DIFICULDADE_CFG[c.dificuldade] || DIFICULDADE_CFG["Médio"];
          const expanded = expandido === c.id;
          const podeAceitar = c.status === "Aberto" && usuario && !isLider && !viewerIsContratante;
          const aceito = c.aceitoPor === usuario?.username;
          const ehMinhaProposta = viewerIsContratante && c.criadoPor === usuario?.username;
          const ehProposta = c.status === "Proposta";
          const podeAprovar = isLider && ehProposta;
          // Pode adicionar negociação: criador da proposta, líder, ou membro interno em propostas/abertos
          const podeNegociar = (
            (ehMinhaProposta) ||
            (isLider && (ehProposta || c.status === "Aberto")) ||
            (!viewerIsContratante && !isLider && c.tipo === "externo" && (ehProposta || c.status === "Aberto"))
          );
          const negociacoes = c.negociacoes || [];
          const missaoVinculada = c.missaoId ? data.missoes?.find(m => m.id === c.missaoId) : null;
          const missaoCfg = missaoVinculada ? statusMissaoConfig(missaoVinculada.status) : null;

          return (
            <div key={c.id} className={`relative rounded-lg border-2 ${sc.border} ${sc.bg} p-5 fadein hover:border-red-500 transition-colors`}
                 style={{ backgroundImage: "radial-gradient(circle at top right, rgba(185,28,28,0.08), transparent 60%)" }}>
              {/* Selo de sangue no canto */}
              <div className="absolute top-3 right-3 opacity-20">
                {c.tipo === "externo" ? <IBriefcase className="w-12 h-12 text-orange-700" /> : <ISkull className="w-12 h-12 text-red-700" />}
              </div>

              <div className="relative">
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  <span className={`text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider ${sc.badge}`}>{c.status}</span>
                  <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider border" style={{ color: dc.cor, borderColor: dc.cor + "80", background: dc.cor + "15" }}>
                    {c.dificuldade}
                  </span>
                  {c.tipo === "externo" && (
                    <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider border border-orange-700 text-orange-300 bg-orange-950/40">
                      Solicitação Externa
                    </span>
                  )}
                  {negociacoes.length > 0 && (
                    <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider bg-zinc-800 text-zinc-400">
                      💬 {negociacoes.length}
                    </span>
                  )}
                </div>

                <h3 className="text-orange-50 font-bold text-lg serif leading-tight mb-1 pr-10">{c.titulo}</h3>
                <p className="text-zinc-400 text-sm mb-3">{c.descricaoCurta}</p>

                {/* Recompensa em destaque */}
                <div className="flex items-center gap-2 mb-3 p-2 bg-black/60 border border-red-900/40 rounded">
                  <div className="w-2 h-2 rounded-full bg-red-500 pulse-fire" />
                  <div className="text-xs uppercase tracking-wider text-zinc-500">{c.tipo === "externo" ? "Oferta:" : "Recompensa:"}</div>
                  <div className="text-orange-300 font-black text-sm">{Number(c.valorRecompensa || 0).toLocaleString("pt-BR")} <span className="text-orange-600 text-xs uppercase">{c.tipoRecompensa}</span></div>
                </div>

                {expanded && (
                  <div className="space-y-2 mb-3">
                    {c.descricao && (
                      <div className="p-3 bg-black/40 border border-zinc-800 rounded">
                        <div className="text-[10px] uppercase tracking-wider text-orange-600 mb-1">Descrição completa</div>
                        <div className="text-sm text-zinc-300 whitespace-pre-wrap">{c.descricao}</div>
                      </div>
                    )}
                    {c.limites && (
                      <div className="p-3 bg-black/40 border border-red-900/40 rounded">
                        <div className="text-[10px] uppercase tracking-wider text-red-500 mb-1">Limites & Restrições</div>
                        <div className="text-sm text-zinc-300 whitespace-pre-wrap">{c.limites}</div>
                      </div>
                    )}
                    {c.prazo && (
                      <div className="p-3 bg-black/40 border border-zinc-800 rounded">
                        <div className="text-[10px] uppercase tracking-wider text-orange-600 mb-1">Prazo</div>
                        <div className="text-sm text-zinc-300">{c.prazo}</div>
                      </div>
                    )}
                    {c.observacoes && (
                      <div className="p-3 bg-black/40 border border-zinc-800 rounded">
                        <div className="text-[10px] uppercase tracking-wider text-orange-600 mb-1">Observações</div>
                        <div className="text-sm text-zinc-300 whitespace-pre-wrap">{c.observacoes}</div>
                      </div>
                    )}

                    {/* Negociações */}
                    {(negociacoes.length > 0 || podeNegociar) && (
                      <div className="p-3 bg-black/40 border border-zinc-800 rounded">
                        <div className="text-[10px] uppercase tracking-wider text-orange-600 mb-2">Negociação ({negociacoes.length})</div>
                        <div className="space-y-2 mb-2 max-h-60 overflow-y-auto">
                          {negociacoes.map((n, ni) => {
                            const ehContratanteAutor = n.autorRole === "contratante";
                            const nomeAutor = exibirNome(n.autor, null);
                            return (
                              <div key={ni} className={`p-2 rounded text-sm border ${ehContratanteAutor ? "bg-orange-950/20 border-orange-900/40" : "bg-red-950/20 border-red-900/40"}`}>
                                <div className="flex items-center justify-between mb-1">
                                  <strong className={ehContratanteAutor ? "text-orange-400 text-xs" : "text-red-400 text-xs"}>{nomeAutor}</strong>
                                  <span className="text-[10px] text-zinc-600">{new Date(n.data).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</span>
                                </div>
                                <div className="text-zinc-300 whitespace-pre-wrap">{n.mensagem}</div>
                              </div>
                            );
                          })}
                          {negociacoes.length === 0 && <div className="text-zinc-700 text-xs italic">Nenhuma mensagem ainda.</div>}
                        </div>
                        {podeNegociar && (
                          <div className="flex gap-2">
                            <input
                              value={novaMsgPorContrato[c.id] || ""}
                              onChange={(e) => setNovaMsgPorContrato(s => ({ ...s, [c.id]: e.target.value }))}
                              onKeyDown={(e) => e.key === "Enter" && (e.preventDefault(), adicionarNegociacao(c.id))}
                              placeholder="Adicionar contraproposta ou mensagem..."
                              className="fox-input"
                            />
                            <Btn onClick={() => adicionarNegociacao(c.id)} variant="primary"><IPlus className="w-3 h-3" /></Btn>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}


                {missaoVinculada && (
                  <div className={`mb-3 p-2 rounded border ${missaoCfg.border} ${missaoCfg.bg} flex items-center justify-between gap-2`}>
                    <div className="min-w-0">
                      <div className="text-[10px] uppercase tracking-wider text-zinc-600">Fluxo operacional</div>
                      <div className="text-xs text-zinc-300 truncate">{missaoVinculada.titulo}</div>
                    </div>
                    <span className={`text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider whitespace-nowrap ${missaoCfg.badge}`}>{missaoCfg.label}</span>
                  </div>
                )}

                {c.aceitoPor && (
                  <div className="text-xs text-zinc-600 mb-3">
                    Aceito por <strong className="text-orange-500">{exibirNome(c.aceitoPor, c.aceitoPorNome)}</strong>
                    {c.aceitoEm && ` em ${new Date(c.aceitoEm).toLocaleDateString("pt-BR")}`}
                  </div>
                )}

                <div className="flex gap-2 mt-3 pt-3 border-t border-red-900/30 flex-wrap">
                  <Btn onClick={() => setExpandido(expanded ? null : c.id)} variant="ghost">
                    {expanded ? "Recolher" : "Detalhes"}
                  </Btn>
                  {podeAprovar && (
                    <>
                      <Btn onClick={() => aprovarProposta(c.id)} variant="primary"><ICheck className="w-3 h-3" /> Aprovar</Btn>
                      <Btn onClick={() => recusarProposta(c.id)} variant="danger"><IX className="w-3 h-3" /> Recusar</Btn>
                    </>
                  )}
                  {podeAceitar && (
                    <Btn onClick={() => aceitar(c)} variant="primary" className="ml-auto">
                      <ISkull className="w-3 h-3" /> Aceitar Contrato
                    </Btn>
                  )}
                  {aceito && c.status === "Em Andamento" && (
                    <span className="ml-auto text-xs uppercase tracking-wider text-orange-500 self-center font-bold">Você aceitou este</span>
                  )}
                  {(isLider || (viewerIsContratante && ehMinhaProposta && ehProposta)) && (
                    <div className="flex gap-1 ml-auto">
                      <button onClick={() => setModal(c)} className="p-1.5 text-orange-400 hover:text-orange-300" title="Editar"><IEdit className="w-4 h-4" /></button>
                      {(isLider || ehMinhaProposta) && (
                        <button onClick={() => deletar(c.id)} className="p-1.5 text-red-500 hover:text-red-400" title="Deletar"><ITrash className="w-4 h-4" /></button>
                      )}
                    </div>
                  )}
                </div>

                <div className="text-[10px] text-zinc-700 italic mt-2">
                  {c.tipo === "externo" ? "Solicitado" : "Forjado"} por {exibirNome(c.criadoPor, c.criadoPorNome)} · {new Date(c.criadoEm).toLocaleDateString("pt-BR")}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {modal && (
        <ContratoModal
          contrato={modal.id ? modal : null}
          onSave={modal.id ? editar : criar}
          onClose={() => setModal(null)}
          viewerIsContratante={viewerIsContratante}
        />
      )}
    </div>
  );
}

function PlanoSection({ data, setData, isLider, usuario = null }) {
  const [aba, setAba] = useState("visao");
  const [faseAberta, setFaseAberta] = useState(null);
  const [editandoFase, setEditandoFase] = useState(null);

  const fases = data.fases || [];
  const sinais = coletarSinaisEstrategicos(data);
  const progressoGeral = progressoGeralJikkai(fases);
  const faseAtual = fases.find(f => f.status === "andamento") || fases.find(f => f.status !== "concluida") || fases[fases.length - 1];
  const objetivos = fases.flatMap(f => (f.objetivos || []).map(o => ({ ...o, faseId: f.id })));
  const concluidos = objetivos.filter(o => o.status === "concluido").length;
  const bloqueados = objetivos.filter(o => o.status === "bloqueado").length;
  const criticos = sinais.filter(s => s.risco === "Crítico").length;
  const operacoesAtivas = (data.missoes || []).filter(m => ["atribuida", "aceita", "andamento", "revisao", "devolvida"].includes(m.status)).length;

  const salvarFase = (faseId, patch) => {
    setData(d => ({
      ...d,
      fases: (d.fases || []).map(f => f.id === faseId ? { ...f, ...patch } : f),
      activityLog: [...(d.activityLog || []), atividade("fase_atualizada", usuario?.username || "lideranca", faseId, "Atualizou a fase " + patch.titulo + " do plano Jikkai")],
    }));
    setEditandoFase(null);
  };

  const criarAlertaManual = () => {
    const titulo = window.prompt("Título do alerta estratégico:", "");
    if (!titulo?.trim()) return;
    const descricao = window.prompt("Descreva a situação, consequência e resposta recomendada:", "") || "";
    const riscoInformado = window.prompt("Nível de risco: Baixo, Moderado, Elevado ou Crítico", "Moderado") || "Moderado";
    const risco = normalizarRisco(riscoInformado);
    const faseId = faseAtual?.id || "";
    setData(d => ({
      ...d,
      sinaisEstrategicos: [...(d.sinaisEstrategicos || []), {
        id: "sinal_" + uid(),
        titulo: titulo.trim(),
        descricao: descricao.trim(),
        risco,
        categoria: "Comando",
        fonteTipo: "comando",
        fonteId: "",
        fonteNome: "Decisão do comando",
        faseId,
        objetivoId: "",
        status: "ativo",
        criadoEm: new Date().toISOString(),
        criadoPor: usuario?.username || "lideranca",
      }],
      activityLog: [...(d.activityLog || []), atividade("alerta_estrategico_criado", usuario?.username || "lideranca", faseId || "jikkai", "Criou o alerta estratégico: " + titulo.trim())],
    }));
  };

  const resolverAlertaManual = sinal => {
    if (sinal.fonteTipo !== "comando") return;
    setData(d => ({
      ...d,
      sinaisEstrategicos: (d.sinaisEstrategicos || []).map(s => s.id === sinal.id ? { ...s, status: "resolvido", resolvidoEm: new Date().toISOString() } : s),
      activityLog: [...(d.activityLog || []), atividade("alerta_estrategico_resolvido", usuario?.username || "lideranca", sinal.id, "Resolveu o alerta estratégico: " + sinal.titulo)],
    }));
  };

  const abrirMapa = () => window.open("./mapa.html", "_blank", "noopener");
  const tabs = [
    { id: "visao", label: "Visão Geral", icon: ITarget },
    { id: "fases", label: "Fases", icon: IClipboard },
    { id: "riscos", label: "Riscos", icon: IAlert },
    { id: "historico", label: "Histórico", icon: IBook },
  ];

  if (faseAberta) {
    const fase = fases.find(f => f.id === faseAberta);
    if (fase) {
      const responsavelLabel = nomeResponsavelEstrategico(fase.responsavelGeral, data);
      const requisitosAtendidos = (fase.requisitos || []).filter(r => r.atendido).length;
      const sinaisDaFase = sinais.filter(s => s.faseId === fase.id);
      return <div className="fadein space-y-6">
        <button onClick={() => setFaseAberta(null)} className="text-zinc-500 hover:text-orange-400 text-xs uppercase tracking-wider">← Voltar à central de comando</button>
        <div className="p-6 rounded-2xl border border-orange-800/50 bg-gradient-to-br from-red-950/20 to-black">
          <div className="flex items-start justify-between gap-4"><div><div className="text-[10px] uppercase tracking-[0.35em] text-orange-600">Fase {String(fase.n).padStart(2, "0")}</div><h1 className="text-3xl font-black text-orange-50 serif mt-1">{fase.titulo}</h1><p className="text-zinc-400 mt-2 max-w-3xl">{fase.desc}</p></div>{isLider && <Btn onClick={() => setEditandoFase(fase.id)} variant="primary"><IEdit className="w-3 h-3" /> Editar fase</Btn>}</div>
          <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mt-6">
            <div className="p-3 rounded border border-zinc-800 bg-black/40"><div className="text-[9px] uppercase tracking-wider text-zinc-600">Progresso</div><div className="text-2xl font-black text-orange-300 mt-1">{progressoFase(fase)}%</div></div>
            <div className="p-3 rounded border border-zinc-800 bg-black/40"><div className="text-[9px] uppercase tracking-wider text-zinc-600">Risco</div><div className="mt-2"><RiscoBadge risco={fase.riscoGeral} /></div></div>
            <div className="p-3 rounded border border-zinc-800 bg-black/40"><div className="text-[9px] uppercase tracking-wider text-zinc-600">Responsável</div><div className="text-orange-100 font-bold mt-1">{responsavelLabel}</div></div>
            <div className="p-3 rounded border border-zinc-800 bg-black/40"><div className="text-[9px] uppercase tracking-wider text-zinc-600">Prazo</div><div className="text-orange-100 font-bold mt-1">{fase.prazo ? new Date(fase.prazo + "T00:00:00").toLocaleDateString("pt-BR") : "Sem prazo"}</div></div>
          </div>
        </div>

        {sinaisDaFase.length > 0 && <section><div className="text-[9px] uppercase tracking-[0.25em] text-red-500 mb-3">Alertas que afetam esta fase</div><div className="grid lg:grid-cols-2 gap-3">{sinaisDaFase.map(s => <SinalEstrategicoCard key={s.id} sinal={s} data={data} onOpenPhase={setFaseAberta} onOpenMap={abrirMapa} />)}</div></section>}

        <section><div className="text-[9px] uppercase tracking-[0.25em] text-orange-600 mb-3">Objetivos estratégicos</div><div className="space-y-3">{(fase.objetivos || []).map(o => <ObjetivoEstrategicoCard key={o.id} objetivo={o} data={data} isLider={isLider} onEdit={() => setEditandoFase(fase.id)} />)}</div></section>

        {(fase.requisitos || []).length > 0 && <section className="p-4 rounded-xl border border-zinc-800 bg-zinc-950/60"><div className="flex items-center justify-between gap-3 mb-3"><div><div className="text-[9px] uppercase tracking-[0.25em] text-orange-600">Requisitos de desbloqueio</div><div className="text-zinc-600 text-xs mt-1">{requisitosAtendidos} de {fase.requisitos.length} atendidos</div></div><div className="text-orange-300 font-black">{fase.requisitos.length ? Math.round(requisitosAtendidos / fase.requisitos.length * 100) : 0}%</div></div><div className="space-y-2">{fase.requisitos.map(r => <div key={r.id} className="flex items-center gap-2 text-sm">{r.atendido ? <ICheck className="w-4 h-4 text-green-500" /> : <ILock className="w-4 h-4 text-zinc-700" />}<span className={r.atendido ? "text-zinc-300" : "text-zinc-600"}>{r.texto}</span></div>)}</div></section>}

        {editandoFase === fase.id && <div className="fixed inset-0 z-[80] overflow-y-auto bg-black/95 p-4 sm:p-8"><div className="max-w-5xl mx-auto bg-zinc-950 border border-orange-700 rounded-xl p-5"><FaseEditor fase={fase} data={data} onCancel={() => setEditandoFase(null)} onSave={patch => salvarFase(fase.id, patch)} /></div></div>}
      </div>;
    }
  }

  return <div className="fadein">
    <SectionTitle icon={ITarget} sub="Sala de guerra digital integrada aos registros do portal" action={isLider && <Btn onClick={criarAlertaManual} variant="primary"><IAlert className="w-3 h-3" /> Novo alerta</Btn>}>Painel Estratégico JIKKAI</SectionTitle>

    <div className="p-5 rounded-2xl border border-orange-900/40 bg-gradient-to-br from-red-950/20 via-black to-black mb-6">
      <div className="flex flex-col lg:flex-row lg:items-end gap-6"><div className="flex-1"><div className="text-[10px] uppercase tracking-[0.35em] text-orange-600">Plano geral</div><div className="flex items-end gap-3 mt-1"><div className="text-5xl sm:text-6xl font-black text-orange-50 serif leading-none">{progressoGeral}<span className="text-2xl text-orange-600">%</span></div><div className="flex-1 mb-2"><div className="h-3 bg-zinc-900 rounded overflow-hidden"><div className="h-full bg-gradient-to-r from-red-700 to-orange-500" style={{ width: progressoGeral + "%" }} /></div></div></div><div className="text-zinc-500 text-sm mt-2">Fase atual: <strong className="text-orange-200">{faseAtual ? "FASE " + faseAtual.n + " — " + faseAtual.titulo : "Nenhuma fase ativa"}</strong></div></div>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 lg:w-[520px]">{[[concluidos, "Concluídos", "text-green-400"], [bloqueados, "Bloqueados", "text-red-400"], [criticos, "Riscos críticos", "text-red-300"], [operacoesAtivas, "Operações ativas", "text-orange-300"]].map(([valor, label, cor]) => <div key={label} className="p-3 rounded border border-zinc-800 bg-black/50 text-center"><div className={"text-2xl font-black " + cor}>{valor}</div><div className="text-[9px] uppercase tracking-wider text-zinc-600 mt-1">{label}</div></div>)}</div>
      </div>
    </div>

    <div className="mb-6 p-1 rounded-xl border border-zinc-800 bg-zinc-950/60 flex gap-1 overflow-x-auto">{tabs.map(t => { const Icon = t.icon; return <button key={t.id} onClick={() => setAba(t.id)} className={"flex-1 min-w-[120px] py-2.5 px-3 rounded-lg flex items-center justify-center gap-2 text-xs uppercase tracking-wider font-bold " + (aba === t.id ? "bg-orange-700 text-white" : "text-zinc-500 hover:text-zinc-200 hover:bg-zinc-900")}><Icon className="w-4 h-4" />{t.label}</button>; })}</div>

    {aba === "visao" && <div className="space-y-7">
      {sinais.length > 0 && <section><div className="flex items-center justify-between gap-3 mb-3"><div><div className="text-[9px] uppercase tracking-[0.25em] text-red-500">Alertas ativos</div><div className="text-zinc-600 text-xs">Consolidados de relatórios, mapa, missões, contratos, objetivos e decisões do comando.</div></div><button onClick={() => setAba("riscos")} className="text-orange-400 text-[10px] uppercase tracking-wider">Ver todos</button></div><div className="grid lg:grid-cols-2 gap-3">{sinais.slice(0, 4).map(s => <SinalEstrategicoCard key={s.id} sinal={s} data={data} onOpenPhase={setFaseAberta} onOpenMap={abrirMapa} />)}</div></section>}
      <section><div className="text-[9px] uppercase tracking-[0.25em] text-orange-600 mb-3">Fases do plano</div><div className="grid lg:grid-cols-2 gap-4">{fases.map(f => <FaseEstrategicaCard key={f.id} fase={f} data={data} isLider={isLider} onOpen={() => setFaseAberta(f.id)} onEdit={() => setEditandoFase(f.id)} />)}</div></section>
    </div>}

    {aba === "fases" && <div className="grid lg:grid-cols-2 gap-4">{fases.map(f => <FaseEstrategicaCard key={f.id} fase={f} data={data} isLider={isLider} onOpen={() => setFaseAberta(f.id)} onEdit={() => setEditandoFase(f.id)} />)}</div>}

    {aba === "riscos" && <div className="space-y-4">{sinais.length ? sinais.map(s => <div key={s.id} className="relative"><SinalEstrategicoCard sinal={s} data={data} onOpenPhase={setFaseAberta} onOpenMap={abrirMapa} />{isLider && s.fonteTipo === "comando" && <button onClick={() => resolverAlertaManual(s)} className="absolute bottom-3 right-3 text-[9px] uppercase tracking-wider text-green-500">Marcar resolvido</button>}</div>) : <div className="p-12 text-center rounded-xl border border-zinc-800 bg-zinc-950/40"><IShield className="w-12 h-12 text-green-700 mx-auto mb-3" /><div className="text-green-400 font-bold">Nenhum alerta ativo</div><div className="text-zinc-600 text-sm mt-1">As fontes integradas não indicam riscos no momento.</div></div>}</div>}

    {aba === "historico" && <div className="space-y-2">{(data.activityLog || []).filter(a => ["fase_atualizada", "alerta_estrategico_criado", "alerta_estrategico_resolvido"].includes(a.tipo)).slice().reverse().map(a => <div key={a.id} className="p-3 rounded border border-zinc-800 bg-zinc-950/50 flex items-start gap-3"><IBook className="w-4 h-4 text-orange-600 mt-0.5" /><div><div className="text-zinc-300 text-sm">{a.descricao}</div><div className="text-[10px] text-zinc-700 mt-1">{a.ator} · {new Date(a.data).toLocaleString("pt-BR")}</div></div></div>)}</div>}

    {editandoFase && (() => { const fase = fases.find(f => f.id === editandoFase); return fase ? <div className="fixed inset-0 z-[80] overflow-y-auto bg-black/95 p-4 sm:p-8"><div className="max-w-5xl mx-auto bg-zinc-950 border border-orange-700 rounded-xl p-5"><FaseEditor fase={fase} data={data} onCancel={() => setEditandoFase(null)} onSave={patch => salvarFase(fase.id, patch)} /></div></div> : null; })()}
  </div>;
}


function ArquivoPublicoPage({ data }) {
  const relatorios = (data.relatorios || [])
    .filter(r => normalizarSigilo(r.confidencialidade) === "Público")
    .slice()
    .sort((a, b) => new Date(b.data || 0) - new Date(a.data || 0));
  const missoes = (data.missoes || [])
    .filter(m => normalizarSigilo(m.sigilo) === "Público")
    .slice()
    .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

  return (
    <div className="fadein">
      <SectionTitle icon={ILock} sub="Informações liberadas pela F.O.X. para consulta externa">Arquivo Público</SectionTitle>
      <div className="mb-8 p-5 rounded-lg border border-green-900/50 bg-green-950/10 flex items-start gap-3">
        <IShield className="w-5 h-5 text-green-500 flex-shrink-0 mt-0.5" />
        <div>
          <div className="text-green-300 text-xs uppercase tracking-widest font-black">Autorização Nível I</div>
          <p className="text-zinc-500 text-sm mt-1 leading-relaxed">
            Somente operações e relatórios expressamente desclassificados aparecem aqui. Identidades reais continuam protegidas por codinomes.
          </p>
        </div>
      </div>
      <div className="grid lg:grid-cols-2 gap-8">
        <section>
          <h3 className="text-orange-50 font-bold serif text-lg mb-4 flex items-center gap-2">
            <IClipboard className="w-4 h-4 text-orange-500" /> Operações desclassificadas
          </h3>
          <div className="space-y-3">
            {missoes.length === 0 && <div className="p-6 border border-zinc-800 bg-zinc-950/50 rounded text-zinc-600 text-sm italic">Nenhuma operação pública.</div>}
            {missoes.map(m => {
              const status = statusMissaoConfig(m.status);
              return (
                <div key={m.id} className="p-4 rounded-lg border border-green-900/40 bg-zinc-950/60">
                  <div className="flex items-center gap-2 flex-wrap mb-2">
                    <SigiloBadge sigilo="Público" compacto />
                    <span className={`text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider ${status.badge}`}>{status.label}</span>
                  </div>
                  <h4 className="text-orange-50 font-bold serif">{m.titulo}</h4>
                  {m.desc && <p className="text-zinc-400 text-sm mt-2 leading-relaxed">{m.desc}</p>}
                  <div className="text-zinc-600 text-xs mt-3">
                    Operadores: {participantesDaMissao(m).map(p => getCodinomeMascarado(data.users.find(u => u.username === p))).join(", ") || "Não divulgado"}
                  </div>
                </div>
              );
            })}
          </div>

function juramentoDoUsuario(juramentados, usuario) {
  if (!usuario) return null;
  const identidades = [usuario.username, usuario.displayName, usuario.nomeRP, usuario.codinome]
    .map(v => slugEstrutura(v))
    .filter(Boolean);

    const identidadeJuramento = slugEstrutura(j.nome || j.codinome || "");
    return identidadeJuramento && identidades.includes(identidadeJuramento);
  }) || null;
}

function normalizarFraseRitual(valor) {
  return String(valor || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function distanciaLevenshtein(a, b) {
  const anterior = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let diagonal = anterior[0];
    anterior[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const acima = anterior[j];
      anterior[j] = Math.min(
        anterior[j] + 1,
        anterior[j - 1] + 1,
        diagonal + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
      diagonal = acima;
    }
  }
  return anterior[b.length];
}

function fraseJuramentoAceita(valor) {
  const digitada = normalizarFraseRitual(valor);
  const alvo = normalizarFraseRitual(FRASE_JURAMENTO);
  if (!digitada) return false;
  if (digitada === alvo) return true;

  const variacoes = [
    FRASE_JURAMENTO,
    "Que o meu próprio sangue queime, que as correntes da minha alma me esmaguem se eu trair este julgamento",
    "Que meu próprio sangue queime, que as correntes da minha alma me esmaguem se eu trair esse julgamento",
    "Que meu próprio sangue queime e que as correntes da minha alma me esmaguem se eu trair este julgamento",
    "Que meu próprio sangue queime, que as correntes da minha alma me esmaguem caso eu traia este julgamento",
  ].map(normalizarFraseRitual);
  if (variacoes.includes(digitada)) return true;

  const distancia = distanciaLevenshtein(digitada, alvo);
  const similaridade = 1 - distancia / Math.max(alvo.length, digitada.length, 1);
  const palavrasObrigatorias = ["sangue", "queime", "correntes", "alma", "esmaguem", "trair", "julgamento"];
  const presentes = palavrasObrigatorias.filter(palavra => digitada.includes(palavra)).length;
  return similaridade >= 0.88 || (presentes >= 6 && digitada.length >= alvo.length * 0.75);
}

function JuramentoPage({ usuario, juramentado, juramentar, data, modoIniciacao = false, onConcluido = null }) {

    elemento: usuario?.elemento || "Katon",
    idade: "",
    motivacao: "",
  });
  const [fraseTypo, setFraseTypo] = useState("");
  const [selando, setSelando] = useState(false);
  const [fotoUrl, setFotoUrl] = useState("");
  const [fotoErro, setFotoErro] = useState("");
  const fotoRef = useRef();

  useEffect(() => { setAceitos(new Array(mandamentos.length).fill(false)); }, [mandamentos.length]);

  const escolherFoto = (e) => {
    const file = e.target.files?.[0];
    setFotoErro("");
    if (!file) return;
    if (!file.type.startsWith("image/")) { setFotoErro("Escolha uma imagem JPG, PNG ou WEBP."); return; }
    if (file.size > 6 * 1024 * 1024) { setFotoErro("A imagem deve ter no máximo 6 MB."); return; }
    const reader = new FileReader();
    reader.onerror = () => setFotoErro("Não foi possível ler a imagem.");
    reader.onload = () => {
      const imagem = new Image();
      imagem.onerror = () => setFotoErro("A imagem não pôde ser processada.");
      imagem.onload = () => {
        const limite = 960;
        const escala = Math.min(1, limite / Math.max(imagem.naturalWidth, imagem.naturalHeight));
        const largura = Math.max(1, Math.round(imagem.naturalWidth * escala));
        const altura = Math.max(1, Math.round(imagem.naturalHeight * escala));
        const canvas = document.createElement("canvas");
        canvas.width = largura;
        canvas.height = altura;
        const ctx = canvas.getContext("2d");
        if (!ctx) { setFotoErro("Seu navegador não conseguiu preparar a imagem."); return; }
        ctx.drawImage(imagem, 0, 0, largura, altura);
        setFotoUrl(canvas.toDataURL("image/jpeg", 0.78));
      };
      imagem.src = reader.result;
    };
    reader.readAsDataURL(file);
  };

  if (juramentado) return <JuramentadoView juramentado={juramentado} modoIniciacao={modoIniciacao} />;

  const todosAceitos = aceitos.every(Boolean);

      id: "juramento_" + uid(),

              <div className="flex items-center justify-between gap-3 mb-3"><div><div className="text-orange-50 text-sm font-bold">Imagem do juramento no RP</div><div className="text-zinc-600 text-xs">Opcional · JPG, PNG ou WEBP · até 6 MB</div></div><Btn onClick={() => fotoRef.current?.click()} variant="default"><IUpload className="w-3 h-3" /> Escolher imagem</Btn></div>

  );
}

function IntroducaoPrimeiroAcesso({ data, usuario, juramentado, juramentar, onAtualizarPerfil, onConcluir, onLogout }) {
  const [etapa, setEtapa] = useState(0);
  const [avatarErro, setAvatarErro] = useState("");
  const [avatarStatus, setAvatarStatus] = useState("");
  const avatarInputRef = useRef();
  const escolherAvatarIniciacao = (e) => {
    const arquivo = e.target.files?.[0];
    setAvatarErro("");
    setAvatarStatus("");
    if (!arquivo) return;
    if (!arquivo.type.startsWith("image/")) {
      setAvatarErro("Escolha uma imagem JPG, PNG ou WEBP.");
      return;
    }
    if (arquivo.size > 6 * 1024 * 1024) {
      setAvatarErro("A imagem deve ter no máximo 6 MB.");
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => setAvatarErro("Não foi possível ler a imagem.");
    reader.onload = () => {
      const imagem = new Image();
      imagem.onerror = () => setAvatarErro("A imagem não pôde ser processada.");
      imagem.onload = () => {
        const lado = Math.min(imagem.naturalWidth, imagem.naturalHeight);
        const sx = Math.max(0, (imagem.naturalWidth - lado) / 2);
        const sy = Math.max(0, (imagem.naturalHeight - lado) / 2);
        const tamanho = 384;
        const canvas = document.createElement("canvas");
        canvas.width = tamanho;
        canvas.height = tamanho;
        const ctx = canvas.getContext("2d");
        if (!ctx) {
          setAvatarErro("Seu navegador não conseguiu preparar a imagem.");
          return;
        }
        ctx.drawImage(imagem, sx, sy, lado, lado, 0, 0, tamanho, tamanho);
        onAtualizarPerfil?.({
          avatarUrl: canvas.toDataURL("image/jpeg", 0.82),
          avatarStoragePath: "",
        });
        setAvatarStatus("Foto registrada no seu dossiê.");
      };
      imagem.src = reader.result;
    };
    reader.readAsDataURL(arquivo);
  };
  const ramo = (data.clas || []).find(c => c.id === usuario.cla);
  const cargo = (data.roles || []).find(r => r.id === usuario.role);
  const recrutador = (data.users || []).find(u => u.username === usuario.criadoPor);
  const total = 6;
  const avancar = () => setEtapa(v => Math.min(total - 1, v + 1));
  const voltar = () => setEtapa(v => Math.max(0, v - 1));

  return (
    <div className="min-h-screen bg-black text-zinc-200 relative overflow-hidden">
      <div className="fixed inset-0 opacity-25 pointer-events-none" style={{ backgroundImage: "radial-gradient(circle at 20% 15%, #7C2D12 0%, transparent 38%), radial-gradient(circle at 80% 80%, #C2410C 0%, transparent 36%)" }} />
      <div className="relative max-w-5xl mx-auto px-4 py-6 sm:py-10">
        <div className="flex items-center justify-between gap-3 mb-6"><div><div className="text-[9px] uppercase tracking-[0.4em] text-orange-600">Protocolo de iniciação</div><div className="text-orange-50 font-black serif text-xl">JIKKAI · F.O.X.</div></div><button onClick={onLogout} className="flex items-center gap-2 text-zinc-600 hover:text-red-400 text-xs uppercase tracking-wider"><ILogout className="w-4 h-4" /> Sair</button></div>
        <div className="flex gap-1 mb-6">{Array.from({ length: total }).map((_, i) => <div key={i} className={"h-1 flex-1 rounded " + (i <= etapa ? "bg-gradient-to-r from-red-700 to-orange-600" : "bg-zinc-900")} />)}</div>

        <div className="rounded-2xl border border-orange-900/50 bg-zinc-950/85 backdrop-blur p-5 sm:p-8 shadow-2xl">
          {etapa === 0 && (
            <div className="fadein text-center">
              <div className="text-[10px] uppercase tracking-[0.35em] text-orange-600 mb-3">Identidade reconhecida</div>
              <MemberAvatar user={usuario} size="xl" className="mx-auto mb-4" />
              <input ref={avatarInputRef} type="file" accept="image/jpeg,image/png,image/webp" onChange={escolherAvatarIniciacao} className="hidden" />
              <Btn onClick={() => avatarInputRef.current?.click()} variant="ghost" className="mx-auto">
                <IUpload className="w-3 h-3" /> {usuario.avatarUrl ? "Trocar foto" : "Adicionar foto"}
              </Btn>
              <div className="text-zinc-600 text-[10px] mt-2">Opcional · recorte quadrado automático · até 6 MB</div>
              {avatarStatus && <div className="text-green-400 text-xs mt-2">{avatarStatus}</div>}
              {avatarErro && <div className="text-red-400 text-xs mt-2">{avatarErro}</div>}
              <h1 className="text-4xl font-black text-orange-50 serif mt-5">{getCodinome(usuario)}</h1>
              <div className="text-zinc-500 italic mt-1">{usuario.nomeRP || usuario.displayName}</div>
              <div className="grid sm:grid-cols-2 gap-3 max-w-2xl mx-auto mt-7 text-left">
                {[
                  ["Ramo", ramo?.nome || "Aguardando designação"],
                  ["Patente", usuario.patente || "Recruta em Observação"],
                  ["Nível de acesso", "Nível " + (usuario.nivelAcesso || 1)],
                  ["Responsável pelo ingresso", recrutador ? getCodinome(recrutador) : "Comando da Jikkai"],
                ].map(([l, v]) => <div key={l} className="p-3 rounded-lg border border-zinc-800 bg-black/40"><div className="text-[9px] uppercase tracking-wider text-orange-700">{l}</div><div className="text-zinc-200 text-sm mt-1">{v}</div></div>)}
              </div>
              <p className="text-zinc-500 text-sm max-w-xl mx-auto mt-6">Seu acesso foi autorizado. Antes de entrar no portal, você conhecerá a organização, sua estrutura e as responsabilidades que assumirá.</p>
              <div className="mt-7"><Btn onClick={avancar} variant="primary" size="lg">Confirmar identidade</Btn></div>
            </div>
          )}

          {etapa === 1 && <div className="fadein"><div className="text-center mb-7"><IFlame className="w-16 h-16 text-orange-500 mx-auto mb-3 pulse-fire" /><div className="text-[10px] uppercase tracking-[0.35em] text-orange-600">Introdução</div><h2 className="text-3xl font-black text-orange-50 serif mt-1">O que é a Jikkai</h2></div><div className="max-w-3xl mx-auto space-y-4 text-zinc-300 leading-relaxed"><p>A <strong className="text-orange-400">Jikkai</strong> é a estrutura estratégica responsável por preservar a ordem, conduzir operações e manter vivo o legado da F.O.X.</p><p>Ela reúne liderança, conselho, ramos, divisões e células operacionais. Cada integrante possui uma função, um nível de acesso e responsabilidade sobre aquilo que conhece e executa.</p><div className="p-5 border-l-4 border-orange-600 bg-orange-950/10 italic text-orange-100">À espreita nas trevas, manter a ordem. Nós somos sombras, entretanto mostramos o caminho.</div><p>Entrar não significa apenas receber uma conta. Significa ocupar uma posição registrada dentro da organização.</p></div><div className="flex gap-2 mt-8"><Btn onClick={voltar} variant="ghost">Voltar</Btn><Btn onClick={avancar} variant="primary" className="flex-1 justify-center">Conhecer a estrutura</Btn></div></div>}

          {etapa === 2 && <div className="fadein"><IntroducaoEstruturaAtual data={data} usuario={usuario} /><div className="flex gap-2 mt-8"><Btn onClick={voltar} variant="ghost">Voltar</Btn><Btn onClick={avancar} variant="primary" className="flex-1 justify-center">Entendi meu lugar</Btn></div></div>}

          {etapa === 3 && <div className="fadein"><div className="text-center mb-7"><IShield className="w-14 h-14 text-orange-500 mx-auto mb-3" /><div className="text-[10px] uppercase tracking-[0.35em] text-orange-600">Conduta</div><h2 className="text-3xl font-black text-orange-50 serif mt-1">O peso do seu acesso</h2></div><div className="grid sm:grid-cols-2 gap-4 max-w-3xl mx-auto">{[["Respeitar a hierarquia","Ordens, decisões e conflitos seguem a cadeia de comando registrada."],["Preservar informações","Dados internos não devem ser levados para fora da organização sem autorização."],["Responder pelos próprios atos","Toda ação realizada em nome da Jikkai possui consequências no RP."],["Registrar acontecimentos","Missões, relatórios e fatos relevantes mantêm a história oficial viva."],["Não usar o nome sem autorização","A reputação da F.O.X. não pode ser empenhada em decisões pessoais."],["Honrar o pacto","O juramento formaliza sua entrada e sua lealdade interna."]].map(([t,d]) => <div key={t} className="p-4 rounded-lg border border-zinc-800 bg-black/40"><div className="text-orange-300 font-bold text-sm">{t}</div><p className="text-zinc-500 text-xs leading-relaxed mt-2">{d}</p></div>)}</div><div className="flex gap-2 mt-8"><Btn onClick={voltar} variant="ghost">Voltar</Btn><Btn onClick={avancar} variant="primary" className="flex-1 justify-center">Prosseguir ao juramento</Btn></div></div>}

          {etapa === 5 && <div className="fadein text-center py-5"><ICheck className="w-20 h-20 text-green-500 mx-auto mb-5" /><div className="text-[10px] uppercase tracking-[0.4em] text-green-600">Iniciação concluída</div><h2 className="text-4xl font-black text-orange-50 serif mt-2">Seu registro está ativo</h2><p className="text-zinc-400 max-w-xl mx-auto mt-4 leading-relaxed">Você conhece a Jikkai, reconhece sua estrutura e possui um juramento registrado. Apresente-se ao responsável pelo seu ingresso e aguarde sua primeira designação.</p><div className="mt-7 p-4 rounded-lg border border-orange-900/40 bg-orange-950/10 max-w-md mx-auto"><div className="text-[9px] uppercase tracking-wider text-orange-700">Status</div><div className="text-orange-300 font-black mt-1">MEMBRO INICIADO · ACESSO NÍVEL {usuario.nivelAcesso || 1}</div></div><div className="mt-8"><Btn onClick={onConcluir} variant="primary" size="lg"><ILock className="w-4 h-4" /> Acessar o portal</Btn></div></div>}
