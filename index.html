          </div>
        ); })}
      </div>
    </div>
  );
}

function RamosManager({ data, setData, usuario }) {
  const [criando, setCriando] = useState(false);
  const [form, setForm] = useState({ nome: "", tipo: "Divisão", cor: "#7C2D12", descricao: "" });
  const [erro, setErro] = useState("");
  const roleOf = u => (data.roles || []).find(r => r.id === u.role);
  const cargoCapitao = (data.roles || []).find(r => estruturaPosicaoRole(r) === "capitao_ramo");

  const criar = () => {
    const nome = form.nome.trim();
    if (!nome) { setErro("O nome do ramo é obrigatório."); return; }
    setData(d => {
      const base = slugEstrutura(nome) || "ramo";
      let id = base;
      let n = 2;
      while ((d.clas || []).some(c => c.id === id)) id = base + "-" + n++;
      const ramo = { id, nome, tipo: form.tipo.trim() || "Divisão", cor: form.cor || "#7C2D12", icon: "shield", descricao: form.descricao.trim(), figuras: [], protected: false };
      return { ...d, clas: [...(d.clas || []), ramo], activityLog: [...(d.activityLog || []), atividade("ramo_criado", usuario?.username, id, "Criou o ramo " + nome)] };
    });
    setForm({ nome: "", tipo: "Divisão", cor: "#7C2D12", descricao: "" });
    setErro("");
    setCriando(false);
  };

  const definirCapitao = (ramoId, username) => {
    if (!cargoCapitao) { alert("Crie ou configure um cargo na posição Capitão da Divisão antes de designar o comando."); return; }
    setData(d => ({
      ...d,
      users: d.users.map(u => {
        const role = d.roles.find(r => r.id === u.role);
        const eraCapitaoDesteRamo = u.cla === ramoId && estruturaPosicaoRole(role) === "capitao_ramo";
        if (eraCapitaoDesteRamo && u.username !== username) return { ...u, role: "member", estruturaNivel: "operador", patente: u.patente === "Capitão" ? "" : u.patente };
        if (u.username === username) return { ...u, cla: ramoId, role: cargoCapitao.id, estruturaNivel: "capitao_ramo", patente: u.patente || "Capitão" };
        return u;
      }),
      activityLog: [...(d.activityLog || []), atividade("capitao_designado", usuario?.username, username || ramoId, username ? "Designou o capitão do ramo " + ramoId : "Removeu o capitão do ramo " + ramoId)],
    }));
  };

  const remover = ramo => {
    if (["soke", "bunke"].includes(ramo.id) || ramo.protected) { alert("Soke e Bunke são ramos protegidos."); return; }
    const quantidade = (data.users || []).filter(u => u.cla === ramo.id).length;
    if (quantidade) { alert("Transfira os membros deste ramo antes de removê-lo."); return; }
    if (!confirm("Remover o ramo " + ramo.nome + "?")) return;
    setData(d => ({ ...d, clas: (d.clas || []).filter(c => c.id !== ramo.id), activityLog: [...(d.activityLog || []), atividade("ramo_removido", usuario?.username, ramo.id, "Removeu o ramo " + ramo.nome)] }));
  };

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between gap-3">
        <div><h3 className="text-orange-50 font-bold text-lg serif">Divisões da Jikkai ({(data.divisoes || DEFAULT_DIVISOES).length})</h3><p className="text-zinc-600 text-xs">Cada divisão possui uma cadeira de Capitão. A designação reflete no organograma operacional.</p></div>
        {!criando && <Btn onClick={() => setCriando(true)} variant="primary"><IPlus className="w-3 h-3" /> Novo Ramo</Btn>}
      </div>
      {criando && (
        <div className="p-4 border border-orange-700 rounded-lg bg-zinc-950/80 space-y-3 fadein">
          <div className="grid sm:grid-cols-2 gap-3">
            <div><label className="fox-label">Nome *</label><input value={form.nome} onChange={e => setForm({...form, nome:e.target.value})} className="fox-input" /></div>
            <div><label className="fox-label">Tipo</label><input value={form.tipo} onChange={e => setForm({...form, tipo:e.target.value})} className="fox-input" placeholder="Divisão, família, inteligência..." /></div>
            <div><label className="fox-label">Cor</label><input type="color" value={form.cor} onChange={e => setForm({...form, cor:e.target.value})} className="h-10 w-full bg-black border border-zinc-700 rounded" /></div>
            <div><label className="fox-label">Descrição</label><input value={form.descricao} onChange={e => setForm({...form, descricao:e.target.value})} className="fox-input" /></div>
          </div>
          {erro && <div className="text-red-400 text-sm">{erro}</div>}
          <div className="flex gap-2"><Btn onClick={() => setCriando(false)} variant="ghost">Cancelar</Btn><Btn onClick={criar} variant="primary"><ISave className="w-3 h-3" /> Criar ramo</Btn></div>
        </div>
      )}
      <div className="grid md:grid-cols-2 gap-3">
        {(data.clas || []).map(ramo => {
          const integrantes = (data.users || []).filter(u => u.cla === ramo.id && u.role !== "contratante");
          const capitaes = integrantes.filter(u => estruturaPosicaoRole(roleOf(u)) === "capitao_ramo");
          const capitao = capitaes[0];
          const protegido = ["soke", "bunke"].includes(ramo.id) || ramo.protected;
          return <div key={ramo.id} className="p-4 rounded-lg border bg-zinc-950/60" style={{borderColor:(ramo.cor || "#7C2D12")+"80"}}>
            <div className="flex justify-between gap-3"><div className="flex-1"><div className="text-[9px] uppercase tracking-wider text-zinc-600">{ramo.tipo || "Divisão"} · {integrantes.length} membros</div><div className="font-black text-lg serif" style={{color:ramo.cor}}>{ramo.nome}</div><p className="text-zinc-500 text-xs mt-2">{ramo.descricao || "Sem descrição."}</p></div>
            {!protegido && <button onClick={() => remover(ramo)} className="text-red-500"><ITrash className="w-4 h-4" /></button>}</div>
            <div className="mt-4 pt-4 border-t border-zinc-800">
              <label className="fox-label">Capitão da Divisão</label>
              <select value={capitao?.username || ""} onChange={e => definirCapitao(ramo.id, e.target.value)} className="fox-input">
                <option value="">— Capitão não designado —</option>
                {(data.users || []).filter(u => u.role !== "contratante" && u.status !== "Oculto").map(u => <option key={u.username} value={u.username}>{getCodinome(u)} · {u.cla === ramo.id ? "neste ramo" : "transferir para cá"}</option>)}
              </select>
              {!cargoCapitao && <div className="text-yellow-500 text-[10px] mt-2">Nenhum cargo está posicionado como Capitão da Divisão.</div>}
              {capitaes.length > 1 && <div className="text-yellow-500 text-[10px] mt-2">Existem {capitaes.length} capitães neste ramo. Escolha um para regularizar.</div>}
            </div>
          </div>;
        })}
      </div>
    </div>
  );
}

function CargosManager({ data, setData, usuario, role }) {
  const podeEditarCargos = !!(role?.hasLeaderPerms || hasPerm(role, "manage_roles"));
  const podePromover = !!(role?.hasLeaderPerms || hasPerm(role, "manage_users") || estruturaPosicaoRole(role) === "conselheiro");
  const vazio = () => ({ nome: "", hasLeaderPerms: false, cor: "#7C2D12", estruturaPosicao: "operador", ordemEstrutura: 100 });
  const [form, setForm] = useState(vazio());
  const [criando, setCriando] = useState(false);
  const [editando, setEditando] = useState(null);
  const membrosPromoviveis = (data.users || []).filter(u => u.role !== "contratante" && u.status !== "Oculto");
  const cargosPromoviveis = (data.roles || []).filter(r => r.id !== "contratante").slice().sort((a,b) => ordemEstruturaRole(a)-ordemEstruturaRole(b));
  const [promoUser, setPromoUser] = useState(membrosPromoviveis[0]?.username || "");
  const [promoRole, setPromoRole] = useState(cargosPromoviveis.find(r => r.id === "member")?.id || cargosPromoviveis[0]?.id || "");
  const [promoStatus, setPromoStatus] = useState("");

  useEffect(() => {
    if (!promoUser && membrosPromoviveis[0]?.username) setPromoUser(membrosPromoviveis[0].username);
    if (!promoRole && cargosPromoviveis[0]?.id) setPromoRole(cargosPromoviveis[0].id);
  }, [membrosPromoviveis.length, cargosPromoviveis.length]);

  const promoverMembro = async () => {
    const alvo = (data.users || []).find(u => u.username === promoUser);
    const novoCargo = (data.roles || []).find(r => r.id === promoRole);
    if (!alvo || !novoCargo) { setPromoStatus("Escolha um membro e um cargo."); return; }
    if (alvo.username === "leader" && novoCargo.id !== "leader") { setPromoStatus("O líder raiz não deve ser rebaixado."); return; }
    const cargoAntigo = (data.roles || []).find(r => r.id === alvo.role);
    if (alvo.role === novoCargo.id) { setPromoStatus(`${getCodinome(alvo)} já possui este cargo.`); return; }
    setData(d => ({
      ...d,
      users: d.users.map(u => u.username === alvo.username ? { ...u, role: novoCargo.id, patente: novoCargo.nome, estruturaNivel: estruturaPosicaoRole(novoCargo) } : u),
      activityLog: [...(d.activityLog || []), atividade("promocao_cargo", usuario?.username, alvo.username, `${getCodinome(alvo)} recebeu o cargo ${novoCargo.nome}`)],
    }));
    setPromoStatus("Cargo atualizado. Enviando selo pelo Discord...");
    try {
      const conteudo = mensagemDiscordPromocao(data, alvo, cargoAntigo?.nome || alvo.role || "Não definido", novoCargo.nome, getCodinome(usuario));
      const resultado = await window.notificarDiscordUsuarios(data, [alvo.username], "promocao", conteudo);
      const ok = resultado.filter(r => r.ok).length;
      const falha = resultado.find(r => !r.ok);
      setPromoStatus(ok ? `Promoção registrada e DM enviada para ${getCodinome(alvo)}.` : `Promoção registrada. DM não enviada: ${falha?.reason || "falha desconhecida"}.`);
    } catch (e) {
      setPromoStatus("Promoção registrada. Falha na DM: " + (e.message || e));
    }
  };

  const abrirNovo = () => { setForm(vazio()); setEditando(null); setCriando(true); };
  const abrirEdicao = role => { setForm({ ...role, estruturaPosicao: estruturaPosicaoRole(role), ordemEstrutura: ordemEstruturaRole(role) }); setEditando(role.id); setCriando(true); };
  const cancelar = () => { setForm(vazio()); setEditando(null); setCriando(false); };

  const salvar = () => {
    if (!form.nome.trim()) return;
    if (editando) {
      setData(d => {
        const atual = d.roles.find(r => r.id === editando);
        const protegidoLider = atual?.id === "leader";
        const protegidoExterno = atual?.id === "contratante";
        const patch = {
          nome: form.nome.trim(),
          cor: form.cor,
          hasLeaderPerms: protegidoLider ? true : Boolean(form.hasLeaderPerms),
          estruturaPosicao: protegidoLider ? "lider" : protegidoExterno ? "fora" : form.estruturaPosicao,
          ordemEstrutura: Number(form.ordemEstrutura) || 0,
        };
        const roles = d.roles.map(r => r.id === editando ? { ...r, ...patch } : r);
        return {
          ...d,
          roles,
          users: d.users.map(u => u.role === editando ? { ...u, estruturaNivel: patch.estruturaPosicao } : u),
        };
      });
    } else {
      const id = slugEstrutura(form.nome) + "_" + uid().slice(0, 4);
      setData(d => ({ ...d, roles: [...d.roles, { id, nome: form.nome.trim(), hasLeaderPerms: Boolean(form.hasLeaderPerms), cor: form.cor, permissions: [], protected: false, estruturaPosicao: form.estruturaPosicao, ordemEstrutura: Number(form.ordemEstrutura) || 100 }] }));
    }
    cancelar();
  };

  const remover = (id) => {
    const role = data.roles.find(r => r.id === id);
    if (role?.protected) { alert("Este cargo é protegido."); return; }
    if (data.users.find(u => u.role === id)) { alert("Há usuários com esse cargo. Mude-os antes de remover."); return; }
    if (confirm(`Remover cargo ${role.nome}?`)) setData(d => ({ ...d, roles: d.roles.filter(r => r.id !== id) }));
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div><h3 className="text-orange-50 font-bold text-lg serif">Cargos ({data.roles.length})</h3><p className="text-zinc-600 text-xs mt-1">Promova membros e ajuste os selos da hierarquia.</p></div>
        {!criando && podeEditarCargos && <Btn onClick={abrirNovo} variant="primary"><IPlus className="w-3 h-3" /> Novo Cargo</Btn>}
      </div>

      {podePromover && (
        <section className="rounded-xl border border-orange-900/45 bg-gradient-to-br from-zinc-950 via-black to-orange-950/10 p-4 space-y-3">
          <div>
            <div className="text-[9px] uppercase tracking-[0.28em] text-orange-600">Promoção rápida</div>
            <div className="text-orange-50 font-black serif text-lg mt-1">Alterar cargo e avisar por Discord</div>
          </div>
          <div className="grid sm:grid-cols-[1fr_1fr_auto] gap-3 items-end">
            <div><label className="fox-label">Membro</label><select value={promoUser} onChange={e => setPromoUser(e.target.value)} className="fox-input">{membrosPromoviveis.map(u => <option key={u.username} value={u.username}>{getCodinome(u)} · {(data.roles || []).find(r => r.id === u.role)?.nome || u.role}</option>)}</select></div>
            <div><label className="fox-label">Novo cargo</label><select value={promoRole} onChange={e => setPromoRole(e.target.value)} className="fox-input">{cargosPromoviveis.map(r => <option key={r.id} value={r.id}>{r.nome}</option>)}</select></div>
            <Btn onClick={promoverMembro} variant="primary" className="w-full sm:w-auto justify-center"><ICrown className="w-3 h-3" /> Promover</Btn>
          </div>
          <div className="text-[11px] text-zinc-600 leading-relaxed">Ao promover, o dossiê é atualizado e o membro recebe DM se tiver Discord verificado.</div>
          {promoStatus && <div className="p-3 rounded-lg border border-zinc-800 bg-black/55 text-xs text-zinc-300">{promoStatus}</div>}
        </section>
      )}

      {criando && (
        <div className="p-4 bg-zinc-950/80 border border-orange-700 rounded-lg space-y-3 fadein">
          <h4 className="text-orange-50 font-bold">{editando ? "Editar cargo" : "Novo cargo customizado"}</h4>
          <div className="grid sm:grid-cols-2 gap-3">
            <div><label className="fox-label">Nome do cargo</label><input value={form.nome} onChange={e => setForm({...form, nome:e.target.value})} className="fox-input" placeholder="Ex: Executor, Sábio, Espião..." /></div>
            <div><label className="fox-label">Posição no organograma</label><select value={form.estruturaPosicao} onChange={e => setForm({...form, estruturaPosicao:e.target.value})} className="fox-input" disabled={editando === "leader" || editando === "contratante"}>{ESTRUTURA_POSICOES.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}</select></div>
            <div><label className="fox-label">Ordem dentro da posição</label><input type="number" value={form.ordemEstrutura} onChange={e => setForm({...form, ordemEstrutura:Number(e.target.value)})} className="fox-input" /><div className="text-zinc-700 text-[10px] mt-1">Números menores aparecem primeiro.</div></div>
            <div><label className="fox-label">Cor</label><input type="color" value={form.cor} onChange={e => setForm({...form, cor:e.target.value})} className="h-11 w-full rounded bg-black border border-zinc-700" /></div>
          </div>
          <div className="p-3 rounded border border-zinc-800 bg-black/50 text-zinc-500 text-xs">{ESTRUTURA_POSICOES.find(p => p.id === form.estruturaPosicao)?.desc}</div>
          <label className="flex items-center gap-2 text-sm text-zinc-300 cursor-pointer"><input type="checkbox" checked={form.hasLeaderPerms} onChange={e => setForm({...form, hasLeaderPerms:e.target.checked})} disabled={editando === "leader"} className="w-4 h-4 accent-orange-600" />Este cargo tem selos de líder (edição total)</label>
          <div className="flex gap-2 pt-2 border-t border-zinc-800"><Btn onClick={cancelar} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn><Btn onClick={salvar} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn></div>
        </div>
      )}

      <div className="space-y-2">
        {data.roles.slice().sort((a,b) => ordemEstruturaRole(a)-ordemEstruturaRole(b)).map(r => {
          const count = data.users.filter(u => u.role === r.id).length;
          const isLeader = r.hasLeaderPerms === true;
          const togglePerm = pid => setData(d => ({ ...d, roles: d.roles.map(x => x.id === r.id ? { ...x, permissions: (x.permissions || []).includes(pid) ? x.permissions.filter(p => p !== pid) : [...(x.permissions || []), pid] } : x) }));
          return (
            <div key={r.id} className="p-4 bg-zinc-950/60 border border-zinc-800 rounded-lg">
              <div className="flex items-center gap-3 mb-2">
                <div className="w-3 h-12 rounded" style={{ background: r.cor }} />
                <div className="flex-1 min-w-0"><div className="text-orange-50 font-bold">{r.nome} {r.protected && <span className="text-xs text-zinc-600">(protegido)</span>}</div><div className="text-zinc-500 text-xs">{count} usuário(s) · {isLeader ? <span className="text-orange-500">Selos totais de líder</span> : `${(r.permissions || []).length} selos`}</div><div className="text-[10px] uppercase tracking-wider text-orange-700 mt-1">{estruturaPosicaoLabel(r)} · ordem {ordemEstruturaRole(r)}</div></div>
                {podeEditarCargos && <button onClick={() => abrirEdicao(r)} className="text-orange-400 hover:text-orange-300 p-2" title="Editar cargo e posição"><IEdit className="w-4 h-4" /></button>}
                {podeEditarCargos && !r.protected && <button onClick={() => remover(r.id)} className="text-red-500 hover:text-red-400 p-2"><ITrash className="w-4 h-4" /></button>}
              </div>
              {podeEditarCargos && !isLeader && r.id !== "contratante" && <div className="mt-3 pt-3 border-t border-zinc-800 grid sm:grid-cols-2 gap-1">{PERMISSIONS_LIST.map(p => <label key={p.id} className="flex items-start gap-2 text-xs text-zinc-300 cursor-pointer hover:text-orange-300 p-1"><input type="checkbox" checked={(r.permissions || []).includes(p.id)} onChange={() => togglePerm(p.id)} className="w-3.5 h-3.5 accent-orange-600 mt-0.5" /><span><strong>{p.label}</strong><br/><span className="text-zinc-600 text-[10px]">{p.desc}</span></span></label>)}</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CapitaoDashboard({ data, usuario, role, onAbrirComando, onAbrirMinhas, onNavigate }) {
  const divisoes = divisoesDoCapitao(data, usuario);
  const divIds = new Set(divisoes.map(d => d.id));
  const equipes = equipesJikkai(data).filter(e => divIds.has(e.divisaoId));
  const equipeIds = new Set(equipes.map(e => e.id));
  const membrosSet = new Set([usuario?.username, ...divisoes.flatMap(d => membrosDaDivisaoOperacional(data, d.id)), ...equipes.flatMap(e => (e.membros || []).map(m => m.username))].filter(Boolean));
  const membros = (data.users || []).filter(u => membrosSet.has(u.username) && u.role !== "contratante");
  const missaoNoEscopo = (m) => {
    const participa = participantesDaMissao(m).some(p => membrosSet.has(p));
    return divIds.has(m.divisaoId)
      || equipeIds.has(m.equipeId)
      || (m.attributionType === "divisao" && divIds.has(m.targetId))
      || (m.attributionType === "equipe" && equipeIds.has(m.targetId))
      || participa;
  };
  const missoesEscopo = (data.missoes || []).filter(missaoNoEscopo);
  const abertas = missoesEscopo.filter(m => !MISSAO_STATUS_TERMINAIS.includes(m.status));
  const emCampo = missoesEscopo.filter(m => m.status === "andamento");
  const revisao = missoesEscopo.filter(m => m.status === "revisao" || m.status === "devolvida");
  const aguardandoAceite = missoesEscopo.filter(m => ["atribuida", "pendente"].includes(m.status) && participantesDaMissao(m).some(p => !(m.aceites || []).includes(p)));
  const missoesIds = new Set(missoesEscopo.map(m => m.id));
  const contratosEscopo = (data.contratos || []).filter(c => missoesIds.has(c.missaoId) || missoesIds.has(c.missaoVinculadaId) || membrosSet.has(c.aceitoPor));
  const contratosAtivos = contratosEscopo.filter(c => ["Aberto", "Em Andamento", "Proposta"].includes(c.status));
  const dossiesPendentes = membros
    .map(u => ({ user: u, perfil: progressoDossieUsuario(u) }))
    .filter(x => x.perfil.pct < 75)
    .sort((a, b) => a.perfil.pct - b.perfil.pct);
  const membrosSemEquipe = membros.filter(u => u.username !== usuario?.username && !equipes.some(e => (e.membros || []).some(m => m.username === u.username)));
  const proximasAcoes = [
    ...revisao.slice(0, 2).map(m => ({ tone: "purple", titulo: "Revisar relatorio", desc: m.titulo, onClick: onAbrirComando })),
    ...aguardandoAceite.slice(0, 2).map(m => ({ tone: "orange", titulo: "Cobrar aceite", desc: m.titulo, onClick: onAbrirComando })),
    ...emCampo.slice(0, 2).map(m => ({ tone: "sky", titulo: "Acompanhar campo", desc: m.titulo, onClick: onAbrirComando })),
  ].slice(0, 4);

  if (!divisoes.length) {
    return (
      <section className="rounded-xl border border-yellow-900/45 bg-yellow-950/10 p-4">
        <div className="flex items-start gap-3">
          <IAlert className="w-5 h-5 text-yellow-500 flex-shrink-0 mt-0.5" />
          <div>
            <div className="text-yellow-200 font-black serif">Capitao sem divisao vinculada</div>
            <p className="text-yellow-100/70 text-sm mt-1">Seu cargo permite comandar missoes, mas a lideranca ainda precisa marcar seu usuario como capitao de uma divisao em Membros &gt; Equipes.</p>
          </div>
        </div>
      </section>
    );
  }

  const stat = (label, value, color) => (
    <div className="rounded-lg border border-zinc-800 bg-black/45 p-3">
      <div className={`text-2xl font-black ${color}`}>{value}</div>
      <div className="text-[9px] uppercase tracking-wider text-zinc-600 mt-1">{label}</div>
    </div>
  );

  return (
    <section className="rounded-2xl border border-orange-900/45 bg-gradient-to-br from-zinc-950 via-black to-red-950/15 p-4 space-y-4">
      <div className="flex items-start justify-between gap-3 flex-wrap">
        <div className="min-w-0">
          <div className="text-[9px] uppercase tracking-[0.3em] text-orange-600">Painel do capitao</div>
          <h3 className="text-xl font-black text-orange-50 serif mt-1">Comando da divisao</h3>
          <div className="flex gap-1.5 flex-wrap mt-2">
            {divisoes.map(d => <span key={d.id} className="px-2 py-1 rounded border border-orange-900/50 bg-orange-950/15 text-orange-200 text-[10px] uppercase tracking-wider">{d.nome}</span>)}
          </div>
        </div>
        <div className="flex gap-2 flex-wrap">
          <Btn onClick={onAbrirComando} variant="primary"><IClipboard className="w-3 h-3" /> Comando</Btn>
          <Btn onClick={onAbrirMinhas} variant="ghost"><IUsers className="w-3 h-3" /> Minhas</Btn>
          <Btn onClick={() => onNavigate?.("jikkai", "relatorios", "novo-relatorio-avulso")} variant="default"><IFile className="w-3 h-3" /> Relatorio</Btn>
        </div>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-2">
        {stat("ativas no escopo", abertas.length, "text-orange-300")}
        {stat("em campo", emCampo.length, "text-sky-300")}
        {stat("revisao/ajustes", revisao.length, "text-purple-300")}
        {stat("aceites pendentes", aguardandoAceite.length, "text-yellow-300")}
      </div>

      <div className="grid lg:grid-cols-[1.15fr_0.85fr] gap-3">
        <div className="rounded-xl border border-zinc-800 bg-black/35 p-3">
          <div className="flex items-center justify-between gap-2 mb-3">
            <div className="text-[9px] uppercase tracking-[0.24em] text-orange-600 font-black">Proximas decisoes</div>
            <button onClick={onAbrirComando} className="text-orange-400 text-[10px] uppercase tracking-wider font-bold">Abrir kanban</button>
          </div>
          <div className="grid sm:grid-cols-2 gap-2">
            {proximasAcoes.length ? proximasAcoes.map((a, i) => (
              <button key={i} onClick={a.onClick} className="text-left rounded-lg border border-zinc-800 bg-zinc-950/65 p-3 hover:border-orange-700">
                <div className="text-orange-50 font-bold text-sm">{a.titulo}</div>
                <div className="text-zinc-500 text-xs mt-1 line-clamp-2">{a.desc}</div>
              </button>
            )) : <div className="sm:col-span-2 rounded-lg border border-dashed border-zinc-800 bg-black/25 p-4 text-center text-zinc-700 text-sm">Nenhuma decisao critica agora.</div>}
          </div>
        </div>

        <div className="rounded-xl border border-zinc-800 bg-black/35 p-3 space-y-3">
          <div className="text-[9px] uppercase tracking-[0.24em] text-orange-600 font-black">Estado da divisao</div>
          <div className="grid grid-cols-3 gap-2 text-center">
            <div className="rounded border border-zinc-800 bg-zinc-950/70 p-2"><div className="text-lg font-black text-orange-200">{equipes.length}</div><div className="text-[8px] uppercase text-zinc-600">equipes</div></div>
            <div className="rounded border border-zinc-800 bg-zinc-950/70 p-2"><div className="text-lg font-black text-orange-200">{membros.length}</div><div className="text-[8px] uppercase text-zinc-600">membros</div></div>
            <div className="rounded border border-zinc-800 bg-zinc-950/70 p-2"><div className="text-lg font-black text-orange-200">{contratosAtivos.length}</div><div className="text-[8px] uppercase text-zinc-600">contratos</div></div>
          </div>
          <div className="space-y-2">
            {dossiesPendentes.slice(0, 3).map(({ user, perfil }) => (
              <div key={user.username} className="flex items-center gap-2 rounded border border-zinc-800 bg-zinc-950/60 p-2">
                <MemberAvatar user={user} size="xs" />
                <div className="min-w-0 flex-1"><div className="text-orange-50 text-xs font-bold truncate">{getCodinome(user)}</div><div className="text-zinc-600 text-[10px]">Dossie {perfil.pct}%</div></div>
              </div>
            ))}
            {membrosSemEquipe.length > 0 && <div className="rounded border border-yellow-900/50 bg-yellow-950/10 p-2 text-yellow-200 text-[11px]">{membrosSemEquipe.length} membro{membrosSemEquipe.length === 1 ? "" : "s"} sem equipe definida.</div>}
            {!dossiesPendentes.length && !membrosSemEquipe.length && <div className="rounded border border-green-900/50 bg-green-950/10 p-2 text-green-200 text-[11px]">Divisao organizada para novas operacoes.</div>}
          </div>
        </div>
      </div>
    </section>
  );
}

function MissoesOperacionaisPage({ data, setData, usuario, role, onNavigate, navigationRequest }) {
  const podeComando = !!(isRootUser(usuario) || role?.hasLeaderPerms || hasPerm(role, "manage_missions"));
  const isCapitaoDivisao = estruturaPosicaoRole(role) === "capitao_ramo";
  const minhasTodas = (data.missoes || []).filter(m => usuarioParticipaMissao(m, usuario.username));
  const todas = data.missoes || [];
  const [modo, setModo] = useState(() => podeComando ? "comando" : "minhas");

  useEffect(() => {
    if (!podeComando) { setModo("minhas"); return; }
    const action = String(navigationRequest?.action || "");
    if (navigationRequest?.tab === "missoes" && action === "abrir-comando") setModo("comando");
    if (navigationRequest?.tab === "missoes" && action === "minhas-missoes") setModo("minhas");
    if (navigationRequest?.tab === "missoes" && (action.startsWith("relatorio-missao:") || action.startsWith("aceitar-missao:"))) setModo("minhas");
  }, [podeComando, navigationRequest?.token]);

  return (
    <div className="space-y-4 fadein">
      {isCapitaoDivisao && (
        <CapitaoDashboard
          data={data}
          usuario={usuario}
          role={role}
          onAbrirComando={() => setModo("comando")}
          onAbrirMinhas={() => setModo("minhas")}
          onNavigate={onNavigate}
        />
      )}

      {podeComando && (
        <div className="jikkai-segmented grid grid-cols-2 gap-1 border border-zinc-800 bg-zinc-950/85">
          <button onClick={() => setModo("minhas")} className={`rounded-xl px-3 py-2.5 uppercase font-black transition-all ${modo === "minhas" ? "bg-orange-700 text-white" : "text-zinc-500 hover:text-zinc-200"}`}>
            Minhas missões <span className="opacity-60">({minhasTodas.length})</span>
          </button>
          <button onClick={() => setModo("comando")} className={`rounded-xl px-3 py-2.5 uppercase font-black transition-all ${modo === "comando" ? "bg-orange-700 text-white" : "text-zinc-500 hover:text-zinc-200"}`}>
            Comando <span className="opacity-60">({todas.length})</span>
          </button>
        </div>
      )}

      {(!podeComando || modo === "minhas") && <MinhasMissoesPage data={data} setData={setData} usuario={usuario} role={role} onNavigate={onNavigate} navigationRequest={navigationRequest} />}
      {podeComando && modo === "comando" && <MissoesManager data={data} setData={setData} usuario={usuario} role={role} />}
    </div>
  );
}

function MissoesManager({ data, setData, usuario, role }) {
  const [criando, setCriando] = useState(false);
  const [filtro, setFiltro] = useState("Ativas");
  const [modoVisual, setModoVisual] = useState("kanban");
  const [expandida, setExpandida] = useState(null);
  const [confirmacao, setConfirmacao] = useState(null);
  const [aviso, setAviso] = useState(null);
  const [feedbackModal, setFeedbackModal] = useState(null);
  const niveisPermitidos = niveisPermitidosPara(data, usuario, role);
  const sigiloInicial = niveisPermitidos.includes("Restrito") ? "Restrito" : niveisPermitidos[0] || "Público";
  const escopos = escoposGerenciaveisOperacionais(data, usuario, role);
  const usuariosBase = (data.users || []).filter(u => u.role !== "contratante");
  const usuariosElegiveis = usuariosBase.filter(u => podeReceberSigilo(data, u, sigiloInicial));
  const alvoInicial = escopos.equipes[0]?.id || escopos.divisoes[0]?.id || "";
  const tipoInicial = escopos.equipes[0]?.id ? "equipe" : (escopos.divisoes[0]?.id ? "divisao" : "membro");
  const [form, setForm] = useState({
    titulo: "",
    desc: "",
    attributionType: tipoInicial,
    targetId: alvoInicial,
    participants: [],
    objetivosText: "",
    sigilo: sigiloInicial,
  });

  const participantesAuto = participantesPorEscopoOperacional(data, form.attributionType, form.targetId, form.participants)
    .filter(username => usuariosBase.some(u => u.username === username))
    .filter(username => podeReceberSigilo(data, data.users.find(u => u.username === username), form.sigilo));

  const participantesSelecionados = form.attributionType === "membro" ? form.participants : participantesAuto;

  const mudarSigilo = (sigilo) => {
    const permitidos = new Set(
      data.users.filter(u => u.role !== "contratante" && podeReceberSigilo(data, u, sigilo)).map(u => u.username)
    );
    setForm(f => ({ ...f, sigilo, participants: f.participants.filter(p => permitidos.has(p)) }));
  };

  const mudarTipoAtribuicao = (tipo) => {
    let targetId = "";
    if (tipo === "equipe") targetId = escopos.equipes[0]?.id || "";
    if (tipo === "divisao") targetId = escopos.divisoes[0]?.id || "";
    setForm(f => ({ ...f, attributionType: tipo, targetId, participants: tipo === "membro" ? f.participants : [] }));
  };

  const toggleParticipante = (username) => {
    setForm(f => ({
      ...f,
      participants: f.participants.includes(username)
        ? f.participants.filter(x => x !== username)
        : [...f.participants, username],
    }));
  };

  const criar = () => {
    const participantes = Array.from(new Set(participantesSelecionados.filter(Boolean)));
    if (!form.titulo.trim() || participantes.length === 0) return;
    const objetivos = form.objetivosText.split("\n").map(s => s.trim()).filter(Boolean).map(text => ({ text, done: false }));
    const divisaoDaEquipe = form.attributionType === "equipe" ? escopos.equipes.find(e => e.id === form.targetId)?.divisaoId : "";
    const nova = {
      id: uid(),
      titulo: form.titulo.trim(),
      desc: form.desc.trim(),
      assignedTo: participantes[0],
      participants: participantes,
      aceites: [],
      assignedBy: usuario.username,
      createdAt: new Date().toISOString(),
      objetivos,
      status: "atribuida",
      sigilo: normalizarSigilo(form.sigilo),
      source: "manual",
      attributionType: form.attributionType,
      targetId: form.targetId,
      divisaoId: form.attributionType === "divisao" ? form.targetId : divisaoDaEquipe,
      equipeId: form.attributionType === "equipe" ? form.targetId : "",
      assignmentLabel: escopoOperacionalLabel(data, form.attributionType, form.targetId, "Operadores selecionados"),
      fluxoObrigatorio: true,
    };
    setData(d => ({ ...d, missoes: [...d.missoes, nova], activityLog: [...(d.activityLog || []), atividade("missao_criada", usuario?.username, nova.id, "Criou missão para " + nova.assignmentLabel)] }));
    window.notificarDiscordUsuarios(data, participantes, "missao", mensagemDiscordMissao(data, nova, "missao"));
    setForm({ titulo: "", desc: "", attributionType: tipoInicial, targetId: alvoInicial, participants: [], objetivosText: "", sigilo: sigiloInicial });
    setCriando(false);
  };

  const remover = (id) => {
    const missao = (data.missoes || []).find(m => m.id === id);
    setConfirmacao({
      title: `Remover "${missao?.titulo || "missao"}"?`,
      message: "O contrato e os relatorios vinculados nao serao apagados.",
      tone: "danger",
      confirmLabel: "Remover",
      onConfirm: () => setData(d => ({ ...d, missoes: d.missoes.filter(m => m.id !== id) })),
    });
  };

  const atualizar = (id, patch) => setData(d => ({
    ...d,
    missoes: d.missoes.map(m => m.id === id ? { ...m, ...patch, updatedAt: new Date().toISOString() } : m),
  }));

  const iniciarPelaLideranca = (m) => {
    setConfirmacao({
      title: `Iniciar "${m.titulo}"?`,
      message: "A operacao sera marcada em andamento mesmo sem todas as confirmacoes dos operadores.",
      tone: "success",
      confirmLabel: "Iniciar",
      onConfirm: () => atualizar(m.id, { status: "andamento", startedAt: m.startedAt || new Date().toISOString() }),
    });
  };

  const devolverParaAjustes = (m) => {
    setFeedbackModal({
      key: "ajustes_" + m.id,
      title: "Solicitar ajustes no relatorio",
      message: m.titulo,
      initial: m.feedbackRevisao || "",
      confirmLabel: "Solicitar ajustes",
      onSubmit: feedback => {
        setData(d => ({
          ...d,
          missoes: d.missoes.map(x => x.id === m.id ? {
            ...x,
            status: "devolvida",
            feedbackRevisao: feedback,
            devolvidaEm: new Date().toISOString(),
            devolvidaPor: usuario.username,
          } : x),
          relatorios: (d.relatorios || []).map(r => r.id === m.relatorioFinalId ? {
            ...r,
            statusAprovacao: "Ajustes solicitados",
            feedbackAprovacao: feedback,
            revisadoPor: usuario.username,
            revisadoEm: new Date().toISOString(),
          } : r),
        }));
        window.notificarDiscordUsuarios(data, m.participants || [m.assignedTo], "relatorio", mensagemDiscordRelatorio(data, m, "ajustes", feedback));
      },
    });
  };

  const recusarRelatorio = (m) => {
    setFeedbackModal({
      key: "recusar_" + m.id,
      title: "Recusar relatorio final",
      message: m.titulo,
      initial: m.feedbackRevisao || "",
      tone: "danger",
      confirmLabel: "Recusar relatorio",
      placeholder: "Explique por que o relatorio foi recusado...",
      onSubmit: feedback => {
        setData(d => ({
          ...d,
          missoes: d.missoes.map(x => x.id === m.id ? {
            ...x,
            status: "devolvida",
            feedbackRevisao: feedback,
            devolvidaEm: new Date().toISOString(),
            devolvidaPor: usuario.username,
          } : x),
          relatorios: (d.relatorios || []).map(r => r.id === m.relatorioFinalId ? {
            ...r,
            statusAprovacao: "Recusado",
            feedbackAprovacao: feedback,
            revisadoPor: usuario.username,
            revisadoEm: new Date().toISOString(),
          } : r),
          activityLog: [...(d.activityLog || []), atividade("relatorio_recusado", usuario?.username, m.id, "Recusou o relatório final de " + m.titulo)],
        }));
        window.notificarDiscordUsuarios(data, m.participants || [m.assignedTo], "relatorio", mensagemDiscordRelatorio(data, m, "recusado", feedback));
      },
    });
  };

  const aprovarResultado = (m) => {
    const relatorio = (data.relatorios || []).find(r => r.id === m.relatorioFinalId);
    if (!relatorio) {
      setAviso({
        title: "Relatorio final nao encontrado",
        message: "A missao nao pode ser encerrada sem relatorio final enviado por um operador.",
        tone: "danger",
      });
      return;
    }
    const falhou = relatorio.resultado === "Falha";
    const statusFinal = falhou ? "falhou" : "concluida";
    const statusContrato = falhou ? "Falhou" : "Concluído";
    const texto = falhou ? "confirmar a falha da operação" : "aprovar a conclusão da operação";
    setConfirmacao({
      title: `Deseja ${texto}?`,
      message: "O contrato vinculado tambem sera atualizado, se existir.",
      tone: falhou ? "danger" : "success",
      confirmLabel: falhou ? "Confirmar falha" : "Aprovar resultado",
      onConfirm: () => {
        setData(d => ({
          ...d,
          missoes: d.missoes.map(x => x.id === m.id ? {
            ...x,
            status: statusFinal,
            concluidaEm: new Date().toISOString(),
            aprovadaPor: usuario.username,
            feedbackRevisao: "",
          } : x),
          relatorios: (d.relatorios || []).map(r => r.id === m.relatorioFinalId ? {
            ...r,
            statusAprovacao: "Aprovado",
            aprovadoPor: usuario.username,
            aprovadoEm: new Date().toISOString(),
          } : r),
          contratos: (d.contratos || []).map(c => c.id === m.contratoId ? {
            ...c,
            status: statusContrato,
            finalizadoEm: new Date().toISOString(),
            resultadoMissao: relatorio.resultado,
            relatorioFinalId: relatorio.id,
          } : c),
          activityLog: [...(d.activityLog || []), atividade("missao_aprovada", usuario?.username, m.id, "Aprovou o relatório final de " + m.titulo)],
        }));
        window.notificarDiscordUsuarios(data, m.participants || [m.assignedTo], "relatorio", mensagemDiscordRelatorio(data, m, "aprovado"));
      },
    });
  };

  const arquivar = (m) => {
    if (m.status === "andamento" || m.status === "aceita" || m.status === "atribuida") {
      setAviso({
        title: "Missao ativa",
        message: "Missao ativa nao deve ser arquivada sem relatorio final e decisao da lideranca.",
        tone: "danger",
      });
      return;
    }
    setConfirmacao({
      title: `Arquivar "${m.titulo}"?`,
      message: "A missao sairá da rotina ativa e ficara como registro historico.",
      tone: "default",
      confirmLabel: "Arquivar",
      onConfirm: () => atualizar(m.id, { status: "arquivada", arquivadaEm: new Date().toISOString() }),
    });
  };

  const renderAcoesOperacionais = (m) => (
    <div className="flex gap-2 flex-wrap">
      {["atribuida", "pendente", "aceita"].includes(m.status) && (
        <Btn onClick={() => iniciarPelaLideranca(m)} variant="primary"><ISwords className="w-3 h-3" /> Iniciar</Btn>
      )}
      {m.status === "revisao" && (
        <>
          <Btn onClick={() => aprovarResultado(m)} variant="success"><ICheck className="w-3 h-3" /> Aprovar</Btn>
          <Btn onClick={() => devolverParaAjustes(m)} variant="default"><IEdit className="w-3 h-3" /> Ajustes</Btn>
          <Btn onClick={() => recusarRelatorio(m)} variant="danger"><IX className="w-3 h-3" /> Recusar</Btn>
        </>
      )}
      {["concluida", "falhou", "recusada"].includes(m.status) && (
        <Btn onClick={() => arquivar(m)} variant="ghost"><IFile className="w-3 h-3" /> Arquivar</Btn>
      )}
    </div>
  );

  const todas = (data.missoes || []).slice().sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
  const ativas = todas.filter(m => !MISSAO_STATUS_TERMINAIS.includes(m.status));
  const encerradas = todas.filter(m => MISSAO_STATUS_TERMINAIS.includes(m.status));
  const missoes = filtro === "Ativas" ? ativas : filtro === "Encerradas" ? encerradas : todas;
  const colunasKanban = MISSAO_KANBAN_COLUNAS.map(col => ({ ...col, missoes: missoes.filter(m => col.statuses.includes(m.status || "atribuida")) }));

  return (
    <div className="space-y-4">
      <div className="flex justify-end gap-3 flex-wrap">
        {!criando && <Btn onClick={() => setCriando(true)} variant="primary"><IPlus className="w-3 h-3" /> Nova Missão</Btn>}
      </div>

      {criando && (
        <div className="p-4 bg-zinc-950/80 border border-orange-700 rounded-lg space-y-4 fadein">
          <div className="flex items-center justify-between gap-3 flex-wrap">
            <div>
              <h4 className="text-orange-50 font-bold">Nova Missão</h4>
              <p className="text-zinc-600 text-xs mt-1">Escolha equipe ou divisão para preencher operadores automaticamente.</p>
            </div>
            <div className="text-[10px] uppercase tracking-wider text-purple-400 border border-purple-900/50 rounded px-2 py-1 bg-purple-950/10">Relatório obrigatório</div>
          </div>

          <div className="grid lg:grid-cols-[1fr_1fr] gap-3">
            <div>
              <label className="fox-label">Atribuir para</label>
              <div className="grid grid-cols-3 gap-2">
                {[{id:"equipe", label:"Equipe"},{id:"divisao", label:"Divisão"},{id:"membro", label:"Membro"}].map(opt => (
                  <button key={opt.id} type="button" onClick={() => mudarTipoAtribuicao(opt.id)} className={`rounded-lg border px-3 py-2 text-xs uppercase tracking-wider font-black ${form.attributionType === opt.id ? "bg-orange-700 border-orange-500 text-white" : "bg-black border-zinc-800 text-zinc-500 hover:text-zinc-300"}`}>{opt.label}</button>
                ))}
              </div>
            </div>
            <div>
              <label className="fox-label">Classificação de sigilo</label>
              <select value={form.sigilo} onChange={(e) => mudarSigilo(e.target.value)} className="fox-input">
                {niveisPermitidos.map(n => <option key={n}>{n}</option>)}
              </select>
            </div>
          </div>

          {form.attributionType === "equipe" && (
            <div>
              <label className="fox-label">Equipe responsável</label>
              <select value={form.targetId} onChange={e => setForm({ ...form, targetId: e.target.value })} className="fox-input">
                <option value="">— Selecione uma equipe —</option>
                {escopos.equipes.map(e => {
                  const d = divisoesJikkai(data).find(x => x.id === e.divisaoId);
                  return <option key={e.id} value={e.id}>{e.nome} · {d?.nome || "Sem divisão"}</option>;
                })}
              </select>
            </div>
          )}

          {form.attributionType === "divisao" && (
            <div>
              <label className="fox-label">Divisão responsável</label>
              <select value={form.targetId} onChange={e => setForm({ ...form, targetId: e.target.value })} className="fox-input">
                <option value="">— Selecione uma divisão —</option>
                {escopos.divisoes.map(d => <option key={d.id} value={d.id}>{d.nome}</option>)}
              </select>
            </div>
          )}

          {form.attributionType === "membro" && (
            <div>
              <label className="fox-label">Escalar operadores autorizados *</label>
              <div className="grid sm:grid-cols-2 gap-2 p-3 bg-black border border-zinc-800 rounded max-h-52 overflow-y-auto">
                {usuariosElegiveis.map(u => (
                  <label key={u.username} className="flex items-center gap-2 text-sm text-zinc-300 cursor-pointer p-1 hover:text-orange-300">
                    <input type="checkbox" checked={form.participants.includes(u.username)} onChange={() => toggleParticipante(u.username)} className="w-4 h-4 accent-orange-600" />
                    <span>{u.codinome || u.displayName || u.username} <span className="text-zinc-700">@{u.username}</span></span>
                  </label>
                ))}
              </div>
            </div>
          )}

          <div className="p-3 rounded-lg border border-zinc-800 bg-black/45">
            <div className="flex items-center justify-between gap-2 flex-wrap">
              <div>
                <div className="text-[10px] uppercase tracking-wider text-zinc-600">Operadores preenchidos pelo escopo</div>
                <div className="text-orange-200 font-bold text-sm mt-1">{participantesSelecionados.length} operador{participantesSelecionados.length === 1 ? "" : "es"}</div>
              </div>
              <div className="text-[10px] text-zinc-600 max-w-xl">{escopoOperacionalLabel(data, form.attributionType, form.targetId, "Seleção manual")}</div>
            </div>
            <div className="flex gap-1.5 flex-wrap mt-3">
              {participantesSelecionados.slice(0, 12).map(username => {
                const u = data.users.find(x => x.username === username);
                return <span key={username} className="px-2 py-1 rounded border border-zinc-800 bg-zinc-950 text-zinc-300 text-[10px]">{u ? getCodinome(u) : username}</span>;
              })}
              {participantesSelecionados.length > 12 && <span className="px-2 py-1 rounded border border-zinc-800 bg-zinc-950 text-zinc-600 text-[10px]">+{participantesSelecionados.length - 12}</span>}
              {participantesSelecionados.length === 0 && <span className="text-yellow-500 text-xs">Nenhum operador disponível. Verifique equipe/divisão ou sigilo.</span>}
            </div>
          </div>

          <div className="grid lg:grid-cols-2 gap-3">
            <div><label className="fox-label">Título *</label><input value={form.titulo} onChange={(e) => setForm({...form, titulo: e.target.value})} className="fox-input" placeholder="Ex: Infiltração em Kirigakure" /></div>
            <div><label className="fox-label">Objetivos (um por linha)</label><textarea value={form.objetivosText} onChange={(e) => setForm({...form, objetivosText: e.target.value})} rows="3" className="fox-input" placeholder={"Mapear o perímetro\nIdentificar o alvo\nRelatar em 48h"} /></div>
          </div>
          <div><label className="fox-label">Descrição</label><textarea value={form.desc} onChange={(e) => setForm({...form, desc: e.target.value})} rows="3" className="fox-input" placeholder="Contexto, objetivo geral, riscos e limites..." /></div>

          <div className="flex gap-2 pt-2 border-t border-zinc-800">
            <Btn onClick={() => setCriando(false)} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
            <Btn onClick={criar} variant="primary" disabled={!form.titulo.trim() || participantesSelecionados.length === 0}><ISave className="w-3 h-3" /> Atribuir Missão</Btn>
          </div>
        </div>
      )}

      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="flex gap-2 flex-wrap">
          {["Ativas", "Encerradas", "Todas"].map(f => {
            const count = f === "Ativas" ? ativas.length : f === "Encerradas" ? encerradas.length : todas.length;
            return <button key={f} onClick={() => setFiltro(f)} className={`px-3 py-1.5 rounded text-xs uppercase tracking-wider font-bold border ${filtro === f ? "bg-orange-700 border-orange-600 text-white" : "bg-zinc-950 border-zinc-800 text-zinc-500"}`}>{f} ({count})</button>;
          })}
        </div>
        <div className="jikkai-segmented grid grid-cols-2 gap-1 border border-zinc-800 bg-zinc-950/85 min-w-[180px]">
          {[
            ["kanban", "Kanban"],
            ["lista", "Lista"],
          ].map(([id, label]) => (
            <button key={id} onClick={() => setModoVisual(id)} className={`rounded-xl px-3 py-2 text-[10px] uppercase font-black transition-all ${modoVisual === id ? "bg-orange-700 text-white" : "text-zinc-500 hover:text-zinc-200"}`}>
              {label}
            </button>
          ))}
        </div>
      </div>

      {missoes.length === 0 && !criando && (
        <div className="p-8 text-center bg-zinc-950/50 border border-zinc-800 rounded-lg text-zinc-600 italic">Nenhuma missão neste filtro.</div>
      )}

      {modoVisual === "kanban" && missoes.length > 0 && (
        <div className="grid md:grid-cols-2 xl:grid-cols-5 gap-3 items-start">
          {colunasKanban.map(col => (
            <section key={col.id} className={`rounded-xl border ${col.tone} p-3 min-h-[230px]`}>
              <div className="flex items-start justify-between gap-2 mb-3">
                <div>
                  <div className="text-orange-50 font-black serif">{col.label}</div>
                  <div className="text-zinc-600 text-[10px] leading-relaxed mt-1">{col.desc}</div>
                </div>
                <span className="min-w-7 text-center rounded-full border border-zinc-700 bg-black px-2 py-1 text-[10px] font-black text-orange-200">{col.missoes.length}</span>
              </div>
              <div className="space-y-2">
                {col.missoes.length === 0 && (
                  <div className="rounded-lg border border-dashed border-zinc-800 bg-black/25 p-4 text-center text-[11px] text-zinc-700">Sem operacao nesta etapa.</div>
                )}
                {col.missoes.map(m => {
                  const c = statusMissaoConfig(m.status);
                  const sigilo = normalizarSigilo(m.sigilo);
                  const autorizado = podeVerItemSigiloso(m, data, usuario, role);
                  if (!autorizado) return <ConteudoCensurado key={m.id} sigilo={sigilo} tipo="OPERACAO" />;
                  const participantes = participantesDaMissao(m);
                  const objetivos = m.objetivos || [];
                  const concluidos = objetivos.filter(o => o.done).length;
                  const prog = objetivos.length > 0 ? Math.round(concluidos / objetivos.length * 100) : 0;
                  const relatorio = m.relatorioFinalId ? (data.relatorios || []).find(r => r.id === m.relatorioFinalId) : null;
                  const contrato = m.contratoId ? (data.contratos || []).find(x => x.id === m.contratoId) : null;
                  const expanded = expandida === m.id;
                  const assignmentLabel = m.assignmentLabel || escopoOperacionalLabel(data, m.attributionType, m.targetId, participantes.length > 1 ? "Equipe operacional" : "Operador individual");
                  return (
                    <article key={m.id} className={`rounded-lg border ${c.border} bg-black/45 p-3 shadow-inner`}>
                      <div className="flex items-start justify-between gap-2">
                        <div className="min-w-0">
                          <div className="text-orange-50 font-bold text-sm leading-tight">{m.titulo}</div>
                          <div className="flex gap-1.5 flex-wrap mt-1">
                            <span className={`text-[9px] px-2 py-0.5 rounded font-black uppercase tracking-wider ${c.badge}`}>{c.label}</span>
                            <SigiloBadge sigilo={sigilo} compacto />
                          </div>
                        </div>
                        <button onClick={() => setExpandida(expanded ? null : m.id)} className="text-orange-400 p-1 leading-none" title="Detalhes">{expanded ? "-" : "+"}</button>
                      </div>
                      <div className="mt-2 text-[10px] text-zinc-500 leading-relaxed">
                        {assignmentLabel}<br />
                        {participantes.length} operador{participantes.length === 1 ? "" : "es"} - {(m.aceites || []).length}/{participantes.length} aceitaram
                      </div>
                      {objetivos.length > 0 && (
                        <div className="mt-2">
                          <div className="h-1.5 rounded-full bg-zinc-900 overflow-hidden"><div className="h-full bg-orange-600" style={{ width: `${prog}%` }} /></div>
                          <div className="text-[9px] text-zinc-600 mt-1">{concluidos}/{objetivos.length} objetivos - {prog}%</div>
                        </div>
                      )}
                      {expanded && (
                        <div className="mt-3 pt-3 border-t border-zinc-800 space-y-3 fadein">
                          {m.desc && <p className="text-zinc-400 text-xs leading-relaxed">{m.desc}</p>}
                          {contrato && <div className="rounded border border-red-900/40 bg-red-950/10 p-2 text-[11px] text-red-200">Contrato: {contrato.titulo}</div>}
                          <div className="flex gap-1 flex-wrap">
                            {participantes.slice(0, 8).map(p => {
                              const u = data.users.find(x => x.username === p);
                              return <span key={p} className="px-2 py-1 rounded border border-zinc-800 bg-zinc-950 text-zinc-400 text-[9px]">{u ? getCodinome(u) : p}</span>;
                            })}
                            {participantes.length > 8 && <span className="px-2 py-1 rounded border border-zinc-800 bg-zinc-950 text-zinc-600 text-[9px]">+{participantes.length - 8}</span>}
                          </div>
                          {relatorio ? (
                            <div className="rounded border border-purple-900/50 bg-purple-950/10 p-2 text-[11px] text-zinc-300">
                              <div className="text-purple-300 uppercase tracking-wider text-[9px] mb-1">Relatorio final - {relatorio.resultado}</div>
                              <div className="line-clamp-3">{relatorio.resumo || relatorio.descricao}</div>
                            </div>
                          ) : (
                            <div className="rounded border border-purple-900/40 bg-purple-950/10 p-2 text-[11px] text-purple-200">Aguardando relatorio final do operador.</div>
                          )}
                          {renderAcoesOperacionais(m)}
                          <button onClick={() => remover(m.id)} className="text-red-500 text-[10px] uppercase tracking-wider font-bold">Remover missao</button>
                        </div>
                      )}
                    </article>
                  );
                })}
              </div>
            </section>
          ))}
        </div>
      )}

      {modoVisual === "lista" && <div className="space-y-3">
        {missoes.map((m) => {
          const c = statusMissaoConfig(m.status);
          const sigilo = normalizarSigilo(m.sigilo);
          const autorizado = podeVerItemSigiloso(m, data, usuario, role);
          if (!autorizado) return <ConteudoCensurado key={m.id} sigilo={sigilo} tipo="OPERAÇÃO" />;
          const participantes = participantesDaMissao(m);
          const objetivos = m.objetivos || [];
          const prog = objetivos.length > 0 ? Math.round(objetivos.filter(o => o.done).length / objetivos.length * 100) : 0;
          const relatorio = m.relatorioFinalId ? (data.relatorios || []).find(r => r.id === m.relatorioFinalId) : null;
          const contrato = m.contratoId ? (data.contratos || []).find(x => x.id === m.contratoId) : null;
          const expanded = expandida === m.id;
          const assignmentLabel = m.assignmentLabel || escopoOperacionalLabel(data, m.attributionType, m.targetId, participantes.length > 1 ? "Equipe operacional" : "Operador individual");
          return (
            <div key={m.id} className={`p-4 rounded-lg border ${c.border} ${c.bg}`}>
              <div className="flex items-start justify-between gap-2">
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2 flex-wrap mb-1">
                    <h4 className="text-orange-50 font-bold">{m.titulo}</h4>
                    <span className={`text-xs px-2 py-0.5 rounded font-bold uppercase tracking-wider ${c.badge}`}>{c.label}</span>
                    <SigiloBadge sigilo={sigilo} compacto />
                    {m.contratoId && <span className="text-[10px] px-2 py-0.5 rounded border border-red-800 text-red-300 uppercase tracking-wider">Contrato</span>}
                    <span className="text-[10px] px-2 py-0.5 rounded border border-purple-800 text-purple-300 uppercase tracking-wider">Relatório obrigatório</span>
                  </div>
                  <div className="text-zinc-500 text-xs">
                    {assignmentLabel} · {participantes.length} operador{participantes.length === 1 ? "" : "es"}
                    {participantes.length > 0 && <span className="text-zinc-700"> · {(m.aceites || []).length}/{participantes.length} aceitaram</span>}
                  </div>
                </div>
                <div className="flex gap-1">
                  <button onClick={() => setExpandida(expanded ? null : m.id)} className="text-orange-400 p-1" title="Detalhes">{expanded ? "−" : "+"}</button>
                  <button onClick={() => remover(m.id)} className="text-red-500 p-1" title="Remover"><ITrash className="w-4 h-4" /></button>
                </div>
              </div>

              {m.desc && <p className="text-zinc-400 text-sm mt-2">{m.desc}</p>}
              {objetivos.length > 0 && <div className="text-xs text-zinc-500 mt-2">{objetivos.filter(o => o.done).length}/{objetivos.length} objetivos · {prog}%</div>}

              {expanded && (
                <div className="mt-4 pt-4 border-t border-zinc-800 space-y-3 fadein">
                  {contrato && (
                    <div className="p-3 bg-black/40 border border-red-900/40 rounded text-sm">
                      <div className="text-[10px] uppercase tracking-wider text-red-500">Contrato vinculado</div>
                      <div className="text-zinc-300">{contrato.titulo}</div>
                    </div>
                  )}
                  <div className="p-3 bg-black/35 border border-zinc-800 rounded">
                    <div className="text-[10px] uppercase tracking-wider text-zinc-600 mb-2">Operadores</div>
                    <div className="flex gap-1.5 flex-wrap">{participantes.map(p => { const u = data.users.find(x => x.username === p); return <span key={p} className="px-2 py-1 rounded bg-zinc-950 border border-zinc-800 text-zinc-300 text-[10px]">{u ? getCodinome(u) : p}</span>; })}</div>
                  </div>
                  {m.feedbackRevisao && (
                    <div className="p-3 bg-yellow-950/20 border border-yellow-800 rounded text-sm text-yellow-100 whitespace-pre-wrap">Feedback atual: {m.feedbackRevisao}</div>
                  )}
                  {relatorio ? (
                    <div className="p-3 bg-purple-950/20 border border-purple-800 rounded">
                      <div className="flex items-center justify-between gap-2 mb-2">
                        <div className="text-purple-200 text-xs uppercase tracking-wider">Relatório final · {relatorio.resultado}</div>
                        <div className="text-zinc-600 text-[10px]">{relatorio.statusAprovacao || "Pendente"}</div>
                      </div>
                      {relatorio.resumo && <div className="text-orange-50 font-bold text-sm mb-1">{relatorio.resumo}</div>}
                      <div className="text-zinc-300 text-sm whitespace-pre-wrap">{relatorio.descricao}</div>
                      {relatorio.evidencias && <div className="text-zinc-500 text-xs whitespace-pre-wrap mt-2 pt-2 border-t border-purple-900/40">Evidências:\n{relatorio.evidencias}</div>}
                    </div>
                  ) : (
                    <div className="p-3 bg-purple-950/10 border border-purple-900/40 rounded text-purple-200 text-xs">Esta missão ainda não pode ser encerrada: falta relatório final enviado por um operador.</div>
                  )}

                  <div className="flex gap-2 flex-wrap">
                    {["atribuida", "pendente", "aceita"].includes(m.status) && (
                      <Btn onClick={() => iniciarPelaLideranca(m)} variant="primary"><ISwords className="w-3 h-3" /> Iniciar pela liderança</Btn>
                    )}
                    {m.status === "revisao" && (
                      <>
                        <Btn onClick={() => aprovarResultado(m)} variant="success"><ICheck className="w-3 h-3" /> Aprovar resultado</Btn>
                        <Btn onClick={() => devolverParaAjustes(m)} variant="default"><IEdit className="w-3 h-3" /> Solicitar ajustes</Btn>
                        <Btn onClick={() => recusarRelatorio(m)} variant="danger"><IX className="w-3 h-3" /> Recusar relatório</Btn>
                      </>
                    )}
                    {["concluida", "falhou", "recusada"].includes(m.status) && (
                      <Btn onClick={() => arquivar(m)} variant="ghost"><IFile className="w-3 h-3" /> Arquivar</Btn>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>}
      <PortalDecisionModal dialog={confirmacao} onClose={() => setConfirmacao(null)} />
      <PortalNoticeModal notice={aviso} onClose={() => setAviso(null)} />
      <FeedbackReviewModal modal={feedbackModal} onClose={() => setFeedbackModal(null)} />
    </div>
  );
}


function DiscordManager({ data, setData, usuario }) {
  const [templates, setTemplates] = useState(() => discordDmTemplates(data));
  const [modelo, setModelo] = useState("missao_atribuida");
  const [token, setToken] = useState(() => discordBotTokenAtual());
  const [status, setStatus] = useState("");
  const [selecionados, setSelecionados] = useState([]);
  const [assunto, setAssunto] = useState("Convocação da liderança");
  const [mensagem, setMensagem] = useState("Compareça ao chamado da liderança assim que possível.");
  const [enviando, setEnviando] = useState(false);

  useEffect(() => { setTemplates(discordDmTemplates(data)); }, [data.discordDmTemplates]);

  const usuariosVerificados = (data.users || []).filter(u => u.role !== "contratante" && u.discordVerificado && u.discordId);
  const toggleUsuario = (username) => setSelecionados(lista => lista.includes(username) ? lista.filter(x => x !== username) : [...lista, username]);
  const selecionarTodos = () => setSelecionados(usuariosVerificados.map(u => u.username));
  const limparSelecionados = () => setSelecionados([]);

  const salvarModelos = () => {
    setData(d => ({
      ...d,
      discordDmTemplates: { ...DEFAULT_DISCORD_DM_TEMPLATES, ...templates },
      activityLog: [...(d.activityLog || []), atividade("discord_templates", usuario?.username, "discord", "Atualizou mensagens privadas do Discord")],
    }));
    setStatus("Mensagens privadas atualizadas.");
  };

  const restaurarModelo = (key) => setTemplates(t => ({ ...t, [key]: DEFAULT_DISCORD_DM_TEMPLATES[key] }));
  const restaurarTodos = () => setTemplates(DEFAULT_DISCORD_DM_TEMPLATES);

  const salvarTokenLocal = () => {
    const ok = salvarDiscordBotToken(token);
    setStatus(ok ? "Token do bot salvo neste navegador." : "Não foi possível salvar o token neste navegador.");
  };

  const enviarConvocacao = async () => {
    if (!selecionados.length) { alert("Selecione pelo menos um membro verificado."); return; }
    const content = mensagemDiscordConvocacao(data, assunto, mensagem, getCodinome(usuario));
    setEnviando(true);
    setStatus("Enviando convocação...");
    try {
      const resultado = await window.notificarDiscordUsuarios(data, selecionados, "convocacao", content);
      const ok = resultado.filter(r => r.ok).length;
      const falhas = resultado.length - ok;
      const detalhesFalhas = resultado.filter(r => !r.ok).map(r => r.reason).filter(Boolean).slice(0, 3).join(" | ");
      setData(d => ({ ...d, activityLog: [...(d.activityLog || []), atividade("discord_convocacao", usuario?.username, selecionados.join(","), `Convocou ${ok} membro(s) pelo Discord${falhas ? ` · ${falhas} falha(s)` : ""}`)] }));
      setStatus(`Convocação enviada para ${ok} membro(s).${falhas ? ` Falhas: ${falhas}${detalhesFalhas ? ` — ${detalhesFalhas}` : ""}.` : ""}`);
    } catch (e) {
      setStatus("Falha ao enviar convocação: " + (e.message || e));
    } finally {
      setEnviando(false);
    }
  };

  const preview = renderDiscordTemplate({ ...data, discordDmTemplates: templates }, modelo, {
    missao: "Vigiar rota de Kirigakure",
    contrato: "Busca de Item — Pergaminho raro",
    sigilo: "Nível II",
    designacao: "Equipe Corvos",
    recompensa: "25.000 Yens",
    feedback: "Corrija local, envolvidos e resultado da cena.",
    resultado: "Sucesso",
    assunto,
    mensagem,
    lider: getCodinome(usuario),
    pendencia: "Dossiê incompleto",
    motivo: "Complete seu dossiê no portal para facilitar designações e registros da Jikkai.",
    responsavel: "Tenshi / Equipe Corvos",
  });

  return (
    <div className="space-y-5 fadein">
      <div className="grid lg:grid-cols-[1fr_0.85fr] gap-4">
        <section className="rounded-xl border border-indigo-900/45 bg-indigo-950/10 p-4 space-y-3">
          <div className="flex items-start justify-between gap-3 flex-wrap">
            <div>
              <h3 className="text-orange-50 font-bold text-lg serif">Mensagens privadas do Discord</h3>
              <p className="text-zinc-500 text-xs mt-1">O líder pode alterar o texto enviado em missão, contrato, relatório e convocação.</p>
            </div>
            <div className="flex gap-2 flex-wrap">
              <Btn onClick={salvarModelos} variant="primary"><ISave className="w-3 h-3" /> Salvar mensagens</Btn>
              <Btn onClick={restaurarTodos} variant="ghost"><IX className="w-3 h-3" /> Restaurar padrões</Btn>
            </div>
          </div>

          <div className="grid md:grid-cols-[220px_1fr] gap-3">
            <div className="space-y-2">
              {Object.keys(DEFAULT_DISCORD_DM_TEMPLATES).map(key => (
                <button key={key} onClick={() => setModelo(key)} className={`w-full text-left p-3 rounded-lg border text-xs uppercase tracking-wider font-black ${modelo === key ? "border-indigo-500 bg-indigo-950/35 text-indigo-100" : "border-zinc-800 bg-black/35 text-zinc-500 hover:text-zinc-200"}`}>
                  {DISCORD_TEMPLATE_LABELS[key] || key}
                </button>
              ))}
            </div>
            <div>
              <div className="flex items-center justify-between gap-2 mb-2">
                <label className="fox-label mb-0">{DISCORD_TEMPLATE_LABELS[modelo]}</label>
                <Btn onClick={() => restaurarModelo(modelo)} variant="ghost">Restaurar esta</Btn>
              </div>
              <textarea value={templates[modelo] || ""} onChange={e => setTemplates(t => ({ ...t, [modelo]: e.target.value }))} rows="12" className="fox-input font-mono text-xs" />
              <div className="mt-2 text-[10px] text-zinc-600 leading-relaxed">
                Variáveis: <span className="text-indigo-300">{"{missao}"}</span>, <span className="text-indigo-300">{"{contrato}"}</span>, <span className="text-indigo-300">{"{sigilo}"}</span>, <span className="text-indigo-300">{"{designacao}"}</span>, <span className="text-indigo-300">{"{recompensa}"}</span>, <span className="text-indigo-300">{"{feedback}"}</span>, <span className="text-indigo-300">{"{resultado}"}</span>, <span className="text-indigo-300">{"{assunto}"}</span>, <span className="text-indigo-300">{"{mensagem}"}</span>, <span className="text-indigo-300">{"{portal}"}</span>.
              </div>
            </div>
          </div>
        </section>

        <aside className="space-y-4">
          <div className="rounded-xl border border-zinc-800 bg-black/45 p-4">
            <div className="text-[9px] uppercase tracking-[0.24em] text-zinc-500 mb-2">Prévia</div>
            <pre className="whitespace-pre-wrap text-xs text-zinc-300 bg-zinc-950/70 border border-zinc-800 rounded-lg p-3 max-h-72 overflow-auto">{preview}</pre>
          </div>
          <div className="rounded-xl border border-yellow-900/40 bg-yellow-950/10 p-4">
            <div className="text-[9px] uppercase tracking-[0.24em] text-yellow-500 mb-2">Bot da Jikkai</div>
            <label className="fox-label">Token do bot</label>
            <input value={token} onChange={e => setToken(e.target.value)} className="fox-input font-mono" type="password" placeholder="Cole o token do bot" />
            <Btn onClick={salvarTokenLocal} variant="default" className="mt-3 w-full justify-center"><ISave className="w-3 h-3" /> Salvar token neste navegador</Btn>
            <div className="text-[10px] text-zinc-600 mt-2 leading-relaxed">O arquivo já possui um token de fallback conforme solicitado. Este campo permite trocar o token sem editar o HTML.</div>
          </div>
          {status && <div className="rounded-xl border border-indigo-900/40 bg-indigo-950/15 p-3 text-indigo-200 text-sm">{status}</div>}
        </aside>
      </div>

      <section className="rounded-xl border border-red-900/40 bg-red-950/10 p-4 space-y-4">
        <div className="flex items-start justify-between gap-3 flex-wrap">
          <div>
            <h3 className="text-orange-50 font-bold text-lg serif">Convocação da liderança</h3>
            <p className="text-zinc-500 text-xs mt-1">Envia uma DM direta para membros com Discord verificado. Convocação ignora preferências de missão/contrato/relatório.</p>
          </div>
          <div className="flex gap-2 flex-wrap">
            <Btn onClick={selecionarTodos} variant="ghost">Selecionar todos</Btn>
            <Btn onClick={limparSelecionados} variant="ghost">Limpar</Btn>
          </div>
        </div>
        <div className="grid lg:grid-cols-[1fr_1fr] gap-4">
          <div className="space-y-3">
            <div><label className="fox-label">Assunto</label><input value={assunto} onChange={e => setAssunto(e.target.value)} className="fox-input" /></div>
            <div><label className="fox-label">Mensagem</label><textarea value={mensagem} onChange={e => setMensagem(e.target.value)} rows="4" className="fox-input" /></div>
            <Btn onClick={enviarConvocacao} variant="primary" disabled={enviando || !selecionados.length} className="w-full justify-center"><IShield className="w-3 h-3" /> {enviando ? "Enviando..." : `Enviar convocação (${selecionados.length})`}</Btn>
          </div>
          <div>
            <div className="text-[9px] uppercase tracking-[0.24em] text-zinc-500 mb-2">Membros verificados</div>
            <div className="grid sm:grid-cols-2 gap-2 max-h-72 overflow-y-auto pr-1">
              {usuariosVerificados.map(u => (
                <label key={u.username} className={`flex items-center gap-2 p-2 rounded-lg border cursor-pointer ${selecionados.includes(u.username) ? "border-indigo-500 bg-indigo-950/30" : "border-zinc-800 bg-black/35"}`}>

const JIKKAI_CONTRATANTE_TRANSICAO_IMG = "assets/jikkai-contractor-transition.png";

function ConviteEntradaScreen({ data, token, onRegistrar, onVoltarLogin }) {
  const tokenNormalizado = normalizarTokenConvite(token);
  const convite = (data.convitesEntrada || []).find(c => normalizarTokenConvite(c.token) === tokenNormalizado);
  const isConviteContratante = conviteEhContratante(convite);
  const nomeRecepcao = conviteNomeFormal(convite) || convite?.nomeConvidado || "";
  const codinomeContratante = conviteCodinomeReservado(convite);
  const contratanteComIdentidadeFixa = isConviteContratante && Boolean(codinomeContratante);
  const nomeCadastroInicial = isConviteContratante ? (contratanteComIdentidadeFixa ? (nomeRecepcao || codinomeContratante) : "") : nomeRecepcao;
  const [codinome, setCodinome] = useState("");
  const [buscaCodinome, setBuscaCodinome] = useState("");
  const [form, setForm] = useState({ username: "", password: "", confirm: "", displayName: nomeCadastroInicial, nomeRP: nomeCadastroInicial, elemento: "", linhagem: "", vilaOrigem: convite?.vilaConvidado || "", especialidade: "" });
  const [erro, setErro] = useState("");
  const [registrando, setRegistrando] = useState(false);
  const [introContratante, setIntroContratante] = useState(false);

  const disponiveis = codinomesDisponiveisParaConvite(data, convite);
  const termo = buscaCodinome.trim().toLowerCase();
  const codinomesFiltrados = disponiveis.filter(c => !termo || [c.nome, c.categoria, c.descricao].some(v => String(v || "").toLowerCase().includes(termo)));
  const statusConvite = !convite ? "invalido" : convite.status !== "pendente" ? "usado" : conviteExpirado(convite) ? "expirado" : "ok";
  useEffect(() => {
    if (!isConviteContratante || statusConvite !== "ok") {
      setIntroContratante(false);
      return;
    }
    setIntroContratante(true);
    const timer = setTimeout(() => setIntroContratante(false), 1700);
    return () => clearTimeout(timer);
  }, [isConviteContratante, statusConvite, tokenNormalizado]);
  const cargo = convite ? (data.roles || []).find(r => r.id === convite.rolePadrao) : null;
  const nomeLivreContratante = codinomeNome(form.displayName || form.nomeRP);
  const codinomeSelecionado = isConviteContratante
    ? (contratanteComIdentidadeFixa
      ? { id: codinomeId(codinomeContratante), nome: codinomeContratante, categoria: "Contratantes", descricao: "Identidade externa reservada por este selo." }
      : (nomeLivreContratante && codinomeDisponivelParaConvite(data, nomeLivreContratante, convite)
        ? { id: codinomeId(nomeLivreContratante), nome: nomeLivreContratante, categoria: "Contratantes", descricao: "Identidade escolhida pelo contratante." }
        : null))
    : disponiveis.find(c => c.nome === codinome || c.id === codinomeId(codinome));
  const mensagemRecepcao = convite?.mensagemPersonalizada || "Você acaba de receber o fuuinjutsu Selo Jikkai e foi liberado para utilizar nossos serviços sob sigilo absoluto.";

  const enviar = async (e) => {
    e.preventDefault();
    setErro("");
    if (statusConvite !== "ok") { setErro("Este selo não está disponível."); return; }
    if (!codinomeSelecionado) { setErro(isConviteContratante && !contratanteComIdentidadeFixa ? (nomeLivreContratante ? "Este nome ja esta em uso ou bloqueado. Escolha outra identidade." : "Informe o nome que deseja usar como contratante.") : "Escolha um codinome disponível antes de continuar."); return; }
    if (form.password !== form.confirm) { setErro("As senhas não conferem."); return; }
    setRegistrando(true);
    try {
      const res = onRegistrar(tokenNormalizado, { ...form, codinome: codinomeSelecionado.nome });
      if (res?.error) setErro(res.error);
    } finally {
      setRegistrando(false);
    }
  };

  const renderIndisponivel = (titulo, msg) => (
    <div className="min-h-screen shadow-ops-bg bg-black flex items-center justify-center p-4">
      <div className="jikkai-terminal-card max-w-lg w-full rounded-2xl p-6 text-center">
        <IAlert className="w-14 h-14 text-red-500 mx-auto mb-4" />
        <div className="text-[10px] uppercase tracking-[0.35em] text-red-500">Selo recusado</div>
        <h1 className="text-3xl font-black text-orange-50 serif mt-2">{titulo}</h1>
        <p className="text-zinc-500 text-sm leading-relaxed mt-3">{msg}</p>
        <Btn onClick={onVoltarLogin} variant="primary" className="mx-auto mt-6"><ILock className="w-3 h-3" /> Voltar ao portal</Btn>
      </div>
    </div>
  );

  if (statusConvite === "invalido") return renderIndisponivel("Convite não encontrado", "Este link não corresponde a nenhum Selo de Entrada ativo no portal.");
  if (statusConvite === "usado") return renderIndisponivel("Selo já utilizado", "Este convite já foi consumido. Solicite um novo link à liderança.");
  if (statusConvite === "expirado") return renderIndisponivel("Selo expirado", "O prazo deste convite acabou. Solicite um novo Selo de Entrada à liderança.");

            </div>

    );
  }

  if (isConviteContratante) {

    return (
