function perfilCompletoUsuario(u) {
  if (!u) return false;
  return Boolean(u.avatarUrl && MEMBER_PROFILE_FIELDS.filter(c => c !== "especialidade").every(c => String(u[c] || "").trim()));
}

function normalizarMembro(u, existente = true) {
  const base = {
    avatarUrl: "", avatarStoragePath: "", nomeRP: "", elemento: "", linhagem: "",
    vilaOrigem: "", patente: "", especialidade: "", bio: "", estruturaNivel: "operador",
    respondeA: "", nivelAcesso: 1, iniciacaoStatus: existente ? "concluida" : "pendente",
    criadoEm: "", criadoPor: "", perfilCompleto: false,
    iniciacaoConcluidaEm: "", iniciacaoVersao: 0, iniciacaoReabertaEm: "",
    reputacao: "Desconhecido", lealdade: "", reputacaoNota: "", lealdadeNota: "",
    reputacaoAtualizadaEm: "", lealdadeAtualizadaEm: "",
  };
  const out = { ...base, ...u };
  if (!existente && !String(out.patente || "").trim()) out.patente = "Recruta em Observação";
  out.nomeRP = out.nomeRP || out.displayName || "";
  out.nivelAcesso = Math.max(1, Math.min(5, Number(out.nivelAcesso) || 1));
  if (!REPUTACAO_NIVEIS.includes(out.reputacao)) out.reputacao = "Desconhecido";
  if (!u?.lealdade) out.lealdade = out.role === "leader" ? "Pilar da F.O.X." : (existente ? "Recruta" : "Observado");
  if (!LEALDADE_NIVEIS.includes(out.lealdade)) out.lealdade = existente ? "Recruta" : "Observado";
  out.perfilCompleto = perfilCompletoUsuario(out);
  return out;
}

function slugEstrutura(valor) {
  return String(valor || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

function usuarioPorIdentidade(users, identidade) {
  const alvo = slugEstrutura(identidade);
  if (!alvo) return null;
  return (users || []).find(u => [u.username, u.codinome, u.displayName, u.nomeRP].some(v => slugEstrutura(v) === alvo)) || null;
}

function trioDoUsuario(data, username) {

const STORAGE_KEY = "fox-portal-v3";

async function loadState() {
  // Tenta nuvem primeiro
  if (cloudClient) {
    try {
      const { data, error } = await cloudClient.from("fox_state").select("data").eq("id", 1).single();
      if (!error && data?.data && Object.keys(data.data).length > 0) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data.data)); } catch {}
        return data.data;
      }
    } catch (e) { console.error("cloud load error", e); }
  }
  // Fallback: localStorage
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { console.error("local load error", e); return null; }
}

async function saveStateAsync(s) {
  let cloudOk = null; // null = não configurado
  if (cloudClient) {
    try {
      const { error } = await cloudClient.from("fox_state").upsert({ id: 1, data: s, updated_at: new Date().toISOString() });
      cloudOk = !error;
      if (error) console.error("cloud save error", error);
    } catch (e) { cloudOk = false; console.error(e); }
  }
  let localOk = false;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); localOk = true; }
  catch (e) { console.error("local save error", e); }
  return { cloudOk, localOk };
}

function useMediaQuery(query) {
  const [matches, setMatches] = useState(() => typeof window !== "undefined" && window.matchMedia(query).matches);
  useEffect(() => {
    if (typeof window === "undefined") return;
    const media = window.matchMedia(query);
    const update = () => setMatches(media.matches);
    update();
    media.addEventListener?.("change", update);
    return () => media.removeEventListener?.("change", update);
  }, [query]);
  return matches;
}

function GaleriaModal({ onSave, onClose, usuario }) {
  const [modo, setModo] = useState("upload"); // "upload" | "url"
  const [titulo, setTitulo] = useState("");
  const [descricao, setDescricao] = useState("");
  const [url, setUrl] = useState("");
  const [arquivo, setArquivo] = useState(null);
  const [preview, setPreview] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [erro, setErro] = useState(null);
  const fileInputRef = useRef();

  const escolherArquivo = (e) => {
    setErro(null);
    const f = e.target.files?.[0];
    if (!f) return;
    if (!f.type.startsWith("image/")) {
      setErro("O arquivo precisa ser uma imagem (PNG, JPG, GIF, WEBP).");
      return;
    }
    if (f.size > 5 * 1024 * 1024) {
      setErro("Imagem muito grande. Máximo: 5MB.");
      return;
    }
    setArquivo(f);
    const reader = new FileReader();
    reader.onload = (ev) => setPreview(ev.target.result);
    reader.readAsDataURL(f);
  };

  const enviarUpload = async () => {
    if (!arquivo) { setErro("Selecione uma imagem primeiro."); return; }
    if (!titulo.trim()) { setErro("Dê um título à imagem."); return; }
    if (!cloudClient) {
      setErro("Sincronização em nuvem não configurada — upload indisponível.");
      return;
    }
    setUploading(true);
    setErro(null);
    try {
      const ext = (arquivo.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "");
      const path = `${Date.now()}-${uid()}.${ext}`;
      const { error: upErr } = await cloudClient.storage.from("galeria").upload(path, arquivo, {
        contentType: arquivo.type,
        upsert: false,
      });
      if (upErr) throw upErr;
      const { data: pubData } = cloudClient.storage.from("galeria").getPublicUrl(path);
      const publicUrl = pubData?.publicUrl;
      if (!publicUrl) throw new Error("Não foi possível obter a URL pública.");
      onSave({
        id: uid(),
        url: publicUrl,
        storagePath: path,
        titulo: titulo.trim(),
        descricao: descricao.trim(),
        autor: usuario?.username || "?",
        autorNome: usuario?.displayName || usuario?.username || "Desconhecido",
        data: new Date().toISOString(),
        source: "upload",
      });
    } catch (err) {
      console.error("upload error", err);
      setErro(`Erro no upload: ${err.message || "verifique o bucket 'galeria' no Supabase."}`);
      setUploading(false);
    }
  };

  const enviarUrl = () => {
    setErro(null);
    if (!url.trim()) { setErro("Cole a URL da imagem."); return; }
    if (!/^https?:\/\/.+/i.test(url.trim())) { setErro("URL inválida. Deve começar com http:// ou https://"); return; }
    if (!titulo.trim()) { setErro("Dê um título à imagem."); return; }
    onSave({
      id: uid(),
      url: url.trim(),
      storagePath: null,
      titulo: titulo.trim(),
      descricao: descricao.trim(),
      autor: usuario?.username || "?",
      autorNome: usuario?.displayName || usuario?.username || "Desconhecido",
      data: new Date().toISOString(),
      source: "url",
    });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm fadein" onClick={uploading ? null : onClose}>
      <div className="bg-zinc-950 border border-orange-700 rounded-lg shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
        <div className="p-5 border-b border-orange-900/50 flex items-center justify-between sticky top-0 bg-zinc-950 z-10">
          <div className="flex items-center gap-3">
            <IImage className="w-6 h-6 text-orange-500" />
            <h3 className="text-xl font-bold text-orange-50 serif">Adicionar à Galeria</h3>
          </div>
          <button onClick={onClose} disabled={uploading} className="text-zinc-500 hover:text-red-400 p-1 disabled:opacity-30"><IX className="w-5 h-5" /></button>
        </div>

        <div className="p-5 space-y-4">
          {/* Toggle modo */}
          <div className="flex gap-1 bg-zinc-900/60 border border-zinc-800 rounded p-1">
            <button
              onClick={() => { setModo("upload"); setErro(null); }}
              className={`flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded text-xs uppercase tracking-wider font-bold transition-all ${modo === "upload" ? "bg-orange-700 text-white" : "text-zinc-500 hover:text-zinc-300"}`}
              disabled={uploading}
            >
              <IUpload className="w-3 h-3" /> Enviar Arquivo
            </button>
            <button
              onClick={() => { setModo("url"); setErro(null); }}
              className={`flex-1 flex items-center justify-center gap-2 px-3 py-2 rounded text-xs uppercase tracking-wider font-bold transition-all ${modo === "url" ? "bg-orange-700 text-white" : "text-zinc-500 hover:text-zinc-300"}`}
              disabled={uploading}
            >
              <ILink className="w-3 h-3" /> Por URL
            </button>
          </div>

          {modo === "upload" && (
            <div>
              <label className="fox-label">Imagem (max 5MB)</label>
              <input ref={fileInputRef} type="file" accept="image/*" onChange={escolherArquivo} disabled={uploading} className="hidden" />
              {!preview ? (
                <button
                  onClick={() => fileInputRef.current?.click()}
                  disabled={uploading}
                  className="w-full border-2 border-dashed border-zinc-800 hover:border-orange-700 rounded-lg p-8 text-center text-zinc-500 hover:text-orange-400 transition-colors disabled:opacity-50"
                >
                  <IUpload className="w-10 h-10 mx-auto mb-2" />
                  <div className="text-sm font-bold uppercase tracking-wider">Clique para escolher</div>
                  <div className="text-xs text-zinc-600 mt-1">PNG, JPG, GIF, WEBP</div>
                </button>
              ) : (
                <div className="relative">
                  <img src={preview} alt="preview" className="w-full max-h-64 object-contain bg-black rounded border border-orange-900/40" />
                  <button
                    onClick={() => { setArquivo(null); setPreview(null); fileInputRef.current.value = ""; }}
                    disabled={uploading}
                    className="absolute top-2 right-2 bg-black/80 border border-red-700 text-red-400 hover:bg-red-950 p-1.5 rounded"
                  >
                    <IX className="w-4 h-4" />
                  </button>
                  <div className="text-xs text-zinc-500 mt-2 truncate">{arquivo?.name} · {(arquivo?.size / 1024).toFixed(0)}KB</div>
                </div>
              )}
            </div>
          )}

          {modo === "url" && (
            <div>
              <label className="fox-label">URL da imagem</label>
              <input
                value={url}
                onChange={(e) => setUrl(e.target.value)}
                disabled={uploading}
                className="fox-input"
                placeholder="https://exemplo.com/imagem.png"
              />
              {url && /^https?:\/\/.+/i.test(url) && (
                <img src={url} alt="preview" className="mt-3 w-full max-h-64 object-contain bg-black rounded border border-orange-900/40" onError={(e) => e.target.style.display = "none"} />
              )}
            </div>
          )}

          <div>
            <label className="fox-label">Título *</label>
            <input value={titulo} onChange={(e) => setTitulo(e.target.value)} disabled={uploading} className="fox-input" placeholder="Ex: Confronto na ponte de Konoha" />
          </div>
          <div>
            <label className="fox-label">Descrição / contexto do RP</label>
            <textarea value={descricao} onChange={(e) => setDescricao(e.target.value)} rows="3" disabled={uploading} className="fox-input" placeholder="Quem estava, o que aconteceu, qual o contexto..." />
          </div>

          {erro && (
            <div className="p-3 bg-red-950/40 border border-red-800 rounded text-red-300 text-sm flex items-start gap-2">
              <IAlert className="w-4 h-4 flex-shrink-0 mt-0.5" />
              <span>{erro}</span>
            </div>
          )}
        </div>

        <div className="p-5 border-t border-zinc-800 flex gap-2 justify-end sticky bottom-0 bg-zinc-950">
          <Btn onClick={onClose} variant="ghost" disabled={uploading}><IX className="w-3 h-3" /> Cancelar</Btn>
          {modo === "upload" ? (
            <Btn onClick={enviarUpload} variant="primary" disabled={uploading || !arquivo || !titulo.trim()}>
              {uploading ? <><ILoader className="w-3 h-3 animate-spin" /> Enviando...</> : <><IUpload className="w-3 h-3" /> Enviar para Galeria</>}
            </Btn>
          ) : (
            <Btn onClick={enviarUrl} variant="primary" disabled={!url.trim() || !titulo.trim()}>
              <ILink className="w-3 h-3" /> Adicionar
            </Btn>
          )}
        </div>
      </div>
    </div>
  );
}

  useEffect(() => {

    window.addEventListener("keydown", onKey);

  return (
    <div className="fixed inset-0 z-[60] flex flex-col bg-black/95 backdrop-blur-sm fadein" onClick={onClose}>
      <div className="flex items-center justify-between p-4 border-b border-orange-900/30">

function LinhaDoTempoSection({ data, setData, podeEditar }) {
  const [editando, setEditando] = useState(false);
  const [draft, setDraft] = useState(data.historia);

  useEffect(() => { if (!editando) setDraft(data.historia); }, [data.historia, editando]);

  const salvar = () => { setData(d => ({ ...d, historia: draft.filter(e => e.evento.trim()) })); setEditando(false); };
  const cancelar = () => { setDraft(data.historia); setEditando(false); };
  const update = (i, field, val) => setDraft(draft.map((e, idx) => idx === i ? { ...e, [field]: val } : e));
  const remove = (i) => setDraft(draft.filter((_, idx) => idx !== i));
  const add = () => setDraft([...draft, { id: uid(), era: "Nova Era", evento: "Novo evento", desc: "" }]);
  const move = (i, dir) => {
    const ni = i + dir;
    if (ni < 0 || ni >= draft.length) return;
    const n = [...draft];
    [n[i], n[ni]] = [n[ni], n[i]];
    setDraft(n);
  };

  const eventos = editando ? draft : data.historia;

  return (
    <div className="fadein">

            <IBook className="w-6 h-6 text-orange-500" />
            <h2 className="text-2xl font-bold text-orange-50 tracking-wide serif">Linha do Tempo</h2>
          </div>
          <p className="text-zinc-500 text-sm mt-1 italic">Da queda de Uzushio ao nascimento da F.O.X.</p>
        </div>
        {podeEditar && (editando ? (
          <div className="flex gap-2">
            <Btn onClick={cancelar} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
            <Btn onClick={salvar} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn>
          </div>
        ) : (
          <Btn onClick={() => setEditando(true)} variant="default"><IEdit className="w-3 h-3" /> Editar</Btn>
        ))}
      </div>
      <div className="relative pl-8 space-y-6 border-l-2 border-orange-900/40">
        {eventos.map((e, i) => (
          <div key={e.id || i} className="relative">
            <div className="absolute -left-[42px] w-5 h-5 rounded-full bg-black border-2 border-orange-600 flex items-center justify-center">

function FigurasEditor({ figuras, onChange, isLider, cor }) {
  const [editando, setEditando] = useState(false);
  const [draft, setDraft] = useState(figuras);
  // cor pode vir como hex (#D85A30) ou legado ("red"/"orange"); normaliza para hex
  const hex = typeof cor === "string" && cor.startsWith("#") ? cor : (cor === "red" ? "#B91C1C" : "#D85A30");
  const corStyle = { borderColor: hex + "66", background: "#000000" };

  useEffect(() => { if (!editando) setDraft(figuras); }, [figuras, editando]);

  const add = () => setDraft([...draft, { nome: "", desc: "" }]);
  const remove = (i) => setDraft(draft.filter((_, idx) => idx !== i));
  const update = (i, field, val) => setDraft(draft.map((f, idx) => idx === i ? { ...f, [field]: val } : f));
  const salvar = () => { onChange(draft.filter(f => f.nome.trim())); setEditando(false); };
  const cancelar = () => { setDraft(figuras); setEditando(false); };

  return (
    <div>
      <div className="flex items-center justify-between mb-2 gap-2 flex-wrap">
        <div className="text-xs uppercase tracking-wider font-semibold" style={{ color: hex }}>Figuras de destaque</div>
        {isLider && !editando && <Btn onClick={() => setEditando(true)} variant="ghost"><IEdit className="w-3 h-3" /> Editar</Btn>}
        {isLider && editando && (
          <div className="flex gap-2">
            <Btn onClick={cancelar} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
            <Btn onClick={salvar} variant="primary"><ISave className="w-3 h-3" /> Salvar</Btn>
          </div>
        )}
      </div>

      {!editando && figuras.length === 0 && (
        <div className="text-zinc-600 text-sm italic p-4 bg-black/40 border border-zinc-900 rounded">
          Nenhuma figura registrada ainda.{isLider && " Clique em Editar para adicionar."}
        </div>
      )}

      {!editando && figuras.length > 0 && (
        <div className="grid sm:grid-cols-2 md:grid-cols-3 gap-2 text-sm">
          {figuras.map((f, i) => (
            <div key={i} className="p-3 bg-black/60 border rounded" style={corStyle}>
              <div className="font-bold" style={{ color: hex }}>{f.nome}</div>
              <div className="text-zinc-500 text-xs">{f.desc}</div>

      )}

        <div className="space-y-2">

            <div key={i} className="p-3 bg-black/60 border rounded flex gap-2 items-start" style={corStyle}>

          <Btn onClick={add} variant="ghost" className="w-full justify-center"><IPlus className="w-3 h-3" /> Adicionar figura</Btn>
        </div>
      )}
    </div>
  );
}

function MeuDossieModal({ membro, data, setData, onClose }) {
  const [form, setForm] = useState({
    nomeRP: membro.nomeRP || membro.displayName || "",
    elemento: membro.elemento || "",
    linhagem: membro.linhagem || "",
    vilaOrigem: membro.vilaOrigem || "",
    especialidade: membro.especialidade || "",
    bio: membro.bio || "",
  });
  const [arquivo, setArquivo] = useState(null);
  const [preview, setPreview] = useState(membro.avatarUrl || "");
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState("");
  const inputRef = useRef();

  const escolherFoto = (e) => {
    setErro("");
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) { setErro("Escolha uma imagem JPG, PNG ou WEBP."); return; }
    if (file.size > 3 * 1024 * 1024) { setErro("A foto deve ter no máximo 3 MB."); return; }
    const reader = new FileReader();
    reader.onerror = () => setErro("Não foi possível ler a imagem escolhida.");
    reader.onload = () => {
      const imagem = new Image();
      imagem.onerror = () => setErro("A imagem escolhida não pôde ser processada.");
      imagem.onload = () => {
        const tamanho = 384;
        const recorte = Math.min(imagem.naturalWidth, imagem.naturalHeight);
        const origemX = Math.max(0, (imagem.naturalWidth - recorte) / 2);
        const origemY = Math.max(0, (imagem.naturalHeight - recorte) / 2);
        const canvas = document.createElement("canvas");
        canvas.width = tamanho;
        canvas.height = tamanho;
        const ctx = canvas.getContext("2d");
        if (!ctx) { setErro("Seu navegador não conseguiu preparar a foto."); return; }
        ctx.drawImage(imagem, origemX, origemY, recorte, recorte, 0, 0, tamanho, tamanho);
        setPreview(canvas.toDataURL("image/jpeg", 0.82));
        setArquivo(file);
      };
      imagem.src = reader.result;
    };
    reader.readAsDataURL(file);
  };

  const salvar = async () => {
    setErro("");
    setSalvando(true);
    let avatarUrl = membro.avatarUrl || "";
    let avatarStoragePath = membro.avatarStoragePath || "";
    try {
      if (arquivo) {
        avatarUrl = preview;
        avatarStoragePath = "";
      }
      setData(d => {
        const atualizado = normalizarMembro({ ...membro, ...form, avatarUrl, avatarStoragePath });
        return {
          ...d,
          users: d.users.map(u => u.username === membro.username ? atualizado : u),
          activityLog: [...(d.activityLog || []), atividade("perfil_atualizado", membro.username, membro.username, arquivo ? "Atualizou o dossiê e a foto de perfil" : "Atualizou o próprio dossiê")],
        };
      });
      onClose();
    } catch (e) {
      setErro(e.message || "Não foi possível salvar o dossiê.");
      setSalvando(false);
    }
  };

  return (
    <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/90 backdrop-blur-sm fadein" onClick={salvando ? null : onClose}>
      <div className="w-full max-w-3xl max-h-[100dvh] sm:max-h-[92vh] overflow-y-auto bg-zinc-950 border border-orange-800 rounded-t-2xl sm:rounded-xl shadow-2xl" onClick={e => e.stopPropagation()}>
        <div className="p-5 border-b border-orange-900/40 flex items-center justify-between sticky top-0 bg-zinc-950 z-10">
          <div>
            <div className="text-[10px] uppercase tracking-[0.3em] text-orange-600">Arquivo pessoal</div>
            <h3 className="text-xl font-black text-orange-50 serif">Meu Dossiê</h3>
          </div>
          <button onClick={onClose} disabled={salvando} className="text-zinc-500 hover:text-red-400"><IX className="w-5 h-5" /></button>
        </div>
        <div className="p-5 space-y-5">
          <div className="flex flex-col sm:flex-row items-center gap-5 p-4 rounded-lg bg-black/60 border border-zinc-800">
            <div className="w-32 h-32 rounded-full overflow-hidden border-2 border-orange-700 bg-black flex items-center justify-center">
              {preview ? <img src={preview} alt="Prévia" className="w-full h-full object-cover" /> : <span className="text-2xl font-black text-orange-400">{iniciaisMembro(membro)}</span>}
            </div>
            <div className="flex-1 text-center sm:text-left">
              <div className="text-orange-50 font-bold mb-1">Foto de perfil</div>
              <p className="text-zinc-500 text-xs mb-3">JPG, PNG ou WEBP, até 3 MB. A foto será recortada e otimizada automaticamente.</p>
              <input ref={inputRef} type="file" accept="image/jpeg,image/png,image/webp" onChange={escolherFoto} className="hidden" />
              <Btn onClick={() => inputRef.current?.click()} variant="default" disabled={salvando}><IUpload className="w-3 h-3" /> Escolher foto</Btn>
            </div>
          </div>
          <div className="grid sm:grid-cols-2 gap-3">
            <div><label className="fox-label">Nome de RP</label><input value={form.nomeRP} onChange={e => setForm({ ...form, nomeRP: e.target.value })} className="fox-input" /></div>
            <div><label className="fox-label">Elemento</label><input value={form.elemento} onChange={e => setForm({ ...form, elemento: e.target.value })} className="fox-input" placeholder="Ex: Raiton" /></div>
            <div><label className="fox-label">Linhagem</label><input value={form.linhagem} onChange={e => setForm({ ...form, linhagem: e.target.value })} className="fox-input" placeholder="Ex: Hyuuga" /></div>
            <div><label className="fox-label">Vila de origem</label><input value={form.vilaOrigem} onChange={e => setForm({ ...form, vilaOrigem: e.target.value })} className="fox-input" /></div>
            <div className="sm:col-span-2"><label className="fox-label">Especialidade</label><input value={form.especialidade} onChange={e => setForm({ ...form, especialidade: e.target.value })} className="fox-input" placeholder="Ex: Inteligência, ataque, suporte..." /></div>
            <div className="sm:col-span-2"><label className="fox-label">Descrição pessoal</label><textarea rows="4" value={form.bio} onChange={e => setForm({ ...form, bio: e.target.value })} className="fox-input" placeholder="Registro breve do personagem dentro da Jikkai" /></div>
          </div>
          <div className="p-3 rounded border border-yellow-900/40 bg-yellow-950/10 text-yellow-600 text-xs">Codinome, patente, ramo, nível de acesso e posição hierárquica são definidos pela liderança.</div>
          {erro && <div className="p-3 rounded border border-red-800 bg-red-950/30 text-red-300 text-sm">{erro}</div>}
        </div>
        <div className="p-5 border-t border-zinc-800 flex justify-end gap-2 sticky bottom-0 bg-zinc-950">
          <Btn onClick={onClose} variant="ghost" disabled={salvando}>Cancelar</Btn>
          <Btn onClick={salvar} variant="primary" disabled={salvando}>{salvando ? "Salvando..." : <><ISave className="w-3 h-3" /> Salvar dossiê</>}</Btn>
        </div>
      </div>
    </div>
  );
}

function EstruturaSection({ data, onOpen }) {
  const membros = (data.users || []).filter(u => u.role !== "contratante" && u.status !== "Oculto");
  const lideranca = membros.filter(u => data.roles.find(r => r.id === u.role)?.hasLeaderPerms === true || u.estruturaNivel === "lideranca");
  const conselho = membros.filter(u => !lideranca.includes(u) && (u.role === "conselheiro" || u.estruturaNivel === "conselho" || /conselh/i.test(data.roles.find(r => r.id === u.role)?.nome || "")));
  const alocados = new Set([...lideranca, ...conselho].map(u => u.username));
  const divisoes = (data.clas || []).map(c => ({ ...c, membros: membros.filter(u => !alocados.has(u.username) && u.cla === c.id) })).filter(c => c.membros.length);
  const semDivisao = membros.filter(u => !alocados.has(u.username) && !u.cla);

  const Linha = () => <div className="h-8 w-px bg-gradient-to-b from-orange-700 to-zinc-800 mx-auto" aria-hidden="true" />;
  return (
    <div className="fadein space-y-10">
      <div className="text-center">
        <div className="text-[10px] uppercase tracking-[0.4em] text-orange-600">Estrutura de comando</div>
        <h3 className="text-2xl font-black text-orange-50 serif mt-1">Hierarquia da Jikkai</h3>
        <p className="text-zinc-600 text-sm mt-2">A árvore é formada automaticamente pelos cargos, ramos e designações dos dossiês.</p>
      </div>

      <section>
        <div className="text-center text-[10px] uppercase tracking-[0.3em] text-orange-500 mb-4">Liderança</div>
        <div className="flex flex-wrap justify-center gap-4">{lideranca.map(u => <OrganogramaCard key={u.username} membro={u} data={data} onOpen={onOpen} destaque />)}</div>
        {(conselho.length > 0 || divisoes.length > 0 || semDivisao.length > 0) && <Linha />}
      </section>

      {conselho.length > 0 && (
        <section>
          <div className="text-center text-[10px] uppercase tracking-[0.3em] text-red-500 mb-4">Conselho</div>
          <div className="flex flex-wrap justify-center gap-4">{conselho.map(u => <OrganogramaCard key={u.username} membro={u} data={data} onOpen={onOpen} />)}</div>
          {(divisoes.length > 0 || semDivisao.length > 0) && <Linha />}
        </section>
      )}

function TriosSection({ data, setData, podeEditar }) {

  const usuarios = (data.users || []).filter(u => u.role !== "contratante");
  const salvar = () => {
    const limpos = draft.filter(t => t.nome.trim()).map(t => ({ ...t, id: t.id || `trio_${slugEstrutura(t.nome) || uid()}`, membros: (t.membros || []).filter(m => m.username || m.nome) }));
    setData(d => ({ ...d, trios: limpos, activityLog: [...(d.activityLog || []), atividade("trios_atualizados", "lideranca", "trios", "Atualizou a composição das células operacionais")] }));
    setEditando(false);
  };
  const cancelar = () => { setDraft(data.trios || []); setEditando(false); };
  const updateTrio = (i, patch) => setDraft(draft.map((t, idx) => idx === i ? { ...t, ...patch } : t));

  const removeMembro = (ti, mi) => updateTrio(ti, { membros: (draft[ti].membros || []).filter((_, idx) => idx !== mi) });
  const addMembro = ti => updateTrio(ti, { membros: [...(draft[ti].membros || []), { username: "", papel: "Operador" }] });
  const trios = editando ? draft : (data.trios || []);

    <div className="fadein">

            <div className="p-4" style={{ background: `linear-gradient(135deg, ${t.cor}, #000)` }}>

            </div>

              {(t.membros || []).map((m, mi) => {
                const u = data.users.find(x => x.username === m.username) || usuarioPorIdentidade(data.users, m.nome);
                return editando ? (
                  <div key={mi} className="border-l-2 pl-3 py-2 space-y-2" style={{ borderColor: t.cor }}>
                    <select value={m.username || ""} onChange={e => updateMembro(ti, mi, { username: e.target.value, nome: "", elemento: "" })} className="fox-input"><option value="">— Selecionar membro —</option>{usuarios.map(user => <option key={user.username} value={user.username}>{getCodinome(user)} · @{user.username}</option>)}</select>

const OBJETIVO_STATUS_CFG = {
  nao_iniciado: { label: "Não iniciado", cor: "#71717A", badge: "bg-zinc-900 text-zinc-400 border-zinc-700" },
  preparacao: { label: "Em preparação", cor: "#2563EB", badge: "bg-blue-950 text-blue-300 border-blue-800" },
  andamento: { label: "Em andamento", cor: "#EA580C", badge: "bg-orange-950 text-orange-300 border-orange-800" },
  parcial: { label: "Parcial", cor: "#CA8A04", badge: "bg-yellow-950 text-yellow-300 border-yellow-800" },
  bloqueado: { label: "Bloqueado", cor: "#DC2626", badge: "bg-red-950 text-red-300 border-red-800" },
  concluido: { label: "Concluído", cor: "#16A34A", badge: "bg-green-950 text-green-300 border-green-800" },
  fracassado: { label: "Fracassado", cor: "#7F1D1D", badge: "bg-red-950 text-red-400 border-red-900" },
  cancelado: { label: "Cancelado", cor: "#52525B", badge: "bg-zinc-950 text-zinc-600 border-zinc-800" },
};

const FASE_STATUS_CFG = {
  planejada: { label: "Planejada", cor: "#71717A", badge: "bg-zinc-900 text-zinc-400 border-zinc-700" },
  bloqueada: { label: "Bloqueada", cor: "#B91C1C", badge: "bg-red-950 text-red-300 border-red-800" },
  andamento: { label: "Em operação", cor: "#EA580C", badge: "bg-orange-950 text-orange-300 border-orange-800" },
  concluida: { label: "Concluída", cor: "#16A34A", badge: "bg-green-950 text-green-300 border-green-800" },
  suspensa: { label: "Suspensa", cor: "#CA8A04", badge: "bg-yellow-950 text-yellow-300 border-yellow-800" },
};

const RISCO_CFG = {
  Baixo: { indice: 1, cor: "#16A34A", badge: "bg-green-950 text-green-300 border-green-800" },
  Moderado: { indice: 2, cor: "#CA8A04", badge: "bg-yellow-950 text-yellow-300 border-yellow-800" },
  Elevado: { indice: 3, cor: "#EA580C", badge: "bg-orange-950 text-orange-300 border-orange-800" },
  Crítico: { indice: 4, cor: "#DC2626", badge: "bg-red-950 text-red-300 border-red-800" },
};

const PRIORIDADE_PESO = { Secundária: 1, Normal: 2, Importante: 3, Crítica: 5 };
const FONTE_ESTRATEGICA_CFG = {
  relatorio: { label: "Relatório", cor: "#A855F7" },
  mapa: { label: "Mapa", cor: "#38BDF8" },
  missao: { label: "Missão", cor: "#EA580C" },
  contrato: { label: "Contrato", cor: "#EF4444" },
  objetivo: { label: "Objetivo", cor: "#F59E0B" },
  comando: { label: "Comando", cor: "#F97316" },
};

function normalizarRisco(valor) {
  const v = String(valor || "").toLowerCase();
  if (v.includes("crít") || v.includes("letal")) return "Crítico";
  if (v.includes("alta") || v.includes("elev")) return "Elevado";
  if (v.includes("méd") || v.includes("moder")) return "Moderado";
  return RISCO_CFG[valor] ? valor : "Baixo";
}

function normalizarStatusObjetivo(status, done = false) {
  if (done) return "concluido";
  const mapa = { pendente: "nao_iniciado", andamento: "andamento", concluida: "concluido", concluido: "concluido" };
  return OBJETIVO_STATUS_CFG[status] ? status : (mapa[status] || "nao_iniciado");
}

function normalizarObjetivoEstrategico(obj, fase, index) {
  const status = normalizarStatusObjetivo(obj.status, obj.done);
  const progressoPadrao = status === "concluido" ? 100 : status === "parcial" ? 50 : status === "andamento" ? 25 : 0;
  const prioridade = PRIORIDADE_PESO[obj.prioridade] ? obj.prioridade : "Normal";
  return {
    id: obj.id || "obj_" + (fase.id || fase.n) + "_" + (index + 1),
    titulo: obj.titulo || obj.text || "Objetivo " + (index + 1),
    descricao: obj.descricao || "",
    status,
    progresso: Math.max(0, Math.min(100, Number(obj.progresso ?? progressoPadrao))),
    prioridade,
    peso: Number(obj.peso) || PRIORIDADE_PESO[prioridade],
    responsavel: obj.responsavel || "",
    apoioTipo: obj.apoioTipo || "",
    apoioId: obj.apoioId || "",
    prazo: obj.prazo || "",
    prazoTipo: obj.prazoTipo || "sem_prazo",
    risco: normalizarRisco(obj.risco || "Baixo"),
    bloqueio: obj.bloqueio || "",
    recursos: Array.isArray(obj.recursos) ? obj.recursos : (obj.recursosTexto ? String(obj.recursosTexto).split("\n").filter(Boolean) : []),
    missaoId: obj.missaoId || "",
    relatorioId: obj.relatorioId || "",
    contratoId: obj.contratoId || "",
    mapaId: obj.mapaId || "",
    observacoes: obj.observacoes || "",
    atualizadaEm: obj.atualizadaEm || "",
  };
}

function normalizarFaseEstrategica(fase, index) {
  const id = fase.id || "fase_" + (fase.n || index + 1);
  const base = { ...fase, id };
  const objetivos = (fase.objetivos || []).map((o, i) => normalizarObjetivoEstrategico(o, base, i));
  const statusLegado = { pendente: index === 0 ? "andamento" : "planejada", andamento: "andamento", concluida: "concluida" };
  return {
    ...fase,
    id,
    n: Number(fase.n) || index + 1,
    titulo: fase.titulo || "Fase " + (index + 1),
    desc: fase.desc || fase.descricao || "",
    status: FASE_STATUS_CFG[fase.status] ? fase.status : (statusLegado[fase.status] || "planejada"),
    objetivos,
    responsavelGeral: fase.responsavelGeral || "",
    prazo: fase.prazo || "",
    prazoTipo: fase.prazoTipo || "sem_prazo",
    riscoGeral: normalizarRisco(fase.riscoGeral || "Baixo"),
    progressoManualAtivo: Boolean(fase.progressoManualAtivo),
    progressoManual: Math.max(0, Math.min(100, Number(fase.progressoManual) || 0)),
    requisitos: Array.isArray(fase.requisitos) ? fase.requisitos.map((r, i) => typeof r === "string" ? { id: "req_" + id + "_" + i, texto: r, atendido: false } : { id: r.id || "req_" + id + "_" + i, texto: r.texto || r.text || "Requisito", atendido: Boolean(r.atendido) }) : [],
    atualizadaEm: fase.atualizadaEm || "",
  };
}

function progressoObjetivo(obj) {
  if (obj.status === "concluido") return 100;
  if (obj.status === "cancelado") return 0;
  return Math.max(0, Math.min(100, Number(obj.progresso) || 0));
}

function progressoFase(fase) {
  if (fase.progressoManualAtivo) return Math.max(0, Math.min(100, Number(fase.progressoManual) || 0));
  const objetivos = fase.objetivos || [];
  if (!objetivos.length) return fase.status === "concluida" ? 100 : 0;
  const pesoTotal = objetivos.reduce((s, o) => s + Math.max(1, Number(o.peso) || 1), 0);
  return Math.round(objetivos.reduce((s, o) => s + progressoObjetivo(o) * Math.max(1, Number(o.peso) || 1), 0) / pesoTotal);
}

function progressoGeralJikkai(fases) {
  const validas = fases || [];
  if (!validas.length) return 0;
  return Math.round(validas.reduce((s, f) => s + progressoFase(f), 0) / validas.length);
}

function prazoAtrasado(prazo, status) {
  if (!prazo || ["concluido", "concluida", "cancelado"].includes(status)) return false;
  const data = new Date(prazo + (String(prazo).length === 10 ? "T23:59:59" : ""));
  return !Number.isNaN(data.getTime()) && data.getTime() < Date.now();
}

function fonteLabel(tipo) {
  return FONTE_ESTRATEGICA_CFG[tipo] || FONTE_ESTRATEGICA_CFG.comando;
}

function coletarSinaisEstrategicos(data) {
  const sinais = [];
  const add = sinal => {
    if (!sinal?.titulo) return;
    sinais.push({
      id: sinal.id || "sinal_" + sinal.fonteTipo + "_" + (sinal.fonteId || uid()),
      titulo: sinal.titulo,
      descricao: sinal.descricao || "",
      risco: normalizarRisco(sinal.risco || "Moderado"),
      categoria: sinal.categoria || "Operacional",
      fonteTipo: sinal.fonteTipo || "comando",
      fonteId: sinal.fonteId || "",
      fonteNome: sinal.fonteNome || "",
      faseId: sinal.faseId || "",
      objetivoId: sinal.objetivoId || "",
      status: sinal.status || "ativo",
      criadoEm: sinal.criadoEm || sinal.data || "",
    });
  };

  (data.sinaisEstrategicos || []).filter(s => s.status !== "resolvido").forEach(s => add(s));
  (data.relatorios || []).filter(r => r.alertaJikkai && r.statusAlerta !== "resolvido").forEach(r => add({
    id: "relatorio_" + r.id,
    titulo: r.titulo,
    descricao: r.resumoEstrategico || r.descricao,
    risco: r.riscoJikkai || "Moderado",
    categoria: r.categoriaJikkai || "Inteligência",
    fonteTipo: "relatorio",
    fonteId: r.id,
    fonteNome: r.titulo,
    faseId: r.faseId,
    objetivoId: r.objetivoId,
    criadoEm: r.data,
  }));

  [...(data.mapaPontos || []), ...(data.mapaRotas || [])].forEach(item => {
    const texto = ((item.status || "") + " " + (item.desc || "")).toLowerCase();
    const automatico = item.alertaJikkai || item.type === "risco" || ["Alta", "Crítica"].includes(item.threat) || /compromet|hostil|bloquead|ameaça|perdido/.test(texto);
    if (!automatico || item.statusAlerta === "resolvido") return;
    add({
      id: "mapa_" + (item.kind || "point") + "_" + item.id,
      titulo: item.alertaTitulo || item.name,
      descricao: item.desc || "Situação: " + (item.status || "não informada") + ".",
      risco: item.riscoJikkai || item.threat,
      categoria: item.categoriaJikkai || "Territorial",
      fonteTipo: "mapa",
      fonteId: item.id,
      fonteNome: item.name,
      faseId: item.faseId,
      objetivoId: item.objetivoId,
      criadoEm: item.updatedAt || item.createdAt || data.mapaAtualizadoEm,
    });
  });

  (data.missoes || []).filter(m => m.status === "falhou").forEach(m => add({
    id: "missao_" + m.id,
    titulo: "Operação fracassada: " + m.titulo,
    descricao: m.relatorio?.resumo || m.desc,
    risco: "Elevado",
    categoria: "Operacional",
    fonteTipo: "missao",
    fonteId: m.id,
    fonteNome: m.titulo,
    faseId: m.faseId,
    objetivoId: m.objetivoId,
    criadoEm: m.updatedAt || m.createdAt,
  }));

  (data.contratos || []).filter(c => c.status === "Falhou" && (c.faseId || c.objetivoId)).forEach(c => add({
    id: "contrato_" + c.id,
    titulo: "Contrato fracassado: " + c.titulo,
    descricao: c.descricaoCurta || c.descricao,
    risco: "Elevado",
    categoria: "Operacional",
    fonteTipo: "contrato",
    fonteId: c.id,
    fonteNome: c.titulo,
    faseId: c.faseId,
    objetivoId: c.objetivoId,
    criadoEm: c.criadoEm,
  }));

  (data.fases || []).forEach(f => (f.objetivos || []).forEach(o => {
    if (o.status === "bloqueado" || prazoAtrasado(o.prazo, o.status) || RISCO_CFG[normalizarRisco(o.risco)].indice >= 3) {
      add({
        id: "objetivo_" + o.id,
        titulo: o.status === "bloqueado" ? "Objetivo bloqueado: " + o.titulo : prazoAtrasado(o.prazo, o.status) ? "Objetivo atrasado: " + o.titulo : "Risco em objetivo: " + o.titulo,
        descricao: o.bloqueio || o.observacoes || o.descricao,
        risco: o.risco || (o.status === "bloqueado" ? "Elevado" : "Moderado"),
        categoria: "Planejamento",
        fonteTipo: "objetivo",
        fonteId: o.id,
        fonteNome: o.titulo,
        faseId: f.id,
        objetivoId: o.id,
        criadoEm: o.atualizadaEm,
      });
    }
  }));

  const ordem = { Crítico: 4, Elevado: 3, Moderado: 2, Baixo: 1 };
  return sinais.sort((a, b) => (ordem[b.risco] || 0) - (ordem[a.risco] || 0) || new Date(b.criadoEm || 0) - new Date(a.criadoEm || 0));
}

function normalizarSigilo(valor) {
  if (valor === "Interno") return "Restrito";
  return SIGILO_CFG[valor] ? valor : "Restrito";
}

function sigiloConfig(sigilo) {
  return SIGILO_CFG[normalizarSigilo(sigilo)];
}

function usuarioTemJuramento(data, usuario) {
  if (!usuario) return false;
  return (data?.juramentados || []).some(j =>
    j.username === usuario.username ||
    (j.nome || "").toLowerCase() === (usuario.displayName || "").toLowerCase()
  );
}

function nivelAcessoUsuario(data, usuario, roleInformado = null) {
  if (!usuario) return 0;
  const role = roleInformado || data?.roles?.find(r => r.id === usuario.role);
  if (role?.hasLeaderPerms === true) return 4;
  if (usuario.role === "contratante") return 1;
  if (usuario.role === "conselheiro" || ["soke", "bunke"].includes(usuario.cla)) return 3;
  if (usuarioTemJuramento(data, usuario)) return 2;
  return 1;
}

function podeVerSigilo(sigilo, data, usuario, role = null) {
  return nivelAcessoUsuario(data, usuario, role) >= sigiloConfig(sigilo).nivel;
}

function podeReceberSigilo(data, usuario, sigilo) {
  const role = data?.roles?.find(r => r.id === usuario?.role);
  return podeVerSigilo(sigilo, data, usuario, role);
}

function podeVerItemSigiloso(item, data, usuario, role = null) {
  if (!item || !usuario) return false;
  const sigilo = normalizarSigilo(item.sigilo || item.confidencialidade);
  if (podeVerSigilo(sigilo, data, usuario, role)) return true;
  if (usuarioParticipaMissao(item, usuario.username)) return true;
  if (item.autorUsername === usuario.username) return true;
  if (item.missaoId) {
    const missao = (data?.missoes || []).find(m => m.id === item.missaoId);
    if (missao && usuarioParticipaMissao(missao, usuario.username)) return true;
  }
  return false;
}

function niveisPermitidosPara(data, usuario, role = null) {
  const nivel = nivelAcessoUsuario(data, usuario, role);
  return SIGILO_NIVEIS.filter(s => SIGILO_CFG[s].nivel <= nivel);
}

    <div className="p-4 rounded-xl border border-zinc-800 bg-zinc-950/60">
      <div className="flex items-center justify-between gap-3 mb-3"><div><div className="text-[9px] uppercase tracking-[0.25em] text-orange-600">Desbloqueio</div><div className="text-zinc-600 text-xs">Condições exigidas para avançar no plano.</div></div><Btn onClick={addReq} variant="ghost"><IPlus className="w-3 h-3" /> Requisito</Btn></div>
      <div className="space-y-2">{draft.requisitos.map((r, i) => <div key={r.id || i} className="flex items-center gap-2"><input type="checkbox" checked={r.atendido} onChange={e => setDraft(d => ({ ...d, requisitos: d.requisitos.map((x, index) => index === i ? { ...x, atendido: e.target.checked } : x) }))} className="accent-green-600" /><input value={r.texto} onChange={e => setDraft(d => ({ ...d, requisitos: d.requisitos.map((x, index) => index === i ? { ...x, texto: e.target.value } : x) }))} className="fox-input flex-1" /><button onClick={() => setDraft(d => ({ ...d, requisitos: d.requisitos.filter((_, index) => index !== i) }))} className="text-red-500"><ITrash className="w-4 h-4" /></button></div>)}</div>
    </div>

    <div className="space-y-3">
      <div className="flex items-center justify-between"><div><div className="text-[9px] uppercase tracking-[0.25em] text-orange-600">Objetivos estratégicos</div><div className="text-zinc-600 text-xs">O peso e o progresso definem a porcentagem automática da fase.</div></div><Btn onClick={addObj} variant="primary"><IPlus className="w-3 h-3" /> Objetivo</Btn></div>
      {draft.objetivos.map((o, i) => <div key={o.id || i} className="p-4 rounded-xl border border-zinc-800 bg-black/40 space-y-3">
        <div className="flex gap-2"><input value={o.titulo} onChange={e => updateObj(i, { titulo: e.target.value })} className="fox-input flex-1 font-bold" /><button onClick={() => removeObj(i)} className="text-red-500"><ITrash className="w-4 h-4" /></button></div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-2">
          <div><label className="fox-label">Status</label><select value={o.status} onChange={e => updateObj(i, { status: e.target.value, progresso: e.target.value === "concluido" ? 100 : o.progresso })} className="fox-input">{Object.entries(OBJETIVO_STATUS_CFG).map(([id, c]) => <option key={id} value={id}>{c.label}</option>)}</select></div>
          <div><label className="fox-label">Progresso %</label><input type="number" min="0" max="100" value={o.progresso} onChange={e => updateObj(i, { progresso: Number(e.target.value) })} className="fox-input" /></div>
          <div><label className="fox-label">Prioridade</label><select value={o.prioridade} onChange={e => updateObj(i, { prioridade: e.target.value, peso: PRIORIDADE_PESO[e.target.value] })} className="fox-input">{Object.keys(PRIORIDADE_PESO).map(p => <option key={p}>{p}</option>)}</select></div>
          <div><label className="fox-label">Risco</label><select value={o.risco} onChange={e => updateObj(i, { risco: e.target.value })} className="fox-input">{Object.keys(RISCO_CFG).map(r => <option key={r}>{r}</option>)}</select></div>
        </div>
        <div className="grid sm:grid-cols-2 gap-2">
          <div><label className="fox-label">Responsável</label><select value={o.responsavel || ""} onChange={e => updateObj(i, { responsavel: e.target.value })} className="fox-input"><option value="">— Não designado —</option><optgroup label="Membros">{users.map(u => <option key={u.username} value={u.username}>{getCodinome(u)}</option>)}</optgroup><optgroup label="Ramos">{ramos.map(r => <option key={r.id} value={"ramo:" + r.id}>Ramo · {r.nome}</option>)}</optgroup></select></div>
          <div><label className="fox-label">Prazo</label><input type="date" value={o.prazo || ""} onChange={e => updateObj(i, { prazo: e.target.value })} className="fox-input" /></div>

        <div><label className="fox-label">Descrição</label><textarea rows="2" value={o.descricao || ""} onChange={e => updateObj(i, { descricao: e.target.value })} className="fox-input" /></div>

        <div><label className="fox-label">Recursos necessários — um por linha</label><textarea rows="2" value={o.recursosTexto || ""} onChange={e => updateObj(i, { recursosTexto: e.target.value })} className="fox-input" /></div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-2">
          <div><label className="fox-label">Missão</label><select value={o.missaoId || ""} onChange={e => updateObj(i, { missaoId: e.target.value })} className="fox-input"><option value="">Nenhuma</option>{(data.missoes || []).map(m => <option key={m.id} value={m.id}>{m.titulo}</option>)}</select></div>
          <div><label className="fox-label">Relatório</label><select value={o.relatorioId || ""} onChange={e => updateObj(i, { relatorioId: e.target.value })} className="fox-input"><option value="">Nenhum</option>{(data.relatorios || []).map(r => <option key={r.id} value={r.id}>{r.titulo}</option>)}</select></div>
          <div><label className="fox-label">Contrato</label><select value={o.contratoId || ""} onChange={e => updateObj(i, { contratoId: e.target.value })} className="fox-input"><option value="">Nenhum</option>{(data.contratos || []).map(c => <option key={c.id} value={c.id}>{c.titulo}</option>)}</select></div>
          <div><label className="fox-label">Mapa</label><select value={o.mapaId || ""} onChange={e => updateObj(i, { mapaId: e.target.value })} className="fox-input"><option value="">Nenhum</option>{[...(data.mapaPontos || []), ...(data.mapaRotas || [])].map(x => <option key={x.id} value={x.id}>{x.name}</option>)}</select></div>
        </div>
      </div>)}
    </div>
    <div className="flex gap-2 pt-4 border-t border-zinc-800"><Btn onClick={onCancel} variant="ghost">Cancelar</Btn><Btn onClick={salvar} variant="primary"><ISave className="w-3 h-3" /> Salvar fase</Btn></div>
  </div>;
}

function OperacaoRelacionada({ tipo, id, data }) {
  if (!id) return null;
  const colecao = tipo === "missao" ? data.missoes : tipo === "relatorio" ? data.relatorios : tipo === "contrato" ? data.contratos : [...(data.mapaPontos || []), ...(data.mapaRotas || [])];
  const item = (colecao || []).find(x => x.id === id);
  if (!item) return null;
  return <div className="flex items-center gap-2 p-2 rounded border border-zinc-800 bg-black/40"><FonteEstrategicaBadge tipo={tipo} /><span className="text-zinc-400 text-xs truncate">{item.titulo || item.name}</span></div>;
}

function ObjetivoEstrategicoCard({ objetivo, data, isLider, onEdit }) {
  const responsavelLabel = nomeResponsavelEstrategico(objetivo.responsavel, data);
  const progresso = progressoObjetivo(objetivo);
  const atrasado = prazoAtrasado(objetivo.prazo, objetivo.status);
  return <div className={"p-4 rounded-xl border " + (objetivo.status === "bloqueado" ? "border-red-800 bg-red-950/10" : "border-zinc-800 bg-zinc-950/50")}>
    <div className="flex items-start justify-between gap-3"><div className="min-w-0"><div className="flex flex-wrap items-center gap-2"><ObjetivoStatusBadge status={objetivo.status} /><RiscoBadge risco={objetivo.risco} compacto />{atrasado && <span className="text-[9px] text-red-400 uppercase font-black">Atrasado</span>}</div><h3 className="text-orange-50 font-bold mt-2">{objetivo.titulo}</h3><p className="text-zinc-500 text-sm mt-1">{objetivo.descricao}</p></div>{isLider && <button onClick={onEdit} className="text-zinc-600 hover:text-orange-400"><IEdit className="w-4 h-4" /></button>}</div>
    <div className="flex items-center justify-between text-[10px] uppercase tracking-wider mt-3"><span className="text-zinc-600">Progresso</span><span className="text-orange-300 font-black">{progresso}%</span></div><div className="h-1.5 bg-zinc-900 rounded overflow-hidden mt-1"><div className="h-full bg-gradient-to-r from-orange-700 to-red-600" style={{ width: progresso + "%" }} /></div>
    <div className="grid sm:grid-cols-2 gap-2 text-xs mt-3"><div className="text-zinc-600">Responsável: <span className="text-zinc-300">{responsavelLabel}</span></div><div className="text-zinc-600">Prazo: <span className={atrasado ? "text-red-400" : "text-zinc-300"}>{objetivo.prazo ? new Date(objetivo.prazo + "T00:00:00").toLocaleDateString("pt-BR") : "Sem prazo"}</span></div></div>
    {objetivo.bloqueio && <div className="mt-3 p-3 rounded border border-red-900/50 bg-red-950/20 text-red-300 text-xs"><strong>Bloqueio:</strong> {objetivo.bloqueio}</div>}
    {objetivo.recursos?.length > 0 && <div className="mt-3 flex flex-wrap gap-1">{objetivo.recursos.map((r, i) => <span key={i} className="text-[10px] px-2 py-1 rounded border border-zinc-800 bg-black/50 text-zinc-400">{r}</span>)}</div>}
    <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-1 mt-3"><OperacaoRelacionada tipo="missao" id={objetivo.missaoId} data={data} /><OperacaoRelacionada tipo="relatorio" id={objetivo.relatorioId} data={data} /><OperacaoRelacionada tipo="contrato" id={objetivo.contratoId} data={data} /><OperacaoRelacionada tipo="mapa" id={objetivo.mapaId} data={data} /></div>
  </div>;
}

function FaseEstrategicaCard({ fase, data, isLider, onOpen, onEdit }) {
  const progresso = progressoFase(fase);
  const cfg = FASE_STATUS_CFG[fase.status] || FASE_STATUS_CFG.planejada;
  const objetivos = fase.objetivos || [];
  const concluidos = objetivos.filter(o => o.status === "concluido").length;
  const bloqueados = objetivos.filter(o => o.status === "bloqueado").length;
  const responsavelLabel = nomeResponsavelEstrategico(fase.responsavelGeral, data);
  return <div className="rounded-2xl border bg-gradient-to-br from-zinc-950 to-black overflow-hidden" style={{ borderColor: cfg.cor + "70" }}>
    <div className="p-5"><div className="flex items-start justify-between gap-3"><div><div className="text-[9px] uppercase tracking-[0.3em]" style={{ color: cfg.cor }}>Fase {String(fase.n).padStart(2, "0")}</div><h3 className="text-xl font-black text-orange-50 serif mt-1">{fase.titulo}</h3><div className="flex flex-wrap gap-2 mt-2"><span className={"text-[9px] px-2 py-0.5 rounded border uppercase font-black " + cfg.badge}>{cfg.label}</span><RiscoBadge risco={fase.riscoGeral} compacto /></div></div>{isLider && <button onClick={onEdit} className="text-zinc-600 hover:text-orange-400"><IEdit className="w-4 h-4" /></button>}</div><p className="text-zinc-500 text-sm mt-3">{fase.desc}</p>
      <div className="flex justify-between text-[10px] uppercase tracking-wider mt-4"><span className="text-zinc-600">Progresso</span><span className="text-orange-300 font-black">{progresso}%</span></div><div className="h-2 bg-zinc-900 rounded overflow-hidden mt-1"><div className="h-full bg-gradient-to-r from-red-700 to-orange-500" style={{ width: progresso + "%" }} /></div>
    </div>
    <div className="grid grid-cols-3 divide-x divide-zinc-800 text-center border-y border-zinc-800"><div className="p-3"><div className="text-xl font-black text-green-400">{concluidos}</div><div className="text-[9px] uppercase text-zinc-600">Concluídos</div></div><div className="p-3"><div className="text-xl font-black text-red-400">{bloqueados}</div><div className="text-[9px] uppercase text-zinc-600">Bloqueados</div></div><div className="p-3"><div className="text-xl font-black text-orange-300">{objetivos.length}</div><div className="text-[9px] uppercase text-zinc-600">Total</div></div></div>
    <div className="p-4 text-xs"><div className="text-zinc-600">Responsável: <span className="text-zinc-300">{responsavelLabel}</span></div><button onClick={onOpen} className="w-full mt-3 py-2.5 rounded bg-orange-700 hover:bg-orange-600 text-white uppercase tracking-wider text-[10px] font-black">Abrir sala estratégica</button></div>
  </div>;
}

function SinalEstrategicoCard({ sinal, data, onOpenPhase, onOpenMap }) {
  const fase = data.fases.find(f => f.id === sinal.faseId);
  return <div className={"p-4 rounded-xl border " + (sinal.risco === "Crítico" ? "border-red-700 bg-red-950/20" : sinal.risco === "Elevado" ? "border-orange-700 bg-orange-950/10" : "border-zinc-800 bg-zinc-950/50")}><div className="flex items-start justify-between gap-3"><div><div className="flex flex-wrap gap-2"><RiscoBadge risco={sinal.risco} /><FonteEstrategicaBadge tipo={sinal.fonteTipo} /><span className="text-[9px] uppercase tracking-wider text-zinc-600">{sinal.categoria}</span></div><div className="text-orange-50 font-bold mt-2">{sinal.titulo}</div><p className="text-zinc-500 text-xs mt-1">{sinal.descricao}</p>{fase && <div className="text-[10px] text-zinc-600 mt-2">Afeta: Fase {fase.n} · {fase.titulo}</div>}</div><div>{sinal.fonteTipo === "mapa" ? <button onClick={onOpenMap} className="text-sky-400 text-[10px] uppercase">Mapa</button> : sinal.faseId && <button onClick={() => onOpenPhase(sinal.faseId)} className="text-orange-400 text-[10px] uppercase">Fase</button>}</div></div></div>;
}


// ============ RELATÓRIOS DE INTELIGÊNCIA ============
const CONFID_CFG = SIGILO_CFG;

function RelatorioModal({ relatorio, onSave, onClose, niveisPermitidos = SIGILO_NIVEIS, data }) {
  const editando = !!relatorio?.id;
  const [titulo, setTitulo] = useState(relatorio?.titulo || "");
  const [local, setLocal] = useState(relatorio?.local || "");
  const [descricao, setDescricao] = useState(relatorio?.descricao || "");
  const [confidencialidade, setConfid] = useState(normalizarSigilo(relatorio?.confidencialidade || niveisPermitidos[Math.min(1, niveisPermitidos.length - 1)] || "Público"));
  const [alertaJikkai, setAlertaJikkai] = useState(Boolean(relatorio?.alertaJikkai));
  const [riscoJikkai, setRiscoJikkai] = useState(relatorio?.riscoJikkai || "Moderado");
  const [categoriaJikkai, setCategoriaJikkai] = useState(relatorio?.categoriaJikkai || "Inteligência");
  const [faseId, setFaseId] = useState(relatorio?.faseId || "");
  const [objetivoId, setObjetivoId] = useState(relatorio?.objetivoId || "");
  const [resumoEstrategico, setResumoEstrategico] = useState(relatorio?.resumoEstrategico || "");
  const faseSelecionada = (data?.fases || []).find(f => f.id === faseId);

  const valido = titulo.trim() && descricao.trim();

  const salvar = () => {
    if (!valido) return;
    onSave({
      titulo: titulo.trim(),
      local: local.trim(),
      descricao: descricao.trim(),
      confidencialidade,
      alertaJikkai,
      riscoJikkai: alertaJikkai ? riscoJikkai : "",
      categoriaJikkai: alertaJikkai ? categoriaJikkai : "",
      faseId: alertaJikkai ? faseId : "",
      objetivoId: alertaJikkai ? objetivoId : "",
      resumoEstrategico: alertaJikkai ? resumoEstrategico.trim() : "",
      statusAlerta: alertaJikkai ? (relatorio?.statusAlerta || "ativo") : "",
    });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm fadein" onClick={onClose}>
      <div className="bg-zinc-950 border border-orange-700 rounded-lg shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
        <div className="p-5 border-b border-orange-900/50 flex items-center justify-between sticky top-0 bg-zinc-950 z-10">
          <div className="flex items-center gap-3">
            <IFile className="w-6 h-6 text-orange-500" />
            <h3 className="text-xl font-bold text-orange-50 serif">{editando ? "Editar Relatório" : "Novo Relatório de Inteligência"}</h3>
          </div>
          <button onClick={onClose} className="text-zinc-500 hover:text-red-400 p-1"><IX className="w-5 h-5" /></button>
        </div>
        <div className="p-5 space-y-4">
          <div>
            <label className="fox-label">Título *</label>
            <input value={titulo} onChange={(e) => setTitulo(e.target.value)} className="fox-input" placeholder="Ex: Movimentação suspeita em Kirigakure" autoFocus />
          </div>
          <div className="grid sm:grid-cols-2 gap-3">
            <div>
              <label className="fox-label">Local / Vila</label>
              <input value={local} onChange={(e) => setLocal(e.target.value)} className="fox-input" placeholder="Ex: Konohagakure, Fronteira Sul..." />
            </div>
            <div>
              <label className="fox-label">Confidencialidade</label>
              <select value={confidencialidade} onChange={(e) => setConfid(e.target.value)} className="fox-input">
                {niveisPermitidos.map(n => <option key={n}>{n}</option>)}
              </select>
              <div className="mt-2 text-[10px] text-zinc-600 leading-relaxed">
                {sigiloConfig(confidencialidade).codigo} — {sigiloConfig(confidencialidade).desc}
              </div>
            </div>
          </div>
          <div>
            <label className="fox-label">Descrição completa *</label>
            <textarea value={descricao} onChange={(e) => setDescricao(e.target.value)} rows="8" className="fox-input" placeholder="Detalhes da observação, contexto, possíveis implicações..." />
          </div>

          <div className={`rounded-lg border p-4 transition-colors ${alertaJikkai ? "border-red-800 bg-red-950/20" : "border-zinc-800 bg-black/30"}`}>
            <label className="flex items-start gap-3 cursor-pointer">
              <input type="checkbox" checked={alertaJikkai} onChange={e => setAlertaJikkai(e.target.checked)} className="mt-1 w-4 h-4 accent-red-600" />
              <div><div className="text-orange-50 font-bold text-sm">Gerar alerta no Painel JIKKAI</div><div className="text-zinc-600 text-xs mt-1">O painel exibirá este relatório como uma fonte rastreável de risco. Não marque relatórios comuns.</div></div>
            </label>
            {alertaJikkai && (
              <div className="grid sm:grid-cols-2 gap-3 mt-4 pt-4 border-t border-red-900/40 fadein">
                <div><label className="fox-label">Nível de risco</label><select value={riscoJikkai} onChange={e => setRiscoJikkai(e.target.value)} className="fox-input">{Object.keys(RISCO_CFG).map(r => <option key={r}>{r}</option>)}</select></div>
                <div><label className="fox-label">Categoria</label><select value={categoriaJikkai} onChange={e => setCategoriaJikkai(e.target.value)} className="fox-input"><option>Inteligência</option><option>Operacional</option><option>Político</option><option>Diplomático</option><option>Exposição</option><option>Financeiro</option><option>Pessoal</option><option>Desconhecido</option></select></div>
                <div><label className="fox-label">Fase afetada</label><select value={faseId} onChange={e => { setFaseId(e.target.value); setObjetivoId(""); }} className="fox-input"><option value="">— Plano geral —</option>{(data?.fases || []).map(f => <option key={f.id} value={f.id}>Fase {f.n} · {f.titulo}</option>)}</select></div>
                <div><label className="fox-label">Objetivo afetado</label><select value={objetivoId} onChange={e => setObjetivoId(e.target.value)} className="fox-input" disabled={!faseSelecionada}><option value="">— Toda a fase —</option>{(faseSelecionada?.objetivos || []).map(o => <option key={o.id} value={o.id}>{o.titulo}</option>)}</select></div>
                <div className="sm:col-span-2"><label className="fox-label">Resumo para a central de comando</label><textarea rows="3" value={resumoEstrategico} onChange={e => setResumoEstrategico(e.target.value)} className="fox-input" placeholder="Ex: Informante em Suna comprometido; interromper contato e revisar a rota de infiltração." /></div>
              </div>

        </div>
        <div className="p-5 border-t border-zinc-800 flex gap-2 justify-end sticky bottom-0 bg-zinc-950">
          <Btn onClick={onClose} variant="ghost"><IX className="w-3 h-3" /> Cancelar</Btn>
          <Btn onClick={salvar} variant="primary" disabled={!valido}><ISave className="w-3 h-3" /> {editando ? "Salvar Alterações" : "Enviar Relatório"}</Btn>
        </div>
      </div>
    </div>
  );
}

function RelatoriosSection({ data, setData, isLider, usuario, role }) {
  const [modal, setModal] = useState(null); // null | {} (criar) | {id, ...} (editar)
  const niveisPermitidos = niveisPermitidosPara(data, usuario, role);

  const relatorios = (data.relatorios || []).slice().sort((a, b) => new Date(b.data) - new Date(a.data));
  const relatoriosLiberados = relatorios.filter(r => podeVerItemSigiloso(r, data, usuario, role));

  const criar = (form) => {
    const novo = {
      id: uid(),
      ...form,
      autorUsername: usuario?.username || "?",
      autorNome: usuario?.displayName || usuario?.username || "Desconhecido",
      data: new Date().toISOString(),
    };
    setData(d => ({ ...d, relatorios: [...(d.relatorios || []), novo] }));
    setModal(null);
  };

  const editar = (form) => {
    setData(d => ({
      ...d,
      relatorios: (d.relatorios || []).map(r => r.id === modal.id ? { ...r, ...form, editadoEm: new Date().toISOString() } : r),
    }));
    setModal(null);
  };

  const deletar = (id) => {
    if (!confirm("Deletar este relatório? Esta ação não pode ser desfeita.")) return;
    setData(d => ({ ...d, relatorios: (d.relatorios || []).filter(r => r.id !== id) }));
  };

  return (
    <div className="fadein">
      <div className="flex items-center justify-between mb-6 gap-3 flex-wrap">
        <div className="border-l-4 border-orange-600 pl-4">
          <div className="flex items-center gap-3">
            <IFile className="w-6 h-6 text-orange-500" />
            <h2 className="text-2xl font-bold text-orange-50 tracking-wide serif">Relatórios de Inteligência</h2>
          </div>
          <p className="text-zinc-500 text-sm mt-1 italic">{relatoriosLiberados.length} liberados · {relatorios.length} registros no arquivo</p>
        </div>
        <Btn onClick={() => setModal({})} variant="primary"><IPlus className="w-3 h-3" /> Novo Relatório</Btn>
      </div>

      {relatorios.length === 0 && (
        <div className="p-8 text-center bg-zinc-950/50 border border-zinc-800 rounded-lg">
          <IFile className="w-12 h-12 text-zinc-700 mx-auto mb-3" />
          <p className="text-zinc-500">Nenhum relatório de inteligência ainda.</p>
          <p className="text-zinc-700 text-xs italic mt-2">Seja o primeiro a reportar.</p>
        </div>
      )}

      <div className="grid md:grid-cols-2 gap-4">
        {relatorios.map((r) => {
          const sigilo = normalizarSigilo(r.confidencialidade);
          const c = sigiloConfig(sigilo);
          const autorizado = podeVerItemSigiloso(r, data, usuario, role);
          if (!autorizado) return <ConteudoCensurado key={r.id} sigilo={sigilo} tipo="RELATÓRIO" />;
          return (
            <div key={r.id} className={`rounded-lg border ${c.border} ${c.bg} p-5 fadein hover:border-orange-600 transition-colors`}>
              <div className="flex items-start justify-between gap-2 mb-2">
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider border" style={{ color: c.cor, borderColor: c.cor + "80", background: c.cor + "20" }}>
                      {c.codigo} · {sigilo}
                    </span>
                    {r.tipo === "Operacional" && <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider bg-purple-950 text-purple-300 border border-purple-800">Operacional</span>}
                    {r.statusAprovacao && <span className="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider bg-zinc-900 text-zinc-400 border border-zinc-800">{r.statusAprovacao}</span>}
                    {r.alertaJikkai && <><FonteEstrategicaBadge tipo="relatorio" /><RiscoBadge risco={r.riscoJikkai} compacto /></>}
                    {r.local && <span className="text-zinc-500 text-xs uppercase tracking-wider">{r.local}</span>}
                  </div>
                  <h3 className="text-orange-50 font-bold text-lg serif leading-tight">{r.titulo}</h3>
                  {r.missaoId && (() => {
                    const missao = (data.missoes || []).find(m => m.id === r.missaoId);
                    return missao ? <div className="text-purple-400 text-xs mt-1">Missão vinculada: {missao.titulo}</div> : null;
                  })()}
                </div>
                {isLider && (
                  <div className="flex gap-1 flex-shrink-0">
                    <button onClick={() => setModal(r)} className="p-1.5 text-orange-400 hover:text-orange-300" title="Editar"><IEdit className="w-4 h-4" /></button>
                    <button onClick={() => deletar(r.id)} className="p-1.5 text-red-500 hover:text-red-400" title="Deletar"><ITrash className="w-4 h-4" /></button>
                  </div>
                )}
              </div>
              <p className="text-zinc-300 text-sm leading-relaxed whitespace-pre-wrap mt-3 mb-4">{r.descricao}</p>
              <div className="pt-3 border-t border-zinc-800/60 flex items-center justify-between text-xs text-zinc-600">
                <span>Por <strong className="text-orange-600">{r.autorNome}</strong></span>
                <span>{new Date(r.data).toLocaleString("pt-BR", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })}</span>
              </div>
              {r.editadoEm && <div className="text-[10px] text-zinc-700 italic mt-1">editado em {new Date(r.editadoEm).toLocaleDateString("pt-BR")}</div>}
            </div>
          );
        })}
      </div>

      {modal && (
        <RelatorioModal
          relatorio={modal.id ? modal : null}
          onSave={modal.id ? editar : criar}
          onClose={() => setModal(null)}
          niveisPermitidos={niveisPermitidos}
          data={data}
        />
      )}
    </div>
  );
}

  "Proposta":     { cor: "#A855F7", border: "border-purple-700", bg: "bg-purple-950/20", badge: "bg-purple-900 text-purple-300" },
  "Aberto":       { cor: "#16A34A", border: "border-green-700",  bg: "bg-green-950/20",  badge: "bg-green-900 text-green-300" },
  "Em Andamento": { cor: "#EA580C", border: "border-orange-700", bg: "bg-orange-950/20", badge: "bg-orange-700 text-black" },
  "Concluído":    { cor: "#16A34A", border: "border-green-800",  bg: "bg-green-950/20",  badge: "bg-green-900 text-green-300" },
  "Falhou":       { cor: "#B91C1C", border: "border-red-800",    bg: "bg-red-950/30",    badge: "bg-red-950 text-red-300" },

const DIFICULDADE_CFG = {
  "Fácil":      { cor: "#16A34A" },
  "Médio":      { cor: "#EAB308" },
