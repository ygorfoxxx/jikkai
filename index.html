const PORTAL_SESSION_KEY = "fox-portal-session-v2";
const MAP_RETURN_KEY = "fox-map-return-v2";
const PORTAL_SESSION_TTL_MS = 12 * 60 * 60 * 1000;
const REPORT_DRAFT_KEY = "fox-report-draft-v2";
const MAP_PICK_REQUEST_KEY = "fox-map-pick-request-v1";
const MAP_PICK_RESULT_KEY = "fox-map-pick-result-v1";

function parseSessaoPortal(raw) {
  if (!raw) return null;
  try {
    const payload = JSON.parse(raw);
    if (!payload?.username) return null;
    const updatedAt = Number(payload.updatedAtMs || new Date(payload.updatedAt || 0).getTime());
    if (updatedAt && Date.now() - updatedAt > PORTAL_SESSION_TTL_MS) return null;
    return payload;
  } catch {
    return null;
  }
}

function lerSessaoPortal() {
  try {
    return parseSessaoPortal(sessionStorage.getItem(PORTAL_SESSION_KEY))
      || parseSessaoPortal(localStorage.getItem(MAP_RETURN_KEY))
      || parseSessaoPortal(localStorage.getItem(PORTAL_SESSION_KEY));
  } catch {
    return null;
  }
}

function salvarSessaoPortalSnapshot({ usuario, tab = "home", navigationRequest = null } = {}) {
  if (!usuario?.username) return;
  const payload = {
    username: usuario.username,
    tab: tab || "home",
    subTab: navigationRequest?.subTab || "",
    action: navigationRequest?.action || "",
    updatedAt: new Date().toISOString(),
    updatedAtMs: Date.now(),
  };
  try { sessionStorage.setItem(PORTAL_SESSION_KEY, JSON.stringify(payload)); } catch {}
  try {
    localStorage.setItem(PORTAL_SESSION_KEY, JSON.stringify(payload));
    localStorage.setItem(MAP_RETURN_KEY, JSON.stringify(payload));
  } catch {}
}

function limparSessaoPortal() {
  try {
    sessionStorage.removeItem(PORTAL_SESSION_KEY);
    localStorage.removeItem(PORTAL_SESSION_KEY);
    localStorage.removeItem(MAP_RETURN_KEY);
    localStorage.removeItem(REPORT_DRAFT_KEY);
    localStorage.removeItem(MAP_PICK_REQUEST_KEY);
    localStorage.removeItem(MAP_PICK_RESULT_KEY);
    localStorage.removeItem("fox-map-viewer");
  } catch {}
}

function prepararRetornoMapa() {
  try {
    const raw = sessionStorage.getItem(PORTAL_SESSION_KEY) || localStorage.getItem(PORTAL_SESSION_KEY);
    if (raw) localStorage.setItem(MAP_RETURN_KEY, raw);
  } catch {}
}

const DEFAULT_DATA = {
  users: DEFAULT_USERS,
  roles: DEFAULT_ROLES,
  missoes: [],
  trios: DEFAULT_TRIOS,
  divisoes: DEFAULT_DIVISOES,
  fases: DEFAULT_FASES,
  armas: DEFAULT_ARMAS,
  clas: DEFAULT_CLAS,
  historia: DEFAULT_HISTORIA,
  mandamentos: DEFAULT_MANDAMENTOS,
  sokeFiguras: [],
  bunkeFiguras: [],
  juramentados: [],
  relatorios: [],
  contratos: [],
  galeria: [],
  codinomes: DEFAULT_CODINOMES,
  convitesEntrada: [],
  activityLog: [],
  discordDmTemplates: DEFAULT_DISCORD_DM_TEMPLATES,
  visaoGeralContratantes: {
    titulo: "JIKKAI — Sombras",
    subtitulo: "Discrição. Letalidade. Resultado.",
    descricao: "A Jikkai opera nas margens do mundo shinobi, executando contratos que vilas oficiais não podem aceitar. Cada operação é conduzida com sigilo absoluto, executores de elite e zero rastros.\n\nNossos serviços incluem: extração, eliminação, sabotagem, espionagem, escolta, recuperação de relíquias e operações especiais sob demanda.\n\nPara contratar nossos serviços, navegue até a aba JIKKAI e analise os contratos disponíveis ou aguarde contato direto com nossa liderança.",
  },
};

// Migra dados antigos garantindo que novos campos existam
function migrate(raw) {
  if (!raw || !raw.users) raw = DEFAULT_DATA;
  const migrated = { ...DEFAULT_DATA, ...raw };
  if (!raw.clas) {
    migrated.clas = [
      { ...DEFAULT_CLAS[0], figuras: raw.sokeFiguras || [] },
      { ...DEFAULT_CLAS[1], figuras: raw.bunkeFiguras || [] },
    ];
  }
  if (!raw.historia) migrated.historia = DEFAULT_HISTORIA;
  migrated.mandamentos = normalizarMandamentosJikkai(raw.mandamentos || migrated.mandamentos);
  if (!raw.relatorios) migrated.relatorios = [];
  migrated.relatorios = (raw.relatorios || []).map(r => ({
    ...r,
    confidencialidade: normalizarSigilo(r.confidencialidade || "Restrito"),
  }));
  if (!raw.contratos) migrated.contratos = [];
  if (!raw.galeria) migrated.galeria = [];
  if (!raw.activityLog) migrated.activityLog = [];
  migrated.discordDmTemplates = { ...DEFAULT_DISCORD_DM_TEMPLATES, ...(raw.discordDmTemplates || {}) };
  migrated.convitesEntrada = Array.isArray(raw.convitesEntrada) ? raw.convitesEntrada.map(c => ({
    id: c.id || "convite_" + uid(),
    token: normalizarTokenConvite(c.token || gerarTokenConvite()),
    tipo: c.tipo || "recruta",
    rolePadrao: c.rolePadrao || "recruta",
    nivelAcesso: Math.max(1, Math.min(5, Number(c.nivelAcesso) || 1)),
    status: c.status || "pendente",
    criadoPor: c.criadoPor || "leader",
    criadoEm: c.criadoEm || new Date().toISOString(),
    expiraEm: c.expiraEm || "",
    usadoPor: c.usadoPor || "",
    usadoEm: c.usadoEm || "",
    codinomeEscolhido: c.codinomeEscolhido || "",
    discordObrigatorio: c.discordObrigatorio !== false,
    categoriasLiberadas: Array.isArray(c.categoriasLiberadas) ? c.categoriasLiberadas : [],
    nomeConvidado: c.nomeConvidado || "",
    tituloConvidado: c.tituloConvidado || "",
    vilaConvidado: c.vilaConvidado || "",
    mensagemPersonalizada: c.mensagemPersonalizada || "",
    codinomeReservado: c.codinomeReservado || "",
    apresentacaoContratante: c.apresentacaoContratante !== false,
  })) : [];
  if (!raw.missoes) migrated.missoes = [];
  migrated.missoes = (raw.missoes || []).map(m => {
    const participants = Array.from(new Set([...(Array.isArray(m.participants) ? m.participants : []), m.assignedTo].filter(Boolean)));
    const status = m.status === "pendente" ? "atribuida" : (m.status || "atribuida");
    const jaEstavaEmExecucao = ["aceita", "andamento", "revisao", "devolvida", "concluida", "falhou", "arquivada"].includes(status);
    return {
      ...m,
      participants,
      aceites: Array.isArray(m.aceites) ? m.aceites : (jaEstavaEmExecucao ? participants : []),
      objetivos: Array.isArray(m.objetivos) ? m.objetivos : [],
      status,
      sigilo: normalizarSigilo(m.sigilo || "Restrito"),
      source: m.source || (m.contratoId ? "contrato" : "manual"),
      attributionType: m.attributionType || (m.equipeId ? "equipe" : (m.divisaoId ? "divisao" : "membro")),
      targetId: m.targetId || m.equipeId || m.divisaoId || m.assignedTo || "",
      divisaoId: m.divisaoId || "",
      equipeId: m.equipeId || "",
      assignmentLabel: m.assignmentLabel || "",
      fluxoObrigatorio: m.fluxoObrigatorio !== false,
    };
  });
  if (!raw.visaoGeralContratantes) migrated.visaoGeralContratantes = DEFAULT_DATA.visaoGeralContratantes;
  // Garante o formato completo do dossiê sem apagar campos antigos.
  migrated.users = (raw.users || DEFAULT_USERS).map(u => normalizarMembro({
    ...u,
    codinome: u.username === "leader" ? "VIPER" : (u.codinome != null ? u.codinome : ""),
    cla: u.cla != null ? u.cla : "",
  }, true));
  migrated.codinomes = normalizarBancoCodinomes(raw.codinomes || DEFAULT_CODINOMES, migrated.users);
  // Preserva juramentos antigos, normaliza os registros e reconhece quem já realizou o pacto.
  migrated.juramentados = (Array.isArray(raw.juramentados) ? raw.juramentados : []).map((j, index) => ({
    ...j,
    id: j.id || "juramento_legado_" + (j.username || slugEstrutura(j.nome) || index),
    fotoUrl: j.fotoUrl || "",
    versao: Number(j.versao) || 1,
    origem: j.origem || "legado",
    discordId: j.discordId || "",
    discordUsername: j.discordUsername || "",
    discordGlobalName: j.discordGlobalName || "",
    discordTag: j.discordTag || "",
    discordVerificado: Boolean(j.discordVerificado && j.discordId),
    discordVerificadoEm: j.discordVerificadoEm || "",
  }));
  migrated.users = migrated.users.map(u => {
    const juramentoExistente = juramentoDoUsuario(migrated.juramentados, u);
    if (!juramentoExistente) return u;
    const nivelAtual = lealdadeConfig(u.lealdade).indice;
    const nivelJuramentado = lealdadeConfig("Juramentado").indice;
    return {
      ...u,
      iniciacaoStatus: "concluida",
      iniciacaoConcluidaEm: u.iniciacaoConcluidaEm || juramentoExistente.data || new Date().toISOString(),
      iniciacaoVersao: Number(u.iniciacaoVersao) || 1,
      lealdade: nivelAtual < nivelJuramentado ? "Juramentado" : u.lealdade,
      lealdadeNota: u.lealdadeNota || "Juramento anterior reconhecido e preservado pelo Protocolo de Iniciação.",
    };
  });
  // A partir desta versão, Soke/Bunke são famílias. Divisões são a estrutura operacional da Jikkai.
  const divisoesBase = Array.isArray(raw.divisoes) && raw.divisoes.length ? raw.divisoes : DEFAULT_DIVISOES;
  migrated.divisoes = divisoesBase.map((d, i) => ({
    id: d.id || "divisao_" + (slugEstrutura(d.nome) || i),
    nome: d.nome || "Divisão " + (i + 1),
    desc: d.desc || d.descricao || "Divisão operacional da Jikkai.",
    cor: d.cor || ["#D85A30", "#B91C1C", "#7C2D12", "#EA580C"][i % 4],
    status: d.status || "ativa",
    capitaoUsername: d.capitaoUsername || d.capitao || "",
    ordem: Number.isFinite(Number(d.ordem)) ? Number(d.ordem) : i,
  }));
  const divisaoPadrao = migrated.divisoes[0]?.id || "divisao_central";
  // Liga integrantes antigos dos trios a usernames reais e converte trios/duplas em equipes operacionais.
  migrated.trios = (raw.trios || DEFAULT_TRIOS).map((t, i) => {
    const membros = (t.membros || []).map(m => {
      const encontrado = m.username ? migrated.users.find(u => u.username === m.username) : usuarioPorIdentidade(migrated.users, m.nome);
      return { ...m, username: m.username || encontrado?.username || "", papel: m.papel || "Soldado" };
    });
    const liderPorPapel = membros.find(m => String(m.papel || "").toLowerCase().includes("líder") || String(m.papel || "").toLowerCase().includes("lider"));
    return {
      ...t,
      id: t.id || `equipe_${slugEstrutura(t.nome) || i}`,
      divisaoId: t.divisaoId || t.ramoId || divisaoPadrao,
      tipo: t.tipo || "Ataque",
      status: t.status || "Ativa",
      liderUsername: t.liderUsername || liderPorPapel?.username || "",
      membros,
    };
  });
  // Garante cargos protegidos, selos e posições estruturais sincronizadas.
  const defaultsById = Object.fromEntries(DEFAULT_ROLES.map(r => [r.id, r]));
  let rolesOut = (raw.roles || DEFAULT_ROLES).map(r => ({
    ...(defaultsById[r.id] || {}),
    ...r,
    permissions: Array.isArray(r.permissions) ? r.permissions : [],
    estruturaPosicao: normalizarPosicaoEstrutura(r),
    ordemEstrutura: Number.isFinite(Number(r.ordemEstrutura)) ? Number(r.ordemEstrutura) : ordemEstruturaRole(r),
  }));
  for (const rolePadrao of DEFAULT_ROLES) {
    if (!rolesOut.find(r => r.id === rolePadrao.id)) rolesOut.push({ ...rolePadrao });
  }
  rolesOut = rolesOut.map(r => {
    if (r.id === "leader") return { ...r, nome: r.nome || "Líder", hasLeaderPerms: true, protected: true, estruturaPosicao: "lider", ordemEstrutura: 0 };
    if (r.id === "herdeiro") return { ...r, protected: true, estruturaPosicao: "braco_direito", ordemEstrutura: Number(r.ordemEstrutura) || 4, permissions: r.permissions.length ? r.permissions : ["manage_users", "manage_missions", "edit_contracts", "edit_reports", "edit_trios", "manage_juramentados"] };
    if (r.id === "braco_direito") return { ...r, protected: true, estruturaPosicao: "braco_direito", ordemEstrutura: Number(r.ordemEstrutura) || 5, permissions: r.permissions.length ? r.permissions : ["manage_users", "manage_missions", "edit_contracts", "edit_reports", "edit_trios"] };
    if (r.id === "conselheiro") return { ...r, hasLeaderPerms: false, protected: true, estruturaPosicao: "conselheiro", ordemEstrutura: Number(r.ordemEstrutura) || 10, permissions: r.permissions.length ? r.permissions : ["manage_users", "manage_missions", "edit_reports"] };
    if (r.id === "capitao") return { ...r, protected: true, estruturaPosicao: "capitao_ramo", ordemEstrutura: Number(r.ordemEstrutura) || 30, permissions: Array.from(new Set([...(r.permissions || []), "manage_missions"])) };
    if (r.id === "executor") return { ...r, protected: true, estruturaPosicao: "operador", ordemEstrutura: Number(r.ordemEstrutura) || 60 };
    if (r.id === "member") return { ...r, nome: r.nome === "Membro" ? "Soldado" : (r.nome || "Soldado"), protected: true, estruturaPosicao: r.estruturaPosicao || "operador", ordemEstrutura: Number(r.ordemEstrutura) || 100 };
    if (r.id === "associado") return { ...r, protected: true, estruturaPosicao: r.estruturaPosicao || "independente", ordemEstrutura: Number(r.ordemEstrutura) || 130 };
    if (r.id === "recruta") return { ...r, protected: true, estruturaPosicao: r.estruturaPosicao || "operador", ordemEstrutura: Number(r.ordemEstrutura) || 150 };
    if (r.id === "contratante") return { ...r, protected: true, estruturaPosicao: "fora", ordemEstrutura: 999 };
    return { ...r, estruturaPosicao: normalizarPosicaoEstrutura(r), ordemEstrutura: ordemEstruturaRole(r) };
  });
  migrated.roles = rolesOut;
  migrated.users = migrated.users.map(u => ({ ...u, estruturaNivel: estruturaPosicaoRole(rolesOut.find(r => r.id === u.role)) }));

migrated.armas = (raw.armas || DEFAULT_ARMAS).map((a, i) => a.id ? a : { ...a, id: `arma_${i}_${Date.now().toString(36)}` });
  migrated.fases = (migrated.fases || DEFAULT_FASES).map((fase, index) => normalizarFaseEstrategica(fase, index));
  migrated.sinaisEstrategicos = Array.isArray(migrated.sinaisEstrategicos) ? migrated.sinaisEstrategicos : [];
  return migrated;
}

function MusicPlayer() {
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const [muted, setMuted] = useState(true);
  const unmutedOnce = useRef(false);

  useEffect(() => {
    const a = audioRef.current;
    if (!a) return;
    a.volume = 0.5;
    a.muted = true;
    a.play().then(() => setPlaying(true)).catch(() => setPlaying(false));

    // Função global que o LoginScreen chama no clique de "Entrar nas Sombras"
    window.foxStartMusic = () => {
      if (unmutedOnce.current) return;
      unmutedOnce.current = true;
      const audio = audioRef.current;
      if (!audio) return;
      audio.muted = false;
      audio.volume = 0.5;
      setMuted(false);
      audio.play().then(() => setPlaying(true)).catch((err) => console.warn("autoplay falhou:", err));
    };

    // Fallback: desmuta no PRIMEIRO clique/toque/tecla em qualquer lugar (caso usuário já esteja logado e recarregue)
    const ativarSom = () => {
      if (unmutedOnce.current) return;
      window.foxStartMusic();
    };
    window.addEventListener("click", ativarSom, { once: true });
    window.addEventListener("touchstart", ativarSom, { once: true });
    window.addEventListener("keydown", ativarSom, { once: true });
    return () => {
      window.removeEventListener("click", ativarSom);
      window.removeEventListener("touchstart", ativarSom);
      window.removeEventListener("keydown", ativarSom);
      delete window.foxStartMusic;
    };
  }, []);

  const toggle = () => {
    const a = audioRef.current;
    if (!a) return;
    if (playing) { a.pause(); setPlaying(false); }
    else { a.play().then(() => setPlaying(true)).catch(() => {}); }
  };
  const toggleMute = () => {
    const a = audioRef.current;
    if (!a) return;
    a.muted = !a.muted;
    setMuted(a.muted);
    unmutedOnce.current = true;
    if (!a.muted && !playing) { a.play().then(() => setPlaying(true)).catch(() => {}); }
  };

  return (
    <div className="fixed bottom-5 right-3 sm:bottom-4 sm:right-4 z-40 bg-black/90 backdrop-blur border border-orange-700/60 rounded-md shadow-2xl flex items-center gap-1 px-1.5 py-1 max-w-[calc(100vw-1rem)]">
      <audio
        ref={audioRef}
        src="https://jikkai.vercel.app/themesong.mp3"
        loop
        preload="auto"
        crossOrigin="anonymous"
        onError={(e) => console.error("erro audio:", e)}
      />
      <button onClick={toggle} className="text-orange-400 hover:text-orange-300 p-0.5 text-[10px] leading-none" title={playing ? "Pausar" : "Tocar"}>
        {playing ? "⏸" : "▶"}
      </button>
      <button onClick={toggleMute} className="text-orange-400 hover:text-orange-300 p-0.5 text-[10px] leading-none" title={muted ? "Ativar som" : "Mudo"}>
        {muted ? "🔇" : "🔊"}
      </button>
      <span className="text-[7px] uppercase tracking-[0.06em] text-orange-600 pr-0.5 hidden sm:inline leading-none">F.O.X. Theme</span>
    </div>
  );
}

  const [terminalToast, setTerminalToast] = useState(null);
  const toastTimerRef = useRef(null);
  const transitionTimerRef = useRef(null);
  const discordOAuthHandledRef = useRef(false);
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saveStatus, setSaveStatus] = useState({ cloudOk: null, localOk: true, time: null, syncing: false });
  const isRemoteUpdate = useRef(false);
  const saveTimeoutRef = useRef(null);

  // Initial load + realtime subscription
  useEffect(() => {
    let subscription = null;
    (async () => {
      const loaded = await loadState();
      setData(migrate(loaded));
      setLoading(false);

      if (cloudClient) {
        subscription = cloudClient
          .channel("fox_state_changes")
          .on("postgres_changes", { event: "*", schema: "public", table: "fox_state" }, (payload) => {
            const newData = payload.new?.data;
            if (newData && Object.keys(newData).length > 0) {
              setData((current) => {
                const migrated = migrate(newData);
                if (JSON.stringify(current) === JSON.stringify(migrated)) return current;
                isRemoteUpdate.current = true;
                return migrated;
              });
            }
          })
          .subscribe();
      }
    })();
    return () => { if (subscription) subscription.unsubscribe(); };
  }, []);

  // Debounced save whenever data changes
  useEffect(() => {
    if (!data || loading) return;
    if (isRemoteUpdate.current) { isRemoteUpdate.current = false; return; }
    setSaveStatus(s => ({ ...s, syncing: true }));
    clearTimeout(saveTimeoutRef.current);
    saveTimeoutRef.current = setTimeout(async () => {
      const res = await saveStateAsync(data);
      setSaveStatus({ ...res, time: new Date(), syncing: false });
    }, 500);
  }, [data, loading]);
  useEffect(() => {
    if (!saveStatus.time || saveStatus.syncing) return;
    clearTimeout(toastTimerRef.current);
    const ok = saveStatus.cloudOk === false ? false : saveStatus.localOk;
    setTerminalToast(ok ? "PERGAMINHO SELADO · RASTROS DE CHAKRA APAGADOS" : "SELO INSTÁVEL · CÓPIA LOCAL PRESERVADA");
    toastTimerRef.current = setTimeout(() => setTerminalToast(null), 2300);
  }, [saveStatus.time, saveStatus.syncing]);

  useEffect(() => () => {
    clearTimeout(saveTimeoutRef.current);
    clearTimeout(transitionTimerRef.current);
    clearTimeout(toastTimerRef.current);
  }, []);

  const acionarTransicaoPortal = (label = "ABRINDO PERGAMINHOS") => {
    clearTimeout(transitionTimerRef.current);
    setPortalTransition(label);
    transitionTimerRef.current = setTimeout(() => setPortalTransition(null), 680);
  };


  const usuarioAtual = usuario && data ? data.users.find(u => u.username === usuario.username) || usuario : null;
  const roleRegistrado = usuarioAtual && data ? data.roles.find(r => r.id === usuarioAtual.role) : null;
  const role = roleEfetivoUsuario(usuarioAtual, roleRegistrado);

  useEffect(() => {
    if (discordOAuthHandledRef.current || !data || loading) return;
    const hash = window.location.hash || "";
    if (!hash.includes("access_token=") && !hash.includes("error=")) return;
    discordOAuthHandledRef.current = true;
    const params = new URLSearchParams(hash.replace(/^#/, ""));
    const erroDiscord = params.get("error");
    const token = params.get("access_token");
    let pending = {};
    try { pending = JSON.parse(localStorage.getItem(DISCORD_OAUTH_STORAGE_KEY) || "{}"); } catch {}
    const limparHash = () => {

      fotoUrl: dados.fotoUrl || existente?.fotoUrl || "",
      versao: Number(dados.versao) || Number(existente?.versao) || 2,
      origem: dados.origem || existente?.origem || "portal",
      discordId: dados.discordId || existente?.discordId || "",
      discordUsername: dados.discordUsername || existente?.discordUsername || "",
      discordGlobalName: dados.discordGlobalName || existente?.discordGlobalName || "",
      discordTag: dados.discordTag || existente?.discordTag || "",
      discordVerificado: Boolean(dados.discordVerificado || existente?.discordVerificado),
      discordVerificadoEm: dados.discordVerificadoEm || existente?.discordVerificadoEm || "",
    };
    const juramentados = existente
      ? registros.map(j => j === existente ? registro : j)
      : [...registros, registro];
    return {
      ...d,
      juramentados,
      users: d.users.map(u => {
        if (u.username !== dados.username) return u;
        const atual = lealdadeConfig(u.lealdade).indice;
        const juramentado = lealdadeConfig("Juramentado").indice;
        return {
          ...u,
          nomeRP: u.nomeRP || dados.nome || u.displayName,
          linhagem: u.linhagem || dados.linhagem || "",
          elemento: u.elemento || dados.elemento || "",
          lealdade: atual < juramentado ? "Juramentado" : u.lealdade,
          lealdadeAtualizadaEm: new Date().toISOString(),
          lealdadeNota: u.lealdadeNota || "Juramento formal registrado pelo portal.",
          discordId: dados.discordId || u.discordId || "",
          discordUsername: dados.discordUsername || u.discordUsername || "",
          discordGlobalName: dados.discordGlobalName || u.discordGlobalName || "",
          discordTag: dados.discordTag || u.discordTag || "",
          discordVerificado: Boolean(dados.discordVerificado || u.discordVerificado),
          discordVerificadoEm: dados.discordVerificadoEm || u.discordVerificadoEm || "",
          discordDmMissoes: u.discordDmMissoes !== false,
          discordDmContratos: u.discordDmContratos !== false,
          discordDmRelatorios: u.discordDmRelatorios !== false,
        };
      }),
      activityLog: [...(d.activityLog || []), atividade(existente ? "juramento_atualizado" : "juramento_registrado", dados.username, dados.username, existente ? "Atualizou o próprio registro de juramento" : "Concluiu o juramento e alcançou a lealdade Juramentado")],
    };
  });
  const removerJuramento = (idx) => setData(d => ({ ...d, juramentados: d.juramentados.filter((_, i) => i !== idx) }));
  const concluirIniciacao = (username) => setData(d => ({
    ...d,
    users: d.users.map(u => u.username === username ? {
      ...u,
      iniciacaoStatus: "concluida",
      iniciacaoConcluidaEm: new Date().toISOString(),
      iniciacaoVersao: 1,
    } : u),
    activityLog: [...(d.activityLog || []), atividade("iniciacao_concluida", username, username, "Concluiu o Protocolo de Iniciação da Jikkai")],
  }));
  const concluirOnboardingContratante = () => {
    if (!usuarioAtual?.username) return;
    const atualizado = { ...usuarioAtual, onboardingContratanteStatus: "concluido", onboardingContratanteConcluidoEm: new Date().toISOString() };
    setData(d => ({
      ...d,
      users: d.users.map(u => u.username === usuarioAtual.username ? { ...u, onboardingContratanteStatus: "concluido", onboardingContratanteConcluidoEm: atualizado.onboardingContratanteConcluidoEm } : u),
      activityLog: [...(d.activityLog || []), atividade("onboarding_contratante_concluido", usuarioAtual.username, usuarioAtual.username, "Concluiu a recepção externa de contratante")],
    }));
    setUsuario(atualizado);
    const req = { tab: "jikkai", subTab: "contratos", action: "abrir-contratos", token: uid() };
    setTab("jikkai");
    setNavigationRequest(req);
    salvarSessaoPortalSnapshot({ usuario: atualizado, tab: "jikkai", navigationRequest: req });
    setTerminalToast("SELO EXTERNO ATIVO · MESA DE CONTRATOS LIBERADA");
  };

  if (loading || !data) {
    return <ShadowBootScreen label="LIBERANDO SELO DE ACESSO" detail="localizando pergaminhos · conferindo juramento · abrindo passagem oculta" />;
  }

  if (accessGranted) return <AccessGrantedOverlay usuario={accessGranted.usuario} role={accessGranted.role} />;

  const tokenConvite = urlConviteAtual();
  if (!usuarioAtual && tokenConvite) return <ConviteEntradaScreen data={data} token={tokenConvite} onRegistrar={registrarPorConvite} onVoltarLogin={() => { limparUrlConvite(); setTerminalToast("SELO DE CONVITE FECHADO"); }} />;

  if (!usuarioAtual) return <LoginScreen data={data} onLogin={(u) => {
    const roleLogin = roleEfetivoUsuario(u, data.roles.find(r => r.id === u.role));
    setAccessGranted({ usuario: u, role: roleLogin });
    setTimeout(() => {
      salvarSessaoPortalSnapshot({ usuario: u, tab: "home" });
      setUsuario(u);
      setAccessGranted(null);
    }, 1450);
  }} />;

  if (!isContratante && !isLider && usuarioAtual.iniciacaoStatus === "pendente") {
    return <IntroducaoPrimeiroAcesso
      data={data}
      usuario={usuarioAtual}
      juramentado={meuJuramento}
      juramentar={juramentar}
      onAtualizarPerfil={(patch) => setData(d => ({
        ...d,
        users: d.users.map(u => {
          if (u.username !== usuarioAtual.username) return u;
          const atualizado = { ...u, ...patch };
          return { ...atualizado, perfilCompleto: perfilCompletoUsuario(atualizado) };
        }),
        activityLog: [...(d.activityLog || []), atividade("foto_iniciacao_atualizada", usuarioAtual.username, usuarioAtual.username, "Atualizou a foto durante a identificação de primeiro acesso")],
      }))}
      onConcluir={() => concluirIniciacao(usuarioAtual.username)}
      onLogout={logoutPortal}
    />;
  }

  if (isContratante && usuarioAtual.onboardingContratanteStatus === "pendente") {
    return <ContratanteOnboardingPage data={data} usuario={usuarioAtual} onConcluir={concluirOnboardingContratante} onLogout={logoutPortal} />;
  }

  const TABS = isContratante ? [
    { id: "visaogeral", label: "Visão Geral", icon: IBriefcase },
    { id: "jikkai", label: "Contratos Jikkai", icon: ITarget },
    { id: "arquivos", label: "Arquivo Público", icon: ILock },
  ] : [
    { id: "home", label: "Visão Geral", icon: IFlame },
    { id: "perfil", label: "Perfil", icon: IUsers },
    { id: "membros", label: "Membros", icon: IUsers },
    { id: "jikkai", label: "JIKKAI", icon: ITarget },
    { id: "armas", label: "Armas", icon: IShield },
    { id: "missoes", label: `Missões${minhasMissoesCount > 0 ? ` (${minhasMissoesCount})` : ""}`, icon: IClipboard },
    { id: "juramento", label: "Juramento", icon: ISkull },
    ...(isLider ? [
      { id: "visaogeral", label: "Vitrine", icon: IBriefcase },
    ] : []),
    ...(podeGerenciar ? [
      { id: "gerenciar", label: "Gerenciar", icon: ISettings },
    ] : []),
  ];

  const mobilePrimaryIds = isContratante
    ? ["visaogeral", "jikkai", "arquivos"]
    : ["home", "perfil", "missoes"];
  const mobilePrimaryTabs = TABS.filter(t => mobilePrimaryIds.includes(t.id));
  const mobileMoreTabs = TABS.filter(t => !mobilePrimaryIds.includes(t.id));
  const mobileMoreActive = mobileMoreTabs.some(t => t.id === tab);
  const navegarPara = (id, subTab = "", action = "") => {
    const destino = TABS.find(t => t.id === id)?.label || (id === "mapa" ? "MAPA ESTRATÉGICO" : "ARQUIVOS");
    acionarTransicaoPortal(id === "mapa" ? "ABRINDO MAPA DAS SOMBRAS" : `LIBERANDO SELO: ${String(destino).toUpperCase()}`);
    if (id === "mapa") {
      setTimeout(() => {
        if (typeof window.foxOpenStrategicMap === "function") window.foxOpenStrategicMap();
        else {
          if (usuarioAtual) salvarSessaoPortalSnapshot({ usuario: usuarioAtual, tab, navigationRequest });
          window.location.href = "./mapa.html";
        }
      }, 360);
      return;
    }
    setTimeout(() => {
      setTab(id);
      setNavigationRequest({ tab: id, subTab, action, token: Date.now() });
      setMobileMoreOpen(false);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }, 120);
  };
  const selecionarTabMobile = (id) => navegarPara(id);

  // Sync indicator
  const syncIndicator = (() => {
    if (!CLOUD_ENABLED) {
      return <div className="text-yellow-600 text-[9px]" title="Modo local — dados não compartilhados">⚠ Local</div>;
    }
    if (saveStatus.syncing) return <div className="text-zinc-400 text-[9px]">⟳ Selando pergaminho...</div>;
    if (saveStatus.cloudOk === true) return <div className="text-green-500 text-[9px] flex items-center gap-1"><ICheck className="w-3 h-3" />Pergaminho selado</div>;
    if (saveStatus.cloudOk === false) return <div className="text-red-500 text-[9px]">⚠ Erro sync</div>;
    return <div className="text-zinc-600 text-[9px]">—</div>;
  })();

  return (
    <div className="jikkai-compact min-h-screen bg-black text-zinc-200">
      <PortalTransitionOverlay active={portalTransition} label={portalTransition || "ABRINDO PERGAMINHOS"} />
      <TerminalToast message={terminalToast} />
      <header className="border-b border-orange-900/30 bg-black/80 backdrop-blur sticky top-0 z-10">
        <div className="max-w-6xl mx-auto px-3 py-3 sm:px-4 sm:py-4 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <div className="p-2 rounded-full border border-orange-700 flex-shrink-0">
              <IFlame className="w-5 h-5 text-orange-500" />
            </div>
            <div className="min-w-0">
              <div className="text-orange-50 font-black tracking-widest serif">F.O.X.</div>
              <div className="text-zinc-600 text-[10px] uppercase tracking-widest truncate">Grupo F.O.X. · Organização Jikkai</div>
            </div>
          </div>
          <div className="flex items-center gap-3 flex-shrink-0">
            <MemberAvatar user={usuarioAtual} size="sm" className="hidden sm:flex" />
            <div className="text-right hidden sm:block">
              <div className="text-orange-300 text-xs font-bold uppercase tracking-wider truncate max-w-[160px]">{getCodinome(usuarioAtual)}</div>
              {!isContratante && usuarioAtual.displayName && (
                <div className="text-zinc-600 text-[9px] truncate max-w-[160px]">{usuarioAtual.displayName}</div>
              )}
              <div className="text-[9px]" style={{ color: role?.cor || "#71717a" }}>{role?.nome || usuarioAtual.role}</div>
              <div className="text-[8px] text-zinc-600 uppercase tracking-wider">{sigiloConfig(minhaAutorizacao).codigo} · {minhaAutorizacao}</div>
            </div>
            <div className="text-right hidden md:block">{syncIndicator}</div>
            <button onClick={logoutPortal} className="mobile-tap p-2 text-zinc-500 hover:text-red-500 transition-colors flex items-center justify-center">
              <ILogout className="w-4 h-4" />
            </button>
          </div>
        </div>
        <nav className="hidden sm:block border-t border-zinc-900 bg-black/60">
          <div className="max-w-6xl mx-auto px-2 flex overflow-x-auto">
            {TABS.map((t) => {
              const I = t.icon;
              const active = tab === t.id;
              return (
                <button key={t.id} onClick={() => navegarPara(t.id)} className={`flex items-center gap-2 px-4 py-3 text-xs uppercase tracking-wider whitespace-nowrap border-b-2 transition-colors ${active ? "border-orange-600 text-orange-400" : "border-transparent text-zinc-600 hover:text-zinc-300"}`}>
                  <I className="w-3.5 h-3.5" />
                  {t.label}
                </button>
              );
            })}
          </div>
        </nav>
      </header>

      <main className="max-w-6xl mx-auto px-3 sm:px-4 py-4 sm:py-8 pb-28 sm:pb-8">
        <div className="mb-4 flex justify-end"><PortalCodeBadge tab={tab} subTab={navigationRequest?.subTab || ""} /></div>
        {tab === "home" && !isContratante && <HomePage data={data} usuario={usuarioAtual} role={role} isLider={isLider} onNavigate={navegarPara} />}
        {tab === "perfil" && !isContratante && <PerfilPage data={data} setData={setData} usuario={usuarioAtual} role={role} navigationRequest={navigationRequest} />}
        {tab === "historia" && !isContratante && <HistoriaPage data={data} setData={setData} role={role} usuario={usuarioAtual} navigationRequest={navigationRequest} />}
        {tab === "membros" && !isContratante && <MembrosPage data={data} setData={setData} role={role} usuario={usuarioAtual} viewerIsContratante={isContratante} navigationRequest={navigationRequest} />}
        {tab === "jikkai" && <JikkaiPage data={data} setData={setData} isLider={isLider} usuario={usuarioAtual} role={role} viewerIsContratante={isContratante} navigationRequest={navigationRequest} />}
        {tab === "armas" && !isContratante && <ArmasPage data={data} setData={setData} isLider={isLider} />}
        {tab === "missoes" && !isContratante && <MissoesOperacionaisPage data={data} setData={setData} usuario={usuarioAtual} role={role} onNavigate={navegarPara} navigationRequest={navigationRequest} />}
        {tab === "juramento" && !isContratante && <JuramentoPage usuario={usuarioAtual} juramentado={meuJuramento} juramentar={juramentar} juramentados={data.juramentados} removerJuramento={removerJuramento} isLider={isLider} data={data} />}
        {tab === "visaogeral" && <VisaoGeralContratantes data={data} setData={setData} isLider={isLider} />}
        {tab === "arquivos" && isContratante && <ArquivoPublicoPage data={data} />}
        {tab === "gerenciar" && podeGerenciar && <GerenciarPage data={data} setData={setData} usuario={usuarioAtual} role={role} exportar={exportar} importar={importar} navigationRequest={navigationRequest} />}
      </main>

      {mobileMoreOpen && (
        <div className="sm:hidden fixed inset-0 z-[90]">
          <button aria-label="Fechar menu" onClick={() => setMobileMoreOpen(false)} className="absolute inset-0 bg-black/80 backdrop-blur-sm" />
          <div className="mobile-sheet-panel absolute inset-x-0 bottom-0 rounded-t-3xl border-t border-orange-800 bg-zinc-950 shadow-2xl overflow-y-auto">
            <div className="sticky top-0 z-10 bg-zinc-950/95 backdrop-blur border-b border-zinc-800 px-4 py-4 flex items-center justify-between">
              <div><div className="text-[9px] uppercase tracking-[0.3em] text-orange-600">Navegação</div><div className="text-lg font-black text-orange-50 serif">Mais opções</div></div>
              <button onClick={() => setMobileMoreOpen(false)} className="mobile-tap flex items-center justify-center rounded-full border border-zinc-800 text-zinc-400"><IX className="w-5 h-5" /></button>
            </div>
            <div className="p-3 grid grid-cols-2 gap-2">
              {mobileMoreTabs.map(t => { const I = t.icon; return (
                <button key={t.id} onClick={() => selecionarTabMobile(t.id)} className={`min-h-20 rounded-xl border p-3 flex flex-col items-center justify-center gap-2 text-center ${tab === t.id ? "border-orange-600 bg-orange-950/40 text-orange-300" : "border-zinc-800 bg-black/50 text-zinc-400"}`}>
                  <I className="w-5 h-5" /><span className="text-[10px] uppercase tracking-wider font-bold leading-tight">{t.label}</span>
                </button>
              ); })}
              {!isContratante && <button onClick={() => navegarPara("mapa")} className="min-h-20 rounded-xl border border-sky-900 bg-sky-950/20 p-3 flex flex-col items-center justify-center gap-2 text-sky-300 text-center"><ITarget className="w-5 h-5" /><span className="text-[10px] uppercase tracking-wider font-bold">Mapa Estratégico</span></button>}
              <button onClick={logoutPortal} className="min-h-20 rounded-xl border border-red-900 bg-red-950/20 p-3 flex flex-col items-center justify-center gap-2 text-red-300"><ILogout className="w-5 h-5" /><span className="text-[10px] uppercase tracking-wider font-bold">Sair</span></button>
            </div>
          </div>
        </div>
      )}

      <nav className="sm:hidden fixed inset-x-0 bottom-0 z-[95] border-t border-orange-900/50 bg-black/95 backdrop-blur-xl mobile-safe-bottom">
        <div className="grid" style={{ gridTemplateColumns: `repeat(${mobilePrimaryTabs.length + 1}, minmax(0, 1fr))` }}>
          {mobilePrimaryTabs.map(t => { const I = t.icon; const active = tab === t.id; return (
            <button key={t.id} onClick={() => selecionarTabMobile(t.id)} className={`min-h-[62px] px-1 py-2 flex flex-col items-center justify-center gap-1 border-t-2 ${active ? "border-orange-500 text-orange-400 bg-orange-950/20" : "border-transparent text-zinc-600"}`}>
              <I className="w-5 h-5" /><span className="text-[8px] uppercase tracking-wide font-bold leading-none text-center">{t.id === "visaogeral" || t.id === "home" ? "Início" : t.label.replace(/ \(.+\)$/, "")}</span>
            </button>
          ); })}
          <button onClick={() => setMobileMoreOpen(true)} className={`min-h-[62px] px-1 py-2 flex flex-col items-center justify-center gap-1 border-t-2 ${mobileMoreOpen || mobileMoreActive ? "border-orange-500 text-orange-400 bg-orange-950/20" : "border-transparent text-zinc-600"}`}>
            <ISettings className="w-5 h-5" /><span className="text-[8px] uppercase tracking-wide font-bold">Mais</span>
          </button>
        </div>
      </nav>

      <ThemeSwitcher />
      <PortalQuickActions onNavigate={navegarPara} isContratante={isContratante} />

      <footer className="border-t border-zinc-900 mt-10 sm:mt-16 pt-6 pb-28 sm:py-6 text-center text-zinc-700 text-xs">
        <p className="uppercase tracking-widest">Grupo F.O.X. · Organização Jikkai · Legado Lamona · {new Date().getFullYear()}</p>
        <p className="italic mt-1">"Mais forte, mais livre, mais letal do que nunca."</p>
      </footer>
      <MusicPlayer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script data-jikkai-map-link>
(function(){
  function guardarSessaoMapa(){
    try{
      var k='fox-portal-session-v2',m='fox-map-return-v2';
      var raw=sessionStorage.getItem(k)||localStorage.getItem(k);
      if(raw)localStorage.setItem(m,raw);
    }catch(e){}
  }
  function montarBotaoMapa(){
    if(document.querySelector('[data-map-strategic-link]'))return;
    var a=document.createElement('a');
    a.href='mapa.html';
    a.setAttribute('data-map-strategic-link','');
    a.setAttribute('aria-label','Abrir mapa estratégico');
    a.innerHTML='<span style="width:30px;height:30px;border-radius:999px;border:1px solid rgba(34,211,238,.45);display:grid;place-items:center;background:rgba(34,211,238,.10);color:#67e8f9;font-size:15px">⌖</span><span style="display:grid;gap:1px"><strong style="font-size:10px;line-height:1;color:#ecfeff">MAPA</strong><small style="font-size:8px;line-height:1;color:#94a3b8;letter-spacing:.13em">ESTRATÉGICO</small></span>';
    a.addEventListener('click',guardarSessaoMapa);
    a.style.cssText='position:fixed;right:18px;bottom:76px;z-index:9999;display:flex;align-items:center;gap:8px;background:rgba(2,8,11,.92);color:#ecfeff;border:1px solid rgba(34,211,238,.32);border-radius:999px;padding:6px 10px 6px 6px;font:900 10px/1 system-ui;letter-spacing:.08em;text-decoration:none;box-shadow:0 18px 50px rgba(0,0,0,.5);backdrop-filter:blur(14px)';
    document.body.appendChild(a);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',montarBotaoMapa);else montarBotaoMapa();
})();
</script></body>
</html>
