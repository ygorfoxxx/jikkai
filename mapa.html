<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JIKKAI — Mapa Estratégico</title>
<style>
:root{--bg:#050505;--panel:#0d0d0f;--line:#27272a;--muted:#71717a;--text:#f4f4f5;--orange:#ea580c;--red:#991b1b;--purple:#7e22ce}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020202;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(234,88,12,.08),transparent 28%),radial-gradient(circle at 80% 90%,rgba(126,34,206,.08),transparent 30%);pointer-events:none}
.app{display:grid;grid-template-columns:320px 1fr;height:100vh}
.panel{background:linear-gradient(180deg,rgba(13,13,15,.98),rgba(5,5,5,.98));border-right:1px solid #27272a;display:flex;flex-direction:column;z-index:20;box-shadow:18px 0 50px rgba(0,0,0,.45)}
.brand{padding:18px;border-bottom:1px solid #27272a}
.kicker{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#f97316;font-weight:800}
h1{font-family:Georgia,serif;font-size:24px;margin:5px 0 3px;letter-spacing:.03em}
.sub{font-size:12px;color:#71717a;line-height:1.5}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-bottom:1px solid #27272a}
button,.btn{appearance:none;border:1px solid #3f3f46;background:#18181b;color:#e4e4e7;border-radius:8px;padding:9px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;cursor:pointer;text-decoration:none;text-align:center}
button:hover,.btn:hover{border-color:#ea580c;color:#fff}
button.primary{background:#c2410c;border-color:#ea580c}
.filters{padding:12px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #27272a}
.filter{padding:6px 8px;font-size:10px}
.filter.active{background:#7c2d12;border-color:#ea580c}
.list{overflow:auto;padding:10px;flex:1}
.card{padding:11px;margin-bottom:8px;border:1px solid #27272a;background:rgba(24,24,27,.72);border-radius:9px;cursor:pointer;transition:.15s}
.card:hover,.card.active{border-color:#ea580c;background:rgba(67,20,7,.35)}
.card-title{font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.card-meta{font-size:10px;color:#a1a1aa;margin-top:5px;text-transform:uppercase;letter-spacing:.08em}
.badge{font-size:9px;padding:3px 6px;border-radius:99px;border:1px solid #52525b;color:#d4d4d8;white-space:nowrap}
.footer{padding:10px 12px;border-top:1px solid #27272a;font-size:10px;color:#52525b}
.map-shell{position:relative;overflow:hidden;background:#0b3c4b;cursor:grab}
.map-shell.dragging{cursor:grabbing}
.map-stage{position:absolute;left:0;top:0;width:954px;height:702px;transform-origin:0 0;will-change:transform;user-select:none}
.map-stage img{display:block;width:954px;height:702px;pointer-events:none}
.overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.12),transparent 15%,transparent 85%,rgba(0,0,0,.18)),repeating-linear-gradient(0deg,transparent 0 31px,rgba(255,255,255,.025) 32px),repeating-linear-gradient(90deg,transparent 0 31px,rgba(255,255,255,.025) 32px);mix-blend-mode:multiply}
.marker{position:absolute;width:22px;height:22px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid white;box-shadow:0 0 0 5px rgba(0,0,0,.35),0 0 20px currentColor;cursor:pointer;pointer-events:auto;display:grid;place-items:center;font-size:9px;font-weight:900;transition:.18s}
.marker:hover,.marker.active{transform:translate(-50%,-50%) scale(1.28);z-index:5}
.marker.vila{background:#c2410c;color:#fb923c}
.marker.regiao{background:#713f12;color:#facc15}
.marker.base{background:#581c87;color:#c084fc}
.marker:after{content:attr(data-label);position:absolute;left:50%;top:27px;transform:translateX(-50%);white-space:nowrap;background:rgba(0,0,0,.82);border:1px solid #3f3f46;color:#f4f4f5;padding:4px 7px;border-radius:5px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:0;pointer-events:none}
.marker:hover:after,.marker.active:after{opacity:1}
.zoom{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:7px;z-index:10}
.zoom button{width:42px;height:42px;padding:0;font-size:18px;background:rgba(9,9,11,.9)}
.legend{position:absolute;right:16px;bottom:16px;background:rgba(9,9,11,.9);border:1px solid #3f3f46;border-radius:9px;padding:10px;z-index:10;font-size:10px;color:#a1a1aa}
.legend-row{display:flex;align-items:center;gap:7px;margin:5px 0}
.dot{width:9px;height:9px;border-radius:50%}
.detail{position:absolute;left:340px;right:20px;bottom:20px;max-width:620px;background:rgba(9,9,11,.94);border:1px solid #ea580c;border-radius:12px;padding:16px;z-index:15;box-shadow:0 20px 60px rgba(0,0,0,.6);display:none}
.detail.show{display:block}
.detail h2{font-family:Georgia,serif;margin:0 0 6px;font-size:21px}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.detail-cell{background:#18181b;border:1px solid #27272a;border-radius:7px;padding:8px}
.detail-label{font-size:9px;color:#71717a;text-transform:uppercase;letter-spacing:.1em}
.detail-value{font-size:12px;margin-top:3px;font-weight:700}
.close{position:absolute;right:10px;top:10px;width:30px;height:30px;padding:0}
.mobile-toggle{display:none;position:absolute;left:12px;top:12px;z-index:30}
@media(max-width:820px){
.app{display:block}.panel{position:absolute;inset:0 auto 0 0;width:min(88vw,340px);transform:translateX(-102%);transition:.2s}.panel.open{transform:translateX(0)}.mobile-toggle{display:block}.detail{left:12px;right:12px;bottom:12px}.legend{display:none}
}
</style>
</head>
<body>
<div class="app">
<aside class="panel" id="panel">
  <div class="brand"><div class="kicker">F.O.X. · Cartografia Operacional</div><h1>Mapa Estratégico</h1><div class="sub">Base cartográfica oficial do Shinobi Legends adaptada para operações da JIKKAI.</div></div>
  <div class="toolbar"><button class="primary" id="resetBtn">Centralizar</button><a class="btn" href="./">Voltar ao portal</a></div>
  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>
  <div class="footer">Arraste para mover · roda do mouse para ampliar · clique em um ponto para abrir o dossiê.</div>
</aside>
<main class="map-shell" id="shell">
  <button class="mobile-toggle" id="menuBtn">☰</button>
  <div class="map-stage" id="stage">
    <img alt="Mapa oficial Shinobi Legends" src="https://slpforge.xyz/images/map/map_base_low.webp">
    <div class="overlay"></div>
    <div id="markers"></div>
  </div>
  <div class="zoom"><button id="plus">+</button><button id="minus">−</button><button id="fit">⌂</button></div>
  <div class="legend"><div class="kicker" style="margin-bottom:7px">Legenda</div><div class="legend-row"><span class="dot" style="background:#c2410c"></span>Vilas</div><div class="legend-row"><span class="dot" style="background:#ca8a04"></span>Regiões</div><div class="legend-row"><span class="dot" style="background:#7e22ce"></span>Bases</div></div>
</main>
</div>
<section class="detail" id="detail"><button class="close" id="close">×</button><div class="kicker" id="detailType"></div><h2 id="detailName"></h2><p class="sub" id="detailDesc"></p><div class="detail-grid"><div class="detail-cell"><div class="detail-label">Situação</div><div class="detail-value" id="detailStatus"></div></div><div class="detail-cell"><div class="detail-label">Ameaça</div><div class="detail-value" id="detailThreat"></div></div><div class="detail-cell"><div class="detail-label">Sigilo</div><div class="detail-value" id="detailSecrecy"></div></div></div></section>
<script>
const POINTS=[{"id": "konoha", "name": "Konohagakure", "type": "vila", "x": 65.5, "y": 60.5, "status": "Neutra", "threat": "Média", "sigilo": "Nível II", "desc": "Centro político e militar do País do Fogo. Rotas principais convergem nesta região."}, {"id": "kiri", "name": "Kirigakure", "type": "vila", "x": 85.2, "y": 78.2, "status": "Hostil", "threat": "Alta", "sigilo": "Nível III", "desc": "Território de origem dos eventos que levaram à formação da F.O.X. Vigilância constante."}, {"id": "suna", "name": "Sunagakure", "type": "vila", "x": 24.5, "y": 71.2, "status": "Neutra", "threat": "Média", "sigilo": "Nível II", "desc": "Vila do deserto. Acesso por rotas expostas e pontos de água limitados."}, {"id": "iwa", "name": "Iwagakure", "type": "vila", "x": 22.5, "y": 28.5, "status": "Desconhecida", "threat": "Média", "sigilo": "Nível II", "desc": "Região rochosa com terreno favorável a emboscadas e defesa vertical."}, {"id": "kumo", "name": "Kumogakure", "type": "vila", "x": 86.2, "y": 13.5, "status": "Objetivo", "threat": "Alta", "sigilo": "Nível IV", "desc": "Destino estratégico final do plano JIKKAI. Informações restritas à liderança."}, {"id": "vale-fim", "name": "Vale do Fim", "type": "regiao", "x": 49.4, "y": 49.6, "status": "Observado", "threat": "Alta", "sigilo": "Nível III", "desc": "Gargalo natural entre áreas centrais. Alto valor para interceptação e retirada."}, {"id": "floresta-morte", "name": "Floresta da Morte", "type": "regiao", "x": 59.7, "y": 45.5, "status": "Observado", "threat": "Alta", "sigilo": "Nível II", "desc": "Vegetação densa, baixa visibilidade e múltiplas rotas clandestinas."}, {"id": "esconderijo", "name": "Esconderijo", "type": "base", "x": 44.5, "y": 70.5, "status": "Controlado", "threat": "Baixa", "sigilo": "Nível III", "desc": "Ponto logístico próximo à fronteira entre o deserto e o País do Fogo."}];
const shell=document.getElementById('shell'), stage=document.getElementById('stage'), markers=document.getElementById('markers'), list=document.getElementById('list'), filters=document.getElementById('filters'), detail=document.getElementById('detail');
let scale=1,x=0,y=0,drag=false,sx=0,sy=0,ox=0,oy=0,active=null,filter='todos';
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function renderTransform(){stage.style.transform=`translate(${x}px,${y}px) scale(${scale})`}
function fit(){const w=shell.clientWidth,h=shell.clientHeight;scale=Math.min(w/954,h/702);x=(w-954*scale)/2;y=(h-702*scale)/2;renderTransform()}
function zoomAt(next,cx=shell.clientWidth/2,cy=shell.clientHeight/2){next=clamp(next,.45,4);const wx=(cx-x)/scale,wy=(cy-y)/scale;x=cx-wx*next;y=cy-wy*next;scale=next;renderTransform()}
function select(id){active=id;document.querySelectorAll('.marker,.card').forEach(el=>el.classList.toggle('active',el.dataset.id===id));const p=POINTS.find(v=>v.id===id);if(!p)return;detail.classList.add('show');detailType.textContent=p.type;detailName.textContent=p.name;detailDesc.textContent=p.desc;detailStatus.textContent=p.status;detailThreat.textContent=p.threat;detailSecrecy.textContent=p.sigilo}
function render(){markers.innerHTML='';list.innerHTML='';POINTS.filter(p=>filter==='todos'||p.type===filter).forEach(p=>{const m=document.createElement('button');m.className='marker '+p.type;m.dataset.id=p.id;m.dataset.label=p.name;m.style.left=p.x+'%';m.style.top=p.y+'%';m.textContent=p.type==='vila'?'◆':p.type==='base'?'▲':'●';m.onclick=e=>{e.stopPropagation();select(p.id)};markers.appendChild(m);const c=document.createElement('div');c.className='card';c.dataset.id=p.id;c.innerHTML=`<div class="card-title"><span>${p.name}</span><span class="badge">${p.sigilo}</span></div><div class="card-meta">${p.type} · ${p.status} · ameaça ${p.threat}</div>`;c.onclick=()=>{select(p.id);zoomAt(Math.max(scale,1.15),shell.clientWidth*.55,shell.clientHeight*.5)};list.appendChild(c)})}
['todos','vila','regiao','base'].forEach(f=>{const b=document.createElement('button');b.className='filter'+(f==='todos'?' active':'');b.textContent=f==='todos'?'Todos':f==='regiao'?'Regiões':f==='vila'?'Vilas':'Bases';b.onclick=()=>{filter=f;document.querySelectorAll('.filter').forEach(e=>e.classList.remove('active'));b.classList.add('active');render()};filters.appendChild(b)})
shell.addEventListener('mousedown',e=>{if(e.target.closest('button'))return;drag=true;shell.classList.add('dragging');sx=e.clientX;sy=e.clientY;ox=x;oy=y});
window.addEventListener('mousemove',e=>{if(!drag)return;x=ox+e.clientX-sx;y=oy+e.clientY-sy;renderTransform()});
window.addEventListener('mouseup',()=>{drag=false;shell.classList.remove('dragging')});
shell.addEventListener('wheel',e=>{e.preventDefault();const r=shell.getBoundingClientRect();zoomAt(scale*(e.deltaY<0?1.13:.885),e.clientX-r.left,e.clientY-r.top)},{passive:false});
let touch=null;shell.addEventListener('touchstart',e=>{if(e.touches.length===1){touch={x:e.touches[0].clientX,y:e.touches[0].clientY,ox:x,oy:y}}},{passive:true});
shell.addEventListener('touchmove',e=>{if(touch&&e.touches.length===1){x=touch.ox+e.touches[0].clientX-touch.x;y=touch.oy+e.touches[0].clientY-touch.y;renderTransform()}},{passive:true});
shell.addEventListener('touchend',()=>touch=null);
plus.onclick=()=>zoomAt(scale*1.25);minus.onclick=()=>zoomAt(scale/1.25);fit.onclick=resetBtn.onclick=fit;close.onclick=()=>detail.classList.remove('show');menuBtn.onclick=()=>panel.classList.toggle('open');window.addEventListener('resize',fit);
render();fit();
</script>
</body></html>
